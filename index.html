.", "why_tr": "Geçmişteki bir olaydan önce olan olay için have/has değil had kullanılır."}, {"wrong": "I had never saw snow before.", "right": "I had never seen snow before.", "why_tr": "Had'den sonra fiilin üçüncü hâli gelir: see → saw → seen."}, {"wrong": "Had you ever went to Chicago?", "right": "Had you ever been to Chicago?", "why_tr": "Had + üçüncü hâl: go/be için \"been\" kullanılır, \"went\" değil."}, {"wrong": "By the time Maria arrived, the meeting has started.", "right": "By the time Maria arrived, the meeting had started.", "why_tr": "By the time + geçmiş zaman varsa, daha önce olan olay had ile söylenir."}], "tip_tr": "\"-mıştı\" diyorsan had düşün: gitmişti = had gone, yemişti = had eaten."}, "7-4": {"summary": "After some verbs we use to + verb, and after other verbs we use the -ing form. We learn each verb together with its pattern.", "tr_summary": "İngilizcede bazı fiillerden sonra to + fiil (decide to buy), bazılarından sonra fiil-ing (avoid buying) gelir. Türkçede de her fiil kendi ekini ister: \"almaya karar verdim\" ama \"almaktan kaçınıyorum\" deriz. Bu yüzden kuralı tahmin etmek yerine fiili kalıbıyla birlikte ezberlemek en iyisidir. Like, love, hate ve start iki şekilde de kullanılabilir.", "use": ["To + verb after: decide, want, need, promise, plan, hope, would like.", "Verb-ing after: enjoy, avoid, don't mind, suggest, finish, keep.", "Both are possible after: like, love, hate, start (I love cooking / I love to cook).", "Learn each verb as one phrase: avoid buying, decide to buy."], "form": [{"label": "Verb + to", "pattern": "subject + decide/want/need/promise/plan/hope + to + base verb", "example": "I've decided to save money."}, {"label": "Verb + -ing", "pattern": "subject + enjoy/avoid/don't mind/suggest/finish/keep + verb-ing", "example": "I don't mind washing the dishes."}, {"label": "Both", "pattern": "subject + like/love/hate/start + to + verb or verb-ing", "example": "I hate thinking about money. / I hate to think about money."}, {"label": "Negative", "pattern": "subject + decide/promise + not to + verb", "example": "I promised not to spend too much."}], "examples": [{"en": "I've decided to stop buying coffee every morning.", "tr": "Her sabah kahve almayı bırakmaya karar verdim."}, {"en": "Elif is going to avoid buying expensive gifts.", "tr": "Elif pahalı hediyeler almaktan kaçınacak."}, {"en": "I promised to take my mom to dinner in Izmir.", "tr": "Annemi İzmir'de yemeğe götürmeye söz verdim."}, {"en": "Dan doesn't mind helping Elif with her budget.", "tr": "Dan, Elif'e bütçesi konusunda yardım etmeyi sorun etmiyor."}, {"en": "We're planning to visit my parents in March.", "tr": "Martta ailemi ziyaret etmeyi planlıyoruz."}, {"en": "Do you enjoy going to the gym?", "tr": "Spor salonuna gitmekten hoşlanıyor musun?"}, {"en": "Have you finished writing the report?", "tr": "Raporu yazmayı bitirdin mi?"}, {"en": "It started to snow when we left. / It started snowing when we left.", "tr": "Biz çıkarken kar yağmaya başladı."}], "mistakes": [{"wrong": "I enjoy to go to the gym.", "right": "I enjoy going to the gym.", "why_tr": "Enjoy'dan sonra her zaman -ing gelir, to gelmez."}, {"wrong": "I've decided buying a new phone.", "right": "I've decided to buy a new phone.", "why_tr": "Decide'dan sonra to + fiil gelir: decide to buy."}, {"wrong": "I don't mind to wash the dishes.", "right": "I don't mind washing the dishes.", "why_tr": "Don't mind kalıbından sonra -ing kullanılır."}, {"wrong": "She suggested to take a taxi.", "right": "She suggested taking a taxi.", "why_tr": "Suggest'ten sonra to + fiil değil, -ing gelir."}], "tip_tr": "Fiilleri tek başına değil, kalıbıyla öğren: \"decide to\", \"avoid -ing\". Türkçedeki \"-meye karar vermek\", \"-mekten kaçınmak\" gibi."}, "7-5": {"summary": "We use may and might + base verb to talk about things that are possible but not sure.", "tr_summary": "May ve might, olası ama kesin olmayan şeyler için kullanılır; anlamları hemen hemen aynıdır, konuşmada might daha yaygındır. Türkçedeki \"-ebilir / -abilir\" ekine benzer: \"Yarın kar yağabilir\" = It might snow tomorrow. Olumsuzu may not / might not olur: \"Gelmeyebilir\" = He might not come. May ve might hiç değişmez: -s almaz, sonrasında to gelmez.", "use": ["For something possible in the future: It might rain later.", "For plans that are not decided: I might visit my old friends.", "For things we aren't sure about now: Maria might be busy.", "Negative possibility: He might not come. (Maybe he won't come.)"], "form": [{"label": "Positive", "pattern": "subject + may/might + base verb", "example": "I might visit my old friends."}, {"label": "Negative", "pattern": "subject + may not/might not + base verb", "example": "He might not be ready in time."}, {"label": "With be", "pattern": "subject + may/might + be + adjective/place", "example": "Maria might be busy."}], "examples": [{"en": "I might sleep all day on my first day in Izmir.", "tr": "İzmir'deki ilk günümde bütün gün uyuyabilirim."}, {"en": "Take an umbrella. It might rain later.", "tr": "Şemsiye al. Sonra yağmur yağabilir."}, {"en": "It may snow tomorrow, so drive carefully.", "tr": "Yarın kar yağabilir, o yüzden dikkatli sür."}, {"en": "I'm not sure, but Ana may come to the party.", "tr": "Emin değilim ama Ana partiye gelebilir."}, {"en": "The store might not be open on Sunday. Let's call and check.", "tr": "Mağaza pazar günü açık olmayabilir. Arayıp soralım."}, {"en": "Elif might stay in Izmir for New Year's Eve.", "tr": "Elif yılbaşında İzmir'de kalabilir."}, {"en": "I might not come tomorrow. I'm not feeling well.", "tr": "Yarın gelmeyebilirim. Kendimi iyi hissetmiyorum."}, {"en": "Maria might be busy, so send her an email first.", "tr": "Maria meşgul olabilir, o yüzden önce ona e-posta at."}], "mistakes": [{"wrong": "She might comes tomorrow.", "right": "She might come tomorrow.", "why_tr": "May ve might'tan sonra fiil yalın hâlde olur, -s almaz."}, {"wrong": "I might to visit my friends.", "right": "I might visit my friends.", "why_tr": "Might'tan sonra to kullanılmaz."}, {"wrong": "He doesn't might come.", "right": "He might not come.", "why_tr": "Olumsuz için doesn't kullanılmaz; might'ın arkasına not eklenir."}, {"wrong": "I may going to Spain next summer.", "right": "I may go to Spain next summer.", "why_tr": "May'den sonra -ing değil, fiilin yalın hâli gelir."}], "tip_tr": "\"-ebilir\" olasılık bildiriyorsa might düşün: gelebilir = might come, gelmeyebilir = might not come."}, "7-6": {"summary": "A phrasal verb is a verb + a small word like up, out or along. Together they often have a new meaning, so we learn them as one phrase.", "tr_summary": "Phrasal verb, bir fiil ile up, out, along gibi küçük bir kelimenin birleşmesidir ve çoğu zaman yeni bir anlam taşır: show up = gelmek, ortaya çıkmak; find out = öğrenmek. Türkçede böyle bir yapı yoktur; bu anlamları genelde tek bir fiille söyleriz. Bazıları üç kelimedir: run out of, get along with, look forward to. Look forward to'dan sonra isim veya -ing gelir.", "use": ["Show up = arrive: Marcus showed up early.", "Find out = learn new information; catch up = talk and share news.", "Get along (with) = be friendly with; run out of = have no more.", "Look forward to + noun or -ing: I'm looking forward to seeing you.", "Put on music = start playing it."], "form": [{"label": "Two words", "pattern": "verb + up/out/along/on", "example": "Everyone showed up. / Let's catch up."}, {"label": "Three words", "pattern": "verb + small word + preposition + noun", "example": "We ran out of cookies. / I get along with Sam."}, {"label": "Look forward to", "pattern": "look forward to + noun / verb-ing", "example": "I'm looking forward to the party. / I'm looking forward to seeing you."}, {"label": "Past", "pattern": "change the verb, keep the small word", "example": "Sam showed up late. / We ran out of milk."}], "examples": [{"en": "Marcus showed up early for his interview.", "tr": "Marcus mülakatına erken geldi."}, {"en": "We ran out of cookies in twenty minutes!", "tr": "Kurabiyeler yirmi dakikada bitti!"}, {"en": "I get along well with my coworkers.", "tr": "İş arkadaşlarımla iyi anlaşıyorum."}, {"en": "Elif is looking forward to seeing her family.", "tr": "Elif ailesini görmeyi dört gözle bekliyor."}, {"en": "Let's meet for coffee next week and catch up.", "tr": "Gelecek hafta kahve içmeye buluşalım, neler yaptığımızı konuşuruz."}, {"en": "How did you find out about the party?", "tr": "Partiyi nereden öğrendin?"}, {"en": "Can you put on some music?", "tr": "Biraz müzik açar mısın?"}, {"en": "Everyone showed up, even Tom from the web team.", "tr": "Herkes geldi, web ekibinden Tom bile."}], "mistakes": [{"wrong": "I'm looking forward to see you.", "right": "I'm looking forward to seeing you.", "why_tr": "Buradaki to bir edattır; arkasından fiilin yalın hâli değil, -ing gelir."}, {"wrong": "We've run out milk.", "right": "We've run out of milk.", "why_tr": "Bir şeyin bittiğini söylerken of gerekir: run out of + isim."}, {"wrong": "I get along my coworkers.", "right": "I get along with my coworkers.", "why_tr": "Kiminle anlaştığını söylerken with eklenir: get along with."}, {"wrong": "How did you find about the party?", "right": "How did you find out about the party?", "why_tr": "Öğrenmek anlamında find tek başına değil, find out kullanılır."}], "tip_tr": "Phrasal verb'ü tek kelime gibi öğren ve Türkçe karşılığıyla ezberle: show up = gelmek, run out of = bitmek."}, "8-1": {"summary": "We use the past simple passive (was/were + past participle) when the action is more important than the person who did it.", "tr_summary": "Past simple passive, was/were + fiilin üçüncü hâli ile kurulur: The flight was delayed. Türkçedeki edilgen yapıya benzer: \"Köprü 1890'da yapıldı\" = The bridge was built in 1890. Tekil öznede was, çoğul öznede were kullanılır. İşi kimin yaptığını söylemek istersek by ekleriz; bu Türkçedeki \"tarafından\" demektir.", "use": ["When we don't know who did the action: My seat was changed.", "When the action is more important than the person: The flight was delayed.", "With by + person to say who did it: made by a woman at the market.", "For history and facts: The bridge was built in 1890."], "form": [{"label": "Positive", "pattern": "subject + was/were + past participle", "example": "The flight was delayed."}, {"label": "Negative", "pattern": "subject + wasn't/weren't + past participle", "example": "The gifts weren't wrapped."}, {"label": "Question", "pattern": "Was/Were + subject + past participle?", "example": "Why was my seat changed?"}, {"label": "With by", "pattern": "subject + was/were + past participle + by + person", "example": "The cookies were baked by Dan."}], "examples": [{"en": "My flight was delayed a little.", "tr": "Uçuşum biraz ertelendi."}, {"en": "These scarves were made by a woman at the market.", "tr": "Bu atkılar pazardaki bir kadın tarafından yapıldı."}, {"en": "Why was my seat changed?", "tr": "Koltuğum neden değiştirildi?"}, {"en": "The cookies were baked by Dan this morning.", "tr": "Kurabiyeler bu sabah Dan tarafından pişirildi."}, {"en": "Elif's ticket was bought in October.", "tr": "Elif'in bileti ekimde alındı."}, {"en": "Were the gifts packed carefully?", "tr": "Hediyeler dikkatlice paketlendi mi?"}, {"en": "The flight was canceled because of the snow.", "tr": "Uçuş kar yüzünden iptal edildi."}, {"en": "This letter was written in Turkish fifty years ago.", "tr": "Bu mektup elli yıl önce Türkçe yazıldı."}], "mistakes": [{"wrong": "The bridge built in 1890.", "right": "The bridge was built in 1890.", "why_tr": "Edilgen cümlede was/were unutulmaz; Türkçedeki \"yapıldı\" İngilizcede \"was built\" olur."}, {"wrong": "These photos was taken by my dad.", "right": "These photos were taken by my dad.", "why_tr": "Çoğul özne (photos) ile were kullanılır."}, {"wrong": "My suitcase was send to the wrong city.", "right": "My suitcase was sent to the wrong city.", "why_tr": "Was'tan sonra fiilin üçüncü hâli gelir: send → sent."}, {"wrong": "Did the windows cleaned yesterday?", "right": "Were the windows cleaned yesterday?", "why_tr": "Edilgen soruda did değil, was/were kullanılır."}], "tip_tr": "Türkçede \"-ıldı / -ildi\" (yapıldı, gönderildi) görürsen İngilizcede was/were + üçüncü hâl düşün."}, "8-2": {"summary": "When, before, after, until and as soon as join two parts of a sentence and show time. For the future, we use the present simple after these words.", "tr_summary": "When, before, after, until ve as soon as iki cümleyi zaman bakımından bağlar. Gelecekten söz ederken bu kelimelerden sonra will değil, geniş zaman (present simple) kullanılır: I'll call you when I get home. Türkçede de \"Eve gelince seni ararım\" deriz; \"gelince\" kısmında gelecek zaman eki yoktur. As soon as \"-ır -maz\" (varır varmaz), until \"-ene kadar\" (dönene kadar) anlamındadır.", "use": ["When = at that time; before = earlier; after = later.", "As soon as = right after: I'll call my mom as soon as we land.", "Until = up to that time: Wait here until I come back.", "For the future, use the present simple after these words, and will in the other part.", "If the time clause comes first, use a comma: When I land, I'll call you."], "form": [{"label": "Future", "pattern": "will + verb + when/before/after/until/as soon as + present simple", "example": "I'll text you when the plane lands."}, {"label": "Time clause first", "pattern": "When/As soon as + present simple, + will + verb", "example": "As soon as I get home, I'll take a shower."}, {"label": "Past", "pattern": "past simple + when/before/after/until + past simple", "example": "We talked until the lights went off."}], "examples": [{"en": "I'll call my mom as soon as we land.", "tr": "İner inmez annemi arayacağım."}, {"en": "When I arrived in Chicago, I didn't know anyone.", "tr": "Chicago'ya geldiğimde kimseyi tanımıyordum."}, {"en": "Please wait here until I come back.", "tr": "Lütfen ben dönene kadar burada bekle."}, {"en": "Before I left, I read three books about Chicago.", "tr": "Gitmeden önce Chicago hakkında üç kitap okudum."}, {"en": "Elif and Joan talked until the lights went off.", "tr": "Elif ve Joan ışıklar sönene kadar konuştu."}, {"en": "I'll text you before I get on the plane.", "tr": "Uçağa binmeden önce sana mesaj atacağım."}, {"en": "We'll have dessert after the movie finishes.", "tr": "Film bittikten sonra tatlı yiyeceğiz."}, {"en": "Dad will wait at the door until Elif comes out.", "tr": "Babam, Elif çıkana kadar kapıda bekleyecek."}], "mistakes": [{"wrong": "I'll call you when I will arrive.", "right": "I'll call you when I arrive.", "why_tr": "When'den sonra gelecek anlamı olsa bile will kullanılmaz; geniş zaman gelir."}, {"wrong": "As soon as I will get home, I'll take a shower.", "right": "As soon as I get home, I'll take a shower.", "why_tr": "As soon as'ten sonra da will kullanılmaz: as soon as I get home."}, {"wrong": "Don't leave until I don't come back.", "right": "Don't leave until I come back.", "why_tr": "Türkçede \"ben gelmeyene kadar\" denebilir ama İngilizcede until'den sonra olumsuz kullanılmaz."}, {"wrong": "Before leave, turn off the lights.", "right": "Before you leave, turn off the lights.", "why_tr": "Before'dan sonra özne + fiil gelir (you leave); özne yoksa -ing kullanılır: before leaving."}], "tip_tr": "Türkçedeki \"gelince, gelene kadar\" gibi, İngilizcede de when/until'den sonra will yok: when I arrive."}, "8-3": {"summary": "We use the present perfect with just, already and yet to talk about recent actions and their results now.", "tr_summary": "Present perfect (have/has + fiilin üçüncü hâli) yakın zamanda olmuş ve sonucu şimdi önemli olan şeyler için kullanılır. Just \"az önce, yeni\", already \"çoktan, zaten\" demektir ve ikisi de have ile fiil arasına gelir. Yet ise soru ve olumsuz cümlelerde, cümlenin sonunda kullanılır: \"Henüz bavulumu açmadım\" = I haven't unpacked yet.", "use": ["Just = a very short time ago: I've just come back.", "Already = before now, maybe sooner than expected: She's already called three times.", "Yet = until now, in questions and negatives: Have you unpacked yet?", "Just and already go before the past participle; yet goes at the end."], "form": [{"label": "Just", "pattern": "subject + have/has + just + past participle", "example": "I've just come back from a walk."}, {"label": "Already", "pattern": "subject + have/has + already + past participle", "example": "Mom has already planned every meal."}, {"label": "Negative + yet", "pattern": "subject + haven't/hasn't + past participle + yet", "example": "I haven't called Deniz yet."}, {"label": "Question + yet", "pattern": "Have/Has + subject + past participle + yet?", "example": "Have you unpacked yet?"}], "examples": [{"en": "I've just come back from a walk by the sea.", "tr": "Az önce deniz kenarındaki yürüyüşten döndüm."}, {"en": "Mom has already eaten half the box of cookies!", "tr": "Annem kurabiye kutusunun yarısını şimdiden yedi bile!"}, {"en": "Have you unpacked yet?", "tr": "Bavulunu açtın mı?"}, {"en": "I haven't seen Deniz yet, but we're meeting this weekend.", "tr": "Deniz'i henüz görmedim ama bu hafta sonu buluşuyoruz."}, {"en": "I'm not hungry. I've already had lunch.", "tr": "Aç değilim. Öğle yemeğini zaten yedim."}, {"en": "Be careful! I've just washed the floor.", "tr": "Dikkat et! Yeri az önce sildim."}, {"en": "The bus hasn't come yet.", "tr": "Otobüs henüz gelmedi."}, {"en": "Mom has just made tea. Do you want some?", "tr": "Annem az önce çay demledi. İster misin?"}], "mistakes": [{"wrong": "I've just came back.", "right": "I've just come back.", "why_tr": "Have'den sonra fiilin üçüncü hâli gelir: come → came → come."}, {"wrong": "I've already ate lunch.", "right": "I've already eaten lunch.", "why_tr": "Already'den sonra da üçüncü hâl kullanılır: eat → ate → eaten."}, {"wrong": "I've finished yet.", "right": "I've already finished.", "why_tr": "Yet olumlu cümlede kullanılmaz; olumlu cümlede already kullanılır."}, {"wrong": "My aunt have already called three times.", "right": "My aunt has already called three times.", "why_tr": "My aunt = she, bu yüzden has kullanılır."}], "tip_tr": "Az önce = just, çoktan = already, henüz (olumsuz) = yet. Just ve already ortada, yet en sonda."}, "8-4": {"summary": "We use reported speech to tell someone what another person asked. Reported questions use normal sentence word order, and requests use asked + person + to + verb.", "tr_summary": "Birinin sorduğu soruyu aktarırken soru düzeni kalkar ve cümle düz cümle gibi kurulur; do, does ve did kullanılmaz. Evet/hayır sorularında if kullanılır: \"Aç olup olmadığımı sordu\" = She asked if I was hungry. Soru kelimeli sorularda soru kelimesi kalır: \"Nerede yaşadığımı sordu\" = She asked where I lived. Rica için asked + kişi + to + fiil kullanılır: \"Tarifi getirmemi istedi\" = He asked me to bring the recipe. Zaman genelde bir adım geçmişe kayar: is → was, can → could.", "use": ["To report yes/no questions: asked (me) + if + subject + verb.", "To report wh- questions: asked + question word + subject + verb.", "To report requests: asked + person + to + verb; negative: not to + verb.", "Move the tense back: is → was, can → could, have → had, do → did."], "form": [{"label": "Yes/no question", "pattern": "subject + asked (me) + if + subject + verb (past)", "example": "\"Do you have snow?\" → She asked me if we had snow."}, {"label": "Wh- question", "pattern": "subject + asked (me) + question word + subject + verb (past)", "example": "\"Where is Turkey?\" → She asked me where Turkey was."}, {"label": "Request", "pattern": "subject + asked + person + to + base verb", "example": "\"Please bring the recipe.\" → He asked me to bring the recipe."}, {"label": "Negative request", "pattern": "subject + asked + person + not to + base verb", "example": "\"Don't be late.\" → She asked me not to be late."}], "examples": [{"en": "My uncle asked me if it was really very cold in Chicago.", "tr": "Amcam bana Chicago'nun gerçekten çok soğuk olup olmadığını sordu."}, {"en": "Ece asked me if I knew any famous people.", "tr": "Ece bana ünlü birini tanıyıp tanımadığımı sordu."}, {"en": "My aunt asked me what I ate every day.", "tr": "Teyzem bana her gün ne yediğimi sordu."}, {"en": "Then she asked me to cook a \"Chicago dinner\" for everyone.", "tr": "Sonra herkese bir \"Chicago yemeği\" pişirmemi istedi."}, {"en": "\"Where do you work?\" → She asked me where I worked.", "tr": "\"Nerede çalışıyorsun?\" → Nerede çalıştığımı sordu."}, {"en": "\"Can you help me?\" → Sam asked me if I could help him.", "tr": "\"Bana yardım edebilir misin?\" → Sam kendisine yardım edip edemeyeceğimi sordu."}, {"en": "Maria asked me to finish the report by Friday.", "tr": "Maria raporu cumaya kadar bitirmemi istedi."}, {"en": "The doctor asked me not to eat too much sugar.", "tr": "Doktor benden çok fazla şeker yemememi istedi."}], "mistakes": [{"wrong": "She asked me where did I live.", "right": "She asked me where I lived.", "why_tr": "Aktarılan soruda did kullanılmaz ve düz cümle düzeni gelir: I lived."}, {"wrong": "He asked me do I like my job.", "right": "He asked me if I liked my job.", "why_tr": "Evet/hayır sorusu if ile aktarılır, zaman da geçmişe kayar: liked."}, {"wrong": "He asked me bring the recipe.", "right": "He asked me to bring the recipe.", "why_tr": "Rica aktarırken kişiden sonra to + fiil gelir."}, {"wrong": "She asked me don't be late.", "right": "She asked me not to be late.", "why_tr": "Olumsuz rica \"don't\" ile değil, \"not to\" ile aktarılır."}], "tip_tr": "\"-ip -mediğini sordu\" = asked if; \"-memi istedi\" = asked me to. Soru düzeni yok, do/did yok."}, "8-5": {"summary": "After hope, plan, want and would like, we use to + base verb. We also review the main ways to talk about the future: going to, will and the present continuous.", "tr_summary": "Hope, plan, want ve would like fiillerinden sonra to + fiilin yalın hâli gelir: I hope to pass = Geçmeyi umuyorum. Would like to, want to'nun daha kibar hâlidir. Türkçede gelecek için çoğu zaman \"-ecek\" ya da şimdiki zamanı kullanırız; İngilizcede ise anlama göre seçim yapılır: plan için going to, anlık karar, teklif ve söz için will, kesinleşmiş plan için present continuous. Türkçede de \"Pazar günü teyzemi ziyaret ediyorum\" deriz; bu, İngilizcedeki \"I'm visiting my aunt on Sunday\" yapısına çok benzer.", "use": ["Hope / plan / want / would like + to + base verb: I plan to join a book club.", "Would like to = a polite want to: I'd like to cook for my coworkers.", "Going to for plans and intentions: I'm going to practice every Saturday.", "Will for quick decisions, offers and promises: I'll help you with the boxes.", "Present continuous for fixed plans with a time: Some friends are coming over on Sunday."], "form": [{"label": "Hope/plan/want + to", "pattern": "subject + hope/plan/want + to + base verb", "example": "I hope to get my driver's license this year."}, {"label": "Would like to", "pattern": "subject + would ('d) like + to + base verb", "example": "I'd like to join a book club."}, {"label": "Going to", "pattern": "subject + am/is/are going to + base verb", "example": "I'm going to go to the gym twice a week."}, {"label": "Will", "pattern": "subject + will ('ll) + base verb", "example": "Don't worry, I'll help you."}, {"label": "Present continuous", "pattern": "subject + am/is/are + verb-ing + time", "example": "I'm visiting my aunt on Sunday."}], "examples": [{"en": "I hope to get my driver's license by the summer.", "tr": "Yaza kadar ehliyetimi almayı umuyorum."}, {"en": "Elif plans to take the driving test in May.", "tr": "Elif, mayısta ehliyet sınavına girmeyi planlıyor."}, {"en": "I want to speak more and worry less.", "tr": "Daha çok konuşmak ve daha az endişelenmek istiyorum."}, {"en": "I'd like to lead a project on my own.", "tr": "Tek başıma bir proje yönetmek isterim."}, {"en": "I'm going to ask Maria for more feedback.", "tr": "Maria'dan daha fazla geri bildirim isteyeceğim."}, {"en": "You can't make baklava? Then I'll teach you!", "tr": "Baklava yapamıyor musun? O zaman ben sana öğretirim!"}, {"en": "Some friends are coming over on Sunday.", "tr": "Pazar günü birkaç arkadaşım bize geliyor."}, {"en": "Dan would like to visit Izmir one day.", "tr": "Dan bir gün İzmir'i ziyaret etmek istiyor."}], "mistakes": [{"wrong": "I hope pass the test.", "right": "I hope to pass the test.", "why_tr": "Hope'tan sonra to + fiil gelir: hope to pass."}, {"wrong": "I'd like visiting Izmir.", "right": "I'd like to visit Izmir.", "why_tr": "Would like'tan sonra -ing değil, to + yalın fiil gelir."}, {"wrong": "I want that you come to my party.", "right": "I want you to come to my party.", "why_tr": "Türkçedeki \"gelmeni istiyorum\" İngilizcede want + kişi + to + fiil olur; \"that\" kullanılmaz."}, {"wrong": "I'll to call Mom every Sunday.", "right": "I'll call Mom every Sunday.", "why_tr": "Will'den sonra to kullanılmaz; fiil yalın hâlde gelir."}], "tip_tr": "Hope, plan, want, would like: hepsinin arkasında \"to\" var. \"-mek istiyorum\" = want to."}, "8-6": {"summary": "This lesson reviews the main grammar of the course: past simple, present perfect, past continuous, first and second conditionals, and the passive.", "tr_summary": "Bitmiş, zamanı belli geçmiş olaylar için past simple; deneyimler ve bugüne uzanan sonuçlar için present perfect kullanılır. Türkçede ikisi de çoğu zaman \"-dı\" ile söylenir, bu yüzden zaman ifadesine bakın: last night → past simple, since October → present perfect. Geçmişte devam eden eylem için past continuous (was/were + -ing) kullanılır. Gerçek olasılık için if + present, will; hayali durum için if + past, would kullanılır. Edilgen yapı be + fiilin üçüncü hâli ile kurulur.", "use": ["Past simple for finished actions at a finished time: Last night I didn't sleep well.", "Present perfect for experiences and results now, often with since, for and ever: I've learned a lot since October.", "Past continuous for an action in progress in the past: You were carrying boxes when we met.", "First conditional for real possibilities; second conditional for imaginary situations.", "Passive (be + past participle) when the action is more important than the person."], "form": [{"label": "Past simple / present perfect", "pattern": "subject + past verb / subject + have/has + past participle", "example": "I arrived in October. / I've lived here since October."}, {"label": "Past continuous", "pattern": "subject + was/were + verb-ing", "example": "I was watching TV when you called."}, {"label": "First conditional", "pattern": "If + present simple, will + base verb", "example": "If it rains tomorrow, we'll stay home."}, {"label": "Second conditional", "pattern": "If + past simple, would + base verb", "example": "If I had a car, I would drive to the lake."}, {"label": "Passive", "pattern": "subject + is/are/was/were + past participle", "example": "The tea was brought from Izmir."}], "examples": [{"en": "When I arrived in Chicago, I didn't know anyone.", "tr": "Chicago'ya geldiğimde kimseyi tanımıyordum."}, {"en": "I've learned a lot since October.", "tr": "Ekimden beri çok şey öğrendim."}, {"en": "Have you ever tried baklava?", "tr": "Hiç baklava yedin mi?"}, {"en": "You were carrying boxes when we first met.", "tr": "İlk tanıştığımızda kutu taşıyordun."}, {"en": "If it rains tomorrow, we'll stay home.", "tr": "Yarın yağmur yağarsa evde kalırız."}, {"en": "If I could go back, I'd say, \"Don't worry.\"", "tr": "Geçmişe dönebilseydim, \"Endişelenme\" derdim."}, {"en": "Elif was given a bigger task at work.", "tr": "Elif'e işte daha büyük bir görev verildi."}, {"en": "The tea was brought from Izmir.", "tr": "Çay İzmir'den getirildi."}], "mistakes": [{"wrong": "I live in Chicago since October.", "right": "I've lived in Chicago since October.", "why_tr": "Since ile, geçmişte başlayıp hâlâ süren durumlar için present perfect kullanılır."}, {"wrong": "If it will rain tomorrow, we'll stay home.", "right": "If it rains tomorrow, we'll stay home.", "why_tr": "If'li kısımda will kullanılmaz; geniş zaman (present simple) gelir."}, {"wrong": "If I would have a car, I would drive to the lake.", "right": "If I had a car, I would drive to the lake.", "why_tr": "Hayali durumda if'ten sonra would değil, geçmiş zaman gelir: if I had."}, {"wrong": "The tea brought from Izmir.", "right": "The tea was brought from Izmir.", "why_tr": "Edilgen cümlede be fiili (was/were) unutulmaz."}], "tip_tr": "Önce zaman ifadesine bak: last night = past simple, since/ever = present perfect, if + will yok."}}}</script>
<script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const CFG = window.EWE_CONFIG || {};
const $ = (s, el) => (el || document).querySelector(s);
const app = $("#app");
const STEPS = [
  { id: "warm", name: "Warm-up", min: 10, desc: "Review your words" },
  { id: "listen", name: "Listen", min: 25, desc: "Dialogue, questions, shadowing" },
  { id: "words", name: "New words", min: 20, desc: "8 phrases and practice" },
  { id: "grammar", name: "Grammar", min: 20, desc: "One small rule, 8 exercises" },
  { id: "read", name: "Read", min: 20, desc: "A short text and questions" },
  { id: "speak", name: "Speak", min: 15, desc: "Say it, record it, check it" },
  { id: "write", name: "Write", min: 10, desc: "Write, submit, get it checked" },
];
const DAYNAMES = ["Spark", "Discover", "Build", "Explore", "Connect", "Grow"];
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const MIC = '<svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-12 0H4.2a7.8 7.8 0 0 0 6.9 7.7V22h1.8v-2.8a7.8 7.8 0 0 0 6.9-7.7z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>';

// ---------- state ----------
const KEY = "english-with-ebru-v1";
let S;
function blank() { return { v: 1, days: {}, cards: {}, mistakes: [], sundays: {}, notes: [], activity: {}, settings: { scale: 1 }, opened: null, updated: 0 }; }
function fill(s) { const b = blank(); for (const k in b) if (s[k] == null) s[k] = b[k]; return s; }
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
  S = S && S.v === 1 ? fill(S) : blank();
}
function save(touch) { if (touch !== false) { S.updated = Date.now(); try { checkAch(); } catch (e) {} } try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} Sync.queue(); }
load();
const dkey = (w, d) => w + "-" + d;
function dayState(k) { const d = S.days[k] || (S.days[k] = { steps: {}, ans: {}, write: "", checks: {} }); d.ans = d.ans || {}; d.checks = d.checks || {}; d.steps = d.steps || {}; return d; }
function localISO(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return localISO(); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return localISO(d); }
function markActive() { S.activity[today()] = (S.activity[today()] || 0) + 1; }
function streak() { let n = 0, d = today(); if (!S.activity[d]) d = addDays(d, -1); while (S.activity[d]) { n++; d = addDays(d, -1); } return n; }
function applySettings() { const r = document.documentElement; r.style.setProperty("--scale", S.settings.scale || 1); const t = S.settings.theme; if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme"); }
applySettings();

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2200); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shuffle(a, seed) { a = a.slice(); let x = seed || 7; for (let i = a.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = Math.floor((x / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s) { return String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/[.!?,]+$/g, "").replace(/\s+/g, " ").trim(); }
function h(tag, attrs, html) { const el = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "class") el.className = attrs[k]; else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]); else el.setAttribute(k, attrs[k]); } if (html != null) el.innerHTML = html; return el; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---------- sync (her account) ----------
const Sync = (function () {
  const enabled = !!(CFG.supabaseUrl && CFG.supabaseKey && window.supabase && window.supabase.createClient);
  let client = null, user = null, timer = null, status = enabled ? "Not logged in" : "", busy = false, onChange = () => {}, ready = false;
  if (enabled) {
    try { client = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }); } catch (e) { client = null; }
  }
  function set(s) { status = s; onChange(); }
  function merge(a, b) {
    // a, b: two states. Keep the union, prefer more progress.
    const out = fill(JSON.parse(JSON.stringify(a)));
    b = fill(JSON.parse(JSON.stringify(b)));

// ---------- day ----------
function renderDay(w, dnum) {
  const d = findDay(w, dnum), k = dkey(w, dnum), ds = dayState(k);
  if (!ds.started) { ds.started = today(); save(); }
  app.innerHTML = ""; app.append(topbar());
  const head = h("div", { class: "dayhead" });
  head.innerHTML = '<div class="eyebrow">Week ' + w + " · " + slotName(d.day) + "</div><h1>" + esc(d.title) + '</h1><div class="small muted">Today you will learn to:</div><ul class="goals">' + d.goals.map((g) => "<li>" + esc(g) + "</li>").join("") + "</ul>";
  app.append(head);
  const steps = h("div", { class: "steps" }); steps.style.marginTop = "16px"; app.append(steps);
  let openId = ds.open !== undefined ? ds.open : (STEPS.find((s) => !ds.steps[s.id]) || STEPS[0]).id;
  const builders = { warm: buildWarm, listen: buildListen, words: buildWords, grammar: buildGrammar, read: buildRead, speak: buildSpeak, write: buildWrite };
  function draw() {
    steps.innerHTML = "";
    STEPS.forEach((st, i) => {
      const done = ds.steps[st.id];
      const box = h("section", { class: "step" + (done ? " done" : "") + (openId === st.id ? " open" : "") });
      box.style.setProperty("--sc", STEP_COLOR[st.id]);
      const sh = h("button", { class: "sh", "aria-expanded": String(openId === st.id) });
      const sc = done && done.score ? '<span class="score">' + done.score[0] + "/" + done.score[1] + "</span>" : (done ? '<span class="score">Done</span>' : "");
      sh.innerHTML = '<span class="num">' + (done ? IC.check : IC[st.id]) + '</span><span><span class="stepno">Step ' + (i + 1) + '</span><br><span class="name">' + st.name + '</span><br><span class="meta">' + st.desc + " · " + st.min + " min</span></span>" + sc;
      sh.onclick = () => { stopAll(); openId = openId === st.id ? null : st.id; ds.open = openId; save(false); draw(); if (openId) box.scrollIntoView({ block: "start" }); };
      box.append(sh);
      if (openId === st.id) {
        const body = h("div", { class: "sb" }); const ctx = { score: null };
        builders[st.id](body, d, k, ds, ctx);
        const fin = h("button", { class: "btn stepdone" }, i === STEPS.length - 1 ? "Finish the day" : "Done — next step");
        fin.onclick = () => {
          const sc = ctx.score ? ctx.score() : null;
          ds.steps[st.id] = { at: today(), score: sc ? [sc[0], sc[2]] : null };
          if (st.id === "words") addCards(k);
          markActive();
          const nxt = STEPS.slice(i + 1).find((s) => !ds.steps[s.id]) || STEPS.find((s) => !ds.steps[s.id]);
          openId = nxt ? nxt.id : null; ds.open = openId;
          if (!nxt) ds.done = today();
          save(); stopAll(); draw();
          if (!nxt) { showDayDone(w, dnum); return; }
          const el = steps.querySelector(".step.open"); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
        };

      }
      steps.append(box);
    });
  }
  draw();
  const nav = h("div", { class: "daynav" });
  const all = []; DATA.weeks.forEach((wk) => { wk.days.forEach((x) => all.push([wk.week, x.day])); all.push([wk.week, 7]); });
  const idx = all.findIndex((x) => x[0] === w && x[1] === dnum);
  if (idx > 0) { const b = h("button", { class: "btn ghost small" }, "← Previous day"); b.onclick = () => go({ w: all[idx - 1][0], d: all[idx - 1][1] }); nav.append(b); } else nav.append(h("span"));
  if (idx < all.length - 1) { const nl = !isUnlocked(all[idx + 1][0], all[idx + 1][1]); const b = h("button", { class: "btn ghost small" + (nl ? " lockedbtn" : "") }, nl ? "Next day (locked)" : "Next day →"); b.onclick = () => go({ w: all[idx + 1][0], d: all[idx + 1][1] }); nav.append(b); }
  app.append(nav);
}
function showDayDone(w, dnum) {

  const p1 = part("Listen and answer", "Listen 1", "Listen to the whole conversation. Don't read anything yet. Then answer the questions.");
  p1.append(pl.el);
  const m = mcqBlock(L.mcq, ds.ans, "lm", k, "Listening"); p1.append(m.el);
  const p2 = part("Fill the gaps", "Listen 2", "Listen again. Write the missing words. Tap ▶ to hear one line again. Press Enter after each answer.");
  L.gaps.forEach((g, gi) => {
    const line = L.lines[g.line];

    const [a, b] = line.t.split(g.answer);
    const id = "lg" + gi;

    top.append(txt); row.append(top, fb);
    function check(val, fresh) {
      const ok = norm(val) === norm(g.answer);
      inp.value = val; inp.disabled = true; inp.classList.add(ok ? "right" : "wrong");
      if (!ok) { fb.hidden = false; fb.className = "fb no"; fb.innerHTML = "Answer: <b>" + esc(g.answer) + "</b>"; }
      if (fresh) { ds.ans[id] = val; markActive(); save(); if (!ok) logMistake(k, "Listening", line.t.replace(g.answer, "___"), val, g.answer, "", { kind: "type", answers: [g.answer] }); }

    inp.addEventListener("change", () => { if (inp.value.trim()) check(inp.value.trim(), true); });
    if (ds.ans[id] != null) check(ds.ans[id], false);

  lineEls = L.lines.map((l, i) => {
    const el = h("div", { class: "line" });
    el.append(h("span", { class: "whos" + (names.indexOf(l.s) === 1 ? " f2" : "") }, esc(l.s)), h("span", null, esc(l.t)));
    const tt = A.listenT && A.listenT[i];

  box.append(h("div", { class: "kind" }, esc(R.kind)));
  const TOKRE = /[A-Za-z\u00C0-\u00FF]+(?:['\u2019][A-Za-z\u00C0-\u00FF]+)*/g;
  R.text.split(/\n\n+/).forEach((para) => {
    if (!G) { box.append(h("p", null, esc(para))); return; }
    let html = "", last = 0;
    para.replace(TOKRE, (m, off) => { html += esc(para.slice(last, off)) + '<span class="tw" tabindex="0" role="button">' + esc(m) + "</span>"; last = off + m.length; return m; });
    html += esc(para.slice(last));

    const pop = h("div", { class: "glosspop", role: "status", hidden: "" });

    let curEl = null;

    const show = (el) => {
      if (curEl === el) { close(); return; }
      if (curEl) curEl.classList.remove("sel");
      curEl = el; el.classList.add("sel");
      const key = el.textContent.toLowerCase().replace(/\u2019/g, "'");

      pop.innerHTML = '<span class="gw">' + esc(el.textContent) + '</span><span class="gt">' + esc(tr) + "</span>";
      pop.hidden = false;
      const br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
      const pw = Math.min(280, br.width - 16);
      pop.style.maxWidth = pw + "px";
      let left = r.left - br.left + r.width / 2 - pop.offsetWidth / 2;
      left = Math.max(8, Math.min(left, br.width - pop.offsetWidth - 8));
      pop.style.left = left + "px";
      pop.style.top = (r.bottom - br.top + 8) + "px";
    };
    box.addEventListener("click", (e) => { const t = e.target.closest(".tw"); if (t) { e.stopPropagation(); show(t); } else close(); });
    box.addEventListener("keydown", (e) => { const t = e.target.closest(".tw"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(t); } if (e.key === "Escape") close(); });
    document.addEventListener("click", (e) => { if (!box.contains(e.target)) close(); });
  }
  if (A.read) p1.append(makePlayer(A.read).el);
  p1.append(box);
  const p2 = part("Questions", null, null);

  body.append(p1, p2, p3);
  ctx.score = () => { const a = m1.score(), b = m2.score(); return [a[0] + b[0], a[2] + b[2], a[2] + b[2]]; };
}

function pickSayLines(d) {
  const L = d.listening.lines;
  const cand = L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.l.s === "Elif" && x.n >= 6 && x.n <= 16);
  const pool = cand.length >= 4 ? cand : L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.n >= 5 && x.n <= 18);
  const step = Math.max(1, Math.floor(pool.length / 4));
  const out = []; for (let j = 0; j < pool.length && out.length < 4; j += step) out.push(pool[j]);
  return out;
}

async function checkText(text) {
  const body = new URLSearchParams({ text, language: "en-US", enabledOnly: "false" });
  const r = await fetch("https://api.languagetool.org/v2/check", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" }, body });
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  return j.matches || [];
}
function friendlyType(m) {
  const t = (m.rule && m.rule.issueType) || "";
  if (t === "misspelling") return "Spelling";
  if (t === "grammar") return "Grammar";
  if (t === "typographical") return "Punctuation";
  if (t === "style") return "Style";
  return "Check";
}
function renderCheck(container, text, matches) {
  container.innerHTML = "";
  let html = "", pos = 0;
  const sorted = matches.slice().sort((a, b) => a.offset - b.offset);
  sorted.forEach((m, i) => { if (m.offset < pos) return; html += esc(text.slice(pos, m.offset)) + '<mark title="' + esc(m.message) + '">' + esc(text.slice(m.offset, m.offset + m.length)) + "<sup>" + (i + 1) + "</sup></mark>"; pos = m.offset + m.length; });
  html += esc(text.slice(pos));
  container.append(h("div", { class: "submitted" }, html));
  if (!sorted.length) { container.append(h("div", { class: "fb ok" }, "<b>No problems found.</b> Well done! Now compare with the model answer.")); }
  else {
    container.append(h("p", null, "<b>" + sorted.length + "</b> " + (sorted.length === 1 ? "thing" : "things") + " to check:"));
    const list = h("div", { class: "issues" });
    sorted.forEach((m, i) => {
      const bad = text.slice(m.offset, m.offset + m.length);
      const sug = (m.replacements || []).slice(0, 3).map((r) => r.value);
      list.append(h("div", { class: "issue" }, '<div class="small muted"><b>' + (i + 1) + ".</b> " + friendlyType(m) + '</div><div><span class="bad">' + esc(bad) + "</span>" + (sug.length ? ' → <span class="sug">' + sug.map(esc).join(" / ") + "</span>" : "") + '</div><div class="small">' + esc(m.shortMessage || m.message) + "</div>"));
    });
    container.append(list);
  }
  container.append(h("p", { class: "credit" }, 'Checked by <a href="https://languagetool.org" target="_blank">LanguageTool</a>. It can miss things or be wrong, so read each note carefully.'));
}
function buildWrite(body, d, k, ds) {
  const W = d.writing;
  const p1 = part(W.prompt, "Write", "Write " + esc(W.length) + ". Don't use a translator. When you finish, press <b>Submit</b> and your text will be checked.");
  const ta = h("textarea", { id: "write-" + k, "aria-label": "Your text", placeholder: "Write here…", spellcheck: "false", autocorrect: "off" });
  ta.value = ds.write || "";
  const wc = h("div", { class: "small muted" });
  const upd = () => { const n = (ta.value.match(/[A-Za-z']+/g) || []).length; wc.textContent = n + " words"; };
  ta.oninput = () => { ds.write = ta.value; save(); upd(); }; upd();
  const submit = h("button", { class: "btn" }, "Submit");
  const editBtn = h("button", { class: "btn ghost small", hidden: "" }, "Edit and submit again");
  const out = h("div", { class: "stack" });
  const after = h("div", { class: "stack", hidden: "" });
  p1.append(ta, wc, h("div", { class: "row" }), out);
  p1.querySelector(".row").append(submit, editBtn);
  const checks = h("div", { class: "checks" });
  W.checklist.forEach((c, i) => { const id = "wr" + i; const lab = h("label"); const cb = h("input", { type: "checkbox", id: k + "-" + id }); cb.checked = !!ds.checks[id]; cb.onchange = () => { ds.checks[id] = cb.checked; save(); }; lab.append(cb, document.createTextNode(c)); checks.append(lab); });

  function lockView(sub) {
    ta.hidden = true; wc.hidden = true; submit.hidden = true; editBtn.hidden = false; after.hidden = false;
    renderCheck(out, sub.text, sub.matches || []);
    if (sub.error) out.prepend(h("div", { class: "fb info" }, "The online checker isn't available right now (no internet, or it's busy). Compare with the model answer, and try <b>Edit and submit again</b> later."));
  }
  submit.onclick = async () => {
    const text = ta.value.trim();
    if ((text.match(/[A-Za-z']+/g) || []).length < 10) { toast("Write a little more first (at least 10 words)."); return; }
    submit.disabled = true; submit.textContent = "Checking…";
    let matches = [], error = false;
    try { matches = await checkText(text); } catch (e) { error = true; }
    submit.disabled = false; submit.textContent = "Submit";
    ds.submissions = ds.submissions || [];
    const sub = { text, at: today(), matches: matches.map((m) => ({ offset: m.offset, length: m.length, message: m.message, shortMessage: m.shortMessage, replacements: (m.replacements || []).slice(0, 3), rule: { issueType: m.rule && m.rule.issueType } })), error };
    ds.submissions.push(sub); ds.submitted = sub;
    sub.matches.forEach((m) => { const bad = text.slice(m.offset, m.offset + m.length); const sug = (m.replacements[0] || {}).value; if (sug) logMistake(k, "Writing", "“" + bad + "” in your text", bad, sug, m.shortMessage || m.message, { kind: "info" }); });
    markActive(); save(); lockView(sub);
  };
  editBtn.onclick = () => { ta.hidden = false; wc.hidden = false; submit.hidden = false; editBtn.hidden = true; out.innerHTML = ""; ta.focus(); };
  body.append(p1, after);
  if (ds.submitted && ds.submitted.text === (ds.write || "").trim()) lockView(ds.submitted);
}

function renderSettings() {

  const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
  c.append(h("h3", null, "Text size"));
  const seg = h("div", { class: "seg" });
  [[0.9, "Small"], [1, "Normal"], [1.15, "Large"], [1.3, "Extra large"]].forEach(([v, l]) => { const b = h("button", { class: (S.settings.scale || 1) === v ? "on" : "" }, l); b.onclick = () => { S.settings.scale = v; save(); applySettings(); renderSettings(); }; seg.append(b); });
  c.append(seg);
  c.append(h("h3", null, "Daily reminder"));
  c.append(reminderBlock());
  c.append(h("h3", null, "Light or dark"));
  const seg2 = h("div", { class: "seg" });
  [["auto", "Same as my phone"], ["light", "Light"], ["dark", "Dark"]].forEach(([v, l]) => { const b = h("button", { class: (S.settings.theme || "auto") === v ? "on" : "" }, l); b.onclick = () => { S.settings.theme = v; save(); applySettings(); renderSettings(); }; seg2.append(b); });
  c.append(seg2);
  app.append(c);
  const c2 = h("div", { class: "card stack" }); c2.style.marginTop = "14px";
  c2.append(h("h3", null, "Start over"));
  c2.append(h("p", { class: "muted" }, "Delete all progress, words, mistakes and notes on this device" + (Sync.user() ? " and in your account" : "") + "."));
  const del = h("button", { class: "btn ghost small" }, "Delete everything");
  del.onclick = () => { if (del.dataset.sure) { const sc = S.settings; S = blank(); S.settings = sc; S.updated = Date.now(); save(); toast("Everything deleted"); go(null); } else { del.dataset.sure = "1"; del.textContent = "Tap again to delete everything"; del.classList.add("red"); } };
  c2.append(del); app.append(c2);
}
function renderAccount(v) {
  pageHead("Account", null);
  const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
  app.append(c);
  if (!Sync.enabled()) { c.append(h("p", null, "Accounts are not set up yet. Your progress is saved on this device.")); return; }
  const u = Sync.user();
  if (v.recover) {
    c.append(h("h2", null, "Choose a new password"));
    const f = h("div", { class: "field" }, '<label for="np">New password (at least 8 characters)</label>'); const np = h("input", { id: "np", type: "password", autocomplete: "new-password" }); f.append(np);
    const msg = h("div"); const b = h("button", { class: "btn" }, "Save password");
    b.onclick = async () => { if (np.value.length < 8) { msg.className = "err"; msg.textContent = "Use at least 8 characters."; return; } b.disabled = true; const { error } = await Sync.newPassword(np.value); b.disabled = false; if (error) { msg.className = "err"; msg.textContent = error.message; } else { toast("Password saved"); go(null); } };
    c.append(f, b, msg); return;
  }
  if (u) {
    c.append(h("h2", null, "You're logged in"));
    c.append(h("p", null, "Email: <b>" + esc(u.email) + "</b>"));
    c.append(h("p", { class: "muted" }, "Your progress, words, mistakes and notes are saved to your account. Log in with the same email on any phone or computer."));
    c.append(h("p", null, "Status: " + esc(Sync.status())));
    const row = h("div", { class: "row" });
    const s = h("button", { class: "btn ghost small" }, "Sync now"); s.onclick = async () => { await Sync.push(); renderAccount({}); };
    const o = h("button", { class: "btn ghost small" }, "Log out"); o.onclick = async () => { o.disabled = true; await Sync.signOut(); toast("Logged out"); go(null); };
    row.append(s, o); c.append(row); return;
  }
  let mode = v.mode || "login";
  c.append(h("h2", null, mode === "signup" ? "Create your account" : mode === "reset" ? "Reset your password" : "Log in"));
  c.append(h("p", { class: "muted" }, mode === "signup" ? "Your progress on this device will be saved to the new account." : mode === "reset" ? "We'll send you an email with a link." : "Log in to save your progress and use it on any device."));
  const f1 = h("div", { class: "field" }, '<label for="em">Email</label>'); const em = h("input", { id: "em", type: "email", autocomplete: "email", inputmode: "email" }); f1.append(em);
  const f2 = h("div", { class: "field" }, '<label for="pw">Password' + (mode === "signup" ? " (at least 8 characters)" : "") + "</label>"); const pw = h("input", { id: "pw", type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password" }); f2.append(pw);
  const msg = h("div");
  const b = h("button", { class: "btn" }, mode === "signup" ? "Create account" : mode === "reset" ? "Send reset email" : "Log in");
  c.append(f1); if (mode !== "reset") c.append(f2); c.append(b, msg);
  const go2 = async () => {
    msg.className = ""; msg.textContent = "";
    const e = em.value.trim(), p = pw.value;
    if (!/^\S+@\S+\.\S+$/.test(e)) { msg.className = "err"; msg.textContent = "Please enter a valid email."; return; }
    if (mode !== "reset" && p.length < (mode === "signup" ? 8 : 1)) { msg.className = "err"; msg.textContent = mode === "signup" ? "Use at least 8 characters." : "Please enter your password."; return; }
    b.disabled = true;
    let r;
    try { r = mode === "signup" ? await Sync.signUp(e, p) : mode === "reset" ? await Sync.reset(e) : await Sync.signIn(e, p); } catch (x) { r = { error: { message: "No connection. Try again." } }; }
    b.disabled = false;
    if (r.error) { msg.className = "err"; msg.textContent = r.error.message === "Invalid login credentials" ? "Wrong email or password." : r.error.message; return; }
    if (mode === "reset") { msg.className = "okmsg"; msg.textContent = "Check your email for the link."; return; }
    if (mode === "signup" && !(r.data && r.data.session)) { msg.className = "okmsg"; msg.textContent = "Almost done! Check your email and tap the link to confirm, then log in here."; return; }
    toast("Welcome!"); go(null);
  };
  b.onclick = go2; [em, pw].forEach((x) => x.addEventListener("keydown", (e) => e.key === "Enter" && go2()));
  const links = h("div", { class: "row" });
  const mk = (label, m) => { const l = h("button", { class: "linkbtn" }, label); l.onclick = () => renderAccount({ mode: m }); return l; };
  if (mode !== "signup") links.append(mk("Create an account", "signup"));
  if (mode !== "login") links.append(mk("Log in", "login"));
  if (mode === "login") links.append(mk("Forgot password?", "reset"));
  c.append(links);
}

// ---------- welcome gate ----------
function offlineOK() { return false; }
function renderSplash() { $("#hdr").hidden = true; app.innerHTML = '<div class="gate"><div class="mark" aria-hidden="true"><i></i><i></i></div><p class="muted">Loading…</p></div>'; }
function renderGate(mode) {
  const known = Sync.knownEmail();
  mode = mode || (known ? "signin" : "signup");
  $("#hdr").hidden = true; app.innerHTML = "";
  const g = h("div", { class: "gate" });
  g.append(h("div", { class: "mark", "aria-hidden": "true" }, "<i></i><i></i>"));
  const titles = { signup: ["Hi Ebru!", "Welcome to your English course. Let’s make your account, so your progress is saved on every device."], signin: ["Hi Ebru!", "Welcome back. Sign in to continue your lessons."], reset: ["Forgot your password?", "No problem. Write your email and we’ll send you a link to make a new one."] };
  g.append(h("h1", null, titles[mode][0]), h("p", { class: "lead" }, titles[mode][1]));
  const card = h("div", { class: "card stack gatecard" });
  const f1 = h("div", { class: "field" }, '<label for="g-em">Email</label>');
  const em = h("input", { id: "g-em", type: "email", autocomplete: "email", inputmode: "email", autocapitalize: "off" });
  em.value = known || ""; f1.append(em);
  const f2 = h("div", { class: "field" }, '<label for="g-pw">' + (mode === "signup" ? "Choose a password (at least 8 characters)" : "Password") + "</label>");
  const pwRow = h("div", { class: "pwrow" });
  const pw = h("input", { id: "g-pw", type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password" });
  const eye = h("button", { class: "linkbtn small", type: "button" }, "Show");
  eye.onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; eye.textContent = pw.type === "password" ? "Show" : "Hide"; };
  pwRow.append(pw, eye); f2.append(pwRow);
  const msg = h("div", { role: "status" });
  const btn = h("button", { class: "btn big" }, mode === "signup" ? "Create my account" : mode === "reset" ? "Send me the link" : "Sign in");
  card.append(f1); if (mode !== "reset") card.append(f2); card.append(btn, msg);
  const links = h("div", { class: "row gatelinks" });
  const mk = (label, m) => { const l = h("button", { class: "linkbtn" }, label); l.onclick = () => renderGate(m); return l; };
  if (mode === "signup") links.append(h("span", { class: "muted small" }, "Already have an account?"), mk("Sign in", "signin"));
  if (mode === "signin") links.append(mk("Forgot password?", "reset"), h("span", { class: "muted small" }, "·"), mk("Create an account", "signup"));
  if (mode === "reset") links.append(mk("Back to sign in", "signin"));
  card.append(links);
  g.append(card);
  const off = h("button", { class: "linkbtn small", hidden: "" }, "Continue without signing in (saved on this device only)");
  off.onclick = () => { try { sessionStorage.setItem("ewe-offline", "1"); } catch (e) {} render(); };
  app.append(g);
  (known && mode === "signin" ? pw : em).focus({ preventScroll: true });
  async function submit() {
    msg.className = ""; msg.textContent = "";
    const e = em.value.trim(), p = pw.value;
    if (!/^\S+@\S+\.\S+$/.test(e)) { msg.className = "err"; msg.textContent = "Please write your email address."; return; }
    if (mode === "signup" && p.length < 8) { msg.className = "err"; msg.textContent = "Your password needs at least 8 characters."; return; }
    if (mode === "signin" && !p) { msg.className = "err"; msg.textContent = "Please write your password."; return; }
    btn.disabled = true; const label = btn.textContent; btn.textContent = "One moment…";
    let r;
    try { r = mode === "signup" ? await Sync.signUp(e, p) : mode === "reset" ? await Sync.reset(e) : await Sync.signIn(e, p); }
    catch (x) { r = { error: { message: "network" } }; }
    btn.disabled = false; btn.textContent = label;
    if (r.error) {
      const m = String(r.error.message || "");
      msg.className = "err";
      if (/network|fetch|Failed/i.test(m)) { msg.textContent = "I can't connect right now. Check your internet and try again."; }
      else if (/Invalid login/i.test(m)) msg.textContent = "Wrong email or password. Try again, or tap “Forgot password?”.";
      else if (/already registered|already exists/i.test(m)) { try { localStorage.setItem("ewe-account", JSON.stringify({ email: e })); } catch (x) {} renderGate("signin"); $("#g-pw").focus(); const mm = $(".gate [role=status]"); mm.className = "okmsg"; mm.textContent = "You already have an account. Please sign in."; }
      else if (/Email not confirmed/i.test(m)) msg.textContent = "Please open the email we sent you and tap the link first.";
      else if (/JSON|Unexpected|undefined|null|TypeError|status/i.test(m) || !m) msg.textContent = "Something went wrong. Please try again in a minute.";
      else msg.textContent = m;
      return;
    }
    if (mode === "reset") { msg.className = "okmsg"; msg.textContent = "Done! Check your email for the link."; return; }
    try { localStorage.setItem("ewe-account", JSON.stringify({ email: e })); } catch (x) {}
    if (mode === "signup" && !(r.data && r.data.session)) { msg.className = "okmsg"; msg.innerHTML = "<b>Almost done!</b> Open the email we sent you and tap the link. Then come back and sign in."; links.innerHTML = ""; links.append(mk("Go to sign in", "signin")); return; }
    S.opened = null; save(false); render();
  }
  btn.onclick = submit;
  [em, pw].forEach((x) => x.addEventListener("keydown", (ev) => ev.key === "Enter" && submit()));
}

// ---------- render ----------
let lastKind = null;
try { history.scrollRestoration = "manual"; } catch (e) {}
function render() {
  const v = S.opened;
  const kind = Sync.enabled() && !Sync.ready() ? "splash" : (Sync.enabled() && !Sync.user() && !offlineOK() && !(v && v.tool === "account" && v.recover)) ? "gate" : "app";
  if (kind !== lastKind) { lastKind = kind; window.scrollTo(0, 0); }
  document.body.classList.toggle("side", kind === "app");
  if (kind === "splash") return renderSplash();
  if (kind === "gate") return renderGate();
  renderApp(v);
  drawMenu();
}
function renderApp(v) {
  if (v && v.w != null && v.d != null && !isUnlocked(v.w, v.d)) { S.opened = null; v = null; }
  if (!v) return renderHome();
  if (v.tool === "words") return renderWords();
  if (v.tool === "mistakes") return renderMistakes();
  if (v.tool === "progress") return renderProgress();
  if (v.tool === "notes") return renderNotes(v);
  if (v.tool === "settings") return renderSettings();
  if (v.tool === "account") return renderAccount(v);
  if (v.tool === "map") return renderMap();
  if (v.tool === "grammar") return renderGrammarBook(v);
  if (v.tool === "library") return renderLibrary();
  if (v.tool === "quick") return renderQuick();
  if (v.tool === "practice") return renderPractice();
  if (v.tool === "ach") return renderAch();
  if (v.tool === "game") return renderGame();
  if (v.d === 7 && DATA.weeks.find((x) => x.week === v.w)) return renderSunday(v.w);
  if (findDay(v.w, v.d)) return renderDay(v.w, v.d);
  S.opened = null; renderHome();
}
render();
Sync.init();
})();
</script>
</body>
