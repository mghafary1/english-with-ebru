together sometime!"}, "writing": {"prompt": "Write a short message to a new coworker. Introduce yourself and ask four questions to get to know them.", "length": "50-70 words", "checklist": ["Use do or does in two questions.", "Use is or are in one question.", "Start one question with Where, What or How."], "model": "Hi Carlos! I'm Mia from the design team. Welcome to the company! My desk is near the kitchen, so come and say hi. I'd like to know you better. Where are you from? Do you live near the office? What do you like doing on weekends? And are you free for lunch on Thursday? There's a great taco place on the corner. See you soon! Mia"}, "partner": {"questions": ["What do you usually do on weekends, and what are you doing this weekend?", "Tell me about your neighbors. Do you know them well?", "What do you always have a lot of in your fridge? What don't you have much of right now?", "When do you usually go to the doctor? What should people do when they have a cold?", "What are the rules at your job or at home? What don't you have to do?", "What questions do you usually ask when you meet someone new?"], "roleplay": "A has just moved into a new apartment. B lives next door. B says hello, offers to help and asks A some questions. A answers, asks about the neighborhood, and invites B for coffee on a certain day and time."}, "audio": {"listen": "audio/w1d6-listen.mp3", "listenT": [[0.3, 1.81], [2.26, 4.95], [5.4, 7.32], [7.77, 10.12], [10.57, 13.51], [13.96, 15.76], [16.21, 17.59], [18.04, 21.43], [21.88, 25.11], [25.56, 28.48], [28.93, 32.55], [33.0, 36.57], [37.02, 38.36], [38.81, 43.16], [43.61, 47.52], [47.97, 49.35], [49.8, 53.54], [53.99, 57.49], [57.94, 60.5], [60.95, 63.21], [63.66, 65.88], [66.33, 70.46], [70.91, 72.45], [72.9, 75.82], [76.27, 79.69], [80.14, 81.99]], "read": "audio/w1d6-read.mp3", "speak": "audio/w1d6-speak.mp3", "vocab": "audio/w1d6-vocab.mp3", "vocabT": [[0.3, 1.54, 2.14, 5.25], [6.15, 7.39, 7.99, 11.45], [12.35, 13.35, 13.95, 16.19], [17.09, 17.98, 18.58, 20.35], [21.25, 22.41, 23.01, 25.5], [26.4, 27.3, 27.9, 29.75], [30.65, 31.66, 32.26, 33.54], [34.44, 35.72, 36.32, 38.39]]}}], "sunday": {"quiz": [{"q": "My mom ___ me every evening.", "options": ["calls", "is calling", "call"], "answer": 0, "why": "Every evening is a habit; he/she/it adds -s: calls."}, {"q": "I'm tired. Let's ___ a break.", "options": ["make", "take", "do"], "answer": 1, "why": "We say take a break."}, {"q": "Sam is ___ excellent designer.", "options": ["a", "an", "the"], "answer": 1, "why": "Excellent starts with a vowel sound, so use an."}, {"q": "How ___ rice do we need?", "options": ["many", "much", "a lot"], "answer": 1, "why": "Rice is uncountable, so use much."}, {"q": "The team meeting starts ___ ten thirty.", "options": ["in", "on", "at"], "answer": 2, "why": "Use at with clock times."}, {"q": "You ___ wear a suit. Jeans are fine.", "options": ["have to", "don't have to", "can't"], "answer": 1, "why": "A suit is not necessary, so use don't have to."}, {"q": "___ Dan live next door?", "options": ["Is", "Does", "Do"], "answer": 1, "why": "Live is a main verb, and Dan is he: does."}, {"q": "I can't talk much today. I have a sore ___.", "options": ["fever", "rest", "throat"], "answer": 2, "why": "We say a sore throat."}, {"q": "Please ___ out this form before you see the doctor.", "options": ["make", "take", "fill"], "answer": 2, "why": "We fill out a form."}, {"q": "After a few weeks, I started to feel ___ home.", "options": ["in", "at", "on"], "answer": 1, "why": "The phrase is feel at home."}], "reflection": ["What was the most useful thing you learned this week?", "Which grammar point is still difficult for you?", "Which new phrase can you use in your own life next week?"]}}, {"week": 2, "title": "Finding my way", "days": [{"day": 1, "dayName": "Monday", "title": "Which bus do I take?", "goals": ["I can ask how to get somewhere.", "I can understand simple directions.", "I can say where places are."], "listening": {"title": "At the bus stop", "intro": "Elif is at a bus stop. She talks to a woman, Carmen, and then to the bus driver, Ray.", "speakers": {"Elif": "female", "Carmen": "female", "Ray": "male"}, "lines": [{"s": "Elif", "t": "Excuse me, is this the right bus stop for downtown?"}, {"s": "Carmen", "t": "It depends. Where exactly do you want to go?"}, {"s": "Elif", "t": "To a print shop. My manager wrote the address on this paper."}, {"s": "Carmen", "t": "Let me see... Oh, I know this place. Take the number 12."}, {"s": "Elif", "t": "The number 12. Does it stop here?"}, {"s": "Carmen", "t": "Yes, it does. It comes every fifteen minutes or so."}, {"s": "Elif", "t": "Great. And where do I get off?"}, {"s": "Carmen", "t": "Get off at the big library. The print shop is across from it."}, {"s": "Elif", "t": "Across from the library. Thank you so much!"}, {"s": "Carmen", "t": "No problem. Oh, look, here it comes."}, {"s": "Ray", "t": "Good morning!"}, {"s": "Elif", "t": "Hi. Can I pay with this card?"}, {"s": "Ray", "t": "Sure. Just tap your card here."}, {"s": "Elif", "t": "Thanks. Does this bus go past the big library?"}, {"s": "Ray", "t": "It does. It's about twenty minutes from here."}, {"s": "Elif", "t": "Can you tell me when we get there? I'm new in the city."}, {"s": "Ray", "t": "Of course. Welcome to Chicago! Sit near the front."}, {"s": "Ray", "t": "Okay, this is your stop. That's the library, on the left."}, {"s": "Elif", "t": "Thank you! Um, where is the print shop exactly?"}, {"s": "Ray", "t": "Cross the street and walk along it. Go past the coffee shop."}, {"s": "Ray", "t": "The print shop is between a bank and a small bookstore."}, {"s": "Elif", "t": "Between a bank and a bookstore. Got it."}, {"s": "Ray", "t": "If you get lost, just go into the library and ask."}, {"s": "Elif", "t": "I will. Thanks again. Have a nice day!"}, {"s": "Ray", "t": "You too. Good luck!"}], "mcq": [{"q": "Where does Elif want to go?", "options": ["to a bookstore", "to a print shop", "to the library"], "answer": 1}, {"q": "Which bus does she need?", "options": ["the number 12", "the number 20", "the number 15"], "answer": 0}, {"q": "What does Elif ask the driver to do?", "options": ["give her a map", "drive faster", "tell her when to get off"], "answer": 2}, {"q": "Where is the print shop?", "options": ["between a bank and a bookstore", "inside the coffee shop", "next to the bus stop"], "answer": 0}], "gaps": [{"line": 6, "answer": "get off"}, {"line": 7, "answer": "across from"}, {"line": 12, "answer": "tap"}, {"line": 19, "answer": "along"}, {"line": 20, "answer": "between"}, {"line": 22, "answer": "into"}]}, "vocab": [{"w": "bus stop", "m": "a place where the bus stops for people", "ex": "There's a bus stop next to my building."}, {"w": "get off", "m": "leave a bus, train or plane", "ex": "We get off at the next stop."}, {"w": "across from", "m": "on the other side of the street", "ex": "The bakery is across from the bank."}, {"w": "go past", "m": "move by something and keep going", "ex": "You go past a school on the way to the park."}, {"w": "It depends", "m": "the answer changes in different situations", "ex": "Is the trip long? It depends on the traffic."}, {"w": "tap your card", "m": "touch your card on a machine to pay", "ex": "At this café, you can tap your card to pay."}, {"w": "this is your stop", "m": "you need to get off here", "ex": "Wake up, Tom! This is your stop."}, {"w": "get lost", "m": "not know where you are", "ex": "I always get lost in big shopping malls."}], "grammar": {"title": "Prepositions of place and movement", "points": ["Place (where something is): next to, across from, between A and B.", "Movement (how you go): along, into, past.", "Across from = on the other side of the street or room.", "Go past = pass something and keep going. Go into = enter."], "examples": [{"en": "The bank is next to the coffee shop.", "note": ""}, {"en": "The pharmacy is across from the park.", "note": "on the other side"}, {"en": "The shop is between the bank and the bookstore.", "note": "between A and B"}, {"en": "Walk along the river and go past the bridge.", "note": "movement"}], "exercises": [{"type": "choice", "q": "The print shop is ___ a bank and a bookstore.", "options": ["between", "along", "into"], "answer": 0, "why": "Between connects two things: between A and B."}, {"type": "choice", "q": "Walk ___ this street for two minutes.", "options": ["between", "along", "into"], "answer": 1, "why": "Along means following a street or a river."}, {"type": "choice", "q": "She went ___ the library to ask for help.", "options": ["along", "between", "into"], "answer": 2, "why": "Into shows movement from outside to inside."}, {"type": "choice", "q": "The post office is ___ the bus stop, on the other side of the street.", "options": ["next to", "across from", "into"], "answer": 1, "why": "On the other side of the street = across from."}, {"type": "type", "q": "Go ___ the coffee shop and turn left at the corner. (past / between)", "answers": ["past"], "why": "Go past = pass it and keep walking."}, {"type": "type", "q": "My apartment is ___ Dan's apartment. Our doors are side by side. (next to / along)", "answers": ["next to"], "why": "Side by side = next to."}, {"type": "type", "q": "We walked ___ the river for an hour. (along / into)", "answers": ["along"], "why": "Along means following the side of the river."}, {"type": "type", "q": "The cat ran ___ the house when it started to rain. (into / between)", "answers": ["into"], "why": "The cat moved from outside to inside: into."}]}, "reading": {"title": "The wrong direction", "kind": "Elif's diary", "text": "Monday evening\n\nToday Maria asked me to take some designs to a print shop downtown. I don't know the city yet, so I was a little nervous. A kind woman at the bus stop helped me, and the driver told me when to get off.\n\nThe print shop is across from a big library. It's small, and it's between a bank and a bookstore. The people there were friendly, and they liked our designs. I felt very proud.\n\nThen I made a mistake. On the way back, I took the number 12 again, but in the wrong direction! After ten minutes, I saw a lake out the window. There is no lake near my office. I got off quickly.\n\nA man with a dog helped me. He said, \"Cross the street and wait next to the pharmacy. That bus goes past your office.\" It was easy. Next time, I'll check the direction before I get on.\n\nTonight I'm tired but happy. I know two more streets in Chicago now!", "questions": [{"q": "Why did Elif go downtown?", "options": ["to meet Dan", "to take designs to a print shop", "to visit the library"], "answer": 1}, {"q": "How did she feel at the print shop?", "options": ["proud", "bored", "angry"], "answer": 0}, {"q": "What was her mistake?", "options": ["She lost the designs.", "She forgot to pay.", "She took the bus in the wrong direction."], "answer": 2}, {"q": "Where did the man tell her to wait?", "options": ["across from the library", "next to the pharmacy", "inside the bookstore"], "answer": 1}], "tf": [{"s": "The print shop is next to the library.", "answer": false}, {"s": "A man with a dog helped Elif.", "answer": true}, {"s": "Elif saw a lake from the bus.", "answer": true}]}, "speaking": {"prompt": "How do you get from your home to a place you often go, like a shop or a friend's house?", "steps": ["say where you go and how you get there", "give directions with three prepositions", "say how long it takes"], "starters": ["I often go to ...", "First, I walk along ...", "Then I go past ...", "It's next to / across from ..."], "model": "I often go to my favorite café on Saturdays. It's not far from my home, so I usually walk. First, I walk along my street for about five minutes. Then I go past a small park and a school. At the corner, I turn right. The café is between a flower shop and a bakery, and it's across from a big supermarket. It takes about fifteen minutes. When it rains, I take the bus. I love this walk because it's quiet and green."}, "writing": {"prompt": "A friend is visiting your home for the first time. Write a text message with directions from the bus stop.", "length": "40-70 words", "checklist": ["Use at least three prepositions (next to, across from, past ...).", "Say what your friend will see on the way.", "End with a friendly line."], "model": "Hi Jen! Get off the bus at the big supermarket. Walk along Green Street and go past a small park. My building is the white one between a bank and a pharmacy. It's across from a coffee shop. Go into the building and take the elevator to the fourth floor. I'm in 4B. Call me if you get lost. See you soon!"}, "audio": {"listen": "audio/w2d1-listen.mp3", "listenT": [[0.3, 3.39], [3.84, 6.6], [7.05, 10.69], [11.14, 14.26], [14.71, 16.86], [17.31, 20.58], [21.03, 22.73], [23.18, 26.75], [27.2, 29.78], [30.23, 32.51], [32.96, 33.83], [34.28, 36.27], [36.72, 38.32], [38.77, 41.56], [42.01, 44.25], [44.7, 47.52], [47.97, 51.0], [51.45, 54.71], [55.16, 58.23], [58.68, 62.12], [62.57, 65.47], [65.92, 68.29], [68.74, 71.55], [72.0, 74.46], [74.91, 76.06]], "read": "audio/w2d1-read.mp3", "speak": "audio/w2d1-speak.mp3", "vocab": "audio/w2d1-vocab.mp3", "vocabT": [[0.3, 1.39, 1.99, 4.19], [5.09, 5.96, 6.56, 8.14], [9.04, 10.17, 10.77, 12.92], [13.82, 14.91, 15.51, 17.94], [18.84, 19.93, 20.53, 23.22], [24.12, 25.31, 25.91, 28.5], [29.4, 30.63, 31.23, 33.41], [34.31, 35.38, 35.98, 38.54]]}}, {"day": 2, "dayName": "Tuesday", "title": "The sink is leaking!", "goals": ["I can describe a problem at home.", "I can say what happened last night.", "I can use the past simple (positive)."], "listening": {"title": "A call to the landlord", "intro": "Elif calls her landlord, Frank, early in the morning about a problem in her kitchen.", "speakers": {"Elif": "female", "Frank": "male"}, "lines": [{"s": "Frank", "t": "Hello, this is Frank."}, {"s": "Elif", "t": "Hi, Frank. This is Elif, from apartment 4B. Sorry to call so early."}, {"s": "Frank", "t": "No problem, Elif. What's wrong?"}, {"s": "Elif", "t": "There's a problem with my kitchen sink. It's leaking."}, {"s": "Frank", "t": "Oh no. Tell me what happened."}, {"s": "Elif", "t": "Last night I washed the dishes after dinner. Everything looked fine."}, {"s": "Elif", "t": "Then, at about midnight, I heard a strange noise in the kitchen."}, {"s": "Frank", "t": "What kind of noise?"}, {"s": "Elif", "t": "Like water. I went into the kitchen and saw water all over the floor."}, {"s": "Frank", "t": "A lot of water?"}, {"s": "Elif", "t": "Yes, a lot! It came from under the sink. I put all my towels on the floor."}, {"s": "Frank", "t": "Good thinking. Is the water still coming out?"}, {"s": "Elif", "t": "No. My neighbor Dan heard me, and he came over."}, {"s": "Elif", "t": "He turned off the water under the sink."}, {"s": "Frank", "t": "Dan's a good guy. That was the right thing to do."}, {"s": "Elif", "t": "Yes, he helped me a lot. We cleaned the floor together. I went to bed at two."}, {"s": "Frank", "t": "I'm sorry, Elif. That sounds like a long night."}, {"s": "Elif", "t": "It was! And now I can't use the sink. I can't cook or wash anything."}, {"s": "Frank", "t": "I understand. I'll send a plumber today. Are you home this afternoon?"}, {"s": "Elif", "t": "I'm at work until five. Can he come after five thirty?"}, {"s": "Frank", "t": "Let me check... Yes, he can come at six. His name is Joe."}, {"s": "Elif", "t": "Perfect. Thank you so much, Frank."}, {"s": "Frank", "t": "Thank you for calling quickly. And please say thanks to Dan for me."}, {"s": "Elif", "t": "I will. Have a good day!"}], "mcq": [{"q": "Why does Elif call Frank?", "options": ["Her door is broken.", "Her sink is leaking.", "She wants a new apartment."], "answer": 1}, {"q": "What did Elif hear at midnight?", "options": ["loud music", "her phone", "a noise like water"], "answer": 2}, {"q": "Who turned off the water?", "options": ["Dan", "Frank", "Joe"], "answer": 0}, {"q": "When is the plumber going to come?", "options": ["at nine", "at five thirty", "at six"], "answer": 2}], "gaps": [{"line": 5, "answer": "washed"}, {"line": 6, "answer": "heard"}, {"line": 8, "answer": "saw"}, {"line": 12, "answer": "came over"}, {"line": 13, "answer": "turned off"}, {"line": 15, "answer": "cleaned"}]}, "vocab": [{"w": "What's wrong?", "m": "What is the problem?", "ex": "You look sad. What's wrong?"}, {"w": "leaking", "m": "water is coming out of a hole", "ex": "The roof is leaking, so we put a bucket under it."}, {"w": "strange noise", "m": "a sound that is not normal", "ex": "My car makes a strange noise in the morning."}, {"w": "come over", "m": "come to someone's home", "ex": "Can you come over for coffee tomorrow?"}, {"w": "turn off", "m": "stop a machine, a light or water", "ex": "Please turn off the lights when you leave."}, {"w": "wash the dishes", "m": "clean plates, cups and pans", "ex": "It's your turn to wash the dishes tonight."}, {"w": "the right thing to do", "m": "the good or correct action", "ex": "Telling the truth was the right thing to do."}, {"w": "plumber", "m": "a person who fixes pipes, sinks and toilets", "ex": "We called a plumber because the shower was broken."}], "grammar": {"title": "Past simple: positive", "points": ["Use the past simple for finished actions at a finished time: last night, yesterday.", "Regular verbs add -ed: wash → washed, clean → cleaned, try → tried.", "Many common verbs are irregular: go → went, see → saw, come → came.", "The form is the same for everyone: I went, she went, they went."], "examples": [{"en": "I heard a strange noise last night.", "note": "hear → heard"}, {"en": "Dan came over and helped me.", "note": "come → came, help → helped"}, {"en": "We cleaned the floor together.", "note": "regular: + -ed"}, {"en": "I put my towels on the floor.", "note": "put → put (no change)"}], "tr": "Türkçede her fiile '-di' eklenir, ama İngilizcede birçok fiil düzensizdir: go → went, buy → bought. Bunları ezberleyin.", "exercises": [{"type": "type", "q": "Last night I ___ a strange noise. (hear)", "answers": ["heard"], "why": "Hear is irregular: hear → heard."}, {"type": "type", "q": "Dan ___ over and helped me. (come)", "answers": ["came"], "why": "Come is irregular: come → came."}, {"type": "type", "q": "Yesterday we ___ the kitchen floor together. (clean)", "answers": ["cleaned"], "why": "Clean is regular, so add -ed."}, {"type": "type", "q": "This morning I ___ to fix the sink myself. (try)", "answers": ["tried"], "why": "Consonant + y: change y to i, then add -ed."}, {"type": "choice", "q": "Yesterday she ___ to the store after work.", "options": ["goes", "went", "goed"], "answer": 1, "why": "Yesterday is a finished time. Go → went."}, {"type": "choice", "q": "Last week the plumber ___ our shower in twenty minutes.", "options": ["fixed", "fix", "fixs"], "answer": 0, "why": "Fix is regular: fix → fixed."}, {"type": "choice", "q": "I ___ my keys on the table an hour ago.", "options": ["putted", "put", "puts"], "answer": 1, "why": "Put doesn't change in the past: put → put."}, {"type": "choice", "q": "We ___ a great movie on Saturday.", "options": ["see", "seen", "saw"], "answer": 2, "why": "See is irregular: see → saw."}]}, "reading": {"title": "What a night!", "kind": "an email to a friend", "text": "Hi Deniz,\n\nHow are you? I have a funny story for you. Well, it's funny now!\n\nLast night my kitchen sink started to leak. At midnight I heard a noise and found water all over the floor. I ran to get towels, but there was too much water. My neighbor Dan heard me, and he came over in his pajamas. He turned off the water under the sink. We cleaned the kitchen together, and I finally went to bed at two.\n\nThis morning I called my landlord, Frank. He was very kind, and he sent a plumber in the evening. The plumber, Joe, arrived at six. He looked under the sink and found an old pipe with a hole in it. He changed the pipe in forty minutes. I made Turkish tea for him, and he loved it!\n\nAfter that, I bought a small cake and took it to Dan. He laughed and said, \"Call me anytime!\"\n\nSo my sink works again, and I have a great neighbor.\n\nWrite soon!\n\nElif", "questions": [{"q": "Why did Dan come over?", "options": ["Frank called him.", "He heard Elif.", "He wanted some tea."], "answer": 1}, {"q": "What was the problem with the sink?", "options": ["An old pipe had a hole in it.", "The sink was too small.", "The water was too hot."], "answer": 0}, {"q": "What did Elif give Joe?", "options": ["a cake", "some flowers", "Turkish tea"], "answer": 2}, {"q": "How does Elif feel at the end?", "options": ["angry with Frank", "happy about her neighbor", "worried about the sink"], "answer": 1}], "tf": [{"s": "Dan came over in his pajamas.", "answer": true}, {"s": "Joe arrived in the morning.", "answer": false}, {"s": "Elif took a cake to Dan.", "answer": true}]}, "speaking": {"prompt": "Talk about a time something broke or went wrong in your home. What happened?", "steps": ["say what broke and when", "say what you did", "say how it ended"], "starters": ["Last year, my ... broke.", "First, I ...", "Then I called ...", "In the end, ..."], "model": "Last winter, our heater stopped working. It was a very cold night in January. First, I put on two sweaters and made some hot tea. Then I called my landlord, but he didn't answer, so I sent him a message. The next morning, a repairman came and looked at the heater. He found a small problem and fixed it in an hour. I felt so happy when the apartment was warm again. After that, I bought a small electric heater, just in case."}, "writing": {"prompt": "Write a short message to your landlord about a problem in your home. Say what happened and ask for help.", "length": "50-80 words", "checklist": ["Say what happened in the past simple (I heard, it started ...).", "Explain the problem now.", "Ask politely for help and say when you are home."], "model": "Hi Mr. Lee,\n\nThis is Ana from apartment 2A. Yesterday evening, the light in my bathroom started to make a strange noise. Then it stopped working. I changed the bulb, but it still doesn't work. Now the bathroom is dark, and it's difficult in the morning. Could you please send someone to check it? I'm home after five every day.\n\nThank you,\nAna"}, "audio": {"listen": "audio/w2d2-listen.mp3", "listenT": [[0.3, 1.49], [1.94, 6.72], [7.17, 9.01], [9.46, 12.4], [12.85, 14.43], [14.88, 18.81], [19.26, 23.03], [23.48, 24.59], [25.04, 29.29], [29.74, 30.76], [31.21, 35.86], [36.31, 38.68], [39.13, 41.9], [42.35, 44.23], [44.68, 47.3], [47.75, 52.11], [52.56, 55.31], [55.76, 60.07], [60.52, 64.49], [64.94, 68.31], [68.76, 72.3], [72.75, 74.75], [75.2, 78.96], [79.41, 80.96]], "read": "audio/w2d2-read.mp3", "speak": "audio/w2d2-speak.mp3", "vocab": "audio/w2d2-vocab.mp3", "vocabT": [[0.3, 1.3, 1.9, 3.52], [4.42, 5.51, 6.11, 8.86], [9.76, 11.04, 11.64, 14.18], [15.08, 16.06, 16.66, 18.63], [19.53, 20.47, 21.07, 23.11], [24.01, 25.36, 25.96, 28.26], [29.16, 30.55, 31.15, 33.6], [34.5, 35.38, 35.98, 38.77]]}}, {"day": 3, "dayName": "Wednesday", "title": "How was your weekend?", "goals": ["I can ask about someone's weekend.", "I can say what I did and didn't do.", "I can make past simple questions and negatives."], "listening": {"title": "In the laundry room", "intro": "Elif and Dan meet in the laundry room of their building on Wednesday evening.", "speakers": {"Elif": "female", "Dan": "male"}, "lines": [{"s": "Dan", "t": "Hey, Elif! Is the sink okay now?"}, {"s": "Elif", "t": "Hi, Dan! Yes, Joe fixed it. Thanks again for Monday night."}, {"s": "Dan", "t": "Anytime. We didn't really talk that night. We were too busy with the water!"}, {"s": "Elif", "t": "That's true! How was your weekend at your sister's?"}, {"s": "Dan", "t": "Really nice, thanks. But tell me about yours. Did you do anything fun?"}, {"s": "Elif", "t": "Yes! On Saturday I had lunch with Sam, my coworker."}, {"s": "Dan", "t": "Oh, nice. Where did you go?"}, {"s": "Elif", "t": "A small restaurant near the office. I ordered the tomato soup."}, {"s": "Dan", "t": "Did you like it?"}, {"s": "Elif", "t": "Yes, it was really good. And we didn't talk about work at all!"}, {"s": "Dan", "t": "Ha! And what did you do on Sunday?"}, {"s": "Elif", "t": "I wanted to stay home and rest, but the weather was so nice. So I went to the art museum downtown."}, {"s": "Dan", "t": "Did you go with Sam?"}, {"s": "Elif", "t": "No, I didn't. I went alone. I wanted a quiet day."}, {"s": "Dan", "t": "Did you see the big blue painting on the second floor? It's my favorite."}, {"s": "Elif", "t": "No, I didn't see it. I didn't go upstairs. My feet hurt!"}, {"s": "Dan", "t": "You have to go back. Did you take the bus there?"}, {"s": "Elif", "t": "No, I walked. It took an hour, but it was a nice walk."}, {"s": "Dan", "t": "An hour? Wow. Did you get lost?"}, {"s": "Elif", "t": "Only once! But I asked a police officer, and she helped me."}, {"s": "Dan", "t": "You're really learning the city."}, {"s": "Elif", "t": "Slowly! But I still don't know where to buy good bread."}, {"s": "Dan", "t": "Oh, I can help with that. There's a great bakery next to the bus stop."}, {"s": "Elif", "t": "Really? I didn't notice it. Can you show me on Saturday morning?"}, {"s": "Dan", "t": "Sure. And Saturday night, come to my place. I'm having a small party."}, {"s": "Elif", "t": "A party? I'd love to come!"}], "mcq": [{"q": "What did Elif do on Saturday?", "options": ["She went to a museum.", "She had lunch with Sam.", "She visited Dan's sister."], "answer": 1}, {"q": "What did Elif eat for lunch?", "options": ["tomato soup", "a chicken sandwich", "spicy Mexican food"], "answer": 0}, {"q": "Who did Elif go to the museum with?", "options": ["Sam", "Dan", "She went alone."], "answer": 2}, {"q": "Why didn't Elif see Dan's favorite painting?", "options": ["The museum was closed.", "She didn't like it.", "She didn't go upstairs."], "answer": 2}], "gaps": [{"line": 6, "answer": "did you go"}, {"line": 7, "answer": "ordered"}, {"l  didn't do much, and that was okay. I felt relaxed and happy, and now I'm ready for Monday."}, "audio": {"listen": "audio/w2d3-listen.mp3", "listenT": [[0.3, 2.9], [3.35, 7.21], [7.66, 12.31], [12.76, 15.32], [15.77, 20.45], [20.9, 24.12], [24.57, 26.7], [27.15, 31.01], [31.46, 32.79], [33.24, 36.67], [37.12, 39.47], [39.92, 46.0], [46.45, 47.81], [48.26, 51.53], [51.98, 56.58], [57.03, 60.4], [60.85, 63.99], [64.44, 67.96], [68.41, 70.74], [71.19, 74.92], [75.37, 77.27], [77.72, 80.51], [80.96, 85.53], [85.98, 89.6], [90.05, 94.75], [95.2, 97.01]], "read": "audio/w2d3-read.mp3", "speak": "audio/w2d3-speak.mp3", "vocab": "audio/w2d3-vocab.mp3", "vocabT": [[0.3, 1.75, 2.35, 4.46], [5.36, 6.39, 6.99, 9.06], [9.96, 10.92, 11.52, 13.78], [14.68, 15.79, 16.39, 19.2], [20.1, 21.3, 21.9, 25.27], [26.17, 27.19, 27.79, 30.84], [31.74, 32.85, 33.45, 35.52], [36.42, 37.45, 38.05, 39.73]]}}, {"day": 4, "dayName": "Thursday", "title": "Opening a bank account", "goals": ["I can open a bank account.", "I can compare two things.", "I can use comparatives and superlatives."], "listening": {"title": "At the bank", "intro": "Elif is at a bank before work. She talks to Grace, a bank clerk.", "speakers": {"Elif": "female", "Grace": "female"}, "lines": [{"s": "Grace", "t": "Good morning! How can I help you today?"}, {"s": "Elif", "t": "Hi. I'd like to open a bank account, please. I just moved here from Turkey."}, {"s": "Grace", "t": "Welcome to Chicago! I'm Grace. Please, have a seat."}, {"s": "Elif", "t": "Thank you. I'm Elif."}, {"s": "Grace", "t": "Nice to meet you, Elif. We have two accounts: the Basic and the Plus."}, {"s": "Elif", "t": "What's the difference?"}, {"s": "Grace", "t": "The Basic account is simpler. It's also cheaper, because there's no monthly fee."}, {"s": "Elif", "t": "And the Plus account?"}, {"s": "Grace", "t": "The Plus is more expensive, but you get more services. For example, you can send money abroad for free."}, {"s": "Elif", "t": "Hmm. I send money to my mom sometimes, but not very often."}, {"s": "Grace", "t": "Then the Basic is probably better for you. It's our most popular account, too."}, {"s": "Elif", "t": "Great. Is there an app?"}, {"s": "Grace", "t": "Yes, and it's very easy to use. Honestly, the app is faster than coming here."}, {"s": "Elif", "t": "Good! The line this morning was longer than I expected."}, {"s": "Grace", "t": "Sorry about that. Thursday morning is our busiest time. Can I see your passport, please?"}, {"s": "Elif", "t": "Here you are. Do you need anything else?"}, {"s": "Grace", "t": "Yes, a letter with your address. A bill or your lease is fine."}, {"s": "Elif", "t": "I have my lease right here."}, {"s": "Grace", "t": "Perfect. Just a minute... Okay, your account is open!"}, {"s": "Elif", "t": "Already? That was easier than I thought."}, {"s": "Grace", "t": "Your card will arrive by mail in about a week."}, {"s": "Elif", "t": "In Turkey, my last bank visit took two hours!"}, {"s": "Grace", "t": "Well, you're my fastest customer today."}, {"s": "Elif", "t": "Thank you, Grace. This was the best part of my morning!"}], "mcq": [{"q": "Why is Elif at the bank?", "options": ["to change money", "to open an account", "to get a new card"], "answer": 1}, {"q": "Why is the Basic account better for Elif?", "options": ["It has more services.", "It's the newest account.", "She doesn't send money very often."], "answer": 2}, {"q": "What does Grace need to see?", "options": ["her passport and a letter with her address", "her work contract", "her phone and her old bank card"], "answer": 0}, {"q": "How does Elif feel at the end?", "options": ["worried about her card", "happy and surprised", "angry about the long line"], "answer": 1}], "gaps": [{"line": 6, "answer": "cheaper"}, {"line": 8, "answer": "more expensive"}, {"line": 10, "answer": "most popular"}, {"line": 13, "answer": "longer than"}, {"line": 14, "answer": "busiest"}, {"line": 19, "answer": "easier"}]}, "vocab": [{"w": "open a bank account", "m": "start using a new account at a bank", "ex": "My sister wants to open a bank account for her son."}, {"w": "have a seat", "m": "sit down (polite)", "ex": "Please have a seat. The doctor is coming."}, {"w": "What's the difference?", "m": "How are these things not the same?", "ex": "These two phones look the same. What's the difference?"}, {"w": "monthly fee", "m": "money you pay every month", "ex": "My gym has a small monthly fee."}, {"w": "send money", "m": "give money to someone far away", "ex": "It's easy to send money with this app."}, {"w": "most popular", "m": "liked or chosen by the most people", "ex": "Pizza is the most popular dish at this restaurant."}, {"w": "Here you are", "m": "said when you give something to someone", "ex": "Can I have the salt? Here you are."}, {"w": "lease", "m": "a contract to rent an apartment", "ex": "Our lease ends in June, so we're looking for a new place."}], "grammar": {"title": "Comparatives and superlatives", "points": ["Short adjectives add -er / -est: cheap → cheaper → the cheapest.", "Adjectives ending in -y: easy → easier → the easiest.", "Long adjectives use more / the most: more expensive, the most popular.", "Irregular: good → better → the best. Use than after comparatives."], "examples": [{"en": "The Basic account is cheaper than the Plus.", "note": "cheap + -er + than"}, {"en": "The app is easier than the website.", "note": "easy → easier"}, {"en": "Thursday morning is our busiest time.", "note": "busy → the busiest"}, {"en": "The Plus account is more expensive.", "note": "long adjective: more"}], "exercises": [{"type": "type", "q": "The Basic account is ___ than the Plus account. (cheap)", "answers": ["cheaper"], "why": "Short adjective: add -er."}, {"type": "type", "q": "Thursday morning is the ___ time at the bank. (busy)", "answers": ["busiest"], "why": "-y → -iest for the superlative."}, {"type": "type", "q": "The Plus account is ___ than the Basic account. (expensive)", "answers": ["more expensive"], "why": "Long adjective: more + adjective."}, {"type": "type", "q": "Grace is the ___ person at the bank. (friendly)", "answers": ["friendliest", "most friendly"], "why": "Superlative of friendly: the friendliest."}, {"type": "choice", "q": "The app is ___ than the website.", "options": ["better", "best", "more good"], "answer": 0, "why": "Good → better → the best."}, {"type": "choice", "q": "This is the ___ coffee shop in the whole city.", "options": ["better", "most good", "best"], "answer": 2, "why": "In the whole city = superlative: the best."}, {"type": "choice", "q": "My new apartment is ___ than my old one.", "options": ["biger", "bigger", "more big"], "answer": 1, "why": "Big → bigger: double the g."}, {"type": "choice", "q": "Today is ___ than yesterday. It's raining and cold.", "options": ["worse", "worst", "badder"], "answer": 0, "why": "Bad → worse → the worst."}]}, "reading": {"title": "Old life, new life", "kind": "Elif's diary", "text": "Thursday evening\n\nToday I opened a bank account. It was easier than I expected! I chose the Basic account because it's cheaper, and I don't need extra services.\n\nTonight I'm thinking about my old life and my new life. My apartment here is smaller than my apartment in Izmir, but it's brighter. The kitchen is tiny, but now the sink works!\n\nMy new job is harder than my old job. Everything is in English, and people speak faster in meetings. But my coworkers are the kindest people I know. Sam always helps me, and Maria is very patient with me.\n\nThe most difficult thing is missing my family. My mom calls me every day. Her cooking is still the best in the world, and I miss it a lot.\n\nBut some things are better here. My walk to the bus stop is shorter, and I have a great neighbor. Dan invited me to a party at his place on Saturday. I'm a little nervous, but I'm excited too!", "questions": [{"q": "Why did Elif choose the Basic account?", "options": ["It's the newest.", "It's cheaper.", "Grace told her to."], "answer": 1}, {"q": " ived in another country before?"}, {"s": "Elif", "t": "No, never. This is my first time. But I've visited Germany and Greece."}, {"s": "Elif", "t": "What about you? Have you ever been to Turkey?"}, {"s": "Nora", "t": "No, but I've always wanted to go."}, {"s": "Dan", "t": "I've been to Istanbul! I went there ten years ago."}, {"s": "Elif", "t": "Really? Did you try Turkish tea?"}, {"s": "Dan", "t": "Of course. I drank about ten glasses a day!"}, {"s": "Nora", "t": "Mmm, this dessert is amazing. What is it?"}, {"s": "Elif", "t": "It's called baklava. Have you ever eaten it?"}, {"s": "Nora", "t": "No, I've never tried it before. It's so sweet and delicious!"}, {"s": "Dan", "t": "So, Elif, what are you doing tomorrow?"}, {"s": "Elif", "t": "I'm going to a lake with my coworkers. I've never swum in a lake."}, {"s": "Nora", "t": "You have to try it! Bring a towel and be brave."}, {"s": "Elif", "t": "Maybe. I'll decide tomorrow!"}, {"s": "Dan", "t": "Okay, everyone, let's eat before Nora finishes the whole dessert!"}], "mcq": [{"q": "What did Elif bring to the party?", "options": ["flowers", "a Turkish dessert", "Turkish tea"], "answer": 1}, {"q": "Who is Nora?", "options": ["Dan's friend from college", "Dan's sister", "Elif's coworker"], "answer": 0}, {"q": "Which country has Dan visited?", "options": ["Germany", "Greece", "Turkey"], "answer": 2}, {"q": "What is Elif doing tomorrow?", "options": ["fixing her sink", "going to the bank", "going to a lake with coworkers"], "answer": 2}], "gaps": [{"line": 9, "answer": "never fixed"}, {"line": 12, "answer": "visited"}, {"line": 13, "answer": "been to"}, {"line": 15, "answer": "went"}, {"line": 20, "answer": "never tried"}, {"line": 22, "answer": "swum"}]}, "vocab": [{"w": "Come in", "m": "please enter", "ex": "The door is open. Come in!"}, {"w": "recipe", "m": "instructions for cooking a dish", "ex": "Can you give me the recipe for this soup?"}, {"w": "How do you like", "m": "What do you think of...?", "ex": "How do you like → swum. Use the participle."}, {"type": "type", "q": "Have you ever ___ Turkish tea? (try)", "answers": ["tried"], "why": "Try → tried (past participle)."}, {"type": "type", "q": "My parents have never ___ on a plane. (fly)", "answers": ["flown"], "why": "Fly → flew → flown."}, {"type": "type", "q": "Dan ___ to Istanbul, but Nora hasn't. (be)", "answers": ["has been", "'s been"], "why": "Life experience: has + been."}]}, "reading": {"title": "The best party", "kind": "Elif's diary", "text": "Saturday night\n\nI just got home from Dan's party. It was so much fun! There were about ten people, and everyone was very friendly.\n\nI met Dan's friend Nora. She's a nurse, and she has lived in Chicago all her life. She has never been to Turkey, but she has always wanted to go. I told her, \"Come to Izmir with me one day!\"\n\nEveryone loved my mom's baklava. A man named Leo asked for the recipe. I've never shared that recipe with anyone, but I wrote it down for him. My mom will be proud.\n\nLater, we played a game called \"Have you ever...?\" Dan has ridden a camel! Nora has met a famous singer. And I said, \"I've never eaten a hot dog.\" Everyone was shocked. \"We're going to fix that,\" they said.\n\nThis week I took the wrong bus, had a flood in my kitchen and opened a bank account. Tomorrow I'm going to the lake with Maria and Sam. Chicago is starting to feel like home.", "questions": [{"q": "What is Nora's job?", "options": ["She's a singer.", "She's a nurse.", "She's a teacher."], "answer": 1}, {"q": "What did Leo ask for?", "options": ["the recipe", "more baklava", "Elif's phone number"], "answer": 0}, {"q": "What has Elif never done?", "options": ["ridden a camel", "met a famous singer", "eaten a hot dog"], "answer": 2}, {"q": "How does Elif feel about Chicago now?", "options": ["It's too busy.", "It's starting to feel like home.", "She wants to go back to Turkey."], "answer": 1}], "tf": [{"s": "Nora has been to Turkey.", "answer": false}, {"s": "Dan has ridden a cam   const el = h("div", { class: "mist" });
  el.append(h("div", { class: "small muted" }, esc(mistakeLabel(m.day)) + " · " + esc(m.area) + ' · <span class="dots" title="Get it right 2 times to fix it"><i class="' + ((m.streak || 0) >= 1 ? "on" : "") + '"></i><i class="' + ((m.streak || 0) >= 2 ? "on" : "") + '"></i></span>'));
  el.append(h("div", null, "<b>" + esc(m.q).replace("___", '<span class="blank">&nbsp;</span>') + "</b>"));
  const fb = h("div", { class: "fb", hidden: "" });
  function result(ok) {
    m.streak = ok ? (m.streak || 0) + 1 : 0;
    if (m.streak >= 2) m.fixed = today();
    fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
    fb.innerHTML = ok ? (m.fixed ? "<b>Fixed!</b> You got it right twice." : "<b>Right!</b> Get it right one more time (another day) to fix it.") : "<b>Not yet.</b> Answer: " + esc(m.right) + ". " + esc(m.why || "");
    const dots = el.querySelectorAll(".dots i"); dots.forEach((d, i) => d.classList.toggle("on", m.streak > i));
    markActive(); save(); onChange && onChange(m);
  }
  if (m.kind === "choice" && m.opts) {
    const row = h("div", { class: "opts" });
    shuffle(m.opts, m.q.length).forEach((o) => { const b = h("button", { class: "opt" }, esc(o)); b.onclick = () => { row.querySelectorAll("button").forEach((x) => { x.disabled = true; if (x.textContent === m.right) x.classList.add("right"); }); if (o !== m.right) b.classList.add("wrong"); result(o === m.right); }; row.append(b); });
    el.append(row);
  } else if (m.kind === "type" || m.area === "Listening" || m.area === "Grammar") {
    const row = h("div", { class: "typein" });
    const inp = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Your answer" });
    const b = h("button", { class: "btn small" }, "Check");
    const go = () => { if (!inp.value.trim()) return; const ok = (m.answers || [m.right]).some((a) => norm(a) === norm(inp.value)); inp.disabled = b.disabled = true; result(ok); };
    b.onclick = go; inp.addEventListener("keydown", (e) => e.key === "Enter" && go());
    row.append(inp, b); el.append(row);
  } else {
    el.append(h("div", null, 'You wrote: <span class="your">' + esc(m.your) + '</span> → <span class="right">' + esc(m.right) + "</span>" + (m.why ? '<div class="small muted">' + esc(m.why) + "</div>" : "")));
    const b = h("button", { class: "btn ghost small" }, "I understand");
    b.style.justifySelf = "start";
    b.onclick = () => { m.fixed = today(); save(); b.disabled = true; fb.hidden = false; fb.className = "fb ok"; fb.textContent = "Marked as fixed."; onChange && onChange(m); };
    el.append(b);
  }
  el.append(fb);
  return el;
}

// ---------- exercise widgets ----------
function mcqBlock(items, rec, prefix, k, area, opts) {
  opts = opts || {};
  const wrap = h("div");
  items.forEach((it, i) => {
    const id = prefix + i;
    const q = h("div", { class: "q" });
    q.append(h("div", { class: "qt" }, (opts.num != null ? opts.num : i + 1) + ". " + esc(it.q).replace("___", '<span class="blank">&nbsp;</span>')));
    const row = h("div", { class: "opts" });
    const fb = h("div", { class: "fb", hidden: "" });
    const options = it.options || (it.tf ? ["True", "False"] : []);
    const correct = it.tf ? (it.answer ? 0 : 1) : it.answer;
    const btns = options.map((o, oi) => { const b = h("button", { class: "opt" }, esc(o)); b.onclick = () => answer(oi, true); row.append(b); return b; });
    function answer(oi, fresh) {
      btns.forEach((b, bi) => { b.disabled = true; if (bi === correct) b.classList.add("right"); else if (bi === oi) b.classList.add("wrong"); });
      const ok = oi === correct;
      fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
      fb.innerHTML = (ok ? "<b>Right!</b> " : "<b>Not quite.</b> Answer: " + esc(options[correct]) + ". ") + esc(it.why || "");
      if (fresh) {
        rec[id] = oi; markActive(); save();
        if (!ok) logMistake(k, area, it.q, options[oi], options[correct], it.why, { kind: "choice", opts: options });
        if (opts.onAnswer) opts.onAnswer();
      }
      if (it.q.includes("___")) q.querySelector(".blank").textContent = options[correct];
    }
    q.append(row, fb);
    if (rec[id] != null) answer(rec[id], false);
    wrap.append(q);
  });
  const score = () => { let c = 0, t = 0; items.forEach((it, i) => { const a = rec[prefix + i]; if (a != null) { t++; const correct = it.tf ? (it.answer ? 0 : 1) : it.answer; if (a === correct) c++; } }); return [c, t, items.length]; };
  return { el: wrap, score };
}
function typeBlock(it, i, rec, id, k, area) {
  const q = h("div", { class: "q" });
  q.append(h("div", { class: "qt" }, (i + 1) + ". " + esc(it.q).replace("___", '<span class="blank">&nbsp;</span>')));
  const row = h("div", { class: "typein" });
  const inp = h("input", { type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Your answer", id: k + "-" + id });
  const b = h("button", { class: "btn small" }, "Check");
  const fb = h("div", { class: "fb", hidden: "" });
  row.append(inp, b);
  function check(val, fresh) {
    const ok = it.answers.some((a) => norm(a) === norm(val));
    inp.value = val; inp.disabled = true; b.disabled = true;
    fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
    fb.innerHTML = (ok ? "<b>Right!</b> " : "<b>Not quite.</b> Answer: " + esc(it.answers[0]) + ". ") + esc(it.why || "");
    q.querySelector(".blank").textContent = ok ? val : it.answers[0];
    if (fresh) { rec[id] = val; markActive(); save(); if (!ok) logMistake(k, area, it.q, val, it.answers[0], it.why, { kind: "type", answers: it.answers }); }
  }
  b.onclick = () => { if (inp.value.trim()) check(inp.value.trim(), true); };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && inp.value.trim()) check(inp.value.trim(), true); });
  q.append(row, fb);
  if (rec[id] != null) check(rec[id], false);
  return { el: q, ok: () => rec[id] != null && it.answers.some((a) => norm(a) === norm(rec[id])) };
}

// ---------- flashcards ----------
const INTERVALS = [0, 1, 2, 4, 7, 14, 30];
const VOCAB = [];
DATA.weeks.forEach((wk) => wk.days.forEach((d) => d.vocab.forEach((v, i) => VOCAB.push({ id: dkey(wk.week, d.day) + "-" + i, w: v.w, m: v.m, ex: v.ex, audio: d.audio && d.audio.vocab, t: d.audio && d.audio.vocabT && d.audio.vocabT[i], day: dkey(wk.week, d.day) }))));
function addCards(k) { VOCAB.filter((v) => v.day === k).forEach((v) => { if (!S.cards[v.id]) S.cards[v.id] = { box: 0, due: today() }; }); save(); }
function dueCards(exceptDay) { const t = today(); return VOCAB.filter((v) => S.cards[v.id] && S.cards[v.id].due <= t && v.day !== exceptDay); }
function flashSession(container, list, onDone) {
  container.innerHTML = "";
  if (!list.length) { container.append(h("p", { class: "muted" }, "No words to review right now. Well done!")); onDone && onDone(); return; }
  let queue = shuffle(list, list.length + 3), shown = 0;
  const box = h("div", { class: "flash" });
  const counter = h("div", { class: "small muted" });
  const card = h("div", { class: "fcard" });
  const btns = h("div", { class: "fbtns" });
  const reveal = h("button", { class: "btn" }, "Show meaning");
  box.append(counter, card, reveal, btns); container.append(box);
  const pls = {};
  function next() {
    if (!queue.length) { box.innerHTML = '<div class="fcard"><div class="big">Done!</div><p class="muted">You reviewed ' + shown + " cards.</p></div>"; save(); onDone && onDone(); return; }
    const v = queue[0]; shown++;
    counter.textContent = queue.length + " left";
    card.innerHTML = '<div class="big">' + esc(v.w) + "</div>";
    if (v.audio && v.t) { const p = pls[v.audio] || (pls[v.audio] = makePlayer(v.audio)); const b = miniBtn(() => p.seg(v.t[0], v.t[1]), "Hear the phrase"); b.style.justifySelf = "center"; card.append(b); }
    btns.hidden = true; reveal.hidden = false;
    reveal.onclick = () => { card.append(h("div", { class: "muted" }, esc(v.m)), h("div", { class: "small" }, "<i>" + esc(v.ex) + "</i>")); reveal.hidden = true; btns.hidden = false; };
    btns.innerHTML = "";
    [["again", "Again"], ["good", "Good"], ["easy", "Easy"]].forEach(([c, label]) => {
      const b = h("button", { class: "btn " + c }, label);
      b.onclick = () => {
        const st = S.cards[v.id] || (S.cards[v.id] = { box: 0, due: today() });
        queue.shift();
        if (c === "again") { st.box = 0; st.due = today(); queue.push(v); }
        else { st.box = Math.min(6, st.box + (c === "easy" ? 2 : 1)); st.due = addDays(today(), INTERVALS[st.box]); }
        markActive(); save(); next();
      };
      btns.append(b);
    });
  }
  next();
}

function findDay(w, d) { const wk = DATA.weeks.find((x) => x.week === w); return wk && wk.days.find((x) => x.day === d); }
function dayProgress(k) { const ds = S.days[k]; if (!ds || !ds.steps) return 0; return STEPS.filter((s) => ds.steps[s.id]).length / STEPS.length; }
function sundayDone(w) { return !!(S.sundays[w] && S.sundays[w].done); }

}

  app.append(head);

      sh.onclick = () => { stopAll(); openId = openId === st.id ? null : st.id; ds.open = openId; save(false); draw(); if (openId) box.scrollIntoView({ block: "start" }); };
      box.append(sh);

function pickSayLines(d) {
  const L = d.listening.lines;
  const cand = L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.l.s === "Elif" && x.n >= 6 && x.n <= 16);
  const pool = cand.length >= 4 ? cand : L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.n >= 5 && x.n <= 18);
  const step = Math.max(1, Math.floor(pool.length / 4));
  const out = []; for (let j = 0; j < pool.length && out.length < 4; j += step) out.push(pool[j]);
  return out;
}

// ---------- writing + checker ----------
async function checkText(text) {
  const body = new URLSearchParams({ text, language: "en-US", enabledOnly: "false" });
  const r = await fetch("https://api.languagetool.org/v2/check", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" }, body });
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  return j.matches || [];
}
function friendlyType(m) {
  const t = (m.rule && m.rule.issueType) || "";
  if (t === "misspelling") return "Spelling";
  if (t === "grammar") return "Grammar";
  if (t === "typographical") return "Punctuation";
  if (t === "style") return "Style";
  return "Check";
}
function renderCheck(container, text, matches) {
  container.innerHTML = "";
  let html = "", pos = 0;
  const sorted = matches.slice().sort((a, b) => a.offset - b.offset);
  sorted.forEach((m, i) => { if (m.offset < pos) return; html += esc(text.slice(pos, m.offset)) + '<mark title="' + esc(m.message) + '">' + esc(text.slice(m.offset, m.offset + m.length)) + "<sup>" + (i + 1) + "</sup></mark>"; pos = m.offset + m.length; });
  html += esc(text.slice(pos));
  container.append(h("div", { class: "submitted" }, html));
  if (!sorted.length) { container.append(h("div", { class: "fb ok" }, "<b>No problems found.</b> Well done! Now compare with the model answer.")); }
  else {
    container.append(h("p", null, "<b>" + sorted.length + "</b> " + (sorted.length === 1 ? "thing" : "things") + " to check:"));
    const list = h("div", { class: "issues" });
    sorted.forEach((m, i) => {
      const bad = text.slice(m.offset, m.offset + m.length);
      const sug = (m.replacements || []).slice(0, 3).map((r) => r.value);
      list.append(h("div", { class: "issue" }, '<div class="small muted"><b>' + (i + 1) + ".</b> " + friendlyType(m) + '</div><div><span class="bad">' + esc(bad) + "</span>" + (sug.length ? ' → <span class="sug">' + sug.map(esc).join(" / ") + "</span>" : "") + '</div><div class="small">' + esc(m.shortMessage || m.message) + "</div>"));
    });
    container.append(list);
  }
  container.append(h("p", { class: "credit" }, 'Checked by <a href="https://languagetool.org" target="_blank">LanguageTool</a>. It can miss things or be wrong, so read each note carefully.'));
}
function buildWrite(body, d, k, ds) {
  const W = d.writing;
  const p1 = part(W.prompt, "Write", "Write " + esc(W.length) + ". Don't use a translator. When you finish, press <b>Submit</b> and your text will be checked.");
  const ta = h("textarea", { id: "write-" + k, "aria-label": "Your text", placeholder: "Write here…", spellcheck: "false", autocorrect: "off" });
  ta.value = ds.write || "";
  const wc = h("div", { class: "small muted" });
  const upd = () => { const n = (ta.value.match(/[A-Za-z']+/g) || []).length; wc.textContent = n + " words"; };
  ta.oninput = () => { ds.write = ta.value; save(); upd(); }; upd();
  const submit = h("button", { class: "btn" }, "Submit");
  const editBtn = h("button", { class: "btn ghost small", hidden: "" }, "Edit and submit again");
  const out = h("div", { class: "stack" });
  const after = h("div", { class: "stack", hidden: "" });
  p1.append(ta, wc, h("div", { class: "row" }), out);
  p1.querySelector(".row").append(submit, editBtn);
  const checks = h("div", { class: "checks" });
  W.checklist.forEach((c, i) => { const id = "wr" + i; const lab = h("label"); const cb = h("input", { type: "checkbox", id: k + "-" + id }); cb.checked = !!ds.checks[id]; cb.onchange = () => { ds.checks[id] = cb.checked; save(); }; lab.append(cb, document.createTextNode(c)); checks.append(lab); });
  after.append(h("h3", null, "Check your text"), checks, h("h3", null, "Model answer"), h("div", { class: "model" }, "<p>" + esc(W.model) + "</p>"));
  function lockView(sub) {
    ta.hidden = true; wc.hidden = true; submit.hidden = true; editBtn.hidden = false; after.hidden = false;
    renderCheck(out, sub.text, sub.matches || []);
    if (sub.error) out.prepend(h("div", { class: "fb info" }, "The online checker isn't available right now (no internet, or it's busy). Compare with the model answer, and try <b>Edit and submit again</b> later."));
  }
  submit.onclick = async () => {
    const text = ta.value.trim();
    if ((text.match(/[A-Za-z']+/g) || []).length < 10) { toast("Write a little more first (at least 10 words)."); return; }
    submit.disabled = true; submit.textContent = "Checking…";
    let matches = [], error = false;
    try { matches = await checkText(text); } catch (e) { error = true; }
    submit.disabled = false; submit.textContent = "Submit";
    ds.submissions = ds.submissions || [];
    const sub = { text, at: today(), matches: matches.map((m) => ({ offset: m.offset, length: m.length, message: m.message, shortMessage: m.shortMessage, replacements: (m.replacements || []).slice(0, 3), rule: { issueType: m.rule && m.rule.issueType } })), error };
    ds.submissions.push(sub); ds.submitted = sub;
    sub.matches.forEach((m) => { const bad = text.slice(m.offset, m.offset + m.length); const sug = (m.replacements[0] || {}).value; if (sug) logMistake(k, "Writing", "“" + bad + "” in your text", bad, sug, m.shortMessage || m.message, { kind: "info" }); });
    markActive(); save(); lockView(sub);
  };
  editBtn.onclick = () => { ta.hidden = false; wc.hidden = false; submit.hidden = false; editBtn.hidden = true; out.innerHTML = ""; ta.focus(); };
  body.append(p1, after);
  if (ds.submitted && ds.submitted.text === (ds.write || "").trim()) lockView(ds.submitted);
}

  if (due.length) { const b = h("button", { class: "btn" }, "Start review"); b.onclick = () => { b.hidden = true; flashSession(box, due); }; c.append(b); }
  c.append(box); app.append(c);
  const learned = VOCAB.filter((v) => S.cards[v.id]);
  const list = h("div", { class: "card stack" }); list.style.marginTop = "14px";
  list.append(h("h3", null, "All my words (" + learned.length + ")"));
  if (!learned.length) list.append(h("p", { class: "muted" }, "No words yet. Finish step 3 of Monday, Week 1."));
  const pls = {};
  learned.forEach((v) => {
    const el = h("div", { class: "word" });
    const p = v.audio ? (pls[v.audio] || (pls[v.audio] = makePlayer(v.audio))) : null;
    el.append(p && v.t ? miniBtn(() => p.seg(v.t[0], v.t[3] || v.t[1])) : h("span"));
    const st = S.cards[v.id];
    el.append(h("div", null, '<div class="w">' + esc(v.w) + ' <span class="pill' + (st.box >= 4 ? " good" : "") + '">' + (st.box >= 4 ? "strong" : st.box >= 2 ? "learning" : "new") + '</span></div><div class="m">' + esc(v.m) + '</div><div class="ex">' + esc(v.ex) + "</div>"));
    list.append(el);
  });
  app.append(list);
}
function renderMistakes() {
  pageHead("My mistakes", "Try each one again. Get it right twice (on different days) and it leaves the list.");
  const open = S.mistakes.filter((m) => !m.fixed);
  const c = h("div", { class: "card" }); c.style.marginTop = "14px";
  if (!open.length) c.append(h("p", null, "No mistakes to fix. Great job!"));
  open.slice().reverse().forEach((m) => c.append(retryBlock(m)));
  app.append(c);
  const fixed = S.mistakes.filter((m) => m.fixed).length;
  if (fixed) app.append(h("p", { class: "muted small" }, fixed + " mistakes fixed so far."));
}
function renderProgress() {
  pageHead("My progress", null);
  const daysDone = Object.keys(S.days).filter((k) => dayProgress(k) === 1).length;
  const cards = Object.values(S.cards);
  const strong = cards.filter((c) => c.box >= 4).length, learning = cards.filter((c) => c.box >= 2 && c.box < 4).length;
  const open = S.mistakes.filter((m) => !m.fixed).length, fixed = S.mistakes.length - open;
  const stats = h("div", { class: "stats" }); stats.style.marginTop = "14px";
  stats.innerHTML = '<div class="stat"><b>' + streak() + '</b><span>day streak</span></div><div class="stat"><b>' + daysDone + '<span class="small muted"> / 12</span></b><span>lesson days done</span></div><div class="stat"><b>' + cards.length + '</b><span>words (' + strong + " strong, " + learning + ' learning)</span></div><div class="stat"><b>' + fixed + '<span class="small muted"> / ' + S.mistakes.length + "</span></b><span>mistakes fixed</span></div>";
  app.append(stats);
  const areas = {}; S.mistakes.filter((m) => !m.fixed).forEach((m) => (areas[m.area] = (areas[m.area] || 0) + 1));
  const top = Object.entries(areas).sort((a, b) => b[1] - a[1]);
  if (top.length) { const c = h("div", { class: "card" }); c.style.marginTop = "14px"; c.innerHTML = "<h3>Where to practice</h3><p>Most open mistakes: " + top.map(([a, n]) => "<b>" + esc(a) + "</b> (" + n + ")").join(", ") + ".</p>"; app.append(c); }
  DATA.weeks.forEach((wk) => {
    const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
    c.append(h("h3", null, "Week " + wk.week + ": " + esc(wk.title)));
    const tw = h("div", { class: "tablewrap" });
    let rows = "<table class=\"prog\"><thead><tr><th>Day</th><th>Steps</th><th>Correct</th><th>Speaking</th><th>Writing</th></tr></thead><tbody>";
    wk.days.forEach((d) => {
      const ds = S.days[dkey(wk.week, d.day)] || {};
      const steps = ds.steps ? Object.keys(ds.steps).length : 0;
      let c2 = 0, t2 = 0; Object.values(ds.steps || {}).forEach((s) => { if (s && s.score && s !== ds.steps.speak) { c2 += s.score[0]; t2 += s.score[1]; } });
      const says = Object.values(ds.say || {}); const sayAvg = says.length ? Math.round(says.reduce((a, x) => a + x.best, 0) / says.length) + "%" : "–";
      const wr = ds.submitted ? (ds.submitted.error ? "sent" : ds.submitted.matches.length + " notes") : "–";
      rows += "<tr><td>" + d.dayName.slice(0, 3) + '</td><td class="n">' + steps + '/7</td><td class="n">' + (t2 ? c2 + "/" + t2 : "–") + '</td><td class="n">' + sayAvg + '</td><td class="n">' + wr + "</td></tr>";
    });
    const st = S.sundays[wk.week]; const qs = st ? (() => { let c3 = 0, t3 = 0; wk.sunday.quiz.forEach((q, i) => { const a = st.ans["sq" + i]; if (a != null) { t3++; if (a === q.answer) c3++; } }); return t3 ? c3 + "/" + t3 : "–"; })() : "–";
    rows += '<tr><td>Sun</td><td class="n">' + (st && st.done ? "done" : "–") + '</td><td class="n">test ' + qs + "</td><td></td><td></td></tr></tbody></table>";
    tw.innerHTML = rows; c.append(tw); app.append(c);
  });
  app.append(h("p", { class: "small muted" }, "Speaking = your best clarity score on the read-aloud sentences. Writing = notes from the online checker."));
}
function renderNotes(v) {
  const n = v.id ? S.notes.find((x) => x.id === v.id) : null;
  if (v.id && n) {
    pageHead("My notes", null);
    const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
    const title = h("input", { type: "text", id: "note-title", "aria-label": "Title", placeholder: "Title" });
    title.style.cssText = "font:inherit;font-family:var(--font-display);font-size:1.2em;font-weight:600;border:0;border-bottom:1.5px solid var(--line);padding:6px 0;background:transparent;color:var(--ink);width:100%";
    title.value = n.title || "";
    const ta = h("textarea", { id: "note-text", "aria-label": "Note", placeholder: "Write your note… (new words, questions, things to remember)" }); ta.style.minHeight = "260px";
    ta.value = n.text || "";
    const upd = () => { n.title = title.value; n.text = ta.value; n.updated = Date.now(); save(); };
    title.oninput = upd; ta.oninput = upd;
    const row = h("div", { class: "row" }); row.style.justifyContent = "space-between";
    const back = h("button", { class: "btn" }, "Done"); back.onclick = () => go({ tool: "notes" });
    const del = h("button", { class: "btn ghost small" }, "Delete note");
    del.onclick = () => { if (del.dataset.sure) { S.notes = S.notes.filter((x) => x.id !== n.id); save(); go({ tool: "notes" }); } else { del.dataset.sure = "1"; del.textContent = "Tap again to delete"; del.classList.add("red"); } };
    row.append(back, del);
    c.append(title, ta, h("p", { class: "small muted" }, "Saved automatically."), row); app.append(c);
    if (!n.text) ta.focus();
    return;
  }
  pageHead("My notes", "Your own notebook: new words, questions, sentences you like.");
  const nb = h("button", { class: "btn" }, "+ New note");
  nb.style.marginTop = "14px";
  nb.onclick = () => { const x = { id: uid(), title: "", text: "", created: Date.now(), updated: Date.now() }; S.notes.unshift(x); save(); go({ tool: "notes", id: x.id }); };
  app.append(nb);
  const list = h("div", { class: "notes" }); list.style.marginTop = "14px";
  if (!S.notes.length) list.append(h("div", { class: "card" }, '<p class="muted">No notes yet. Tap <b>New note</b> to start.</p>'));
  S.notes.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0)).forEach((x) => {
    const b = h("button", { class: "note" }, "<b>" + esc(x.title || "Untitled") + "</b><span>" + esc(x.text || "Empty note") + "</span>");
    b.onclick = () => go({ tool: "notes", id: x.id }); list.append(b);
  });
  app.append(list);
}
function renderSettings() {
  pageHead("Settings", null);
  const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
  c.append(h("h3", null, "Text size"));
  const seg = h("div", { class: "seg" });
  [[0.9, "Small"], [1, "Normal"], [1.15, "Large"], [1.3, "Extra large"]].forEach(([v, l]) => { const b = h("button", { class: (S.settings.scale || 1) === v ? "on" : "" }, l); b.onclick = () => { S.settings.scale = v; save(); applySettings(); renderSettings(); }; seg.append(b); });
  c.append(seg);
  c.append(h("h3", null, "Microphone"));
  c.append(h("p", null, SR ? "Speech check is available in this browser." : "Speech check is not available in this browser. Use Chrome (Android, Windows, Mac) or Safari (iPhone, Mac). Recording still works."));
  const t = h("button", { class: "btn ghost small" }, "Test my microphone");
  const tbox = h("div");
  t.onclick = () => { tbox.innerHTML = ""; const sb = sayBlock("Hello, my name is Ebru.", {}, "test", null); tbox.append(sb); sb.querySelector(".mini.mic").click(); };
  c.append(t, tbox);
  app.append(c);
  const c2 = h("div", { class: "card stack" }); c2.style.marginTop = "14px";
  c2.append(h("h3", null, "Start over"));
  c2.append(h("p", { class: "muted" }, "Delete all progress, words, mistakes and notes on this device" + (Sync.user() ? " and in your account" : "") + "."));
  const del = h("button", { class: "btn ghost small" }, "Delete everything");
  del.onclick = () => { if (del.dataset.sure) { const sc = S.settings; S = blank(); S.settings = sc; S.updated = Date.now(); save(); toast("Everything deleted"); go(null); } else { del.dataset.sure = "1"; del.textContent = "Tap again to delete everything"; del.classList.add("red"); } };
  c2.append(del); app.append(c2);
}
function renderAccount(v) {
  pageHead("Account", null);
  const c = h("div", { class: "card stack" }); c.style.marginTop = "14px";
  app.append(c);
  if (!Sync.enabled()) { c.append(h("p", null, "Accounts are not set up yet. Your progress is saved on this device.")); return; }
  const u = Sync.user();
  if (v.recover) {
    c.append(h("h2", null, "Choose a new password"));
    const f = h("div", { class: "field" }, '<label for="np">New password (at least 8 characters)</label>'); const np = h("input", { id: "np", type: "password", autocomplete: "new-password" }); f.append(np);
    const msg = h("div"); const b = h("button", { class: "btn" }, "Save password");
    b.onclick = async () => { if (np.value.length < 8) { msg.className = "err"; msg.textContent = "Use at least 8 characters."; return; } b.disabled = true; const { error } = await Sync.newPassword(np.value); b.disabled = false; if (error) { msg.className = "err"; msg.textContent = error.message; } else { toast("Password saved"); go(null); } };
    c.append(f, b, msg); return;
  }
  if (u) {
    c.append(h("h2", null, "You're logged in"));
    c.append(h("p", null, "Email: <b>" + esc(u.email) + "</b>"));
    c.append(h("p", { class: "muted" }, "Your progress, words, mistakes and notes are saved to your account. Log in with the same email on any phone or computer."));
    c.append(h("p", null, "Status: " + esc(Sync.status())));
    const row = h("div", { class: "row" });
    const s = h("button", { class: "btn ghost small" }, "Sync now"); s.onclick = async () => { await Sync.push(); renderAccount({}); };
    const o = h("button", { class: "btn ghost small" }, "Log out"); o.onclick = async () => { o.disabled = true; await Sync.signOut(); toast("Logged out"); go(null); };
    row.append(s, o); c.append(row); return;
  }
  let mode = v.mode || "login";
  c.append(h("h2", null, mode === "signup" ? "Create your account" : mode === "reset" ? "Reset your password" : "Log in"));
  c.append(h("p", { class: "muted" }, mode === "signup" ? "Your progress on this device will be saved to the new account." : mode === "reset" ? "We'll send you an email with a link." : "Log in to save your progress and use it on any device."));
  const f1 = h("div", { class: "field" }, '<label for="em">Email</label>'); const em = h("input", { id: "em", type: "email", autocomplete: "email", inputmode: "email" }); f1.append(em);
  const f2 = h("div", { class: "field" }, '<label for="pw">Password' + (mode === "signup" ? " (at least 8 characters)" : "") + "</label>"); const pw = h("input", { id: "pw", type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password" }); f2.append(pw);
  const msg = h("div");
  const b = h("button", { class: "btn" }, mode === "signup" ? "Create account" : mode === "reset" ? "Send reset email" : "Log in");
  c.append(f1); if (mode !== "reset") c.append(f2); c.append(b, msg);
  const go2 = async () => {
    msg.className = ""; msg.textContent = "";
    const e = em.value.trim(), p = pw.value;
    if (!/^\S+@\S+\.\S+$/.test(e)) { msg.className = "err"; msg.textContent = "Please enter a valid email."; return; }
    if (mode !== "reset" && p.length < (mode === "signup" ? 8 : 1)) { msg.className = "err"; msg.textContent = mode === "signup" ? "Use at least 8 characters." : "Please enter your password."; return; }
    b.disabled = true;
    let r;
    try { r = mode === "signup" ? await Sync.signUp(e, p) : mode === "reset" ? await Sync.reset(e) : await Sync.signIn(e, p); } catch (x) { r = { error: { message: "No connection. Try again." } }; }
    b.disabled = false;
    if (r.error) { msg.className = "err"; msg.textContent = r.error.message === "Invalid login credentials" ? "Wrong email or password." : r.error.message; return; }
    if (mode === "reset") { msg.className = "okmsg"; msg.textContent = "Check your email for the link."; return; }
    if (mode === "signup" && !(r.data && r.data.session)) { msg.className = "okmsg"; msg.textContent = "Almost done! Check your email and tap the link to confirm, then log in here."; return; }
    toast("Welcome!"); go(null);
  };
  b.onclick = go2; [em, pw].forEach((x) => x.addEventListener("keydown", (e) => e.key === "Enter" && go2()));
  const links = h("div", { class: "row" });
  const mk = (label, m) => { const l = h("button", { class: "linkbtn" }, label); l.onclick = () => renderAccount({ mode: m }); return l; };
  if (mode !== "signup") links.append(mk("Create an account", "signup"));
  if (mode !== "login") links.append(mk("Log in", "login"));
  if (mode === "login") links.append(mk("Forgot password?", "reset"));
  c.append(links);
}

// ---------- welcome gate ----------
function offlineOK() { try { return sessionStorage.getItem("ewe-offline") === "1"; } catch (e) { return false; } }
function renderSplash() { $("#hdr").hidden = true; app.innerHTML = '<div class="gate"><div class="mark" aria-hidden="true"><i></i><i></i></div><p class="muted">Loading…</p></div>'; }
function renderGate(mode) {
  const known = Sync.knownEmail();
  mode = mode || (known ? "signin" : "signup");
  $("#hdr").hidden = true; app.innerHTML = "";
  const g = h("div", { class: "gate" });
  g.append(h("div", { class: "mark", "aria-hidden": "true" }, "<i></i><i></i>"));
  const titles = { signup: ["Hi Ebru!", "Welcome to your English course. Let’s make your account, so your progress is saved on every device."], signin: ["Hi Ebru!", "Welcome back. Sign in to continue your lessons."], reset: ["Forgot your password?", "No problem. Write your email and we’ll send you a link to make a new one."] };
  g.append(h("h1", null, titles[mode][0]), h("p", { class: "lead" }, titles[mode][1]));
  const card = h("div", { class: "card stack gatecard" });
  const f1 = h("div", { class: "field" }, '<label for="g-em">Email</label>');
  const em = h("input", { id: "g-em", type: "email", autocomplete: "email", inputmode: "email", autocapitalize: "off" });
  em.value = known || ""; f1.append(em);
  const f2 = h("div", { class: "field" }, '<label for="g-pw">' + (mode === "signup" ? "Choose a password (at least 8 characters)" : "Password") + "</label>");
  const pwRow = h("div", { class: "pwrow" });
  const pw = h("input", { id: "g-pw", type: "password", autocomplete: mode === "signup" ? "new-password" : "current-password" });
  const eye = h("button", { class: "linkbtn small", type: "button" }, "Show");
  eye.onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; eye.textContent = pw.type === "password" ? "Show" : "Hide"; };
  pwRow.append(pw, eye); f2.append(pwRow);
  const msg = h("div", { role: "status" });
  const btn = h("button", { class: "btn big" }, mode === "signup" ? "Create my account" : mode === "reset" ? "Send me the link" : "Sign in");
  card.append(f1); if (mode !== "reset") card.append(f2); card.append(btn, msg);
  const links = h("div", { class: "row gatelinks" });
  const mk = (label, m) => { const l = h("button", { class: "linkbtn" }, label); l.onclick = () => renderGate(m); return l; };
  if (mode === "signup") links.append(h("span", { class: "muted small" }, "Already have an account?"), mk("Sign in", "signin"));
  if (mode === "signin") links.append(mk("Forgot password?", "reset"), h("span", { class: "muted small" }, "·"), mk("Create an account", "signup"));
  if (mode === "reset") links.append(mk("Back to sign in", "signin"));
  card.append(links);
  g.append(card);
  const off = h("button", { class: "linkbtn small", hidden: "" }, "Continue without signing in (saved on this device only)");
  off.onclick = () => { try { sessionStorage.setItem("ewe-offline", "1"); } catch (e) {} render(); };
  g.append(off);
  app.append(g);
  (known && mode === "signin" ? pw : em).focus({ preventScroll: true });
  async function submit() {
    msg.className = ""; msg.textContent = "";
    const e = em.value.trim(), p = pw.value;
    if (!/^\S+@\S+\.\S+$/.test(e)) { msg.className = "err"; msg.textContent = "Please write your email address."; return; }
    if (mode === "signup" && p.length < 8) { msg.className = "err"; msg.textContent = "Your password needs at least 8 characters."; return; }
    if (mode === "signin" && !p) { msg.className = "err"; msg.textContent = "Please write your password."; return; }
    btn.disabled = true; const label = btn.textContent; btn.textContent = "One moment…";
    let r;
    try { r = mode === "signup" ? await Sync.signUp(e, p) : mode === "reset" ? await Sync.reset(e) : await Sync.signIn(e, p); }
    catch (x) { r = { error: { message: "network" } }; }
    btn.disabled = false; btn.textContent = label;
    if (r.error) {
      const m = String(r.error.message || "");
      msg.className = "err";
      if (/network|fetch|Failed/i.test(m)) { msg.textContent = "I can't connect right now. Check your internet and try again."; off.hidden = false; }
      else if (/Invalid login/i.test(m)) msg.textContent = "Wrong email or password. Try again, or tap “Forgot password?”.";
      else if (/already registered|already exists/i.test(m)) { try { localStorage.setItem("ewe-account", JSON.stringify({ email: e })); } catch (x) {} renderGate("signin"); $("#g-pw").focus(); const mm = $(".gate [role=status]"); mm.className = "okmsg"; mm.textContent = "You already have an account. Please sign in."; }
      else if (/Email not confirmed/i.test(m)) msg.textContent = "Please open the email we sent you and tap the link first.";
      else msg.textContent = m;
      return;
    }
    if (mode === "reset") { msg.className = "okmsg"; msg.textContent = "Done! Check your email for the link."; return; }
    try { localStorage.setItem("ewe-account", JSON.stringify({ email: e })); } catch (x) {}
    if (mode === "signup" && !(r.data && r.data.session)) { msg.className = "okmsg"; msg.innerHTML = "<b>Almost done!</b> Open the email we sent you and tap the link. Then come back and sign in."; links.innerHTML = ""; links.append(mk("Go to sign in", "signin")); return; }
    S.opened = null; save(false); render();
  }
  btn.onclick = submit;
  [em, pw].forEach((x) => x.addEventListener("keydown", (ev) => ev.key === "Enter" && submit()));
}

// ---------- render ----------
let lastKind = null;
try { history.scrollRestoration = "manual"; } catch (e) {}
function render() {
  const v = S.opened;
  const kind = Sync.enabled() && !Sync.ready() ? "splash" : (Sync.enabled() && !Sync.user() && !offlineOK() && !(v && v.tool === "account" && v.recover)) ? "gate" : "app";
  if (kind !== lastKind) { lastKind = kind; window.scrollTo(0, 0); }
  if (kind === "splash") return renderSplash();
  if (kind === "gate") return renderGate();
  if (!v) return renderHome();
  if (v.tool === "words") return renderWords();
  if (v.tool === "mistakes") return renderMistakes();
  if (v.tool === "progress") return renderProgress();
  if (v.tool === "notes") return renderNotes(v);
  if (v.tool === "settings") return renderSettings();
  if (v.tool === "account") return renderAccount(v);
  if (v.d === 7 && DATA.weeks.find((x) => x.week === v.w)) return renderSunday(v.w);
  if (findDay(v.w, v.d)) return renderDay(v.w, v.d);
  S.opened = null; renderHome();
}
render();
Sync.init();
})();
</script>
