<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English with Ebru</title>
<meta name="description" content="A 2-week B1 English course: daily lessons with audio, speaking practice, exercises, flashcards and progress.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%231D6A96'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%23B4532F' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column; a day is a vertical path of 7 steps, one open at a time; tools live in a side menu. */
:root {
  --bg: #F3F6F7; --surface: #FFFFFF; --surface-2: #E9EFF1; --ink: #1C2B33; --muted: #5B6C74; --line: #D5DFE3;
  --lake: #1D6A96; --lake-soft: #DDEEF7; --brick: #B4532F; --brick-soft: #F7E6DE;
  --good: #2E7D4F; --good-soft: #DFF2E5; --bad: #B53A3A; --bad-soft: #F8E1E1; --warn: #9A6A00; --warn-soft: #FBF0D4;
  --on-accent: #FFFFFF; --scrim: rgba(15,30,38,.45);
  --hdr: rgba(255,255,255,.84); --glow1: rgba(29,106,150,.16); --glow2: rgba(180,83,47,.12); --dot: rgba(28,43,51,.07);
  --font-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --scale: 1;
  --shadow: 0 1px 2px rgba(20,40,50,.06), 0 4px 14px rgba(20,40,50,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1F; --surface: #18242B; --surface-2: #1F2E36; --ink: #E6EEF1; --muted: #9DB0B8; --line: #2C3F49;
    --lake: #6DB5DE; --lake-soft: #17384A; --brick: #E08A66; --brick-soft: #3A2419;
    --good: #6FCB94; --good-soft: #17352A; --bad: #EF8B8B; --bad-soft: #3D1E1E; --warn: #E8C468; --warn-soft: #3A3018;
    --on-accent: #0E1A20; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3); --hdr: rgba(20,31,38,.86); --glow1: rgba(109,181,222,.12); --glow2: rgba(224,138,102,.09); --dot: rgba(230,238,241,.05); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1F; --surface: #18242B; --surface-2: #1F2E36; --ink: #E6EEF1; --muted: #9DB0B8; --line: #2C3F49;
  --lake: #6DB5DE; --lake-soft: #17384A; --brick: #E08A66; --brick-soft: #3A2419;
  --good: #6FCB94; --good-soft: #17352A; --bad: #EF8B8B; --bad-soft: #3D1E1E; --warn: #E8C468; --warn-soft: #3A3018;
  --on-accent: #0E1A20; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3); --hdr: rgba(20,31,38,.86); --glow1: rgba(109,181,222,.12); --glow2: rgba(224,138,102,.09); --dot: rgba(230,238,241,.05); color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100vh; background-color: var(--bg); background-image: radial-gradient(1100px 700px at -8% -12%, var(--glow1), transparent 62%), radial-gradient(1000px 700px at 108% 112%, var(--glow2), transparent 60%), radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: auto, auto, 24px 24px; background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: calc(18px * var(--scale)); line-height: 1.55; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 840px; margin: 0 auto; padding-block: 22px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9em; font-weight: 700; }
h2 { font-size: 1.4em; font-weight: 600; }
h3 { font-size: 1.12em; font-weight: 600; }
p { margin: 0; }
a { color: var(--lake); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--lake); outline-offset: 2px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .9em; }
.eyebrow { font-family: var(--font-display); font-size: .78em; letter-spacing: .08em; text-transform: uppercase; color: var(--lake); font-weight: 600; }

/* header + drawer */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--hdr); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--hdr); }
.hdr-in { display: flex; align-items: center; gap: 16px; min-height: 76px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .hdr-in { min-height: 84px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.burger { width: 54px; height: 54px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
.burger:hover { border-color: var(--lake); }
.burger span, .burger span::before, .burger span::after { display: block; width: 22px; height: 2.5px; background: var(--ink); border-radius: 2px; position: relative; content: ""; }
.burger span::before { position: absolute; top: -7px; } .burger span::after { position: absolute; top: 7px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.4em; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.brand .bm { position: relative; width: 44px; height: 30px; flex: none; }
.brand .bm i { position: absolute; top: 0; width: 30px; height: 30px; border-radius: 50%; }
.brand .bm i:first-child { left: 0; background: var(--lake); }
.brand .bm i:last-child { right: 0; background: var(--brick); opacity: .85; }
.brand .bt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand .bt small { font-family: var(--font-body); font-weight: 400; font-size: .5em; color: var(--muted); letter-spacing: .02em; }
@media (max-width: 420px) { .brand { font-size: 1.18em; } .brand .bt small { display: none; } }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.hello { font-family: var(--font-display); font-weight: 600; }
.who { font-size: .8em; color: var(--muted); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
@media (max-width: 620px) { .hello, .who { display: none; } }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--lake); box-shadow: 6px 0 0 var(--brick); margin-right: 8px; flex: none; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); background: var(--surface); z-index: 31; box-shadow: 4px 0 24px rgba(0,0,0,.2); display: flex; flex-direction: column; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: 16px; gap: 4px; overflow-y: auto; transform: translateX(-105%); transition: transform .22s ease; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer .dh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.navi { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 14px 12px; font-size: 1.02em; border-radius: 10px; border: 0; background: none; font-family: var(--font-display); font-weight: 500; }
.navi:hover, .navi.on { background: var(--surface-2); }
.navi .badge { font-size: .78em; font-weight: 700; background: var(--lake-soft); color: var(--lake); padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.navi .badge.red { background: var(--bad-soft); color: var(--bad); }
.dsep { height: 1px; background: var(--line); margin: 8px 0; }
.sync { font-size: .85em; color: var(--muted); padding: 8px 12px; margin-top: auto; }
.x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.2em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-family: var(--font-display); font-weight: 600; background: var(--lake); color: var(--on-accent); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.red { background: var(--bad); }
.btn.small { padding: 7px 14px; font-size: .9em; }
.btn:disabled { opacity: .45; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--lake); font-weight: 700; padding: 6px 4px; }

/* home */
.hero { display: grid; gap: 14px; }
.today { background: var(--lake); color: #fff; border-radius: 18px; padding: 22px; display: grid; gap: 10px; }
.today .eyebrow { color: rgba(255,255,255,.85); }
.today h2 { font-size: 1.6em; }
.today .btn { background: #fff; color: #12425E; justify-self: start; }
:root[data-theme="dark"] .today { background: #1B4E6C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .today { background: #1B4E6C; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.5em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85em; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: left; min-height: 92px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .d { font-family: var(--font-display); font-weight: 600; font-size: .85em; color: var(--muted); }
.tile .t { font-size: .82em; line-height: 1.25; overflow-wrap: anywhere; }
.tile .bar { margin-top: auto; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; background: var(--good); }
.tile.done { border-color: var(--good); }
.tile.next { border: 2px solid var(--lake); }
.tile.sun { background: var(--surface-2); }
@media (max-width: 620px) { .weekgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile { min-height: 0; } .tile.sun { grid-column: 1 / -1; } }

/* day */
.dayhead { display: grid; gap: 8px; margin-bottom: 6px; }
.goals { margin: 0; padding-left: 20px; }
.steps { display: grid; gap: 10px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.step > .sh { width: 100%; display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; }
.num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--surface-2); color: var(--muted); }
.step.done .num { background: var(--good); color: var(--on-accent); }
.step.open .num { background: var(--lake); color: var(--on-accent); }
.sh .name { font-family: var(--font-display); font-weight: 600; }
.sh .meta { font-size: .85em; color: var(--muted); }
.sh .score { font-size: .85em; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
.sb { padding: 4px 16px 18px; display: grid; gap: 18px; border-top: 1px solid var(--line); }
.sb .stepdone { justify-self: end; }
.part { display: grid; gap: 10px; min-width: 0; }
.part > h3 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.part > h3 .tag { font-size: .75em; letter-spacing: .06em; text-transform: uppercase; color: var(--brick); font-weight: 700; }
.howto { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: .95em; }

/* audio player */
.player { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--lake-soft); border-radius: 999px; padding: 8px 14px 8px 8px; }
.pbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--lake); display: grid; place-items: center; }
.pbtn svg { fill: var(--on-accent); width: 18px; height: 18px; }
.track { height: 8px; border-radius: 4px; background: var(--surface); position: relative; cursor: pointer; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--lake); border-radius: 4px; width: 0; }
.ptime { font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
.speed { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: .8em; font-weight: 700; }
.pextra { display: flex; gap: 8px; align-items: center; }

/* transcript */
.script { display: grid; gap: 6px; }
.line { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: start; padding: 6px 8px; border-radius: 8px; }
.line .whos { font-family: var(--font-display); font-weight: 600; font-size: .85em; color: var(--lake); padding-top: 2px; }
.line .whos.f2 { color: var(--brick); }
.line.now { background: var(--lake-soft); }
.line .acts { display: flex; gap: 6px; }
.line .heard { grid-column: 2 / -1; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; flex: none; }
.mini svg { width: 14px; height: 14px; fill: var(--lake); }
.mini.mic svg { fill: var(--brick); }
.mini.live { background: var(--bad); border-color: var(--bad); }
.mini.live svg { fill: #fff; }
@media (max-width: 480px) { .line { grid-template-columns: 1fr auto; } .line .whos { grid-column: 1 / -1; padding: 0; } .line .heard { grid-column: 1 / -1; } }

/* exercises */
.q { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.q:last-child { border-bottom: 0; }
.q .qt { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--lake); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { font-size: .95em; border-radius: 8px; padding: 8px 12px; }
.fb.ok { background: var(--good-soft); color: var(--good); }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.fb.info { background: var(--surface-2); color: var(--ink); }
.typein { display: flex; gap: 8px; flex-wrap: wrap; }
input.gap, .typein input, .field input { font: inherit; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--ink); min-width: 0; }
.typein input { flex: 1 1 180px; }
input.gap { width: 9em; padding: 2px 8px; }
input.gap.right { border-color: var(--good); background: var(--good-soft); }
input.gap.wrong { border-color: var(--bad); background: var(--bad-soft); }
.gapline { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.blank { display: inline-block; min-width: 4em; border-bottom: 2px solid var(--muted); text-align: center; color: var(--lake); font-weight: 700; }
.result { font-family: var(--font-display); font-weight: 600; }

/* words */
.words { display: grid; gap: 10px; }
.word { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.word .w { font-family: var(--font-display); font-weight: 600; font-size: 1.08em; }
.word .m { color: var(--muted); }
.word .ex { font-style: italic; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mcol { display: grid; gap: 8px; align-content: start; min-width: 0; }
.chip { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); text-align: left; font-size: .95em; }
.chip.sel { border-color: var(--lake); background: var(--lake-soft); }
.chip.ok { border-color: var(--good); background: var(--good-soft); opacity: .6; }
.chip.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .chip.shake { animation: none; } }

/* grammar */
.rule { display: grid; gap: 8px; }
.rule ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.exs { display: grid; gap: 6px; }
.exs div { border-left: 3px solid var(--lake); padding: 2px 0 2px 12px; }
.exs .note { color: var(--muted); font-size: .9em; }
.tr { background: var(--brick-soft); border-radius: 10px; padding: 10px 14px; }
.tr b { color: var(--brick); font-family: var(--font-display); font-size: .85em; }

/* reading */
.reading { background: var(--surface-2); border-radius: 12px; padding: 18px; display: grid; gap: 10px; font-size: 1.05em; }
.reading .kind { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-family: var(--font-display); }

/* speaking */
.say { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.say .target { font-size: 1.08em; }
.say .target .ok { color: var(--good); font-weight: 700; }
.say .target .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 3px; }
.heardtxt { font-size: .92em; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); }
.rec { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.recbtn { display: inline-flex; align-items: center; gap: 10px; }
.recbtn .dotr { width: 12px; height: 12px; border-radius: 50%; background: var(--on-accent); }
.recbtn.live { background: var(--bad); }
.recbtn.live .dotr { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .recbtn.live .dotr { animation: none; } }
.takes { display: grid; gap: 8px; }
.take { display: grid; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 10px; }
.take audio { width: 100%; height: 36px; }
.starters { display: flex; flex-wrap: wrap; gap: 8px; }
.starters span { background: var(--lake-soft); border-radius: 999px; padding: 5px 12px; font-size: .95em; }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; }
.checks input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--good); flex: none; }
textarea { font: inherit; width: 100%; min-height: 160px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); color: var(--ink); resize: vertical; }
.model { background: var(--good-soft); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.bonus { background: var(--brick-soft); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.bonus ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }

/* writing check */
.submitted { background: var(--surface-2); border-radius: 12px; padding: 14px; white-space: pre-wrap; line-height: 1.8; }
.submitted mark { background: var(--warn-soft); color: inherit; border-bottom: 2px solid var(--warn); padding: 0 1px; border-radius: 2px; }
.issues { display: grid; gap: 8px; }
.issue { border-left: 4px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 8px 12px; display: grid; gap: 4px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.issue .bad { text-decoration: line-through; color: var(--bad); }
.issue .sug { color: var(--good); font-weight: 700; }
.credit { font-size: .82em; color: var(--muted); }

/* flashcards */
.flash { display: grid; gap: 14px; justify-items: center; text-align: center; }
.fcard { width: 100%; min-height: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 10px; place-content: center; box-shadow: var(--shadow); }
.fcard .big { font-family: var(--font-display); font-size: 1.6em; font-weight: 600; }
.fbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.fbtns .btn { border-radius: 12px; }
.fbtns .again { background: var(--bad); } .fbtns .good { background: var(--lake); } .fbtns .easy { background: var(--good); }

.mist { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.mist:last-child { border-bottom: 0; }
.mist .your { color: var(--bad); text-decoration: line-through; }
.mist .right { color: var(--good); font-weight: 700; }
.pill { display: inline-block; font-size: .75em; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.dots i.on { background: var(--good); border-color: var(--good); }

/* progress table */
.tablewrap { overflow-x: auto; }
table.prog { border-collapse: collapse; width: 100%; font-size: .95em; }
table.prog th, table.prog td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.prog td.n { font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.seg button.on { border-color: var(--lake); background: var(--lake-soft); color: var(--lake); }

/* notes */
.notes { display: grid; gap: 10px; }
.note { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: grid; gap: 4px; }
.note b { font-family: var(--font-display); }
.note span { color: var(--muted); font-size: .88em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .92em; }
.field input { padding: 10px 12px; }
.err { color: var(--bad); font-size: .92em; }
.okmsg { color: var(--good); font-size: .92em; }
/* welcome gate */
.gate { min-height: calc(100vh - 40px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-block: 24px; }
.gate h1 { font-size: 2.6em; letter-spacing: -.01em; }
.gate .lead { color: var(--muted); max-width: 30em; font-size: 1.05em; }
.mark { position: relative; width: 84px; height: 56px; margin-bottom: 4px; }
.mark i { position: absolute; top: 0; width: 56px; height: 56px; border-radius: 50%; }
.mark i:first-child { left: 0; background: var(--lake); }
.mark i:last-child { right: 0; background: var(--brick); opacity: .85; mix-blend-mode: multiply; }
:root[data-theme="dark"] .mark i:last-child { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark i:last-child { mix-blend-mode: screen; } }
.gatecard { width: 100%; max-width: 420px; text-align: left; margin-top: 8px; }
.btn.big { padding: 14px 20px; font-size: 1.05em; width: 100%; }
.pwrow { display: flex; gap: 8px; align-items: center; }
.pwrow input { flex: 1; min-width: 0; }
.gatelinks { justify-content: center; gap: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 40; max-width: calc(100vw - 32px); text-align: center; }
.daynav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
</style>

<script id="course-data" type="application/json">{"weeks": [{"week": 1, "title": "A new start", "days": [{"day": 1, "dayName": "Monday", "title": "Hello, neighbor!", "goals": ["I can introduce myself to a neighbor.", "I can talk about habits and things happening now.", "I can understand a short, friendly conversation."], "listening": {"title": "Boxes in the hallway", "intro": "Elif meets her new neighbor, Dan, in the hallway of her apartment building.", "speakers": {"Elif": "female", "Dan": "male"}, "lines": [{"s": "Dan", "t": "Hi there! Do you need some help with those boxes?"}, {"s": "Elif", "t": "Oh, yes, please. Thank you! They're really heavy."}, {"s": "Dan", "t": "No problem. Are you moving into 4B?"}, {"s": "Elif", "t": "Yes, I am. I'm Elif. I arrived from Turkey on Saturday."}, {"s": "Dan", "t": "Nice to meet you, Elif. I'm Dan. I live next door, in 4C."}, {"s": "Elif", "t": "Nice to meet you too, Dan."}, {"s": "Dan", "t": "Wow, what's in this box? Books?"}, {"s": "Elif", "t": "No, it's my kitchen stuff. I cook a lot."}, {"s": "Dan", "t": "Great! I usually eat sandwiches. I'm not a good cook."}, {"s": "Elif", "t": "Then you have to try my Turkish food sometime."}, {"s": "Dan", "t": "I'd love that. So, what brings you to Chicago?"}, {"s": "Elif", "t": "A new job. I'm an assistant at a small design company. I start tomorrow."}, {"s": "Dan", "t": "That's exciting! Are you nervous?"}, {"s": "Elif", "t": "A little. Right now I'm trying to unpack everything, but it's taking forever."}, {"s": "Dan", "t": "Ha! I know the feeling. What do you do in your free time?"}, {"s": "Elif", "t": "I usually go for a walk in the evening. And I read a lot."}, {"s": "Dan", "t": "There's a nice park near here. I often run there on weekends."}, {"s": "Elif", "t": "Really? Can you show me sometime?"}, {"s": "Dan", "t": "Sure. Oh, wait. Is that your phone? It's ringing."}, {"s": "Elif", "t": "Oh, it's my mom. She calls me every day!"}, {"s": "Dan", "t": "Go ahead. I'm putting the last box inside your door."}, {"s": "Elif", "t": "Thank you so much, Dan. You're very kind."}, {"s": "Dan", "t": "Anytime. Knock on my door if you need anything. Welcome to the building!"}], "mcq": [{"q": "Why does Dan start talking to Elif?", "options": ["She is carrying heavy boxes.", "She is knocking on his door.", "She is asking for directions."], "answer": 0}, {"q": "What is in the heavy box?", "options": ["Books", "Kitchen things", "Clothes"], "answer": 1}, {"q": "When does Elif start her new job?", "options": ["Today", "Next week", "Tomorrow"], "answer": 2}, {"q": "Who calls Elif at the end?", "options": ["Her manager", "Her mother", "Dan's friend"], "answer": 1}], "gaps": [{"line": 2, "answer": "moving into"}, {"line": 4, "answer": "next door"}, {"line": 8, "answer": "usually eat"}, {"line": 13, "answer": "unpack"}, {"line": 16, "answer": "on weekends"}, {"line": 19, "answer": "calls me"}]}, "vocab": [{"w": "next door", "m": "in the home right beside yours", "ex": "My best friend lives next door to my parents."}, {"w": "move into", "m": "start living in a new home", "ex": "We want to move into a bigger apartment next year."}, {"w": "unpack", "m": "take things out of a box or bag", "ex": "I always unpack my suitcase on the first night."}, {"w": "nervous", "m": "a little worried or afraid", "ex": "I always get nervous before a test."}, {"w": "free time", "m": "time when you are not working", "ex": "In my free time, I like to watch movies."}, {"w": "go for a walk", "m": "walk outside for fun or exercise", "ex": "Let's go for a walk after dinner."}, {"w": "on weekends", "m": "on Saturdays and Sundays", "ex": "My brother works on weekends, so he's always busy."}, {"w": "I know the feeling", "m": "I understand; this happens to me too", "ex": "You're tired after a long day? I know the feeling."}], "grammar": {"title": "Present simple vs present continuous", "points": ["Present simple: habits, routines and facts. I work. She works.", "Present continuous (am/is/are + -ing): actions happening now. I'm working.", "Present simple words: usually, often, every day, on weekends.", "Present continuous words: now, right now, at the moment, today."], "examples": [{"en": "She calls me every day.", "note": "a habit"}, {"en": "She's calling me right now.", "note": "happening now"}, {"en": "I live next door.", "note": "a fact"}, {"en": "I'm unpacking at the moment.", "note": "in progress now"}], "tr": "Türkçede alışkanlık için de '-iyor' deriz, ama İngilizcede present simple gerekir: I work every day.", "exercises": [{"type": "choice", "q": "Look! Dan ___ the boxes upstairs right now.", "options": ["carries", "is carrying"], "answer": 1, "why": "Right now means it is happening at this moment."}, {"type": "choice", "q": "Elif's mother ___ her every day.", "options": ["calls", "is calling"], "answer": 0, "why": "Every day shows a habit, so use present simple."}, {"type": "choice", "q": "I can't talk now. I ___ dinner.", "options": ["cook", "am cooking"], "answer": 1, "why": "The action is happening at the moment of speaking."}, {"type": "type", "q": "Sam usually ___ to work by bus. (go)", "answers": ["goes"], "why": "Habit with usually; he/she/it adds -es: goes."}, {"type": "type", "q": "Please be quiet! The baby ___. (sleep)", "answers": ["is sleeping", "'s sleeping"], "why": "It is happening now: is + sleeping."}, {"type": "type", "q": "Elif ___ coffee in the morning. She prefers tea. (not / drink)", "answers": ["doesn't drink", "does not drink"], "why": "A habit, negative: doesn't + base verb."}, {"type": "type", "q": "Listen! Someone ___ at the door. (knock)", "answers": ["is knocking", "'s knocking"], "why": "Listen! shows the action is happening now."}, {"type": "choice", "q": "We often ___ in the park on Sundays.", "options": ["run", "are running"], "answer": 0, "why": "Often and on Sundays show a routine."}]}, "reading": {"title": "Boxes everywhere", "kind": "Elif's diary", "text": "Dear diary,\n\nIt's eleven o'clock at night, and I'm sitting on the floor of my new apartment. There are boxes everywhere! I'm tired, but I'm happy.\n\nToday I met my neighbor. His name is Dan, and he lives next door. He helped me with my heavy boxes. He seems really friendly. He runs in the park on weekends. Maybe I can go with him one day.\n\nMy apartment is small, but I love it. The kitchen has a big window, and right now I'm looking at the city lights. It's also very quiet. My family's home in Turkey is always noisy. Here, I can only hear the wind.\n\nMom called again tonight. She calls me every day at the same time. \"Are you eating well?\" she asked. I laughed and said yes. Actually, I'm eating crackers for dinner right now!\n\nTomorrow is my first day at work. I'm a little nervous because I don't know anyone there. I know my manager, Maria, only from video calls.\n\nOK, I'm going to bed now. Good night!", "questions": [{"q": "Where is Elif sitting while she writes?", "options": ["On the floor", "At a table", "On her bed"], "answer": 0}, {"q": "How is her new apartment different from her family's home?", "options": ["It is bigger.", "It is quieter.", "It is noisier."], "answer": 1}, {"q": "What is Elif eating for dinner?", "options": ["Turkish food", "A sandwich", "Crackers"], "answer": 2}, {"q": "Why is Elif nervous?", "options": ["Her apartment is noisy.", "She doesn't know anyone at work.", "Her mother is sick."], "answer": 1}], "tf": [{"s": "Dan lives in the apartment next to Elif's.", "answer": true}, {"s": "Elif's mother calls her once a week.", "answer": false}, {"s": "Elif knows Maria only from video calls.", "answer": true}]}, "speaking": {"prompt": "Describe your home and your neighbors. What do you usually do at home, and what are you doing these days?", "steps": ["say where you live and who your neighbors are", "say what you usually do at home in the evening", "say something new you are doing these days"], "starters": ["I live in ...", "My neighbors are ...", "In the evening, I usually ...", "These days, I'm ..."], "model": "I live in a small apartment on the third floor. My neighbors are an older couple, and they're very kind. They often give me fruit from their garden. In the evening, I usually cook dinner and watch a show. On weekends, I clean the apartment and visit my sister. These days, I'm learning to play the guitar, so I'm practicing every night. I'm not very good yet, but I'm enjoying it. I hope my neighbors don't mind the noise!"}, "writing": {"prompt": "Write a text message to a new neighbor. Introduce yourself and invite them for coffee.", "length": "40-60 words", "checklist": ["Say who you are and where you live.", "Use the present simple for a habit (I usually ...).", "Use the present continuous for now (I'm still ...)."], "model": "Hi! I'm Ana from apartment 2A. I'm your new neighbor. I'm still unpacking, so my place is a mess! I usually have coffee at home on Sunday mornings. Would you like to come over this Sunday at ten? I make really good coffee. Let me know! Ana"}, "audio": {"listen": "audio/w1d1-listen.mp3", "listenT": [[0.3, 3.46], [3.91, 6.81], [7.26, 10.27], [10.72, 14.58], [15.03, 19.76], [20.21, 21.79], [22.24, 24.5], [24.95, 27.75], [28.2, 31.97], [32.42, 34.96], [35.41, 38.78], [39.23, 44.14], [44.59, 46.94], [47.39, 51.59], [52.04, 55.71], [56.16, 59.81], [60.26, 64.25], [64.7, 66.7], [67.15, 70.14], [70.59, 73.36], [73.81, 77.35], [77.8, 80.15], [80.6, 85.4]], "read": "audio/w1d1-read.mp3", "speak": "audio/w1d1-speak.mp3", "vocab": "audio/w1d1-vocab.mp3", "vocabT": [[0.3, 1.41, 2.01, 4.68], [5.58, 6.71, 7.31, 10.04], [10.94, 11.96, 12.56, 15.4], [16.3, 17.3, 17.9, 20.12], [21.02, 22.13, 22.73, 25.42], [26.32, 27.49, 28.09, 30.07], [30.97, 32.06, 32.66, 35.69], [36.59, 37.87, 38.47, 41.35]]}}, {"day": 2, "dayName": "Tuesday", "title": "Welcome to the team!", "goals": ["I can greet and meet new coworkers.", "I can use a, an and the correctly.", "I can describe my workplace."], "listening": {"title": "A tour of the office", "intro": "It's Elif's first morning at the design company. Her manager, Maria, shows her around and introduces Sam.", "speakers": {"Elif": "female", "Maria": "female", "Sam": "male"}, "lines": [{"s": "Maria", "t": "Elif! Welcome! It's so nice to finally meet you in person."}, {"s": "Elif", "t": "You too, Maria! Sorry, I'm a little early."}, {"s": "Maria", "t": "That's not a problem. Was the office easy to find?"}, {"s": "Elif", "t": "Yes, I took the bus. The bus stop is right outside."}, {"s": "Maria", "t": "Great. Let me show you around. This is the kitchen. There's a coffee machine and a fridge."}, {"s": "Elif", "t": "Oh, nice. Is the coffee free?"}, {"s": "Maria", "t": "Yes, it is. The cookies are free too, but they go fast!"}, {"s": "Elif", "t": "Ha! I'll remember that."}, {"s": "Maria", "t": "And this is your desk. You have a laptop and a phone. The laptop is new."}, {"s": "Elif", "t": "Wow, thank you. It's a really nice desk, and it's next to the window!"}, {"s": "Maria", "t": "Now come and meet Sam. Sam, this is Elif, our new assistant."}, {"s": "Sam", "t": "Hi, Elif! Welcome to the team. I'm a designer here."}, {"s": "Elif", "t": "Nice to meet you, Sam. What are you working on?"}, {"s": "Sam", "t": "A logo for a bakery. The owner wants an orange cake in it."}, {"s": "Elif", "t": "An orange cake? That sounds delicious."}, {"s": "Sam", "t": "It does. If you have any questions today, just ask me."}, {"s": "Elif", "t": "Thanks. Actually, I have a question already. Where's the restroom?"}, {"s": "Sam", "t": "It's at the end of the hall, on the left."}, {"s": "Maria", "t": "Elif, we have a team meeting at ten. It's in the big room."}, {"s": "Elif", "t": "OK. Do I need to bring anything?"}, {"s": "Maria", "t": "Just a notebook and a pen. And a smile!"}, {"s": "Elif", "t": "I can do that. Thank you both. I'm really happy to be here."}], "mcq": [{"q": "How does Elif get to the office?", "options": ["By bus", "By train", "On foot"], "answer": 0}, {"q": "What is special about Elif's desk?", "options": ["It is very old.", "It is next to the window.", "It is in the kitchen."], "answer": 1}, {"q": "What is Sam working on?", "options": ["A website for a hotel", "A menu for a coffee shop", "A logo for a bakery"], "answer": 2}, {"q": "What does Elif need for the meeting?", "options": ["A laptop and a phone", "A notebook and a pen", "Coffee and cookies"], "answer": 1}], "gaps": [{"line": 3, "answer": "bus stop"}, {"line": 4, "answer": "show you around"}, {"line": 8, "answer": "a laptop"}, {"line": 13, "answer": "an orange"}, {"line": 17, "answer": "at the end of"}, {"line": 18, "answer": "team meeting"}]}, "vocab": [{"w": "in person", "m": "face to face, not online", "ex": "I want to meet my online teacher in person."}, {"w": "a little early", "m": "a short time before the planned time", "ex": "We arrived a little early, so we got coffee."}, {"w": "show you around", "m": "take you to see a new place", "ex": "My cousin can show you around the city."}, {"w": "assistant", "m": "a person who helps a manager with work", "ex": "Her assistant answers the phone and plans meetings."}, {"w": "welcome to the team", "m": "a friendly hello to a new coworker", "ex": "Welcome to the team, Jack! We're happy you're here."}, {"w": "restroom", "m": "a toilet in a public place or office", "ex": "The restroom is next to the elevator."}, {"w": "at the end of the hall", "m": "in the last part of a long hallway", "ex": "My office is the last door at the end of the hall."}, {"w": "team meeting", "m": "a meeting with everyone in your work group", "ex": "We have a team meeting every Monday morning."}], "grammar": {"title": "a / an / the", "points": ["Use a before a consonant sound: a desk, a pen, a university.", "Use an before a vowel sound: an orange, an assistant, an hour.", "Use the when we both know which one: the laptop, the bus stop.", "Use a/an with jobs: She's a designer. He's an engineer."], "examples": [{"en": "I have a laptop. The laptop is new.", "note": "first time a, then the"}, {"en": "Elif is an assistant.", "note": "jobs need a/an"}, {"en": "We have an hour for lunch.", "note": "the h is silent"}, {"en": "The restroom is on the left.", "note": "we both know which one"}], "tr": "Türkçede 'Ben asistanım' deriz; İngilizcede meslekten önce 'a/an' gerekir: I am an assistant.", "exercises": [{"type": "choice", "q": "Elif is ___ assistant at a design company.", "options": ["a", "an", "the"], "answer": 1, "why": "Assistant starts with a vowel sound, so use an."}, {"type": "choice", "q": "We have a meeting at ten. ___ meeting is in the big room.", "options": ["A", "An", "The"], "answer": 2, "why": "We already know which meeting, so use the."}, {"type": "choice", "q": "We have ___ hour for lunch.", "options": ["a", "an", "the"], "answer": 1, "why": "The h in hour is silent, so use an."}, {"type": "type", "q": "Sam is ___ designer. (a / an / the)", "answers": ["a"], "why": "Use a with jobs before a consonant sound."}, {"type": "type", "q": "There's ___ umbrella by the door. Is it yours? (a / an / the)", "answers": ["an"], "why": "A new thing, and umbrella starts with a vowel sound."}, {"type": "type", "q": "I bought a cake and a pie. ___ cake was delicious. (a / an / the)", "answers": ["The", "the"], "why": "We already know which cake, so use the."}, {"type": "type", "q": "Dan wants to be ___ engineer. (a / an / the)", "answers": ["an"], "why": "A job, and engineer starts with a vowel sound."}, {"type": "choice", "q": "___ sun is very bright today.", "options": ["A", "An", "The"], "answer": 2, "why": "There is only one sun, so use the."}]}, "reading": {"title": "My first day!", "kind": "an email", "text": "Hi Deniz,\n\nI survived my first day at work! The office is small but very bright. There are only eight people, and everyone is friendly.\n\nMy manager, Maria, is a kind woman with a loud laugh. She showed me around in the morning. Then I met Sam. He's a designer, and he's working on a logo for a bakery. He helped me a lot today. He even explained the printer to me. The printer is old, and it's a little crazy!\n\nI have a desk next to the window. From my desk, I can see a tree and an old church. At ten, we had a team meeting. I didn't understand everything because people speak very fast here. But I took a lot of notes.\n\nThe best part? The kitchen! There's free coffee, and there's a big box of cookies. Sam says the cookies are usually gone by noon. Tomorrow I'm bringing some Turkish delight for everyone.\n\nI'm tired now, but I'm happy. How are you? Write soon!\n\nLove,\nElif", "questions": [{"q": "How many people work in the office?", "options": ["Six", "Eight", "Ten"], "answer": 1}, {"q": "Who explained the printer to Elif?", "options": ["Sam", "Maria", "Deniz"], "answer": 0}, {"q": "Why didn't Elif understand everything in the meeting?", "options": ["The room was noisy.", "People spoke very fast.", "The meeting was very long."], "answer": 1}, {"q": "What is Elif bringing to work tomorrow?", "options": ["Cookies", "Coffee", "Turkish delight"], "answer": 2}], "tf": [{"s": "Elif's desk is next to the window.", "answer": true}, {"s": "Elif didn't take any notes in the meeting.", "answer": false}, {"s": "The cookies usually last all day.", "answer": false}]}, "speaking": {"prompt": "Describe the place where you work or study. What is there, and who do you work or study with?", "steps": ["say where it is and what it looks like", "say what is on or near your desk", "describe one person there"], "starters": ["I work in ...", "There's a ... and an ...", "On my desk, there's ...", "One of my coworkers is ..."], "model": "I work in an office near the city center. It's a big building with a nice café on the first floor. My desk is in a quiet corner. On my desk, there's a computer, a plant and an old photo of my family. The plant is a gift from my sister. I work with a great team. My favorite coworker is an engineer named Tom. He's very funny, and he always brings snacks. The best thing about the office is the view."}, "writing": {"prompt": "Write a short email to a friend about your first day at a new job or class.", "length": "60-80 words", "checklist": ["Use a or an for new things: a desk, an office.", "Use the for things your friend already knows about.", "Say how you feel."], "model": "Hi Mia,\n\nToday was my first day at the new job! The office is in an old building downtown. I have a small desk and a new computer. The computer is really fast! My manager is a friendly woman, and she showed me around. At lunch, I ate a sandwich in the park near the office. I'm tired, but I'm happy.\n\nTalk soon,\nLena"}, "audio": {"listen": "audio/w1d2-listen.mp3", "listenT": [[0.3, 4.46], [4.91, 7.62], [8.07, 11.27], [11.72, 15.07], [15.52, 21.07], [21.52, 23.52], [23.97, 27.55], [28.0, 29.48], [29.93, 34.58], [35.03, 38.95], [39.4, 43.58], [44.03, 46.85], [47.3, 49.99], [50.44, 54.21], [54.66, 57.2], [57.65, 60.94], [61.39, 65.14], [65.59, 67.53], [67.98, 71.4], [71.85, 73.83], [74.28, 76.86], [77.31, 80.56]], "read": "audio/w1d2-read.mp3", "speak": "audio/w1d2-speak.mp3", "vocab": "audio/w1d2-vocab.mp3", "vocabT": [[0.3, 1.32, 1.92, 4.48], [5.38, 6.51, 7.11, 9.72], [10.62, 11.79, 12.39, 14.63], [15.53, 16.75, 17.35, 20.33], [21.23, 22.64, 23.24, 26.04], [26.94, 27.92, 28.52, 30.78], [31.68, 33.04, 33.64, 36.42], [37.32, 38.47, 39.07, 41.46]]}}, {"day": 3, "dayName": "Wednesday", "title": "A full cart", "goals": ["I can buy food and ask where things are.", "I can use some, any, much, many and a lot of.", "I can understand a cashier's questions."], "listening": {"title": "At the grocery store", "intro": "After work, Elif meets Dan at the grocery store. Then she pays at the checkout with Rosa, the cashier.", "speakers": {"Elif": "female", "Dan": "male", "Rosa": "female"}, "lines": [{"s": "Dan", "t": "Elif! Hi! Are you shopping for dinner?"}, {"s": "Elif", "t": "Hi, Dan! Not for tonight. I want to make you some Turkish food on Friday. Are you free?"}, {"s": "Dan", "t": "Really? I'm free, and I'm always hungry!"}, {"s": "Elif", "t": "Great. I'm making stuffed peppers. I need some peppers, some rice and a lot of onions."}, {"s": "Dan", "t": "How many onions?"}, {"s": "Elif", "t": "Five or six. And I need some ground beef."}, {"s": "Dan", "t": "How much meat do you need?"}, {"s": "Elif", "t": "Not much. About one pound."}, {"s": "Dan", "t": "OK. The meat is over there, next to the cheese."}, {"s": "Elif", "t": "Thanks. Is there any fresh mint in this store? I can't find it."}, {"s": "Dan", "t": "I don't think they have any fresh mint. But there's some dried mint near the salt."}, {"s": "Elif", "t": "Dried is fine. Do you like yogurt? We usually eat yogurt with this dish."}, {"s": "Dan", "t": "I love yogurt. I eat a lot of yogurt for breakfast."}, {"s": "Elif", "t": "Perfect! Then I'll get a big one."}, {"s": "Dan", "t": "Wow, your cart is full. That's a lot of food!"}, {"s": "Elif", "t": "I know. I don't have much food at home yet. My fridge is empty."}, {"s": "Rosa", "t": "Hi there. Did you find everything OK?"}, {"s": "Elif", "t": "Yes, thank you. Oh, wait. Do you have any bags? I forgot mine."}, {"s": "Rosa", "t": "Sure. How many do you need?"}, {"s": "Elif", "t": "Two, please. No, three. I have so many things!"}, {"s": "Rosa", "t": "Here you go. Have a nice evening!"}, {"s": "Dan", "t": "See? Shopping in a new city is easy. Now I'm excited about Friday!"}], "mcq": [{"q": "Why is Elif buying a lot of food?", "options": ["She is having a party at work.", "She is cooking for her family.", "She is cooking dinner for Dan."], "answer": 2}, {"q": "What can't Elif find in the store?", "options": ["Rice", "Fresh mint", "Yogurt"], "answer": 1}, {"q": "How does Dan feel about yogurt?", "options": ["He loves it.", "He never eats it.", "He eats it only for dinner."], "answer": 0}, {"q": "Why does Elif ask for bags?", "options": ["Her bags are broken.", "She forgot her bags.", "Dan took her bags."], "answer": 1}], "gaps": [{"line": 3, "answer": "a lot of"}, {"line": 4, "answer": "How many"}, {"line": 6, "answer": "How much"}, {"line": 10, "answer": "any fresh mint"}, {"line": 15, "answer": "much food"}, {"line": 17, "answer": "any bags"}]}, "vocab": [{"w": "free", "m": "not busy; with no plans", "ex": "Are you free on Saturday afternoon?"}, {"w": "ground beef", "m": "beef cut into very small pieces", "ex": "I need some ground beef for the burgers."}, {"w": "over there", "m": "in that place, not near us", "ex": "The bus stop is over there, across the street."}, {"w": "dried", "m": "with the water taken out", "ex": "I always keep some dried fruit in my bag."}, {"w": "cart", "m": "a big basket on wheels in a store", "ex": "This cart is too heavy to push."}, {"w": "empty", "m": "with nothing inside", "ex": "The bottle is empty. Can you buy more water?"}, {"w": "find everything", "m": "find all the things you want in a store", "ex": "Did you find everything you needed today?"}, {"w": "Here you go", "m": "said when you give something to someone", "ex": "Here you go. One coffee with milk."}], "grammar": {"title": "Countable and uncountable: some, any, much, many, a lot of", "points": ["Countable nouns have plurals: an onion, two onions. Uncountable nouns don't: rice, milk, meat.", "Use some in positive sentences. Use any in questions and negatives.", "Use many with countable nouns and much with uncountable nouns, mostly in questions and negatives.", "A lot of works with both: a lot of onions, a lot of rice."], "examples": [{"en": "I need some rice and some onions.", "note": "positive: some"}, {"en": "Do you have any bags?", "note": "question: any"}, {"en": "How much meat do you need?", "note": "uncountable: much"}, {"en": "How many onions do you need?", "note": "countable: many"}], "exercises": [{"type": "choice", "q": "How ___ apples do you want?", "options": ["much", "many"], "answer": 1, "why": "Apples are countable, so use many."}, {"type": "choice", "q": "We don't have ___ milk. Can you buy some?", "options": ["some", "any"], "answer": 1, "why": "Negative sentence, so use any."}, {"type": "choice", "q": "There isn't ___ cheese in the fridge.", "options": ["many", "much"], "answer": 1, "why": "Cheese is uncountable, so use much."}, {"type": "type", "q": "I'd like ___ water, please. (some / any)", "answers": ["some"], "why": "A polite request or positive sentence uses some."}, {"type": "type", "q": "How ___ money do you have? (much / many)", "answers": ["much"], "why": "Money is uncountable, so use much."}, {"type": "type", "q": "There are ___ people in the store today. It's very busy. (a lot of / much)", "answers": ["a lot of"], "why": "People is countable; much is only for uncountable nouns."}, {"type": "type", "q": "Sorry, I don't have ___ time today. (some / any)", "answers": ["any"], "why": "Negative sentence, so use any."}, {"type": "choice", "q": "She drinks ___ coffee every day.", "options": ["a lot of", "many"], "answer": 0, "why": "Coffee is uncountable, so many is wrong."}]}, "reading": {"title": "What can I bring?", "kind": "a text message chat", "text": "Dan: Hey, neighbor! Thanks for inviting me on Friday. Can I bring anything?\n\nElif: Hi Dan! You don't need to bring much. Maybe some bread? I forgot to buy it today.\n\nDan: Sure. How many loaves? One or two?\n\nElif: One is fine. Oh, and do you drink tea? I have a lot of Turkish tea.\n\nDan: I love tea! But I don't drink it with sugar.\n\nElif: No problem. We usually drink it with a little sugar, but you can have it without.\n\nDan: Great. Is the food very spicy? I can't eat a lot of hot pepper.\n\nElif: Not really. There's some red pepper in it, but not much. You can add more if you like.\n\nDan: Perfect. By the way, I'm making a dessert too. My grandma's apple pie!\n\nElif: Wow! Is it a big pie?\n\nDan: Very big. Maybe we can share it with some of the other neighbors.\n\nElif: Good idea. I don't know many people in the building yet.\n\nDan: Then Friday can be a small party. See you then!", "questions": [{"q": "What does Elif ask Dan to bring?", "options": ["Some bread", "Some tea", "Some sugar"], "answer": 0}, {"q": "How does Dan like his tea?", "options": ["With a lot of sugar", "Without sugar", "With milk"], "answer": 1}, {"q": "What is Dan making for Friday?", "options": ["A salad", "Bread", "An apple pie"], "answer": 2}, {"q": "Why does Elif like the idea of sharing the pie?", "options": ["She doesn't know many people in the building.", "She doesn't like apple pie.", "The pie is very small."], "answer": 0}], "tf": [{"s": "Elif forgot to buy bread today.", "answer": true}, {"s": "Elif's food is very spicy.", "answer": false}, {"s": "Elif has a lot of Turkish tea.", "answer": true}]}, "speaking": {"prompt": "What do you usually buy when you go grocery shopping? What is in your fridge right now?", "steps": ["say where and when you usually shop", "say what you buy a lot of", "say what you don't have much or many of right now"], "starters": ["I usually shop at ...", "I always buy a lot of ...", "Right now, there's some ... in my fridge.", "I don't have many ..."], "model": "I usually go grocery shopping on Saturday mornings. There's a small market near my home, and it isn't very busy early in the day. I always buy a lot of fruit and vegetables, because I eat salad every day. I don't buy much meat. Right now, there are some eggs and some cheese in my fridge, but there isn't any milk. I also don't have many vegetables left. So I need to go shopping again soon!"}, "writing": {"prompt": "Write a note for your roommate or family. Say what food you have and what you need to buy.", "length": "40-60 words", "checklist": ["Use some and any.", "Use much or many in a negative sentence.", "Use a lot of at least once."], "model": "Hi Tom,\n\nI'm going to the store after work. We have some eggs and a lot of pasta, but we don't have any milk. There isn't much coffee, and we don't have many apples. Do you need anything? Send me a message before six.\n\nThanks!\nKate"}, "audio": {"listen": "audio/w1d3-listen.mp3", "listenT": [[0.3, 2.99], [3.44, 8.96], [9.41, 12.12], [12.57, 17.82], [18.27, 19.81], [20.26, 23.01], [23.46, 25.21], [25.66, 27.45], [27.9, 30.99], [31.44, 34.88], [35.33, 40.13], [40.58, 44.99], [45.44, 49.24], [49.69, 51.61], [52.06, 55.05], [55.5, 59.44], [59.89, 62.24], [62.69, 66.34], [66.79, 68.2], [68.65, 71.51], [71.96, 73.98], [74.43, 79.15]], "read": "audio/w1d3-read.mp3", "speak": "audio/w1d3-speak.mp3", "vocab": "audio/w1d3-vocab.mp3", "vocabT": [[0.3, 1.22, 1.82, 3.93], [4.83, 5.96, 6.56, 8.84], [9.74, 10.75, 11.35, 13.93], [14.83, 15.77, 16.37, 18.84], [19.74, 20.57, 21.17, 23.03], [23.93, 24.89, 25.49, 28.35], [29.25, 30.53, 31.13, 33.52], [34.42, 35.57, 36.17, 38.43]]}}, {"day": 4, "dayName": "Thursday", "title": "Say \"Ahh\"", "goals": ["I can make an appointment by phone.", "I can explain a simple health problem.", "I can use in, on and at for time."], "listening": {"title": "A sore throat", "intro": "In the morning, Elif calls a doctor's office and talks to Linda. In the afternoon, she sees Dr. Brown.", "speakers": {"Elif": "female", "Linda": "female", "Dr. Brown": "male"}, "lines": [{"s": "Linda", "t": "Good morning, doctor's office. This is Linda. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like to make an appointment, please. I have a bad sore throat."}, {"s": "Linda", "t": "I'm sorry to hear that. Are you a new patient?"}, {"s": "Elif", "t": "Yes, I am. I just moved here."}, {"s": "Linda", "t": "OK. What's your name, please?"}, {"s": "Elif", "t": "Elif Demir."}, {"s": "Linda", "t": "Thank you. The doctor can see you on Monday at nine."}, {"s": "Elif", "t": "Monday? Is there anything sooner? It really hurts."}, {"s": "Linda", "t": "Let me check. Oh, someone just canceled. The doctor can see you today at four thirty."}, {"s": "Elif", "t": "Perfect! I'll ask my manager if I can leave at four."}, {"s": "Linda", "t": "Great. Please come in at four fifteen and fill out some forms."}, {"s": "Elif", "t": "OK. Thank you so much!"}, {"s": "Dr. Brown", "t": "Hello, Elif. I'm Doctor Brown. So, what's the problem?"}, {"s": "Elif", "t": "My throat hurts, and I feel tired. It started on Tuesday."}, {"s": "Dr. Brown", "t": "Do you have a fever?"}, {"s": "Elif", "t": "A little, at night. In the morning, I feel OK."}, {"s": "Dr. Brown", "t": "Let me look. Open your mouth and say \"Ahh.\""}, {"s": "Elif", "t": "Ahh."}, {"s": "Dr. Brown", "t": "Hmm, it's a little red. It's probably just a cold. Drink a lot of water and get some rest."}, {"s": "Elif", "t": "Can I go to work tomorrow?"}, {"s": "Dr. Brown", "t": "Yes, but get a lot of rest on the weekend. If you don't feel better in a week, call us again."}, {"s": "Elif", "t": "OK. I'm cooking for my neighbor tomorrow night. Is that OK?"}, {"s": "Dr. Brown", "t": "Sure. Just wash your hands often. And make some hot tea with honey."}, {"s": "Elif", "t": "Turkish tea with honey. That's my favorite medicine!"}], "mcq": [{"q": "Why does Elif call the doctor's office?", "options": ["She has a sore throat.", "She wants to change her appointment.", "She needs a form for work."], "answer": 0}, {"q": "When does Elif see the doctor?", "options": ["On Monday at nine", "Today at four thirty", "Tomorrow morning"], "answer": 1}, {"q": "What does the doctor think the problem is?", "options": ["A bad tooth", "An allergy", "A cold"], "answer": 2}, {"q": "What does the doctor tell Elif to do on the weekend?", "options": ["Go to work", "Get a lot of rest", "Come back to the office"], "answer": 1}], "gaps": [{"line": 1, "answer": "make an appointment"}, {"line": 6, "answer": "on Monday"}, {"line": 10, "answer": "fill out"}, {"line": 13, "answer": "on Tuesday"}, {"line": 15, "answer": "at night"}, {"line": 20, "answer": "in a week"}]}, "vocab": [{"w": "make an appointment", "m": "arrange a time to see a doctor", "ex": "I need to make an appointment with my dentist."}, {"w": "sore throat", "m": "pain in your throat, often with a cold", "ex": "I can't sing today. I have a sore throat."}, {"w": "I'm sorry to hear that", "m": "a kind reply to bad news", "ex": "You lost your phone? I'm sorry to hear that."}, {"w": "new patient", "m": "a person who visits this doctor for the first time", "ex": "As a new patient, you need to bring your ID."}, {"w": "fill out", "m": "write information on a form", "ex": "Please fill out this form with a pen."}, {"w": "fever", "m": "a body temperature that is higher than normal", "ex": "My son has a fever, so he's staying home."}, {"w": "get some rest", "m": "relax or sleep so your body feels better", "ex": "You look tired. Go home and get some rest."}, {"w": "feel better", "m": "be less sick than before", "ex": "I hope you feel better soon!"}], "grammar": {"title": "Prepositions of time: in, on, at", "points": ["at + clock times and night: at nine, at four thirty, at night.", "on + days and dates: on Monday, on Friday, on the weekend.", "in + parts of the day, months, years: in the morning, in June, in 2020.", "No preposition before today, tomorrow, yesterday, this, next or last."], "examples": [{"en": "My appointment is on Thursday at four thirty.", "note": "day: on, time: at"}, {"en": "I feel OK in the morning, but not at night.", "note": ""}, {"en": "Call us again in a week.", "note": "in = after this amount of time"}, {"en": "See you tomorrow morning!", "note": "no preposition"}], "tr": "Türkçede çoğu zaman '-de' deriz; İngilizcede saat 'at', gün 'on', ay ve yıl 'in' alır.", "exercises": [{"type": "choice", "q": "My appointment is ___ Friday.", "options": ["in", "on", "at"], "answer": 1, "why": "Use on with days of the week."}, {"type": "choice", "q": "I usually drink coffee ___ the morning.", "options": ["in", "on", "at"], "answer": 0, "why": "Use in with parts of the day."}, {"type": "choice", "q": "The store closes ___ nine o'clock", "options": ["in", "on", "at"], "answer": 2, "why": "Use at with clock times."}, {"type": "type", "q": "I can't sleep well ___ night. (in / on / at)", "answers": ["at"], "why": "We say at night, but in the morning."}, {"type": "type", "q": "Elif's birthday is ___ June. (in / on / at)", "answers": ["in"], "why": "Use in with months."}, {"type": "type", "q": "Let's meet ___ Saturday afternoon. (in / on / at)", "answers": ["on"], "why": "A specific day, even with afternoon, takes on."}, {"type": "type", "q": "Call me back ___ ten minutes. (in / on / at)", "answers": ["in"], "why": "In + time means after that amount of time."}, {"type": "choice", "q": "Is the party ___ December 5th?", "options": ["in", "on", "at"], "answer": 1, "why": "Use on with dates."}]}, "reading": {"title": "Can I leave early?", "kind": "two short emails", "text": "Hi Maria,\n\nI'm sorry, but I'm not feeling well. I have a sore throat and a low fever, and I didn't sleep much last night. I made an appointment with a doctor today at four thirty. Can I leave work at four? I'm really sorry, because it's only my first week. I can finish the client report tomorrow morning.\n\nThank you,\nElif\n\nHi Elif,\n\nOf course you can leave early! Your health is more important than any report. Please don't worry about it. You can send the report to me on Monday.\n\nIf you feel sick tomorrow, stay home. I got sick too, in my first winter here. Drink a lot of tea and rest!\n\nBy the way, Sam says your Turkish delight was amazing. The box was empty at eleven yesterday! Everyone wants to know where to buy it. Can you tell us at the team meeting on Monday?\n\nFeel better soon,\nMaria", "questions": [{"q": "Why does Elif write to Maria?", "options": ["She wants to leave work early.", "She wants a day off on Friday.", "She lost the client report."], "answer": 0}, {"q": "What time is Elif's appointment?", "options": ["At four", "At four thirty", "At eleven"], "answer": 1}, {"q": "When does Maria say Elif can send the report?", "options": ["Tonight", "At eleven", "On Monday"], "answer": 2}, {"q": "What happened to the Turkish delight?", "options": ["Nobody liked it.", "Peop mp3", "vocabT": [[0.3, 1.62, 2.22, 4.87], [5.77, 6.86, 7.46, 10.1], [11.0, 12.47, 13.07, 15.7], [16.6, 17.64, 18.24, 20.93], [21.83, 22.92, 23.52, 25.52], [26.42, 27.32, 27.92, 30.5], [31.4, 32.6, 33.2, 35.88], [36.78, 37.98, 38.58, 40.33]]}}, {"day": 5, "dayName": "Friday", "title": "Office rules", "goals": ["I can ask about rules at work.", "I can give advice with should.", "I can use can, have to and don't have to."], "listening": {"title": "Never take the last cookie", "intro": "On Friday morning, Sam answers Elif's questions about the office. Then Maria joins them.", "speakers": {"Elif": "female", "Sam": "male", "Maria": "female"}, "lines": [{"s": "Sam", "t": "Good morning, Elif! How's your throat?"}, {"s": "Elif", "t": "Much better, thanks. The doctor said it's just a cold."}, {"s": "Sam", "t": "Good. You should drink a lot of tea today."}, {"s": "Elif", "t": "Don't worry, I have five tea bags in my bag! Can I ask you some questions about the office?"}, {"s": "Sam", "t": "Sure. What do you want to know?"}, {"s": "Elif", "t": "Do I have to start at nine every day?"}, {"s": "Sam", "t": "Yes, you have to be here by nine. But on Fridays, you can leave at three."}, {"s": "Elif", "t": "Really? That's great! What about lunch? Can I eat at my desk?"}, {"s": "Sam", "t": "You can, but you shouldn't. Maria wants everyone to take a real break."}, {"s": "Elif", "t": "OK. And can I use the big printer?"}, {"s": "Sam", "t": "Yes, but you have to ask Maria for the code first."}, {"s": "Elif", "t": "Got it. Anything else?"}, {"s": "Sam", "t": "Hmm. Oh, yes. You don't have to wear formal clothes. Jeans are fine."}, {"s": "Elif", "t": "Good. I don't have many formal clothes anyway."}, {"s": "Sam", "t": "And one very important thing: you should never take the last cookie."}, {"s": "Elif", "t": "Ha! Is that a real rule?"}, {"s": "Sam", "t": "No, but everyone follows it. Trust me."}, {"s": "Maria", "t": "Good morning, you two! Elif, how are you feeling?"}, {"s": "Elif", "t": "Much
