"tr": "Biletlerimizi geçen ay aldık. Mayısta teyzemi ziyaret edeceğiz."}, {"en": "Someone is at the door. Wait, I'll open it.", "tr": "Kapıda biri var. Bekle, ben açarım."}, {"en": "Maria decided yesterday. We're going to leave at eight.", "tr": "Maria dün karar verdi. Saat sekizde yola çıkacağız."}, {"en": "You look hungry. Sit down. I'll make you a sandwich.", "tr": "Aç görünüyorsun. Otur, sana bir sandviç yapayım."}], "mistakes": [{"wrong": "We going to leave at eight.", "right": "We're going to leave at eight.", "why_tr": "'Going to' öncesinde 'am/is/are' gerekir: We are going to."}, {"wrong": "I will to bring an umbrella.", "right": "I'll bring an umbrella.", "why_tr": "'Will' sonrasında 'to' gelmez; fiil yalın kalır."}, {"wrong": "She wills call you later.", "right": "She'll call you later.", "why_tr": "'Will' hiçbir kişiyle -s almaz."}, {"wrong": "Do you will come with us?", "right": "Will you come with us?", "why_tr": "'Will' ile soru yaparken 'do' kullanılmaz; 'will' öne gelir."}], "tip_tr": "Plan önceden varsa 'going to', karar şimdi veriliyorsa 'will'. 'Dur, ben açarım' = I'll open it."}, "2-6": {"summary": "Use the present perfect with ever and never to talk about life experiences, when the exact time is not important.", "tr_summary": "Present perfect (have/has + past participle) hayat deneyimlerini anlatır; zamanın ne zaman olduğu önemli değildir. Türkçede ayrı bir zaman yok, '-di' kullanırız: 'Hiç İstanbul'a gittin mi?' = Have you ever been to Istanbul? Türkçede 'hiç gitmedim' deriz ama İngilizcede 'never' zaten olumsuzdur, fiil olumlu kalır: I've never been. Zaman belliyse (ten years ago, in 2019) past simple kullanılır.", "use": ["Life experiences, no time given: I've been to Greece.", "Questions with ever (at any time in your life): Have you ever tried baklava?", "Never = not at any time: I've never swum in a lake.", "Short answers: Yes, I have. / No, I haven't.", "With a finished time, use the past simple: I went there in 2019."], "form": [{"label": "Positive", "pattern": "I/you/we/they have ('ve); he/she/it has ('s) + past participle", "example": "I've been to Istanbul."}, {"label": "Never", "pattern": "have / has + never + past participle", "example": "Nora has never tried baklava."}, {"label": "Question", "pattern": "Have / Has + subject + ever + past participle?", "example": "Have you ever seen snow?"}, {"label": "Short answer", "pattern": "Yes, + subject + have/has. / No, + subject + haven't/hasn't.", "example": "Yes, I have. No, she hasn't."}], "examples": [{"en": "Have you ever been to Turkey?", "tr": "Hiç Türkiye'ye gittin mi?"}, {"en": "Nora has never tried baklava.", "tr": "Nora hiç baklava denemedi."}, {"en": "I've been to Istanbul. I went there ten years ago.", "tr": "İstanbul'u gördüm. Oraya on yıl önce gittim."}, {"en": "Have you ever seen snow? Yes, I have.", "tr": "Hiç kar gördün mü? Evet, gördüm."}, {"en": "I've never swum in a lake.", "tr": "Hiç gölde yüzmedim."}, {"en": "Have you ever tried Turkish tea?", "tr": "Hiç Türk çayı denedin mi?"}, {"en": "My parents have never flown on a plane.", "tr": "Annemle babam hiç uçağa binmedi."}, {"en": "Dan has been to Istanbul, but Nora hasn't.", "tr": "Dan İstanbul'a gitti ama Nora gitmedi."}], "mistakes": [{"wrong": "I haven't never been to Canada.", "right": "I've never been to Canada.", "why_tr": "Türkçede 'hiç gitmedim' deriz, ama 'never' zaten olumsuzdur; fiili olumsuz yapmayın."}, {"wrong": "Have you ever ate sushi?", "right": "Have you ever eaten sushi?", "why_tr": "'Have' sonrasında past participle gelir: eat → ate → eaten."}, {"wrong": "I have been to Greece in 2019.", "right": "I went to Greece in 2019.", "why_tr": "'In 2019' belli, bitmiş bir zamandır; past simple kullanılır."}, {"wrong": "She have never tried baklava.", "right": "She has never tried baklava.", "why_tr": "He/she/it ile 'have' değil 'has' kullanılır."}], "tip_tr": "'Hiç ... mı?' = Have you ever...? 'Never' tek başına olumsuzdur; 'haven't never' demeyin."}, "3-1": {"summary": "Use the present perfect with for and since for something that started in the past and is still true now.", "tr_summary": "Türkçede şimdiki zamanla söylediğimiz \"İki yıldır burada yaşıyorum\" gibi cümleler için İngilizcede present perfect kullanılır: I've lived here for two years. Süre (iki hafta, üç yıl) söylüyorsanız for, başlangıç noktası (pazartesi, 2020, taşındığımdan beri) söylüyorsanız since kullanın. Kabaca \"iki yıldır\" for'a, \"pazartesiden beri\" since'e karşılık gelir.", "use": ["Something started in the past and is still true now.", "for + a period of time: for two weeks, for a long time.", "since + a point in time: since Monday, since 2020.", "since + a past action: since I moved here.", "Ask about the length of time with How long...?"], "form": [{"label": "Positive", "pattern": "subject + have/has + past participle + for/since ...", "example": "I've lived in Chicago for two weeks."}, {"label": "Negative", "pattern": "subject + haven't/hasn't + past participle + for/since ...", "example": "She hasn't exercised since she moved."}, {"label": "Question", "pattern": "How long + have/has + subject + past participle?", "example": "How long have you worked here?"}, {"label": "since + action", "pattern": "... since + subject + past simple", "example": "Sam has played basketball since he was a kid."}], "examples": [{"en": "I've lived in Chicago for two weeks.", "tr": "İki haftadır Chicago'da yaşıyorum."}, {"en": "Dan has been a member of the gym for three years.", "tr": "Dan üç yıldır spor salonuna üye."}, {"en": "I haven't exercised much since I moved here.", "tr": "Buraya taşındığımdan beri pek spor yapmadım."}, {"en": "My back has hurt for about a week.", "tr": "Yaklaşık bir haftadır sırtım ağrıyor."}, {"en": "We've known each other since 2019.", "tr": "2019'dan beri birbirimizi tanıyoruz."}, {"en": "How long have you worked here?", "tr": "Ne zamandır burada çalışıyorsun?"}, {"en": "She has had this car for a long time.", "tr": "Bu araba uzun zamandır onda."}, {"en": "I haven't seen my parents since August.", "tr": "Ağustostan beri annemle babamı görmedim."}], "mistakes": [{"wrong": "I live in Chicago for two weeks.", "right": "I've lived in Chicago for two weeks.", "why_tr": "Türkçede \"yaşıyorum\" deriz ama geçmişte başlayıp hâlâ süren durum için İngilizcede present perfect gerekir."}, {"wrong": "I've worked here since three years.", "right": "I've worked here for three years.", "why_tr": "Üç yıl bir süredir; süre için for kullanılır."}, {"wrong": "I've lived here for 2020.", "right": "I've lived here since 2020.", "why_tr": "2020 bir başlangıç noktasıdır; başlangıç için since kullanılır."}, {"wrong": "How long do you live here?", "right": "How long have you lived here?", "why_tr": "\"Ne zamandır?\" sorusunda present simple değil, present perfect kullanılır."}], "tip_tr": "Süre ise for (for two weeks), başlangıç ise since (since Monday). \"-den beri\" diyebiliyorsan since kullan."}, "3-2": {"summary": "Use can, could and would you mind to ask people to do things politely, and can I / could I to ask for permission.", "tr_summary": "Birinden bir şey isterken Can you...? samimi, Could you...? daha kibar bir sorudur. Would you mind + -ing çok kibardır; kelime anlamı \"Sakıncası var mı?\" demektir. Bu yüzden kabul ederken No, not at all (Hayır, hiç sakıncası yok) denir. İzin istemek için Can I...? veya Could I...? kullanılır; Türkçedeki \"...-ebilir miyim?\" gibi.", "use": ["Can you...? with friends and family: friendly and informal.", "Could you...? with people you don't know well, at work or in a shop.", "Would you mind + -ing? when you want to be very polite.", "Can I...? / Could I...? to ask for permission.", "Say No, not at all to agree to Would you mind...?"], "form": [{"label": "Request", "pattern": "Can / Could + you + base verb ...?", "example": "Could you send me a text, please?"}, {"label": "Very polite request", "pattern": "Would you mind + verb-ing ...?", "example": "Would you mind spelling your name?"}, {"label": "Permission", "pattern": "Can / Could + I + base verb ...?", "example": "Could I use your Wi-Fi?"}, {"label": "Answers", "pattern": "Sure. / Of course. / No, not at all. (to Would you mind)", "example": "A: Would you mind waiting? B: No, not at all."}], "examples": [{"en": "Can you help me with this box?", "tr": "Bu kutu için bana yardım eder misin?"}, {"en": "Could you send me the password, please?", "tr": "Şifreyi bana gönderebilir misin, lütfen?"}, {"en": "Could I use your Wi-Fi for a few minutes?", "tr": "Birkaç dakika Wi-Fi'ını kullanabilir miyim?"}, {"en": "Would you mind sending it in a text?", "tr": "Zahmet olmazsa mesajla gönderir misin?"}, {"en": "Can I ask you a favor?", "tr": "Senden bir ricam olabilir mi?"}, {"en": "Could you speak more slowly, please?", "tr": "Biraz daha yavaş konuşabilir misiniz, lütfen?"}, {"en": "Would you mind waiting a minute?", "tr": "Bir dakika bekler misiniz, rica etsem?"}, {"en": "A: Would you mind closing the door? B: No, not at all.", "tr": "A: Kapıyı kapatır mısınız, rica etsem? B: Tabii, hiç sorun değil."}], "mistakes": [{"wrong": "Would you mind to wait a minute?", "right": "Would you mind waiting a minute?", "why_tr": "Mind'dan sonra fiil to almaz, -ing alır."}, {"wrong": "A: Would you mind helping me? B: Yes, of course.", "right": "A: Would you mind helping me? B: No, not at all.", "why_tr": "Soru \"Sakıncası var mı?\" demektir; Yes derseniz \"Evet, sakıncası var\" anlamına gelir."}, {"wrong": "Could you to send me the file?", "right": "Could you send me the file?", "why_tr": "Can ve could'dan sonra to gelmez, yalın fiil gelir."}, {"wrong": "Would I use your phone?", "right": "Could I use your phone?", "why_tr": "İzin isterken Can I veya Could I kullanılır, Would I kullanılmaz."}], "tip_tr": "Would you mind = \"Sakıncası var mı?\" Kabul ederken \"No, not at all\" de: \"Hayır, hiç sakıncası yok.\""}, "3-3": {"summary": "Use imperatives to give instructions, like in a recipe. Use sequence words to put the steps in order.", "tr_summary": "Emir cümlesinde özne yoktur; fiilin yalın hâliyle başlarız: Chop the onion (Soğanı doğra). Olumsuz için başa Don't koyarız: Don't touch the pan (Tavaya dokunma). Türkçede olumsuzluk eki (-me/-ma) fiile eklenir, İngilizcede ise fiil değişmez, önüne sadece Don't gelir. Adımları sıralamak için first (önce), then (sonra), next (ardından), after that (ondan sonra) ve finally (son olarak) kullanılır.", "use": ["Recipes and instructions: Add the eggs.", "Directions and advice: Take the bus. Speak slowly.", "Warnings: Don't touch the pan!", "Put steps in order with first, then, next, after that, finally."], "form": [{"label": "Positive", "pattern": "base verb + ...", "example": "Chop the onion."}, {"label": "Negative", "pattern": "Don't + base verb + ...", "example": "Don't use high heat."}, {"label": "Polite", "pattern": "Please + base verb + ...", "example": "Please wash your hands."}, {"label": "Steps in order", "pattern": "First, ... Then ... Next, ... After that, ... Finally, ...", "example": "First, wash the peppers. Then cut them."}], "examples": [{"en": "First, wash your hands.", "tr": "Önce ellerini yıka."}, {"en": "Cut the onion into small pieces.", "tr": "Soğanı küçük küçük doğra."}, {"en": "Don't use high heat.", "tr": "Yüksek ateş kullanma."}, {"en": "Then add the tomatoes and some salt.", "tr": "Sonra domatesleri ve biraz tuz ekle."}, {"en": "After that, cook them for five minutes.", "tr": "Ondan sonra beş dakika pişir."}, {"en": "Finally, break the eggs into the pan.", "tr": "Son olarak yumurtaları tavaya kır."}, {"en": "Please turn off your phone.", "tr": "Lütfen telefonunuzu kapatın."}, {"en": "Don't forget your keys!", "tr": "Anahtarlarını unutma!"}], "mistakes": [{"wrong": "No touch the pan. It's hot!", "right": "Don't touch the pan. It's hot!", "why_tr": "Olumsuz emirde No veya Not değil, Don't kullanılır."}, {"wrong": "Don't to forget your keys.", "right": "Don't forget your keys.", "why_tr": "Don't'tan sonra to gelmez, yalın fiil gelir."}, {"wrong": "Adds the eggs.", "right": "Add the eggs.", "why_tr": "Emir cümlesinde fiil hiç ek almaz; -s eklenmez."}, {"wrong": "At last, add some salt.", "right": "Finally, add some salt.", "why_tr": "Son adım için finally kullanılır; at last \"uzun beklemeden sonra nihayet\" demektir."}], "tip_tr": "Emir: fiille başla, özne yok (Chop!). Yasak: başına Don't ekle (Don't touch!). Sıra: first, then, next, after that, finally."}, "3-4": {"summary": "Use the past continuous for a longer action in progress in the past, and the past simple for a short action that happened during it.", "tr_summary": "Past continuous (was/were + -ing), Türkçedeki \"-iyordu\" gibidir: Eve yürüyordum = I was walking home. Past simple ise \"-di\" gibi kısa ve bitmiş bir olayı anlatır: Telefon çaldı = The phone rang. Uzun bir eylemin ortasında kısa bir olay olursa, uzun eylem past continuous, kısa olay past simple olur. When genelde kısa olaydan önce, while ise uzun eylemden önce gelir.", "use": ["An action in progress at a time in the past: at eight last night.", "A long action and a short action that happens in the middle of it.", "long action + when + short action.", "While + long action, short action.", "Describing a scene: Mom was sitting in the kitchen."], "form": [{"label": "Positive", "pattern": "I/he/she/it + was + verb-ing; you/we/they + were + verb-ing", "example": "Dad was working in the garden."}, {"label": "Negative", "pattern": "wasn't / weren't + verb-ing", "example": "We weren't watching TV."}, {"label": "Question", "pattern": "(What) + was/were + subject + verb-ing?", "example": "What were you doing at eight last night?"}, {"label": "with when", "pattern": "past continuous + when + past simple", "example": "I was walking home when I smelled fresh bread."}, {"label": "with while", "pattern": "While + past continuous, past simple", "example": "While I was cooking, he ate the bread."}], "examples": [{"en": "I was walking home when I smelled fresh bread.", "tr": "Eve yürürken taze ekmek kokusu aldım."}, {"en": "My phone rang while I was doing yoga.", "tr": "Ben yoga yaparken telefonum çaldı."}, {"en": "Mom was sitting in the kitchen, and Dad was working in the garden.", "tr": "Annem mutfakta oturuyordu, babam da bahçede çalışıyordu."}, {"en": "What were you doing at eight last night?", "tr": "Dün akşam saat sekizde ne yapıyordun?"}, {"en": "While I was cooking, Dan ate all the bread.", "tr": "Ben yemek yaparken Dan bütün ekmeği yedi."}, {"en": "It was raining when I left the office.", "tr": "Ofisten çıktığımda yağmur yağıyordu."}, {"en": "We weren't watching TV when you called.", "tr": "Sen aradığında televizyon izlemiyorduk."}, {"en": "Elif was waiting for the bus when she saw Sam.", "tr": "Elif otobüs beklerken Sam'i gördü."}], "mistakes": [{"wrong": "I was walk home when it started to rain.", "right": "I was walking home when it started to rain.", "why_tr": "Was/were'den sonra fiil -ing alır."}, {"wrong": "They was talking when I arrived.", "right": "They were talking when I arrived.", "why_tr": "They, we ve you ile was değil were kullanılır."}, {"wrong": "What did you doing at eight?", "right": "What were you doing at eight?", "why_tr": "Past continuous sorusu did ile değil, was/were ile yapılır."}, {"wrong": "I am walking home yesterday when I saw him.", "right": "I was walking home yesterday when I saw him.", "why_tr": "Geçmişte devam eden eylem için am değil was kullanılır."}], "tip_tr": "\"-iyordu\" = was/were + -ing (uzun eylem). \"-di\" = past simple (kısa olay). While uzun eylemle, when genelde kısa olayla gelir."}, "3-5": {"summary": "Use must for things that are necessary, mustn't for things that are not allowed, and don't have to for things that are not necessary.", "tr_summary": "Must \"gerekli, çok önemli\" demektir: You must be on time (Zamanında gelmelisin). Mustn't \"yapma, yasak\" demektir: You mustn't park here (Buraya park etmemelisin). Don't have to ise \"zorunda değilsin, ama istersen yapabilirsin\" anlamına gelir. Türkçede \"-memelisin\" ile \"zorunda değilsin\" çok farklıdır; İngilizcede de mustn't ile don't have to aynı şey değildir. Amerikalılar konuşurken must yerine çoğu zaman have to, mustn't yerine can't der.", "use": ["must: it's necessary or very important.", "mustn't: don't do it; it's not allowed.", "don't have to: it's not necessary, but you can if you want.", "he/she/it: doesn't have to.", "In American English, people often say have to and can't."], "form": [{"label": "Necessary", "pattern": "subject + must + base verb", "example": "You must finish in five minutes."}, {"label": "Not allowed", "pattern": "subject + mustn't + base verb", "example": "You mustn't show the logo."}, {"label": "Not necessary", "pattern": "subject + don't/doesn't have to + base verb", "example": "She doesn't have to work on Saturday."}, {"label": "American English", "pattern": "have to (= must), can't (= mustn't)", "example": "You can't smoke here."}], "examples": [{"en": "You must be on time.", "tr": "Zamanında gelmelisin."}, {"en": "I must charge my laptop before the meeting.", "tr": "Toplantıdan önce bilgisayarımı şarj etmeliyim."}, {"en": "You mustn't show the logo.", "tr": "Logoyu göstermemelisin."}, {"en": "You mustn't park here.", "tr": "Buraya park etmek yasak."}, {"en": "You don't have to use slides.", "tr": "Slayt kullanmak zorunda değilsin."}, {"en": "She doesn't have to work on Saturday.", "tr": "Cumartesi çalışmak zorunda değil."}, {"en": "I don't have to wear formal clothes. My blue shirt is fine.", "tr": "Resmi kıyafet giymek zorunda değilim. Mavi gömleğim yeterli."}, {"en": "You can't smoke here.", "tr": "Burada sigara içemezsin."}], "mistakes": [{"wrong": "You don't have to smoke here. It's not allowed.", "right": "You mustn't smoke here. It's not allowed.", "why_tr": "Yasak için mustn't kullanılır; don't have to sadece \"gerekli değil\" demektir."}, {"wrong": "You must to be on time.", "right": "You must be on time.", "why_tr": "Must'tan sonra to gelmez, yalın fiil gelir."}, {"wrong": "She don't have to work today.", "right": "She doesn't have to work today.", "why_tr": "He, she, it ile doesn't have to kullanılır."}, {"wrong": "Tomorrow is Sunday, so I mustn't get up early.", "right": "Tomorrow is Sunday, so I don't have to get up early.", "why_tr": "Erken kalkmak yasak değil, sadece gerekli değil; bu yüzden don't have to."}], "tip_tr": "Mustn't = yasak, yapma! Don't have to = zorunda değilsin, istersen yap. İkisini karıştırma!"}, "3-6": {"summary": "Use too when something is more than you want or need. Use enough when it is as much as you need.", "tr_summary": "Too + sıfat \"fazla, gereğinden çok\" demektir ve genelde bir sorun olduğunu gösterir: too expensive (fazla pahalı, alamam). Enough \"yeterli, yeterince\" demektir; sıfattan sonra (big enough), isimden önce (enough money) gelir. Türkçede \"yeterince büyük\" deriz ama İngilizcede sıra terstir: big enough. Kişi için for, eylem için to + fiil eklenir: too heavy for him, old enough to drive.", "use": ["too + adjective: more than you want; there is a problem.", "adjective + enough: as much as you need.", "enough + noun: enough money, enough apples.", "not ... enough: less than you need.", "Add for + person or to + verb: too heavy for me, old enough to drive."], "form": [{"label": "too", "pattern": "too + adjective (+ for + person)", "example": "This pumpkin is too heavy for me."}, {"label": "too + to", "pattern": "too + adjective + to + verb", "example": "It's too cold to sit outside."}, {"label": "adjective + enough", "pattern": "(not) + adjective + enough (+ to + verb)", "example": "He's strong enough to carry it."}, {"label": "enough + noun", "pattern": "(not) enough + noun", "example": "Do we have enough apples?"}], "examples": [{"en": "This pumpkin is too heavy for me.", "tr": "Bu balkabağı benim için fazla ağır."}, {"en": "The honey was a little too expensive.", "tr": "Bal biraz fazla pahalıydı."}, {"en": "My kitchen isn't big enough for two people.", "tr": "Mutfağım iki kişi için yeterince büyük değil."}, {"en": "Do we have enough apples for the pie?", "tr": "Turta için yeterince elmamız var mı?"}, {"en": "He's strong enough to carry it.", "tr": "Onu taşıyacak kadar güçlü."}, {"en": "It's too cold to sit outside.", "tr": "Dışarıda oturmak için hava çok soğuk."}, {"en": "I don't have enough time today.", "tr": "Bugün yeterince zamanım yok."}, {"en": "She isn't old enough to drive.", "tr": "Araba kullanacak yaşta değil."}], "mistakes": [{"wrong": "This coat is enough big.", "right": "This coat is big enough.", "why_tr": "Enough sıfattan sonra gelir."}, {"wrong": "We don't have money enough.", "right": "We don't have enough money.", "why_tr": "Enough isimden önce gelir."}, {"wrong": "The market was too nice!", "right": "The market was very nice!", "why_tr": "Too olumsuzdur (fazla, sorun var); sadece \"çok\" demek için very kullanılır."}, {"wrong": "The box is too heavy that I can't carry it.", "right": "The box is too heavy to carry.", "why_tr": "Too ile that kullanılmaz; too + sıfat + to + fiil kullanılır."}], "tip_tr": "Türkçedeki \"çok\" iki şeydir: very (sorun yok) ve too (fazla, sorun var). Enough sıfattan sonra gelir: big enough."}, "4-1": {"summary": "Use will ('ll) + base verb for promises, offers and decisions you make at the moment of speaking.", "tr_summary": "Will (kısaca 'll) söz verirken, yardım teklif ederken ve o anda bir karar verirken kullanılır. Türkçede bunları çoğu zaman geniş zamanla ya da \"-eyim\" ile söyleriz: Seni ararım (I'll call you), Ben taşırım (I'll carry it), Pencereyi kapatayım (I'll close the window). Will'den sonra fiil yalın hâldedir ve hiç değişmez. Olumsuzu won't'tur: Kimseye söylemem (I won't tell anyone).", "use": ["Promises: I'll call you tonight.", "Offers of help: I'll carry it.", "Decisions you make now, at the moment of speaking.", "won't for promises not to do something: I won't be late."], "form": [{"label": "Positive", "pattern": "subject + will ('ll) + base verb", "example": "I'll call you tonight."}, {"label": "Negative", "pattern": "subject + won't (will not) + base verb", "example": "I won't tell anyone."}, {"label": "Question", "pattern": "Will + subject + base verb?", "example": "Will you call me after work?"}], "examples": [{"en": "I'll call you tonight. I promise.", "tr": "Bu akşam seni ararım, söz."}, {"en": "That bag looks heavy. I'll carry it.", "tr": "Bu çanta ağır görünüyor. Ben taşırım."}, {"en": "I'm cold. I'll close the window.", "tr": "Üşüdüm. Pencereyi kapatayım."}, {"en": "The blue one? OK, I'll take it.", "tr": "Mavi olan mı? Tamam, onu alayım."}, {"en": "Don't worry. I won't be late.", "tr": "Merak etme, geç kalmam."}, {"en": "I'll share my ideas in meetings more often.", "tr": "Toplantılarda fikirlerimi daha sık paylaşacağım."}, {"en": "You look busy. I'll help you.", "tr": "Meşgul görünüyorsun. Sana yardım edeyim."}, {"en": "I won't tell anyone your secret.", "tr": "Sırrını kimseye söylemem."}], "mistakes": [{"wrong": "I will to call you tomorrow.", "right": "I'll call you tomorrow.", "why_tr": "Will'den sonra to gelmez, yalın fiil gelir."}, {"wrong": "The phone is ringing. I answer it.", "right": "The phone is ringing. I'll answer it.", "why_tr": "Türkçede \"Ben açarım\" deriz ama o anda verilen karar için İngilizcede will gerekir."}, {"wrong": "I promise I don't tell anyone.", "right": "I promise I won't tell anyone.", "why_tr": "Gelecek için verilen sözde don't değil won't kullanılır."}, {"wrong": "She'll calls you later.", "right": "She'll call you later.", "why_tr": "Will'den sonra fiil -s almaz."}], "tip_tr": "Türkçede geniş zamanla verdiğin sözler ve teklifler (Ararım, Taşırım) İngilizcede genelde I'll olur: I'll call, I'll carry."}, "4-2": {"summary": "Use who, which and that to add information about a person or a thing and say which one you mean.", "tr_summary": "İngilizcede bir ismi açıklamak için isimden sonra who, which veya that ile başlayan bir cümle ekleriz. Türkçede ise açıklama isimden önce gelir ve \"-en/-an\", \"-dığı/-diği\" gibi eklerle yapılır: dükkânı olan kadın = the woman who owns the shop. İnsanlar için who, şeyler için which, ikisi için de that kullanılır. Bu cümlede nesne tekrar edilmez: the photos that she sent (them eklenmez).", "use": ["Say which person or thing you mean.", "who for people: the woman who owns the shop.", "which for things: the posters which we're designing.", "that for people and things.", "Join two short sentences into one."], "form": [{"label": "People", "pattern": "noun + who + verb ...", "example": "Ms. Carter is the woman who owns the flower shop."}, {"label": "Things", "pattern": "noun + which + verb ...", "example": "Clients like emails which are short."}, {"label": "People or things", "pattern": "noun + that + verb ...", "example": "He's the man that prints our posters."}, {"label": "Object", "pattern": "noun + that/which/who + subject + verb (no it/them)", "example": "This is the file that I need."}], "examples": [{"en": "Ms. Carter is the woman who owns the flower shop.", "tr": "Ms. Carter, çiçekçi dükkânı olan kadın."}, {"en": "Elif is the new assistant who works with Sam.", "tr": "Elif, Sam'le çalışan yeni asistan."}, {"en": "Clients like emails which are short.", "tr": "Müşteriler kısa e-postaları sever."}, {"en": "This is the file that I need.", "tr": "İhtiyacım olan dosya bu."}, {"en": "He's the man that prints our posters.", "tr": "Afişlerimizi basan adam o."}, {"en": "Could you send us the photos that you want on the posters?", "tr": "Afişlerde istediğiniz fotoğrafları bize gönderebilir misiniz?"}, {"en": "I lost the keys which you gave me.", "tr": "Bana verdiğin anahtarları kaybettim."}, {"en": "Is green still the color that you like best?", "tr": "En sevdiğiniz renk hâlâ yeşil mi?"}], "mistakes": [{"wrong": "The man which lives next door is very funny.", "right": "The man who lives next door is very funny.", "why_tr": "İnsanlar için which kullanılmaz; who veya that kullanılır."}, {"wrong": "These are the photos that she sent them.", "right": "These are the photos that she sent.", "why_tr": "That zaten fotoğrafları gösterir; them ile nesneyi tekrar etme."}, {"wrong": "I have a friend lives in Izmir.", "right": "I have a friend who lives in Izmir.", "why_tr": "Bu cümlede who/that atlanamaz, çünkü fiilin öznesidir."}, {"wrong": "The shop what sells flowers is closed.", "right": "The shop that sells flowers is closed.", "why_tr": "Bu yapıda what kullanılmaz; that veya which kullanılır."}], "tip_tr": "Türkçede açıklama önce gelir (dükkânı olan kadın), İngilizcede sonra: the woman who owns the shop. İnsan = who, şey = which."}, "4-3": {"summary": "Use reported speech with said and told to tell someone what another person said.", "tr_summary": "Birinin sözlerini aktarırken said veya told kullanırız. Told'dan sonra mutlaka kişi gelir (told me, told Sam); said'den sonra doğrudan kişi gelmez. Türkçede aktarırken genelde zamanı değiştirmeyiz (\"Yorgunum\" dedi), ama İngilizcede fiil bir adım geçmişe kayar: is → was, like → liked, can → could, will → would. Zamirler de değişir: \"I love it.\" → She said she loved it.", "use": ["Tell someone what another person said.", "said without a person: She said (that) ...", "told + a person: She told me (that) ...", "Move the verb one step back: is → was, can → could, will → would.", "Change the pronouns: I → she, my → her."], "form": [{"label": "said", "pattern": "subject + said (that) + subject + verb (past)", "example": "She said (that) the photo was dark."}, {"label": "told", "pattern": "subject + told + person + (that) + subject + verb (past)", "example": "She told me (that) the photo was dark."}, {"label": "Tense change", "pattern": "is/am → was, are → were, like → liked, can → could, will → would", "example": "\"I can help.\" → He said he could help."}, {"label": "Pronoun change", "pattern": "I → he/she, my → his/her, you → me", "example": "\"I love your colors.\" → She told him she loved his colors."}], "examples": [{"en": "\"The photo is too dark.\" → I said the photo was too dark.", "tr": "\"Fotoğraf çok karanlık.\" → Fotoğrafın çok karanlık olduğunu söyledim."}, {"en": "She told me that she was tired.", "tr": "Bana yorgun olduğunu söyledi."}, {"en": "\"I love your colors.\" → She told him she loved his colors.", "tr": "\"Renklerini çok seviyorum.\" → Ona renklerini çok sevdiğini söyledi."}, {"en": "\"I can help.\" → He said he could help.", "tr": "\"Yardım edebilirim.\" → Yardım edebileceğini söyledi."}, {"en": "\"I'll call you.\" → She told me she would call me.", "tr": "\"Seni ararım.\" → Beni arayacağını söyledi."}, {"en": "\"We're late.\" → They said they were late.", "tr": "\"Geç kaldık.\" → Geç kaldıklarını söylediler."}, {"en": "\"I like the posters.\" → Ms. Carter said she liked the posters.", "tr": "\"Afişleri beğendim.\" → Ms. Carter afişleri beğendiğini söyledi."}, {"en": "Dan told us he was hungry.", "tr": "Dan bize aç olduğunu söyledi."}], "mistakes": [{"wrong": "She said me that she was tired.", "right": "She told me that she was tired.", "why_tr": "Said'den sonra doğrudan kişi gelmez; kişi varsa told kullanılır."}, {"wrong": "He told that the bus was late.", "right": "He said that the bus was late.", "why_tr": "Told'dan sonra mutlaka bir kişi gelir (told me, told us)."}, {"wrong": "She told to me that she was busy.", "right": "She told me that she was busy.", "why_tr": "Told'dan sonra to gelmez: told me."}, {"wrong": "\"I love it.\" → She said I loved it.", "right": "\"I love it.\" → She said she loved it.", "why_tr": "Zamir değişmeli: konuşan kişi o, bu yüzden I yerine she gelir."}], "tip_tr": "Told + kişi (told me), said + kişi yok (said that). Aktarırken fiili bir adım geçmişe kaydır: is → was."}, "4-4": {"summary": "Use would like and would rather to say what you want or prefer politely. Use a few and a little to talk about small amounts.", "tr_summary": "Would like (I'd like) \"istiyorum\"un daha kibar hâlidir; sipariş verirken veya bir şey teklif ederken kullanılır: Would you like some coffee? (Kahve ister misin?). Would rather (I'd rather) \"tercih ederim\" demektir ve ardından to'suz, yalın fiil gelir: I'd rather stay (Kalmayı tercih ederim). A few sayılabilen çoğul isimlerle (birkaç), a little sayılamayan isimlerle (biraz) kullanılır: a few cookies (birkaç kurabiye), a little sugar (biraz şeker).", "use": ["Order or ask for something politely: I'd like a sandwich.", "Offer something: Would you like some coffee?", "Say what you prefer: I'd rather stay here.", "a few + plural countable nouns: a few days.", "a little + uncountable nouns: a little time."], "form": [{"label": "would like", "pattern": "I'd like + noun / to + verb", "example": "I'd like a chicken sandwich, please."}, {"label": "Offer", "pattern": "Would you like + noun / to + verb?", "example": "Would you like some chips?"}, {"label": "would rather", "pattern": "I'd rather (not) + base verb", "example": "I'd rather not go out tonight."}, {"label": "a few", "pattern": "a few + plural noun", "example": "a few bottles, a few days"}, {"label": "a little", "pattern": "a little + uncountable noun", "example": "a little fruit, a little time"}], "examples": [{"en": "I'd like a chicken sandwich, please.", "tr": "Bir tavuklu sandviç alabilir miyim, lütfen?"}, {"en": "Would you like some coffee?", "tr": "Kahve ister misin?"}, {"en": "I'd like to order lunch for the team.", "tr": "Ekip için öğle yemeği sipariş etmek istiyorum."}, {"en": "Would you rather walk or take the bus?", "tr": "Yürümeyi mi tercih edersin, otobüse binmeyi mi?"}, {"en": "I'd rather not go out tonight.", "tr": "Bu akşam dışarı çıkmamayı tercih ederim."}, {"en": "There are a few sandwiches in the fridge.", "tr": "Buzdolabında birkaç sandviç var."}, {"en": "There's a little fruit too.", "tr": "Biraz da meyve var."}, {"en": "Can I have a little sugar and a few cookies?", "tr": "Biraz şeker ve birkaç kurabiye alabilir miyim?"}], "mistakes": [{"wrong": "I'd rather to stay at home.", "right": "I'd rather stay at home.", "why_tr": "Would rather'dan sonra to gelmez, yalın fiil gelir."}, {"wrong": "I would like eat a sandwich.", "right": "I'd like to eat a sandwich.", "why_tr": "Would like'tan sonra fiil gelirse to gerekir."}, {"wrong": "Can I have a few water?", "right": "Can I have a little water?", "why_tr": "Water sayılamaz; sayılamayan isimlerle a little kullanılır."}, {"wrong": "We need a little chairs.", "right": "We need a few chairs.", "why_tr": "Chairs sayılabilir ve çoğul; bu yüzden a few kullanılır."}], "tip_tr": "Sayabiliyorsan a few (a few cookies), sayamıyorsan a little (a little sugar). I'd rather + yalın fiil, to yok!"}, "4-5": {"summary": "Use the present continuous (am/is/are + -ing) to talk about fixed plans for the future.", "tr_summary": "Am/is/are + -ing sadece şu an olanlar için değil, kesinleşmiş gelecek planları için de kullanılır: I'm meeting Ms. Carter on Monday. Türkçede de planları çoğu zaman \"-iyor\" ile anlatırız: Pazartesi Ms. Carter'la görüşüyorum. Cümlede genelde bir zaman ifadesi vardır (tomorrow, at nine, on Saturday); bu sayede şimdiyi değil, geleceği anlattığımız anlaşılır.", "use": ["Fixed plans you have already made: I'm meeting Sam at six.", "Plans with a time or day: tomorrow, at nine, next week.", "Ask people about their plans: What are you doing tomorrow?", "Say what you are not doing: I'm not working on Sunday."], "form": [{"label": "Positive", "pattern": "subject + am/is/are + verb-ing + time", "example": "Ms. Carter is coming at nine on Monday."}, {"label": "Negative", "pattern": "subject + am/is/are + not + verb-ing + time", "example": "I'm not working this weekend."}, {"label": "Question", "pattern": "(What) + am/is/are + subject + verb-ing + time?", "example": "Are you coming to the party?"}], "examples": [{"en": "I'm meeting Ms. Carter on Monday.", "tr": "Pazartesi Ms. Carter'la görüşüyorum."}, {"en": "Ms. Carter is coming at nine on Monday.", "tr": "Ms. Carter pazartesi saat dokuzda geliyor."}, {"en": "What are you doing tomorrow?", "tr": "Yarın ne yapıyorsun?"}, {"en": "We're having brunch at eleven.", "tr": "Saat on birde brunch yapıyoruz."}, {"en": "I'm taking the bus at nine.", "tr": "Saat dokuzda otobüse biniyorum."}, {"en": "Are you coming to the party on Saturday?", "tr": "Cumartesi partiye geliyor musun?"}, {"en": "I'm not working this weekend.", "tr": "Bu hafta sonu çalışmıyorum."}, {"en": "My parents are visiting me next month. They have their tickets.", "tr": "Annemle babam gelecek ay beni ziyarete geliyor. Biletlerini aldılar."}], "mistakes": [{"wrong": "What do you do tomorrow?", "right": "What are you doing tomorrow?", "why_tr": "Planları sorarken present simple değil, present continuous kullanılır."}, {"wrong": "I meeting Sam at six.", "right": "I'm meeting Sam at six.", "why_tr": "Am/is/are unutulmamalı: I'm meeting."}, {"wrong": "Are Sam coming to the party?", "right": "Is Sam coming to the party?", "why_tr": "Sam tek kişidir, bu yüzden is kullanılır."}, {"wrong": "We aren't go out tonight.", "right": "We aren't going out tonight.", "why_tr": "Aren't'tan sonra fiil -ing alır."}], "tip_tr": "Ajandana yazdığın planlar için -ing kullan: I'm meeting Sam tomorrow. Tıpkı \"Yarın Sam'le buluşuyorum\" gibi."}, "4-6": {"summary": "Use -ed adjectives for how a person feels and -ing adjectives for the thing that causes the feeling.", "tr_summary": "-ed ile biten sıfatlar bir kişinin nasıl hissettiğini anlatır: I'm bored (Sıkıldım). -ing ile biten sıfatlar ise bu duyguya sebep olan şeyi anlatır: The movie is boring (Film sıkıcı). Türkçede de benzer bir ayrım vardır: yorgun / yorucu, heyecanlı / heyecan verici. Dikkat: \"I'm boring\" demek \"Ben sıkıcı biriyim\" demektir!", "use": ["-ed: how a person feels: I'm tired. She's surprised.", "-ing: the thing (or person) that causes the feeling: a tiring day.", "Common pairs: bored/boring, tired/tiring, excited/exciting, interested/interesting, embarrassed/embarrassing.", "interested in + noun: Are you interested in art?"], "form": [{"label": "Feeling (-ed)", "pattern": "person + be + -ed adjective", "example": "I was bored."}, {"label": "Cause (-ing)", "pattern": "thing + be + -ing adjective", "example": "The meeting was boring."}, {"label": "Before a noun", "pattern": "a/an + -ing adjective + noun", "example": "Friday was a tiring day."}, {"label": "With a preposition", "pattern": "interested in / excited about + noun", "example": "I'm so excited about the trip."}], "examples": [{"en": "The meeting was boring, so I was bored.", "tr": "Toplantı sıkıcıydı, o yüzden sıkıldım."}, {"en": "I'm so excited about the trip.", "tr": "Gezi için çok heyecanlıyım."}, {"en": "Friday was a tiring day.", "tr": "Cuma yorucu bir gündü."}, {"en": "Are you interested in art?", "tr": "Sanata ilgin var mı?"}, {"en": "I was so surprised when I saw the whole team.", "tr": "Bütün ekibi görünce çok şaşırdım."}, {"en": "Moving to a new city can be tiring.", "tr": "Yeni bir şehre taşınmak yorucu olabilir."}, {"en": "That was an embarrassing mistake.", "tr": "Bu utanç verici bir hataydı."}, {"en": "The news was exciting, and everyone was excited.", "tr": "Haber heyecan vericiydi ve herkes çok heyecanlandı."}], "mistakes": [{"wrong": "I'm boring. Let's go home.", "right": "I'm bored. Let's go home.", "why_tr": "\"I'm boring\" = \"Ben sıkıcı biriyim.\" Sıkıldığını söylemek için bored kullan."}, {"wrong": "The movie was very bored.", "right": "The movie was very boring.", "why_tr": "Film duyguya sebep olur; şeyler için -ing kullanılır."}, {"wrong": "I'm interesting in art.", "right": "I'm interested in art.", "why_tr": "İlgi duyan kişidir, bu yüzden -ed: interested in."}, {"wrong": "I was very exciting about my birthday.", "right": "I was very excited about my birthday.", "why_tr": "Heyecanı hisseden kişidir, bu yüzden excited."}], "tip_tr": "Kişi hissediyorsa -ed (I'm tired), şey hissettiriyorsa -ing (It's tiring). Sıkılmak: bored; sıkıcı: boring."}, "5-1": {"summary": "We use the first conditional to talk about a possible situation in the future and its result.", "tr_summary": "Birinci koşul cümlesi, gelecekte olabilecek bir durumu ve sonucunu anlatır. 'If' kısmında present simple, sonuç kısmında will / won't + fiil kullanılır. Türkçede de genelde 'Yağmur yağarsa evde kalırım' deriz, 'yağacaksa' demeyiz. İngilizcede de if'ten sonra will gelmez.", "use": ["A possible situation in the future: If it rains, ...", "The result of that situation: ... I'll stay at home.", "Advice and warnings: If you don't rest, you'll get worse.", "Plans that depend on something: If I feel better, I'll go to work."], "form": [{"label": "Positive", "pattern": "If + present simple, will + verb", "example": "If you drink warm tea, you'll feel better."}, {"label": "Negative", "pattern": "If + don't / doesn't + verb, won't + verb", "example": "If I don't rest, I won't get better."}, {"label": "Question", "pattern": "What will + subject + verb + if ...?", "example": "What will you do if the bus doesn't come?"}, {"label": "If part second", "pattern": "will + verb + if + present simple (no comma)", "example": "Maria won't be happy if everyone gets sick."}], "examples": [{"en": "If it rains tomorrow, I'll take the bus.", "tr": "Yarın yağmur yağarsa otobüse bineceğim."}, {"en": "If you drink warm tea, your throat will feel better.", "tr": "Sıcak çay içersen boğazın rahatlar."}, {"en": "If I don't feel better, I'll call the doctor.", "tr": "Kendimi daha iyi hissetmezsem doktoru arayacağım."}, {"en": "If Elif goes to the office, everyone will get sick.", "tr": "Elif ofise giderse herkes hastalanacak."}, {"en": "You'll miss the bus if you don't hurry.", "tr": "Acele etmezsen otobüsü kaçıracaksın."}, {"en": "If you need anything, I'll bring it.", "tr": "Bir şeye ihtiyacın olursa getiririm."}, {"en": "What will you do if the shop is closed?", "tr": "Dükkân kapalıysa ne yapacaksın?"}, {"en": "If she has a fever, she won't come to work.", "tr": "Ateşi varsa işe gelmeyecek."}], "mistakes": [{"wrong": "If it will rain, I'll stay home.", "right": "If it rains, I'll stay home.", "why_tr": "If'ten sonra will kullanılmaz; present simple kullanılır."}, {"wrong": "If I will feel better, I go to work.", "right": "If I feel better, I'll go to work.", "why_tr": "Will, if kısmına değil, sonuç kısmına gelir."}, {"wrong": "If she have a fever, she won't come.", "right": "If she has a fever, she won't come.", "why_tr": "He / she / it ile present simple'da fiile -s eklenir."}, {"wrong": "I'll call you, if I need help.", "right": "I'll call you if I need help.", "why_tr": "If kısmı ikinci sıradaysa virgül kullanılmaz."}], "tip_tr": "Türkçedeki '-ırsa / -erse' gibi düşünün: if'ten sonra present simple, will sadece sonuç kısmında."}, "5-2": {"summary": "We use the past simple for finished times and the present perfect for experiences or unfinished times.", "tr_summary": "Türkçede 'telefonumu kaybettim' tek bir şekildir, ama İngilizcede iki seçenek var. Belli, bitmiş bir zaman söylüyorsanız (yesterday, last week, two days ago) past simple kullanılır. Zaman belli değilse, bir hayat tecrübesinden bahsediyorsanız ya da today, this week, since, for gibi bitmemiş zamanlar varsa present perfect kullanılır.", "use": ["Past simple with a finished time: yesterday, last week, in 2020, two days ago.", "Present perfect for life experiences with no time: I've never lost a phone.", "Present perfect with today, this week, this year, since and for.", "Start with the present perfect, then give details (when, where) in the past simple."], "form": [{"label": "Past simple", "pattern": "subject + past verb (+ finished time)", "example": "I lost my phone on the bus yesterday."}, {"label": "Present perfect", "pattern": "subject + have / has + past participle", "example": "I've lost my phone twice this year."}, {"label": "Experience question", "pattern": "Have you ever + past participle?", "example": "Have you ever been to Izmir?"}, {"label": "Detail question", "pattern": "When / Where did + subject + verb?", "example": "Where did you lose it?"}], "examples": [{"en": "I've never lost a phone before.", "tr": "Daha önce hiç telefon kaybetmedim."}, {"en": "Elif left her phone on the bus this morning.", "tr": "Elif bu sabah telefonunu otobüste unuttu."}, {"en": "Have you ever been to Chicago? Yes, I went there in 2023.", "tr": "Hiç Chicago'ya gittin mi? Evet, 2023'te gittim."}, {"en": "My mom has called me four times since this morning.", "tr": "Annem sabahtan beri beni dört kez aradı."}, {"en": "Sam called my number again and again at lunch.", "tr": "Sam öğle yemeğinde numaramı tekrar tekrar aradı."}, {"en": "I've lived in Chicago for three months.", "tr": "Üç aydır Chicago'da yaşıyorum."}, {"en": "We haven't seen Dan this week.", "tr": "Bu hafta Dan'i görmedik."}, {"en": "I went to the lost-and-found office two days ago.", "tr": "İki gün önce kayıp eşya bürosuna gittim."}], "mistakes": [{"wrong": "I have lost my phone yesterday.", "right": "I lost my phone yesterday.", "why_tr": "'Yesterday' bitmiş bir zaman; present perfect ile kullanılmaz."}, {"wrong": "When have you lost it?", "right": "When did you lose it?", "why_tr": "'When' ile belli bir zaman sorulur, bu yüzden past simple kullanılır."}, {"wrong": "I've been to Izmir last year.", "right": "I went to Izmir last year.", "why_tr": "Zamanı söylüyorsanız (last year) past simple kullanın."}, {"wrong": "I live in Chicago since September.", "right": "I've lived in Chicago since September.", "why_tr": "Türkçede 'yaşıyorum' deriz ama İngilizcede 'since' ile present perfect gerekir."}], "tip_tr": "Zaman belli ve bitmişse past simple; zaman yoksa ya da hâlâ devam ediyorsa present perfect."}, "5-3": {"summary": "After like, love, enjoy, hate and don't mind, we use a verb with -ing.", "tr_summary": "Türkçede 'okumayı severim', 'beklemekten nefret ederim' deriz; fiil isim gibi kullanılır. İngilizcede bu fiillerden sonra fiile -ing eklenir: I enjoy reading. Özellikle enjoy ve don't mind'dan sonra her zaman -ing gelir, 'to + fiil' gelmez. 'Don't mind' ise 'benim için sorun değil' anlamına gelir.", "use": ["To talk about things you like or don't like doing.", "After enjoy and don't mind, always use -ing.", "Use don't mind when something is okay for you: I don't mind waiting.", "Use hate for things you really don't like: I hate getting up early."], "form": [{"label": "Positive", "pattern": "subject + like / love / enjoy / hate + verb-ing", "example": "The kids enjoy listening to stories."}, {"label": "Negative", "pattern": "subject + don't / doesn't + like + verb-ing", "example": "I don't like cooking."}, {"label": "Question", "pattern": "Do / Does + subject + like + verb-ing?", "example": "Does she like reading?"}, {"label": "don't mind", "pattern": "subject + don't mind + verb-ing", "example": "I don't mind coming every week."}, {"label": "Spelling", "pattern": "take → taking, sit → sitting, fly → flying", "example": "She loves sitting by the window."}], "examples": [{"en": "I enjoy reading stories to children.", "tr": "Çocuklara hikâye okumaktan keyif alıyorum."}, {"en": "Helen loves working with kids.", "tr": "Helen çocuklarla çalışmaya bayılıyor."}, {"en": "I hate getting up when it's cold.", "tr": "Hava soğukken kalkmaktan nefret ederim."}, {"en": "Elif doesn't mind taking the bus.", "tr": "Otobüse binmek Elif için sorun değil."}, {"en": "Do you like cooking?", "tr": "Yemek yapmayı sever misin?"}, {"en": "The children enjoy sitting on the floor.", "tr": "Çocuklar yerde oturmaktan hoşlanıyor."}, {"en": "My dad hates flying.", "tr": "Babam uçmaktan nefret ediyor."}, {"en": "I don't mind waiting. Take your time.", "tr": "Beklemek benim için sorun değil. Acele etme."}], "mistakes": [{"wrong": "I enjoy to read.", "right": "I enjoy reading.", "why_tr": "Enjoy'dan sonra her zaman -ing gelir, 'to' gelmez."}, {"wrong": "I don't mind to wait.", "right": "I don't mind waiting.", "why_tr": "Don't mind'dan sonra da her zaman -ing kullanılır."}, {"wrong": "She likes swim.", "right": "She likes swimming.", "why_tr": "Like'tan sonra fiil yalın kullanılmaz; -ing ekleyin."}, {"wrong": "I love siting by the window.", "right": "I love sitting by the window.", "why_tr": "Sit gibi kısa fiillerde son harf iki kez yazılır: sitting."}], "tip_tr": "Enjoy ve don't mind gördüğünüz an -ing aklınıza gelsin: enjoy reading, don't mind waiting."}, "5-4": {"summary": "We use going to and will to make predictions, and will for quick decisions.", "tr_summary": "Türkçede 'yağmur yağacak' ve 'telefonu şarj edeceğim' için aynı '-ecek' ekini kullanırız. İngilizcede ise şu anda bir kanıt görüyorsanız (kara bulutlar gibi) going to kullanılır. Sadece fikrinizi söylüyorsanız (I think, probably, I'm sure) will kullanılır. Konuşurken o an verdiğiniz kararlar için de will kullanılır.", "use": ["Going to when you can see the reason now: Look at those clouds! It's going to rain.", "Will for your opinion: I think, I'm sure, probably.", "Will for a quick decision while you speak: I'll get a candle.", "Negatives: won't and isn't / aren't going to."], "form": [{"label": "going to", "pattern": "subject + am / is / are + going to + verb", "example": "Look at the sky. It's going to snow."}, {"label": "will", "pattern": "subject + will ('ll) + verb", "example": "I think the power will come back soon."}, {"label": "Negative", "pattern": "won't + verb / isn't going to + verb", "example": "It won't be cold tomorrow."}, {"label": "Question", "pattern": "Will + subject + verb? / Is it going to + verb?", "example": "Is it going to rain?"}], "examples": [{"en": "Look at those clouds! It's going to rain.", "tr": "Şu bulutlara bak! Yağmur yağacak."}, {"en": "I think the power will come back soon.", "tr": "Bence elektrik yakında gelir."}, {"en": "Don't worry. It'll be back by morning.", "tr": "Merak etme. Sabaha kadar gelir."}, {"en": "My battery is almost dead. I'll charge it.", "tr": "Şarjım bitmek üzere. Şarj edeyim."}, {"en": "The wind is getting stronger. There's going to be a storm.", "tr": "Rüzgâr giderek sertleşiyor. Fırtına çıkacak."}, {"en": "Mrs. Green will probably be cold tonight.", "tr": "Mrs. Green bu gece muhtemelen üşüyecek."}, {"en": "It's dark in here. I'll get a candle.", "tr": "Burası karanlık. Bir mum getireyim."}, {"en": "I'm sure the storm won't last long.", "tr": "Fırtınanın uzun sürmeyeceğinden eminim."}], "mistakes": [{"wrong": "Look! It going to rain.", "right": "Look! It's going to rain.", "why_tr": "Going to'dan önce am / is / are unutulmamalı."}, {"wrong": "I think the power comes back soon.", "right": "I think the power will come back soon.", "why_tr": "Tahmin için present simple değil, will kullanılır."}, {"wrong": "It will to be cold tomorrow.", "right": "It will be cold tomorrow.", "why_tr": "Will'den sonra 'to' gelmez; fiil yalın kullanılır."}, {"wrong": "My phone is dead. Wait, I charge it.", "right": "My phone is dead. Wait, I'll charge it.", "why_tr": "O an verilen kararlar için will kullanılır."}], "tip_tr": "Gözünüzle kanıt görüyorsanız going to; sadece düşünüyorsanız ya da o an karar veriyorsanız will."}, "5-5": {"summary": "We use comparatives to show how two things are different and as ... as to show they are the same.", "tr_summary": "Türkçede 'daha sıcak' ve 'ondan daha pahalı' deriz. İngilizcede kısa sıfatlara -er eklenir (warmer), uzun sıfatlarda more kullanılır (more expensive); 'den/dan' yerine than gelir. Türkçedeki 'kadar' için iki tane as kullanılır: 'onun kadar sıcak' = as warm as. 'Daha az' anlamı için not as ... as kullanılır.", "use": ["Short adjectives: -er + than: warmer than.", "Long adjectives: more + adjective + than: more expensive than.", "Irregular: good → better, bad → worse. Make it stronger with much.", "as + adjective + as when two things are the same.", "not as + adjective + as when something is less."], "form": [{"label": "Short adjective", "pattern": "adjective-er + than", "example": "The black coat is warmer than the gray one."}, {"label": "Long adjective", "pattern": "more + adjective + than", "example": "It's more expensive than the gray coat."}, {"label": "Stronger", "pattern": "much + comparative", "example": "It looks much warmer than your old one."}, {"label": "Same", "pattern": "as + adjective + as", "example": "This scarf is as soft as a blanket."}, {"label": "Less", "pattern": "not as + adjective + as", "example": "The gray coat isn't as warm as the black one."}], "examples": [{"en": "My new coat is much warmer than my old one.", "tr": "Yeni montum eskisinden çok daha sıcak."}, {"en": "Chicago is colder than Izmir in winter.", "tr": "Kışın Chicago, İzmir'den daha soğuk."}, {"en": "The black coat was more expensive than the gray one.", "tr": "Siyah mont griden daha pahalıydı."}, {"en": "My old coat isn't as thick as this sweater!", "tr": "Eski montum bu kazak kadar kalın değil!"}, {"en": "This store is better than the one on Main Street.", "tr": "Bu mağaza Main Street'teki mağazadan daha iyi."}, {"en": "Today the weather is worse than yesterday.", "tr": "Bugün hava dünden daha kötü."}, {"en": "Sam is as tall as Dan.", "tr": "Sam, Dan kadar uzun."}, {"en": "The small bag isn't as heavy as the large one.", "tr": "Küçük çanta büyüğü kadar ağır değil."}], "mistakes": [{"wrong": "This coat is more warmer than that one.", "right": "This coat is warmer than that one.", "why_tr": "Kısa sıfatlara -er eklenir; -er ve more birlikte kullanılmaz."}, {"wrong": "It's as warm than a blanket.", "right": "It's as warm as a blanket.", "why_tr": "'Kadar' anlamında iki tarafta da as kullanılır, than değil."}, {"wrong": "This coat is gooder than my old one.", "right": "This coat is better than my old one.", "why_tr": "Good düzensizdir: good → better."}, {"wrong": "It's very warmer than my old coat.", "right": "It's much warmer than my old coat.", "why_tr": "Karşılaştırmayı güçlendirmek için very değil much kullanılır."}], "tip_tr": "'-den daha' = than, '... kadar' = as ... as. As ile than asla karışmasın."}, "5-6": {"summary": "Adverbs of manner tell us how someone does something.", "tr_summary": "Zarflar bir işin nasıl yapıldığını anlatır: yavaşça, dikkatlice, iyi. Türkçede sıfatı çoğu zaman olduğu gibi zarf olarak kullanırız ('yavaş sür', 'iyi kayıyor') ya da '-ca / -ce' ekleriz ('dikkatlice'). İngilizcede ise sıfata genellikle -ly eklenir: careful → carefully. Bazı zarflar düzensizdir: good → well, fast → fast, hard → hard.", "use": ["To say how someone does something: She skates well.", "Most adverbs: adjective + -ly: slow → slowly.", "Adjectives ending in -y: y → i + -ly: easy → easily.", "Irregular: good → well, fast → fast, hard → hard.", "The adverb usually comes after the verb, or after the object."], "form": [{"label": "Regular", "pattern": "adjective + -ly", "example": "Move slowly and carefully."}, {"label": "-y adjectives", "pattern": "y → i + -ly", "example": "She answered the question easily."}, {"label": "Irregular", "pattern": "good → well, fast → fast, hard → hard", "example": "Dan skates well."}, {"label": "Word order", "pattern": "verb + object + adverb", "example": "Elif speaks English well."}, {"label": "Stronger", "pattern": "very / really + adverb", "example": "The little girl skated very fast."}], "examples": [{"en": "Move slowly and carefully on the ice.", "tr": "Buzun üstünde yavaş ve dikkatli hareket et."}, {"en": "Dan skates well, but Sam skates badly.", "tr": "Dan iyi kayıyor ama Sam kötü kayıyor."}, {"en": "The little girl skated very fast.", "tr": "Küçük kız çok hızlı kaydı."}, {"en": "Elif is learning quickly.", "tr": "Elif hızlı öğreniyor."}, {"en": "Please speak slowly. I'm still learning English.", "tr": "Lütfen yavaş konuşun. Hâlâ İngilizce öğreniyorum."}, {"en": "Sam fell, but he got up happily.", "tr": "Sam düştü ama neşeyle ayağa kalktı."}, {"en": "Maria works hard every day.", "tr": "Maria her gün çok çalışıyor."}, {"en": "She answered calmly.", "tr": "Sakin bir şekilde cevap verdi."}], "mistakes": [{"wrong": "She skates good.", "right": "She skates well.", "why_tr": "Good bir sıfattır; 'iyi bir şekilde' anlamı için well kullanılır."}, {"wrong": "He drives fastly.", "right": "He drives fast.", "why_tr": "Fast düzensizdir; 'fastly' diye bir kelime yoktur."}, {"wrong": "You learn very easyly.", "right": "You learn very easily.", "why_tr": "-y ile biten sıfatlarda y, i'ye döner: easily."}, {"wrong": "Elif speaks very well English.", "right": "Elif speaks English very well.", "why_tr": "Zarf, fiil ile nesnenin arasına girmez; nesneden sonra gelir."}], "tip_tr": "'Nasıl?' sorusunun cevabıysa zarf kullanın: -ly ekleyin, ama good → well olduğunu unutmayın."}, "6-1": {"summary": "We use the second conditional to talk about imagined situations now and to give advice.", "tr_summary": "İkinci koşul cümlesi gerçek olmayan, hayalî durumları anlatır. Türkçedeki 'Zamanım olsa gelirdim' yapısına benzer: if kısmında past simple, sonuç kısmında would + fiil kullanılır. Geçmiş zaman kullanılsa da anlam şimdiki zamanla ilgilidir. 'Senin yerinde olsam...' demek için If I were you, I would... kalıbı kullanılır.", "use": ["Imagined situations now that are not true: If I had more time... (but I don't).", "Dreams and wishes: If I won the lottery, I would travel.", "Advice: If I were you, I would...", "Questions about imagined situations: What would you do if...?"], "form": [{"label": "Positive", "pattern": "If + past simple, would + verb", "example": "If I had more time, I would help you."}, {"label": "Negative", "pattern": "If + didn't + verb, wouldn't + verb", "example": "If I didn't like my job, I wouldn't stay."}, {"label": "Question", "pattern": "What would + subject + verb + if + past simple?", "example": "What would you do if the client said no?"}, {"label": "Advice", "pattern": "If I were you, I would + verb", "example": "If I were you, I would make a simple plan."}], "examples": [{"en": "If I had more experience, I would feel calmer.", "tr": "Daha fazla tecrübem olsa daha sakin olurdum."}, {"en": "If I were you, I would make a simple plan.", "tr": "Senin yerinde olsam basit bir plan yapardım."}, {"en": "What would you do if the client said no?", "tr": "Müşteri hayır dese ne yapardın?"}, {"en": "I wouldn't worry if I were you.", "tr": "Senin yerinde olsam endişelenmezdim."}, {"en": "If Elif lived near the sea, she would swim every day.", "tr": "Elif denize yakın otursa her gün yüzerdi."}, {"en": "If I had a car, I wouldn't take the bus.", "tr": "Arabam olsa otobüse binmezdim."}, {"en": "If my parents were here, they would be proud of me.", "tr": "Annemle babam burada olsa benimle gurur duyarlardı."}, {"en": "Would you help me if I asked?", "tr": "Rica etsem bana yardım eder miydin?"}], "mistakes": [{"wrong": "If I would have time, I would help you.", "right": "If I had time, I would help you.", "why_tr": "If kısmında would kullanılmaz; past simple kullanılır."}, {"wrong": "If I had more money, I will buy a car.", "right": "If I had more money, I would buy a car.", "why_tr": "Hayalî durumlarda sonuç kısmında will değil would gelir."}, {"wrong": "If I were you, I would to call her.", "right": "If I were you, I would call her.", "why_tr": "Would'dan sonra 'to' gelmez; fiil yalın kullanılır."}, {"wrong": "I would help you if I have time.", "right": "I would help you if I had time.", "why_tr": "Would ile birlikte if kısmı geçmiş zamanda olmalı."}], "tip_tr": "'-sa ... -ırdı' = if + geçmiş, would + fiil. 'Senin yerinde olsam' = If I were you."}, "6-2": {"summary": "We use should and ought to for advice, and Could you please...? for polite requests and complaints.", "tr_summary": "Tavsiye vermek için should / shouldn't + fiil kullanılır; Türkçedeki '-malısın / -meli' gibidir. Ought to da aynı anlama gelir ama daha resmîdir. Kibar bir rica için 'Could you please...?' kullanılır; Türkçedeki 'Rica etsem ... -ebilir misiniz?' gibi. Şikâyet ederken 'Sorry to bother you, but...' gibi yumuşak bir girişle başlamak çok önemlidir.", "use": ["Advice: You should talk to him.", "Negative advice: You shouldn't call the landlord yet.", "More formal advice: You ought to give him a chance.", "Polite requests: Could you please turn it down?", "Start a complaint softly: Sorry to bother you, but..."], "form": [{"label": "Advice", "pattern": "subject + should + verb", "example": "You should talk to your neighbor first."}, {"label": "Negative advice", "pattern": "subject + shouldn't + verb", "example": "You shouldn't call the landlord yet."}, {"label": "Formal advice", "pattern": "subject + ought to + verb", "example": "You ought to give him a chance."}, {"label": "Polite request", "pattern": "Could you please + verb?", "example": "Could you please turn the music down?"}, {"label": "Soft start", "pattern": "Sorry to bother you, but... / I'm afraid...", "example": "I'm afraid there's a problem with the noise."}], "examples": [{"en": "You should talk to your neighbor first.", "tr": "Önce komşunla konuşmalısın."}, {"en": "You ought to give him a chance.", "tr": "Ona bir şans vermelisin."}, {"en": "Could you please turn the music down after ten?", "tr": "Rica etsem saat ondan sonra müziğin sesini kısabilir misiniz?"}, {"en": "You shouldn't call the landlord yet.", "tr": "Ev sahibini henüz aramamalısın."}, {"en": "Sorry to bother you, but the music is very loud.", "tr": "Rahatsız ettiğim için kusura bakmayın ama müzik çok yüksek."}, {"en": "I'm afraid there's a problem with the noise at night.", "tr": "Maalesef gece gürültü konusunda bir sorun var."}, {"en": "Should I write a note to my neighbor?", "tr": "Komşuma not mu yazsam?"}, {"en": "Could you please walk more quietly at night?", "tr": "Rica etsem geceleri daha sessiz yürüyebilir misiniz?"}], "mistakes": [{"wrong": "You should to talk to him.", "right": "You should talk to him.", "why_tr": "Should'dan sonra 'to' gelmez; fiil yalın kullanılır."}, {"wrong": "You ought talk to him.", "right": "You ought to talk to him.", "why_tr": "Ought'tan sonra mutlaka 'to' gelir: ought to."}, {"wrong": "Could you please to turn it down?", "right": "Could you please turn it down?", "why_tr": "Could you please'ten sonra fiil yalın kullanılır."}, {"wrong": "You don't should call him.", "right": "You shouldn't call him.", "why_tr": "Should'un olumsuzu shouldn't'tur; 'don't' kullanılmaz."}], "tip_tr": "Should sonrası 'to' yok, ought sonrası 'to' var. Kibar rica: Could you please...?"}, "6-3": {"summary": "We use the present simple passive when the action is more important than the person who does it.", "tr_summary": "Edilgen yapı, işi kimin yaptığı önemli olmadığında kullanılır. Türkçedeki '-ılır / -ilir / -nır' eklerine benzer: 'Burada İngilizce konuşulur' = English is spoken here. İngilizcede am / is / are + fiilin üçüncü hâli (past participle) kullanılır. İşi yapan kişi önemliyse by ile eklenir.", "use": ["When the action is more important than the person: Lessons are given every day.", "When we don't know or don't care who does it.", "In rules, information sheets and signs.", "Add by + the doer only when it is important: ... by the school."], "form": [{"label": "Positive", "pattern": "subject + am / is / are + past participle", "example": "All lessons are given in a small car."}, {"label": "Negative", "pattern": "subject + isn't / aren't + past participle", "example": "Lunch isn't included."}, {"label": "Question", "pattern": "Is / Are + subject + past participle?", "example": "Is a book included?"}, {"label": "With by", "pattern": "... + by + the doer", "example": "The car is provided by the school."}], "examples": [{"en": "All lessons are given in a small car.", "tr": "Bütün dersler küçük bir arabada verilir."}, {"en": "Students are picked up at home.", "tr": "Öğrenciler evden alınır."}, {"en": "Is a book included?", "tr": "Kitap fiyata dahil mi?"}, {"en": "Every new student is given a free book.", "tr": "Her yeni öğrenciye ücretsiz bir kitap verilir."}, {"en": "The cars are checked every week.", "tr": "Arabalar her hafta kontrol edilir."}, {"en": "Coffee is made fresh every morning.", "tr": "Kahve her sabah taze yapılır."}, {"en": "English and Spanish are spoken at the school.", "tr": "Okulda İngilizce ve İspanyolca konuşulur."}, {"en": "The car is provided by the school.", "tr": "Araba okul tarafından sağlanır."}], "mistakes": [{"wrong": "Lessons give every day.", "right": "Lessons are given every day.", "why_tr": "Edilgen yapıda is / are ve fiilin üçüncü hâli gerekir."}, {"wrong": "The car provided by the school.", "right": "The car is provided by the school.", "why_tr": "Türkçede yardımcı fiil yok ama İngilizcede 'is' unutulmamalı."}, {"wrong": "Is the cars checked every week?", "right": "Are the cars checked every week?", "why_tr": "Çoğul özneyle is değil are kullanılır."}, {"wrong": "English is speak here.", "right": "English is spoken here.", "why_tr": "Is'ten sonra fiilin üçüncü hâli gelir: speak → spoken."}], "tip_tr": "'-ılır / -ilir' görünce is / are + üçüncü hâl düşünün: verilir = is given."}, "6-4": {"summary": "We use used to for past habits and states that are not true now.", "tr_summary": "Used to, geçmişte düzenli olarak yaptığımız ama artık yapmadığımız şeyleri anlatır. Türkçedeki 'Eskiden İzmir'de otururdum' ya da 'Bayramda bütün akrabaları ziyaret ederdik' yapısına benzer. Olumsuz ve soru cümlelerinde did kullanıldığı için 'd' düşer: didn't use to, Did you use to...? Şimdiki alışkanlıklar için used to değil usually kullanılır.", "use": ["Past habits that stopped: We used to visit our relatives every Bayram.", "Past states that changed: I used to have long hair.", "Negative: didn't use to + verb.", "Questions: Did + subject + use to + verb?", "For the present, use usually: I usually walk to work."], "form": [{"label": "Positive", "pattern": "subject + used to + verb", "example": "I used to live in Izmir."}, {"label": "Negative", "pattern": "subject + didn't use to + verb", "example": "Dan didn't use to like vegetables."}, {"label": "Question", "pattern": "Did + subject + use to + verb?", "example": "Did your family use to play games?"}, {"label": "Present habit", "pattern": "subject + usually + present simple", "example": "I usually walk to work."}], "examples": [{"en": "We used to visit all our relatives during Bayram.", "tr": "Bayramda bütün akrabalarımızı ziyaret ederdik."}, {"en": "I used to live in Izmir. Now I live in Chicago.", "tr": "Eskiden İzmir'de yaşardım. Şimdi Chicago'da yaşıyorum."}, {"en": "Dan didn't use to like vegetables.", "tr": "Dan eskiden sebze sevmezdi."}, {"en": "Did your family use to play games?", "tr": "Ailen eskiden oyun oynar mıydı?"}, {"en": "I used to have long hair.", "tr": "Eskiden saçlarım uzundu."}, {"en": "We used to wake up early and put on our new clothes.", "tr": "Sabah erken kalkıp yeni kıyafetlerimizi giyerdik."}, {"en": "My grandmother used to make baklava for us.", "tr": "Babaannem bize baklava yapardı."}, {"en": "Now I usually call my parents on Sundays.", "tr": "Şimdi genelde pazar günleri annemle babamı arıyorum."}], "mistakes": [{"wrong": "I use to live in Izmir.", "right": "I used to live in Izmir.", "why_tr": "Olumlu cümlede 'used to' yazılır; 'd' unutulmamalı."}, {"wrong": "I didn't used to like coffee.", "right": "I didn't use to like coffee.", "why_tr": "Didn't'ten sonra 'd' düşer: didn't use to."}, {"wrong": "Did you used to play outside?", "right": "Did you use to play outside?", "why_tr": "Soru cümlesinde did olduğu için 'use to' kullanılır."}, {"wrong": "Now I used to walk to work.", "right": "Now I usually walk to work.", "why_tr": "Used to sadece geçmiş içindir; şimdiki alışkanlık için usually kullanılır."}], "tip_tr": "'Eskiden ... -ırdım' = used to. Did varsa 'd' düşer: didn't use to, Did you use to?"}, "6-5": {"summary": "English has three common ways to talk about the future: going to, the present continuous and will.", "tr_summary": "Türkçede gelecek için çoğunlukla '-ecek' kullanırız, ama İngilizcede anlam farkına göre üç yapı var. Önceden karar verilmiş planlar için going to kullanılır. Saati ya da kişisi belli olan randevular için present continuous kullanılır; Türkçede de 'Yarın Dan'le buluşuyorum' deriz. O an verilen kararlar, teklifler ve sözler için will kullanılır.", "use": ["going to: plans you made before now: I'm going to book a flight.", "Present continuous: arrangements with a time or a person: I'm meeting Dan at six.", "will: quick decisions, offers and promises: I'll help you.", "Predictions: will or going to: She'll probably cry."], "form": [{"label": "Plan", "pattern": "am / is / are + going to + verb", "example": "I'm going to call my mom tonight."}, {"label": "Arrangement", "pattern": "am / is / are + verb-ing (+ time)", "example": "I'm meeting Dan at six."}, {"label": "Offer / promise", "pattern": "will ('ll) + verb", "example": "Don't worry, I'll help you."}, {"label": "Prediction", "pattern": "will + verb / going to + verb", "example": "She'll probably cry."}], "examples": [{"en": "I'm going to book my flight this weekend.", "tr": "Bu hafta sonu uçak biletimi alacağım."}, {"en": "I'm calling my mom tonight at nine.", "tr": "Bu akşam saat dokuzda annemi arıyorum."}, {"en": "Sam is going to help me find cheap tickets.", "tr": "Sam ucuz bilet bulmama yardım edecek."}, {"en": "I'm meeting Dan at six.", "tr": "Saat altıda Dan'le buluşuyorum."}, {"en": "Don't worry, I'll finish the report before I leave.", "tr": "Merak etme, gitmeden önce raporu bitireceğim."}, {"en": "That bag looks heavy. I'll carry it for you.", "tr": "O çanta ağır görünüyor. Ben taşırım."}, {"en": "My mom will probably cry when she sees me.", "tr": "Annem beni görünce muhtemelen ağlayacak."}, {"en": "We're having dinner with my parents on Friday.", "tr": "Cuma günü annemlerle akşam yemeği yiyoruz."}], "mistakes": [{"wrong": "I going to call my mom tonight.", "right": "I'm going to call my mom tonight.", "why_tr": "Going to'dan önce am / is / are gerekir."}, {"wrong": "Are you meet Dan tomorrow?", "right": "Are you meeting Dan tomorrow?", "why_tr": "Present continuous'ta fiile -ing eklenir."}, {"wrong": "That bag looks heavy. I carry it for you.", "right": "That bag looks heavy. I'll carry it for you.", "why_tr": "O an yapılan teklifler için will kullanılır."}, {"wrong": "I'll to help you.", "right": "I'll help you.", "why_tr": "Will'den sonra 'to' gelmez."}], "tip_tr": "Plan: going to. Randevu: -ing (Türkçedeki 'buluşuyorum' gibi). Anlık karar, teklif, söz: will."}, "6-6": {"summary": "We use So do I and Neither do I to say that we agree or feel the same as someone.", "tr_summary": "Türkçede aynı fikirde olduğumuzu göstermek için olumlu ve olumsuz cümlelerde hep 'Ben de' deriz. İngilizcede olumlu cümleye So + yardımcı fiil + I, olumsuz cümleye Neither + yardımcı fiil + I ile cevap verilir. Yardımcı fiil ilk cümleyle aynı olmalıdır: am → am, can → can, did → did. Like, love gibi asıl fiiller geniş zamandaysa do / does, geçmiş zamandaysa did kullanılır.", "use": ["Agree with a positive sentence: I love tea. – So do I.", "Agree with a negative sentence: I don't smoke. – Neither do I.", "Use the same auxiliary: I'm full. – So am I.", "For main verbs in the present use do / does; in the past use did."], "form": [{"label": "Positive (be)", "pattern": "So + am / is / are + subject", "example": "I'm full. – So am I."}, {"label": "Positive (main verb)", "pattern": "So + do / does / did + subject", "example": "I love pie. – So do I."}, {"label": "Negative", "pattern": "Neither + auxiliary + subject", "example": "I don't like coffee. – Neither do I."}, {"label": "Modal", "pattern": "So / Neither + can / will + subject", "example": "I can't swim. – Neither can I."}], "examples": [{"en": "I'm full. – So am I.", "tr": "Doydum. – Ben de."}, {"en": "I love pumpkin pie. – So do I.", "tr": "Balkabağı turtasına bayılırım. – Ben de."}, {"en": "I don't like cooking from books. – Neither do I.", "tr": "Kitaptan bakarak yemek yapmayı sevmem. – Ben de."}, {"en": "I can't swim. – Neither can I.", "tr": "Yüzme bilmiyorum. – Ben de."}, {"en": "We went to the lake last summer. – So did we.", "tr": "Geçen yaz göle gittik. – Biz de."}, {"en": "I'm not tired yet. – Neither am I.", "tr": "Henüz yorgun değilim. – Ben de."}, {"en": "Dan's grandma tells funny stories. – So does my grandma.", "tr": "Dan'in büyükannesi komik hikâyeler anlatır. – Benim büyükannem de."}, {"en": "I've never been to an American family dinner. – Neither have I.", "tr": "Hiç Amerikan aile yemeğine gitmedim. – Ben de."}], "mistakes": [{"wrong": "I love tea. – So I do.", "right": "I love tea. – So do I.", "why_tr": "So'dan sonra önce yardımcı fiil, sonra özne gelir."}, {"wrong": "I don't smoke. – Neither I don't.", "right": "I don't smoke. – Neither do I.", "why_tr": "Neither zaten olumsuzdur; tekrar 'don't' kullanılmaz ve sıra değişir."}, {"wrong": "I'm tired. – So do I.", "right": "I'm tired. – So am I.", "why_tr": "İlk cümlede am varsa cevapta da am kullanılır."}, {"wrong": "I can't swim. – So can I.", "right": "I can't swim. – Neither can I.", "why_tr": "Olumsuz cümleye So ile değil Neither ile cevap verilir."}], "tip_tr": "Türkçede hep 'Ben de'; İngilizcede olumlu cümleye So, olumsuza Neither. Yardımcı fiili ilk cümleden kopyalayın."}, "7-1": {"summary": "We use the present perfect continuous for an action that started in the past and is still happening now. It answers the question \"How long?\"", "tr_summary": "Geçmişte başlayıp hâlâ devam eden bir eylem için have/has been + fiil-ing kullanılır. Türkçede bunu şimdiki zamanla söyleriz: \"İki haftadır bu proje üzerinde çalışıyoruz.\" İngilizcede burada \"We're working\" denmez; doğrusu \"We've been working on it for two weeks.\" Süre için for (iki haftadır), başlangıç noktası için since (sekizden beri) kullanılır.", "use": ["An action started in the past and is still happening: I've been living here for a year.", "With How long...? questions: How long have you been waiting?", "To explain why something is true now: I'm tired because I've been working all day.", "With for + a period (for two weeks) or since + a start point (since eight)."], "form": [{"label": "Positive", "pattern": "subject + have/has been + verb-ing", "example": "We've been working on it for two weeks."}, {"label": "Negative", "pattern": "subject + haven't/hasn't been + verb-ing", "example": "She hasn't been sleeping well."}, {"label": "Question", "pattern": "Have/Has + subject + been + verb-ing?", "example": "Have you been staying late?"}, {"label": "How long", "pattern": "How long + have/has + subject + been + verb-ing?", "example": "How long have you been learning English?"}], "examples": [{"en": "Elif has been working on the flower shop project for two weeks.", "tr": "Elif iki haftadır çiçekçi projesi üzerinde çalışıyor."}, {"en": "Maria has been sitting in meetings since eight.", "tr": "Maria sabah sekizden beri toplantılarda oturuyor."}, {"en": "I've been waiting for the bus for twenty minutes.", "tr": "Yirmi dakikadır otobüs bekliyorum."}, {"en": "How long have you been living in Chicago?", "tr": "Ne zamandır Chicago'da yaşıyorsun?"}, {"en": "Your eyes are red. Have you been crying?", "tr": "Gözlerin kırmızı. Ağladın mı?"}, {"en": "I'm tired because I've been cleaning the apartment all day.", "tr": "Yorgunum, çünkü bütün gün ev temizledim."}, {"en": "Sam has been drawing logos for days. He has made twelve.", "tr": "Sam günlerdir logo çiziyor. On iki tane yaptı."}, {"en": "It has been raining since this morning.", "tr": "Sabahtan beri yağmur yağıyor."}], "mistakes": [{"wrong": "I'm working here for two years.", "right": "I've been working here for two years.", "why_tr": "Türkçede \"iki yıldır çalışıyorum\" deriz ama İngilizcede süre varsa şimdiki zaman değil, have been + -ing kullanılır."}, {"wrong": "I've been living here since two years.", "right": "I've been living here for two years.", "why_tr": "Süre (iki yıl) için for, başlangıç noktası (2024, ekim, sabah sekiz) için since kullanılır."}, {"wrong": "She have been waiting for an hour.", "right": "She has been waiting for an hour.", "why_tr": "He/she/it ile have değil has kullanılır."}, {"wrong": "I've been making twelve logos.", "right": "I've made twelve logos.", "why_tr": "Bitmiş bir sonuç veya sayı söylüyorsak present perfect simple kullanılır: have + made."}], "tip_tr": "\"-dır/-dir\" ile süre söylüyorsan (iki haftadır, sabahtan beri), İngilizcede have been + -ing düşün."}, "7-2": {"summary": "Indirect questions are a polite way to ask for information. After Can you tell me...? or Do you know...?, we use normal sentence word order.", "tr_summary": "Dolaylı sorular, soruyu daha kibar sormanın yoludur: Can you tell me...?, Do you know...?, I'd like to know... Bu kalıplardan sonra soru kelimesi gelir ama cümle düz cümle gibi devam eder: önce özne, sonra fiil. Do, does ve did kullanılmaz. Evet/hayır sorularında if kullanılır; Türkçedeki \"İspanyolca konuşup konuşmadığını biliyor musun?\" yapısına benzer.", "use": ["To ask politely, for example to a stranger, a client or in an interview.", "Wh- questions: Can you tell me + question word + subject + verb.", "Yes/no questions: Do you know + if + subject + verb.", "To say what you want to learn: I'd like to know why you want this job."], "form": [{"label": "Wh- question", "pattern": "Can you tell me / Do you know + question word + subject + verb", "example": "Can you tell me where the office is?"}, {"label": "Without do/does/did", "pattern": "question word + subject + verb (with -s or past form)", "example": "Could you tell me what you did in your last job?"}, {"label": "Yes/no question", "pattern": "Do you know / Can you tell me + if + subject + verb", "example": "Do you know if he speaks Spanish?"}, {"label": "Statement", "pattern": "I'd like to know / I wonder + question word + subject + verb", "example": "I'd like to know why you want this job."}], "examples": [{"en": "Excuse me, can you tell me where the restroom is?", "tr": "Affedersiniz, tuvaletin nerede olduğunu söyleyebilir misiniz?"}, {"en": "Do you know what time the store opens on Sundays?", "tr": "Mağazanın pazar günleri saat kaçta açıldığını biliyor musunuz?"}, {"en": "Could you tell me what you did at the hotel?", "tr": "Otelde ne iş yaptığınızı anlatabilir misiniz?"}, {"en": "Do you know when you could start?", "tr": "Ne zaman başlayabileceğinizi biliyor musunuz?"}, {"en": "Elif asked Marcus: \"I'd like to know why you want this job.\"", "tr": "Elif, Marcus'a sordu: \"Bu işi neden istediğinizi öğrenmek isterim.\""}, {"en": "Do you know if Maria is in her office?", "tr": "Maria'nın ofisinde olup olmadığını biliyor musun?"}, {"en": "Can you tell me how much these shoes cost?", "tr": "Bu ayakkabıların ne kadar olduğunu söyleyebilir misiniz?"}, {"en": "Do you know where Sam went yesterday?", "tr": "Sam'in dün nereye gittiğini biliyor musun?"}], "mistakes": [{"wrong": "Can you tell me where is the office?", "right": "Can you tell me where the office is?", "why_tr": "Dolaylı soruda soru düzeni bozulur: önce özne (the office), sonra fiil (is)."}, {"wrong": "Do you know what time does the store open?", "right": "Do you know what time the store opens?", "why_tr": "Dolaylı soruda does kullanılmaz; fiil -s alır: the store opens."}, {"wrong": "Could you tell me what did you do?", "right": "Could you tell me what you did?", "why_tr": "Did kalkar, fiil geçmiş hâle geçer: you did."}, {"wrong": "Can you tell me does he speak Spanish?", "right": "Can you tell me if he speaks Spanish?", "why_tr": "Evet/hayır sorusunu dolaylı sorarken if kullanılır, does kullanılmaz."}], "tip_tr": "Kibar kalıptan sonra soru biter: Can you tell me... dedin mi, gerisini düz cümle gibi söyle."}, "7-3": {"summary": "We use the past perfect for an action that happened before another action in the past. It shows which action came first.", "tr_summary": "Past perfect (had + fiilin üçüncü hâli), geçmişteki bir olaydan daha önce olmuş başka bir olayı anlatır. Türkçedeki \"-mıştı / -mişti\" eki genelde buna karşılık gelir: \"Vardığımda Sam çoktan gitmişti\" = When I arrived, Sam had already left. Önce olan olay had ile, sonra olan olay past simple ile söylenir. Already, never, before ve by the time ile sık kullanılır.", "use": ["For the earlier of two past actions: When I arrived, Sam had already left.", "To explain a past situation: She was hungry because she hadn't eaten.", "With never or ever for experiences before a past time: I had never seen snow before I moved here.", "With by the time: By the time Maria arrived, the meeting had started."], "form": [{"label": "Positive", "pattern": "subject + had + past participle", "example": "Sam had already left."}, {"label": "Negative", "pattern": "subject + hadn't (had not) + past participle", "example": "He hadn't eaten a cookie all week."}, {"label": "Question", "pattern": "Had + subject + (ever) + past participle?", "example": "Had you ever been to Chicago before?"}, {"label": "Two actions", "pattern": "When/By the time + past simple, subject + had + past participle", "example": "By the time Maria arrived, the meeting had started."}], "examples": [{"en": "I looked for Sam, but he had already left.", "tr": "Sam'i aradım ama o çoktan gitmişti."}, {"en": "When we got to the station, the train had already left.", "tr": "İstasyona vardığımızda tren çoktan kalkmıştı."}, {"en": "Elif had never seen so much snow before she moved to Chicago.", "tr": "Elif, Chicago'ya taşınmadan önce hiç bu kadar çok kar görmemişti."}, {"en": "Before Sam said yes, he had talked to Maria a few times.", "tr": "Sam evet demeden önce Maria'yla birkaç kez konuşmuştu."}, {"en": "She was hungry because she hadn't eaten breakfast.", "tr": "Acıkmıştı, çünkü kahvaltı yapmamıştı."}, {"en": "The movie had begun when we arrived, so we missed the start.", "tr": "Biz vardığımızda film başlamıştı, o yüzden başını kaçırdık."}, {"en": "I didn't know her name because we hadn't met before.", "tr": "Adını bilmiyordum, çünkü daha önce tanışmamıştık."}, {"en": "Had you ever worked in a team before this job?", "tr": "Bu işten önce hiç bir ekipte çalışmış mıydın?"}], "mistakes": [{"wrong": "When I arrived, Sam has already left.", "right": "When I arrived, Sam had already left
