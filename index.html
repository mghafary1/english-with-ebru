r. When the bus came, he waved goodbye. I felt warm, even in the rain."}, "audio": {"listen": "audio/w3d4-listen.mp3", "listenT": [[0.3, 2.35], [2.8, 6.4], [6.85, 10.57], [11.02, 13.83], [14.28, 16.03], [16.48, 21.75], [22.2, 26.96], [27.41, 31.1], [31.55, 34.34], [34.79, 36.2], [36.65, 40.32], [40.77, 42.48], [42.93, 47.79], [48.24, 49.48], [49.93, 54.32], [54.77, 56.86], [57.31, 60.64], [61.09, 62.18], [62.63, 64.08], [64.53, 70.01], [70.46, 72.36], [72.81, 75.73], [76.18, 77.95], [78.4, 82.42], [82.87, 86.68], [87.13, 88.82], [89.27, 91.83]], "read": "audio/w3d4-read.mp3", "speak": "audio/w3d4-speak.mp3", "vocab": "audio/w3d4-vocab.mp3", "vocabT": [[0.3, 1.3, 1.9, 4.63], [5.53, 6.73, 7.33, 9.82], [10.72, 11.62, 12.22, 14.08], [14.98, 16.02, 16.62, 19.18], [20.08, 21.3, 21.9, 24.31], [25.21, 26.3, 26.9, 29.24], [30.14, 31.34, 31.94, 34.03], [34.93, 36.19, 36.79, 39.62]]}}, {"day": 5, "dayName": "Friday", "title": "Five minutes, no more", "goals": ["I can understand rules and tips for a presentation.", "I can use must, mustn't and don't have to.", "I can say what is and isn't necessary."], "listening": {"title": "Before the presentation", "intro": "On Friday morning, Elif is getting ready for a short presentation. Maria and Sam help her in the office.", "speakers": {"Elif": "female", "Maria": "female", "Sam": "male"}, "lines": [{"s": "Maria", "t": "Good morning, Elif. Are you ready for two o'clock?"}, {"s": "Elif", "t": "Almost. I'm a little nervous. It's my first presentation in English."}, {"s": "Maria", "t": "Don't worry. It's just for the team. But it must be short. Five minutes, no more."}, {"s": "Elif", "t": "Five minutes. Okay. Do I have to use slides?"}, {"s": "Maria", "t": "No, you don't have to. But slides can help."}, {"s": "Sam", "t": "Use slides! Then people look at the screen, not at you."}, {"s": "Elif", "t": "Good point. Sam, would you mind checking them?"}, {"s": "Sam", "t": "Sure. Hmm, this slide has a lot of words."}, {"s": "Elif", "t": "Is that bad?"}, {"s": "Sam", "t": "A little. People must understand a slide in a few seconds."}, {"s": "Elif", "t": "Okay, I'll cut some words. What else?"}, {"s": "Maria", "t": "One important thing. The bakery's new logo is still a secret. You mustn't show it outside the office."}, {"s": "Elif", "t": "Of course. Do I have to answer questions at the end?"}, {"s": "Maria", "t": "Yes, people will ask a few. But you don't have to know every answer."}, {"s": "Elif", "t": "Really? What do I say if I don't know?"}, {"s": "Maria", "t": "Just say, \"Good question. I'll check and tell you later.\""}, {"s": "Sam", "t": "That's what I always say!"}, {"s": "Elif", "t": "Should I read from my notes?"}, {"s": "Sam", "t": "You can look at them, but you mustn't read every word. Talk to people."}, {"s": "Elif", "t": "Okay. Speak slowly, look at people, smile."}, {"s": "Maria", "t": "Exactly. And you must breathe!"}, {"s": "Elif", "t": "Oh no. Look, my laptop battery is almost dead."}, {"s": "Sam", "t": "Don't panic. There's a charger in the meeting room."}, {"s": "Elif", "t": "Thank you! What would I do without you two?"}, {"s": "Maria", "t": "You'll be great, Elif. See you at two."}], "mcq": [{"q": "When is Elif's presentation?", "options": ["on Monday morning", "at two o'clock", "at three o'clock"], "answer": 1}, {"q": "Does Elif have to use slides?", "options": ["Yes, Maria says she must.", "No, she can't use slides.", "No, but slides can help."], "answer": 2}, {"q": "What mustn't Elif do with the bakery's logo?", "options": ["show it outside the office", "put it on a slide", "send it to Sam"], "answer": 0}, {"q": "What does Sam say about her notes?", "options": ["She must read every word.", "She mustn't read every word.", "She doesn't have to bring them."], "answer": 1}], "gaps": [{"line": 2, "answer": "must"}, {"line": 4, "answer": "don't have to"}, {"line": 6, "answer": "Good point"}, {"line": 11, "answer": "mustn't"}, {"line": 20, "answer": "breathe"}, {"line": 22, "answer": "Don't panic"}]}, "vocab": [{"w": "presentation", "m": "a short talk to show information to a group", "ex": "I have a presentation for the team on Monday."}, {"w": "slides", "m": "pages you show on a screen during a talk", "ex": "Her slides had nice pictures and very few words."}, {"w": "Good point", "m": "you're right; that's a good idea", "ex": "Good point! Let's take the bus, not a taxi."}, {"w": "nervous", "m": "a little afraid and worried", "ex": "I always feel nervous before a test."}, {"w": "battery", "m": "it gives power to a phone or laptop", "ex": "My phone battery is low again."}, {"w": "charger", "m": "you use it to give power to a phone", "ex": "Can I borrow your phone charger?"}, {"w": "Don't panic", "m": "stay calm; don't be very afraid", "ex": "Don't panic. We still have ten minutes."}, {"w": "it went well", "m": "it happened in a good way", "ex": "How was your interview? It went well, thanks."}], "grammar": {"title": "must, mustn't, don't have to", "points": ["must + base verb = it's necessary or very important: You must finish in five minutes.", "mustn't = don't do it; it's not allowed: You mustn't show the logo.", "don't have to = it's not necessary, but you can: You don't have to use slides.", "In American English, people often say have to for must, and can't for mustn't."], "examples": [{"en": "You must be on time.", "note": "necessary"}, {"en": "You mustn't park here.", "note": "not allowed"}, {"en": "You don't have to bring anything.", "note": "not necessary"}, {"en": "She doesn't have to work on Saturday.", "note": "he/she: doesn't have to"}], "tr": "Dikkat: mustn't = yapmamalısın (yasak); don't have to = yapmak zorunda değilsin (gerekli değil).", "exercises": [{"type": "choice", "q": "You ___ smoke in the office. It's not allowed.", "options": ["mustn't", "don't have to", "must"], "answer": 0, "why": "Not allowed = mustn't."}, {"type": "choice", "q": "Tomorrow is Saturday, so I ___ get up early.", "options": ["mustn't", "don't have to", "must"], "answer": 1, "why": "It's not necessary, so use don't have to."}, {"type": "choice", "q": "Your passport is very important. You ___ forget it.", "options": ["don't have to", "mustn't"], "answer": 1, "why": "Forgetting it is a big problem: mustn't."}, {"type": "choice", "q": "Drivers ___ stop at a red light.", "options": ["don't have to", "mustn't", "must"], "answer": 2, "why": "It's necessary and it's the law: must."}, {"type": "type", "q": "The museum is free today. You ___ pay. (not / have to)", "answers": ["don't have to", "do not have to"], "why": "Not necessary = don't have to."}, {"type": "type", "q": "This is a secret. You ___ tell anyone! (must / not)", "answers": ["mustn't", "must not"], "why": "Not allowed = mustn't."}, {"type": "type", "q": "Sam ___ work this weekend. He's free! (not / have to)", "answers": ["doesn't have to", "does not have to"], "why": "He + doesn't have to: it's not necessary."}, {"type": "type", "q": "You ___ be late for the meeting. The client is coming. (must / not)", "answers": ["mustn't", "must not"], "why": "Being late is not okay: mustn't."}]}, "reading": {"title": "Notes to myself", "kind": "notes on Elif's phone", "text": "Friday, 1:30 p.m.\n\nThe presentation is in thirty minutes. Okay, Elif, read this one more time.\n\nBefore: I must charge my laptop. The charger is in the meeting room. I mustn't leave it there afterward! I don't have to wear formal clothes. My blue shirt is fine. I must drink some water and breathe.\n\nDuring: I mustn't read every word from my notes. Look at people and smile. Speak slowly. I must finish in five minutes. Maria is very organized, and she watches the clock! I mustn't show the bakery's new logo outside the office. It's still a secret.\n\nQuestions: I don't have to know every answer. If I don't know, I can say, \"Good question. I'll check and tell you later.\"\n\nAfter: I don't have to stay late. It's Friday, so we can leave at three!\n\nFriday, 3:15 p.m.\n\nUpdate: It went well! I finished in four and a half minutes. Sam asked an easy question, and Maria said, \"Great job.\" My hands were shaking at the start, but nobody noticed. Now I'm going home to sleep for a week!", "questions": [{"q": "How long must the presentation be?", "options": ["thirty minutes", "five minutes or less", "ten minutes"], "answer": 1}, {"q": "What doesn't Elif have to wear?", "options": ["formal clothes", "her blue shirt", "comfortable shoes"], "answer": 0}, {"q": "Why mustn't she show the logo outside the office?", "options": ["It isn't ready.", "Sam doesn't like it.", "It's still a secret."], "answer": 2}, {"q": "How did the presentation go?", "options": ["It went well.", "It was too long.", "She forgot her laptop."], "answer": 0}], "tf": [{"s": "Elif must stay late on Friday.", "answer": false}, {"s": "Elif finished her presentation in less than five minutes.", "answer": true}, {"s": "Maria noticed that Elif's hands were shaking.", "answer": false}], "gloss": {"a": "bir", "after": "sonra (sonrasında)", "afterward": "sonra / ardından", "an": "bir", "and": "ve", "answer": "cevap", "asked": "sordu (ask: sormak)", "at": "-e (look at); saat (at three); başta (at the start)", "bakery's": "fırının", "before": "önce (öncesinde)", "blue": "mavi", "breathe": "nefes almak", "but": "ama", "can": "-ebilir (can: -ebilmek)", "charge": "şarj etmek", "charger": "şarj aleti", "check": "kontrol etmek", "clock": "saat", "clothes": "kıyafetler", "don't": "-me (do not); don't have to: zorunda değil", "drink": "içmek", "during": "sırasında", "easy": "kolay", "elif": "Elif (isim)", "every": "her", "fine": "uygun / yeterli", "finish": "bitirmek", "finished": "bitirdim (finish: bitirmek)", "five": "beş", "for": "boyunca (for a week)", "formal": "resmi", "four": "dört", "friday": "Cuma", "from": "-den", "going": "gidiyorum (go: gitmek)", "good": "güzel / iyi", "great": "harika", "half": "buçuk (four and a half: dört buçuk)", "hands": "ellerim", "have": "(have to: zorunda olmak)", "home": "eve", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-iyorum (I am)", "if": "eğer", "in": "-de; sonra (in thirty minutes)", "is": "-dir / olmak (to be)", "it": "onu / o", "it's": "o ...-dir (it is)", "job": "iş (Great job: Harika iş çıkardın)", "know": "bilmek", "laptop": "dizüstü bilgisayar", "late": "geç", "later": "sonra", "leave": "bırakmak; çıkmak (leave at three)", "logo": "logo", "look": "bak (look at: bakmak)", "m": "p.m. (öğleden sonra)", "maria": "Maria (isim)", "meeting": "toplantı (meeting room)", "minutes": "dakika", "more": "daha (one more time)", "must": "-meliyim (must: zorunda olmak)", "mustn't": "-memeliyim (must not)", "my": "benim", "new": "yeni", "nobody": "hiç kimse", "notes": "notlar", "noticed": "fark etti (notice: fark etmek)", "now": "şimdi", "office": "ofis", "okay": "tamam", "one": "bir", "organized": "düzenli", "outside": "dışında", "p": "p.m. (öğleden sonra)", "people": "insanlar", "presentation": "sunum", "question": "soru", "questions": "sorular", "read": "oku / okumak (read)", "room": "oda", "said": "dedi (say: demek)", "sam": "Sam (isim)", "say": "demek / söylemek", "secret": "sır", "shaking": "titriyordu (shake: titremek)", "she": "o (kadın)", "shirt": "gömlek", "show": "göstermek", "sleep": "uyumak", "slowly": "yavaşça", "smile": "gülümse (smile: gülümsemek)", "so": "bu yüzden", "some": "biraz", "speak": "konuş (speak: konuşmak)", "start": "başlangıç (at the start: başta)", "stay": "kalmak", "still": "hâlâ", "tell": "söylemek", "the": "belirli tanımlık (Türkçede karşılığı yok)", "there": "orada", "thirty": "otuz", "this": "bu", "three": "üç", "time": "kez (one more time: bir kez daha)", "to": "-mek/-mak (fiil öncesi); -mek için", "update": "güncelleme / son durum", "very": "çok", "watches": "takip eder / bakar (watch: izlemek)", "water": "su", "we": "biz", "wear": "giymek", "week": "hafta", "well": "iyi (go well: iyi geçmek)", "went": "geçti (go well: iyi geçmek)", "were": "-iyordu (were: olmak)", "word": "kelime", "you": "sana / sen"}}, "speaking": {"prompt": "Think about the rules at your job or school, now or in the past. What must you do? What don't you have to do?", "steps": ["say where you work or study", "say two things you must do and one thing you mustn't do", "say one thing you don't have to do"], "starters": ["At my job, we must ...", "We mustn't ...", "We don't have to ...", "I like this rule because ..."], "model": "I work at a small hotel. At my job, we must be friendly to every guest, even when we're tired. We must wear a uniform, and it must be clean. We mustn't use our phones at the front desk. That's a strict rule. But we don't have to work every weekend, because we take turns. I also don't have to cook, because there's a chef. I like these rules because they're fair. And the guests are usually happy."}, "writing": {"prompt": "A new person is starting at your work or school. Write a short note with some rules and tips.", "length": "50-80 words", "checklist": ["Use must, mustn't and don't have to.", "Give a reason with because.", "End in a friendly way."], "model": "Hi Ben, welcome to the team! Here are a few things to know. You must sign in at the front desk every morning. You mustn't leave food in the fridge on Fridays, because we clean it in the afternoon. You don't have to wear a suit. Jeans are fine here. And you don't have to bring lunch on Wednesdays, because we often eat together. See you tomorrow! Lisa"}, "audio": {"listen": "audio/w3d5-listen.mp3", "listenT": [[0.3, 3.16], [3.61, 7.77], [8.22, 13.04], [13.49, 16.35], [16.8, 19.49], [19.94, 23.05], [23.5, 26.21], [26.66, 28.82], [29.27, 30.29], [30.74, 34.3], [34.75, 37.03], [37.48, 44.16], [44.61, 47.49], [47.94, 51.93], [52.38, 54.51], [54.96, 58.34], [58.79, 60.17], [60.62, 62.2], [62.65, 66.62], [67.07, 69.84], [70.29, 72.34], [72.79, 75.9], [76.35, 79.0], [79.45, 81.71], [82.16, 84.47]], "read": "audio/w3d5-read.mp3", "speak": "audio/w3d5-speak.mp3", "vocab": "audio/w3d5-vocab.mp3", "vocabT": [[0.3, 1.45, 2.05, 4.85], [5.75, 6.83, 7.43, 10.61], [11.51, 12.49, 13.09, 15.63], [16.53, 17.54, 18.14, 20.46], [21.36, 22.3, 22.9, 24.99], [25.89, 26.91, 27.51, 29.41], [30.31, 31.34, 31.94, 34.2], [35.1, 36.21, 36.81, 39.22]]}}, {"day": 6, "dayName": "Saturday", "title": "The farmers market", "goals": ["I can shop at a market and ask about prices.", "I can say something is too big or not big enough.", "I can talk about my week."], "listening": {"title": "Pumpkins and apples", "intro": "On Saturday morning, Elif and Dan go to a farmers market. Ruth sells apples and honey there.", "speakers": {"Elif": "female", "Dan": "male", "Ruth": "female"}, "lines": [{"s": "Dan", "t": "Look at all these pumpkins! Do you have farmers markets in Turkey?"}, {"s": "Elif", "t": "Yes, there's a big market near my parents' house every week. But I've never seen pumpkins like these!"}, {"s": "Dan", "t": "Halloween is next week. I need one for my door. Oh, this one is perfect."}, {"s": "Elif", "t": "Dan, that pumpkin is too big. You can't carry it home."}, {"s": "Dan", "t": "Sure I can. I run every day. I'm strong enough."}, {"s": "Elif", "t": "Okay, Mr. Strong. Show me."}, {"s": "Dan", "t": "Hmm. Okay, maybe it's a little too heavy."}, {"s": "Elif", "t": "Ha! I told you. Take a smaller one."}, {"s": "Ruth", "t": "Good morning! Would you like to try an apple? They're fresh from our farm."}, {"s": "Elif", "t": "Yes, please. Mmm, it's really sweet! How much are they?"}, {"s": "Ruth", "t": "Three dollars a pound."}, {"s": "Elif", "t": "Can I have two pounds, please? Are they good for apple pie?"}, {"s": "Ruth", "t": "For pie, the green ones are better. These red ones are too sweet for some people."}, {"s": "Dan", "t": "My grandma always uses green apples for her pie."}, {"s": "Elif", "t": "Then two pounds of green ones too, please. Oh, and is this honey from your farm?"}, {"s": "Ruth", "t": "Yes, it is. It's twelve dollars a jar."}, {"s": "Elif", "t": "Twelve dollars? That's a little too expensive for me."}, {"s": "Ruth", "t": "Try some first."}, {"s": "Elif", "t": "Oh, wow. Okay, it's worth it. One jar, please. Do you take cards? I don't have enough cash."}, {"s": "Ruth", "t": "Sure, we do. Here you go. Enjoy!"}, {"s": "Dan", "t": "So, do we have enough apples for a pie?"}, {"s": "Elif", "t": "For one pie? We have enough for three pies!"}, {"s": "Dan", "t": "Perfect. Let's bake one this afternoon at my place."}, {"s": "Elif", "t": "Your kitchen isn't big enough for two people. Remember Wednesday?"}, {"s": "Dan", "t": "True. I hit my elbow three times. Let's use yours."}, {"s": "Elif", "t": "Mine is only a little bigger. But okay!"}, {"s": "Dan", "t": "Great. And tomorrow I'm making menemen for my friends."}, {"s": "Elif", "t": "Good luck. Don't forget the bread!"}], "mcq": [{"q": "Why doesn't Dan take the big pumpkin?", "options": ["It's too expensive.", "It's too heavy.", "It isn't big enough."], "answer": 1}, {"q": "Which apples are better for pie, according to Ruth?", "options": ["the green ones", "the red ones", "the yellow ones"], "answer": 0}, {"q": "Why does Elif buy the honey?", "options": ["Dan wants it for his pie.", "It's cheap.", "She tries it, and it's very good."], "answer": 2}, {"q": "Where are they going to bake the pie?", "options": ["at Dan's place", "in Elif's kitchen", "at Ruth's farm"], "answer": 1}], "gaps": [{"line": 3, "answer": "too big"}, {"line": 4, "answer": "strong enough"}, {"line": 7, "answer": "I told you"}, {"line": 8, "answer": "fresh from"}, {"line": 18, "answer": "worth it"}, {"line": 20, "answer": "enough apples"}]}, "vocab": [{"w": "farmers market", "m": "a market where farmers sell their own food", "ex": "We buy fresh eggs at the farmers market."}, {"w": "fresh from", "m": "very fresh; it just came from that place", "ex": "This bread is fresh from the oven."}, {"w": "a pound", "m": "a US weight, a little under half a kilo", "ex": "I need a pound of ground beef for dinner."}, {"w": "worth it", "m": "good enough for the money or work", "ex": "The ticket was expensive, but the concert was worth it."}, {"w": "a jar of", "m": "a glass container with a lid", "ex": "There's a jar of jam in the fridge."}, {"w": "cash", "m": "money in paper and coins", "ex": "I never carry much cash these days."}, {"w": "in the end", "m": "finally, after everything", "ex": "We wanted pizza, but in the end we cooked at home."}, {"w": "I told you", "m": "I said this before, and I was right", "ex": "I told you the store was closed on Sundays!"}], "grammar": {"title": "too and enough", "points": ["too + adjective = more than you want or need: too big, too expensive.", "adjective + enough = as much as you need: big enough, warm enough.", "enough + noun: enough money, enough apples. Not enough = less than you need.", "Add for + person or to + verb: too heavy for him, old enough to drive."], "examples": [{"en": "This pumpkin is too heavy for me.", "note": "too + adjective"}, {"en": "My kitchen isn't big enough for two people.", "note": "adjective + enough"}, {"en": "Do we have enough apples?", "note": "enough + noun"}, {"en": "He's strong enough to carry it.", "note": "enough + to + verb"}], "exercises": [{"type": "choice", "q": "This coat is ___ small. I need a bigger size.", "options": ["too", "enough", "much"], "answer": 0, "why": "More than you want: too + adjective."}, {"type": "choice", "q": "I'm not tall ___ to reach the top shelf.", "options": ["too", "enough", "very"], "answer": 1, "why": "Enough comes after the adjective: tall enough."}, {"type": "choice", "q": "We don't have ___ chairs for everyone.", "options": ["too", "very", "enough"], "answer": 2, "why": "Enough comes before a noun: enough chairs."}, {"type": "choice", "q": "The soup is ___ hot to eat. Wait a minute.", "options": ["enough", "too"], "answer": 1, "why": "More than you want: too hot to eat."}, {"type": "type", "q": "She's eighteen, so she's old ___ to vote. (enough / too)", "answers": ["enough"], "why": "Adjective + enough + to + verb."}, {"type": "type", "q": "I can't buy this bag. It's ___ expensive. (too / enough)", "answers": ["too"], "why": "More than you want to pay: too expensive."}, {"type": "type", "q": "Is this room ___ for ten people? (big + enough)", "answers": ["big enough"], "why": "Adjective first, then enough: big enough."}, {"type": "type", "q": "The music is ___ for me. I can't hear you! (loud + too)", "answers": ["too loud"], "why": "Too comes before the adjective: too loud."}]}, "reading": {"title": "Apples, honey and a busy week", "kind": "an email to a friend", "text": "Hi Deniz,\n\nWhat a week! I'm writing this with a cup of tea and a piece of warm apple pie.\n\nThis morning, Dan and I went to a farmers market. It was cold, but the sun was out. There were pumpkins everywhere, because Halloween is next week. Dan tried to carry a huge pumpkin, but it was too heavy for him. In the end, he bought a small one.\n\nI bought apples and a jar of honey. The honey was a little too expensive, but it was so good. Then we made an apple pie in my tiny kitchen. It isn't big enough for two people, so Dan hit his head on a cabinet twice!\n\nThe rest of the week was busy too. I joined a gym, my internet finally works, and I gave my first presentation in English. I was nervous, but it was short, and it went well. On Thursday I talked to Mom and Dad on video. I was homesick, but talking to them helped.\n\nNow I think I'm strong enough for a Chicago winter. Well, maybe! Everyone says it gets very cold here.\n\nHow are you? Write soon!\n\nElif", "questions": [{"q": "Why were there pumpkins everywhere?", "options": ["It was a pumpkin festival.", "Halloween is next week.", "Dan wanted to buy them all."], "answer": 1}, {"q": "What happened to Dan in Elif's kitchen?", "options": ["He hit his head twice.", "He burned his hand.", "He dropped the pie."], "answer": 0}, {"q": "What does Elif say about the honey?", "options": ["It was cheap.", "It was too sweet.", "It was a little too expensive, but very good."], "ans  this jar. B: Give it to me. I ___ it. (open)", "answers": ["'ll open", "will open"], "why": "An offer: I'll + base verb."}, {"type": "type", "q": "She ___ late again. She promised. (not / be)", "answers": ["won't be", "will not be"], "why": "A promise in the negative: won't + base verb."}, {"type": "type", "q": "A: Tea or coffee? B: I ___ tea, please. (have)", "answers": ["'ll have", "will have"], "why": "A decision at the moment: I'll have."}]}, "reading": {"title": "Notes from our check-in", "kind": "an email from Maria", "text": "Subject: Notes from our check-in\n\nHi Elif,\n\nThank you for our meeting this morning. Here are my notes, as I promised.\n\nFirst, the good news. You have done great work in your first weeks here. Your presentation last week was clear and well organized, and the whole team enjoyed it.\n\nSecond, one small goal. In our meetings, please share your ideas. You have good ideas, and your English is fine. If something isn't clear, just ask. Nobody will think it's a strange question.\n\nThird, the flower shop project. You offered to help Sam, so I'll tell him today. Ms. Carter, the owner of the shop, is a very nice woman. You will write the emails to her, and Sam will make the designs. She needs the posters by next Monday morning.\n\nFinally, I'll send you an invite for our next check-in in a month. If you have any questions before then, my door is always open.\n\nOh, and don't worry. I won't forget my other promise!\n\nBest,\nMaria", "questions": [{"q": "Why did Maria write this email?", "options": ["to send notes from the meeting", "to invite Elif to a party", "to give Elif a new job"], "answer": 0}, {"q": "What is Elif's goal for meetings?", "options": ["to arrive earlier", "to share her ideas", "to take more notes"], "answer": 1}, {"q": "Who is Ms. Carter?", "options": ["a new designer", "the owner of a flower shop", "Maria's manager"], "answer": 1}, {"q": "When does Ms. Carter need the posters?", "options": ["by Friday", "by next Monday m  it?"}, {"s": "Sam", "t": "Sure. Who's it for? Ms. Carter?"}, {"s": "Elif", "t": "Yes, the woman who owns the shop. Here it is."}, {"s": "Sam", "t": "OK... \"Dear Ms. Carter, I am Elif, the new assistant which works with Sam.\""}, {"s": "Elif", "t": "Is that wrong?"}, {"s": "Sam", "t": "Just one word. For people, we use \"who.\" The assistant who works with Sam."}, {"s": "Elif", "t": "Oh, right. \"Which\" is for things. Like the posters which we're designing."}, {"s": "Sam", "t": "Exactly. You can also use \"that\" for people and things."}, {"s": "Elif", "t": "OK. What about the rest? Is it too long?"}, {"s": "Sam", "t": "A little. Clients like emails that are short and clear."}, {"s": "Elif", "t": "Hmm. I wrote five paragraphs."}, {"s": "Sam", "t": "Five? Let's make it two. What does she need to know?"}, {"s": "Elif", "t": "She needs to send us the photos that she wants on the posters."}, {"s": "Sam", "t": "Good. Put that first. Then ask about the colors."}, {"s": "Elif", "t": "The colors which she likes? She said green in her first email."}, {"s": "Sam", "t": "Right. So just check: \"Is green still the color you want?\""}, {"s": "Elif", "t": "Got it. And how do I finish? \"Kisses, Elif\"?"}, {"s": "Sam", "t": "Ha! No kisses for clients, please. \"Best regards\" is fine."}, {"s": "Elif", "t": "In Turkey, we're more formal in work emails. Here, people seem more relaxed."}, {"s": "Sam", "t": "A bit. But don't use too many emojis, either."}, {"s": "Elif", "t": "OK, no emojis. One more question. Who's the man who called this morning?"}, {"s": "Sam", "t": "That's Mr. Ortiz. He works at the print shop that prints all our posters."}, {"s": "Elif", "t": "I'll add him to my contacts. Thanks, Sam. You're a big help."}, {"s": "Sam", "t": "Anytime. Now send it before you write paragraph number three!"}], "mcq": [{"q": "What is Elif writing?", "options": ["a report for Maria", "an email to a client", "a message to her mom"], "answer": 1}, {"q": "What mistake did Elif make?", "options": ["She used \"which\" for a person.", "She wrote the wrong name.", "She forgot the photos."], "answer": 0}, {"q": "What does Sam say about emails to clients?", "options": ["They should be short and clear.", "They should be very formal.", "They should have a lot of emojis."], "answer": 0}, {"q": "Who is Mr. Ortiz?", "options": ["a new client", "Sam's friend", "a man from the print shop"], "answer": 2}], "gaps": [{"line": 3, "answer": "who owns"}, {"line": 6, "answer": "who works"}, {"line": 10, "answer": "short and clear"}, {"line": 13, "answer": "that she wants"}, {"line": 18, "answer": "Best regards"}, {"line": 22, "answer": "that prints"}]}, "vocab": [{"w": "owns", "m": "has something that belongs to them", "ex": "My uncle owns a small restaurant."}, {"w": "short and clear", "m": "quick and easy to understand", "ex": "Please keep your answers short and clear."}, {"w": "paragraph", "m": "a group of sentences about one idea", "ex": "The first paragraph of your email is too long."}, {"w": "Best regards", "m": "a polite way to end a work email", "ex": "I always end my work emails with \"Best regards.\""}, {"w": "formal", "m": "serious and polite, for work or official situations", "ex": "A job interview is a formal situation."}, {"w": "relaxed", "m": "calm and not very formal", "ex": "Our office feels relaxed on Fridays."}, {"w": "contacts", "m": "the names and numbers saved in your phone", "ex": "I added my new coworker to my phone contacts."}, {"w": "attach", "m": "add a file to an email", "ex": "Can you attach the photos to your email?"}], "grammar": {"title": "Relative clauses: who, which, that", "points": ["Use who for people: the woman who owns the shop.", "Use which for things: the posters which we're designing.", "You can use that for people and things: the man that called, the email that I sent.", "Don't repeat the object: the photos that she sent (not \"sent them\")."], "examples": [{"en": "Ms. Carter is the woman who owns the flower shop.", "note": " ir\n\nDear Elif,\n\nThank you for your email. It was short and clear. I like that!\n\nThe designs are lovely. My favorite is the one which has the big flowers at the top. I've attached six photos that my daughter took in the shop. Please use the photo that shows our front window. It's my favorite.\n\nYes, green is still my favorite color. But maybe you can add a little yellow too.\n\nOne more thing: the man who brings flowers to my shop every morning would like a small poster for his truck. Can you make one for him too? I'll pay for it, of course.\n\nThank you, and say hello to Sam!\n\nBest regards,\nAnn Carter", "questions": [{"q": "Why did Elif write to Ms. Carter?", "options": ["to ask for photos and check the color", "to ask for money", "to invite her to the office"], "answer": 0}, {"q": "Which design does Ms. Carter like best?", "options": ["the green one", "the one with big flowers at the top", "the one with yellow letters"], "answer": 1}, {"q": "Who took the photos?", "options": ["Sam", "Ms. Carter", "Ms. Carter's daughter"], "answer": 2}, {"q": "What extra job does Ms. Carter ask for?", "options": ["a poster for a truck", "a new logo", "a photo of the shop"], "answer": 0}], "tf": [{"s": "Elif attached two designs to her email.", "answer": true}, {"s": "Ms. Carter doesn't like green anymore.", "answer": false}, {"s": "Ms. Carter wants Sam to take more photos.", "answer": false}], "gloss": {"a": "bir", "add": "eklemek", "also": "ayrıca", "and": "ve", "ann": "Ann (isim)", "are": "-dir / -siniz (to be)", "assistant": "asistan", "at": "-de (at the top: üst kısımda)", "attached": "ekledim (attach: eklemek)", "best": "en çok / (best regards: saygılar)", "big": "büyük", "brings": "getiren (bring: getirmek)", "but": "ama", "can": "-ebilir misiniz (can: yapabilmek)", "carter": "Carter (soyadı)", "clear": "açık, anlaşılır", "color": "renk", "could": "-ebilir misiniz (rica)", "course": "(of course: tabii ki)", "daughter": "kızım", "dear": "sevgili, sayın", "demir": "Demir (soyadı)", "designs": "tasarımlar", "early": "ilk, erken (early designs: ilk taslaklar)", "elif": "Elif (isim)", "email": "e-posta", "every": "her", "favorite": "en sevdiğim", "flowers": "çiçekler", "for": "için", "front": "ön", "green": "yeşil", "has": "olan (have: sahip olmak)", "hello": "selam, merhaba", "him": "onun için (for him: ona)", "his": "onun (erkek)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-im (I am)", "i've": "ben ...-dim (I have)", "in": "-de / içinde", "is": "-dir / olmak (to be)", "it": "o / bu", "it's": "o ...-dir (it is)", "like": "sevmek, beğenmek (like best: en çok sevmek)", "little": "biraz (a little: biraz)", "lovely": "çok güzel, hoş", "made": "yaptı (make: yapmak)", "make": "yapmak", "man": "adam", "maybe": "belki", "more": "daha (one more: bir ... daha)", "morning": "sabah", "ms": "Bayan (Ms.)", "my": "benim", "name": "ad, isim", "new": "yeni", "of": "-in / -nın", "on": "üzerinde (work on: üzerinde çalışmak)", "one": "bir tane / o", "our": "bizim", "pay": "ödemek (pay for: parasını ödemek)", "photo": "fotoğraf", "photos": "fotoğraflar", "please": "lütfen", "poster": "afiş", "posters": "afişler", "regards": "saygılar (best regards: saygılarımla)", "sam": "Sam (isim)", "say": "söylemek (say hello: selam söylemek)", "send": "göndermek", "shop": "dükkân", "short": "kısa", "shows": "gösteren (show: göstermek)", "six": "altı", "small": "küçük", "still": "hâlâ", "subject": "konu", "thank": "teşekkür etmek (thank you: teşekkürler)", "that": "ki (ilgi zamiri: -dığınız / -diği)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "thing": "şey", "to": "-e / -a (yönelme)", "too": "de / da (ayrıca)", "took": "çekti (take a photo: çekmek)", "top": "üst kısım", "truck": "kamyonet", "two": "iki", "us": "bize", "use": "kullanmak", "want": "istemek", "was": "idi / -di (to be, geçmiş)", "which": "ki o (-en, ilgi zamiri)", "who": "ki o (-en, ilgi zamiri)", "window": "pencere / vitrin", "with": "ile, birlikte", "works": "çalışıyor (w mp3", "speak": "audio/w4d2-speak.mp3", "vocab": "audio/w4d2-vocab.mp3", "vocabT": [[0.3, 1.26, 1.86, 3.95], [4.85, 6.07, 6.67, 8.86], [9.76, 10.79, 11.39, 14.05], [14.95, 16.17, 16.77, 19.91], [20.81, 21.75, 22.35, 25.08], [25.98, 26.94, 27.54, 29.8], [30.7, 31.7, 32.3, 35.18], [36.08, 37.08, 37.68, 39.82]]}}, {"day": 3, "dayName": "Wednesday", "title": "That's not what I said!", "goals": ["I can report what people said.", "I can use said and told correctly.", "I can fix a small misunderstanding politely."], "listening": {"title": "Too dark?", "intro": "Elif talks to Sam in the office kitchen on Wednesday afternoon.", "speakers": {"Elif": "female", "Sam": "male"}, "lines": [{"s": "Elif", "t": "Sam? Are you OK? You didn't say much in the meeting this morning."}, {"s": "Sam", "t": "I'm fine. I'm just busy."}, {"s": "Elif", "t": "Are you sure? You usually tell me jokes all day."}, {"s": "Sam", "t": "OK... Maria told me something yesterday. She said you didn't like my posters."}, {"s": "Elif", "t": "What? That's not true! What exactly did she say?"}, {"s": "Sam", "t": "She said you thought the colors were too dark."}, {"s": "Elif", "t": "Oh no. I didn't say that. I said the photo was too dark."}, {"s": "Sam", "t": "The photo?"}, {"s": "Elif", "t": "Yes, the photo of the front window. The one that Ms. Carter sent us."}, {"s": "Elif", "t": "I told Maria that your colors were perfect. I love them!"}, {"s": "Sam", "t": "Really? Then why did she tell me that?"}, {"s": "Elif", "t": "Maybe she was in a hurry. She had three meetings yesterday."}, {"s": "Sam", "t": "Hmm, that's true. She told me about it in the hallway, very fast."}, {"s": "Elif", "t": "And my English isn't perfect. Maybe I said it badly."}, {"s": "Sam", "t": "No, I think I heard it wrong. I'm sorry, Elif. I was a little upset all day."}, {"s": "Elif", "t": "I'm sorry too. Next time, I'll talk to you first."}, {"s": "Sam", "t": "That's OK. So, you really like the colors?"}, {"s": "Elif", "t": "I really do. Last night I told my neighbor they were beautiful!"}, {"s": "Sam", "t": "Ha! OK, now I feel much better."}, {"s": "Elif", "t": "So, what about the dark photo? Ms. Carter said it was her favorite."}, {"s": "Sam", "t": "I can make it brighter on my computer. It's easy."}, {"s": "Elif", "t": "Great! I'll tell her we're fixing it."}, {"s": "Sam", "t": "And I'll tell Maria we're a great team again."}, {"s": "Elif", "t": "We never stopped being a great team! Do you want a coffee?"}, {"s": "Sam", "t": "Yes, please. And look, there's one cookie left."}, {"s": "Elif", "t": "You told me the rule: never take the last cookie!"}, {"s": "Sam", "t": "True. So let's share it."}], "mcq": [{"q": "Why is Sam quiet?", "options": ["He is sick.", "He thinks Elif doesn't like his posters.", "He is angry with Maria."], "answer": 1}, {"q": "What did Elif really say to Maria?", "options": ["The colors were too dark.", "The photo was too dark.", "The posters were too big."], "answer": 1}, {"q": "Why did the misunderstanding happen?", "options": ["Maria spoke fast, and Sam heard it wrong.", "Elif sent the wrong email.", "Ms. Carter didn't like the posters."], "answer": 0}, {"q": "How will they fix the dark photo?", "options": ["Ms. Carter will take a new one.", "Sam will make it brighter.", "Elif will choose a different photo."], "answer": 1}], "gaps": [{"line": 3, "answer": "She said"}, {"line": 5, "answer": "were too dark"}, {"line": 6, "answer": "I said"}, {"line": 9, "answer": "told Maria"}, {"line": 14, "answer": "heard it wrong"}, {"line": 19, "answer": "it was her favorite"}]}, "vocab": [{"w": "That's not true", "m": "that is wrong", "ex": "That's not true! I never said that."}, {"w": "exactly", "m": "used to ask for all the details", "ex": "What exactly do you need?"}, {"w": "in a hurry", "m": "doing things fast because you have little time", "ex": "Sorry, I can't talk now. I'm in a hurry."}, {"w": "hallway", "m": "a long space between rooms", "ex": "Let's talk in the hallway."}, {"w": "heard it wrong", "m": "understood the words in the wrong way", "ex": "I thought he said Tuesday, but I heard it wrong."}, {"w": "upset", "m": "unhappy or worried because of a problem", "ex": "She was upset because she missed the bus."}, {"w": "brighter", "m": "with more light", "ex": "This room is brighter in the morning."}, {"w": "misunderstanding", "m": "when people understand something in the wrong way", "ex": "It was just a small misunderstanding."}], "grammar": {"title": "Reported speech: said and told", "points": ["Use said without a person: She said (that) the photo was dark.", "Use told + a person: She told me (that) the photo was dark.", "Move the verb one step back: is → was, like → liked, can → could, will → would.", "Change the pronouns: \"I love it.\" → She said she loved it."], "examples": [{"en": "\"The photo is too dark.\" → I said the photo was too dark.", "note": "is → was"}, {"en": "\"I love your colors.\" → She told him she loved his colors.", "note": "told + person"}, {"en": "\"I can help.\" → He said he could help.", "note": "can → could"}, {"en": "\"I'll call you.\" → She told me she would call me.", "note": "will → would"}], "tr": "Türkçedeki \"dedi\", İngilizcede hem said hem told olabilir; ama told'dan sonra mutlaka kişi gelir: told me, told Sam.", "exercises": [{"type": "choice", "q": "She ___ me that she was tired.", "options": ["said", "told", "say"], "answer": 1, "why": "Told + a person (me)."}, {"type": "choice", "q": "He ___ that the bus was late.", "options": ["told", "said", "told to"], "answer": 1, "why": "There's no person after the verb, so use said."}, {"type": "choice", "q": "\"I am hungry.\" → Yesterday, Dan said he ___ hungry.", "options": ["is", "was", "were"], "answer": 1, "why": "Move the tense back: am → was."}, {"type": "choice", "q": "\"I can drive.\" → Sam told us he ___ drive.", "options": ["could", "would", "should"], "answer": 0, "why": "In reported speech, can → could."}, {"type": "type", "q": "\"I'm tired.\" → Last night, Elif said she ___ tired. (be)", "answers": ["was"], "why": "Move the tense back: am → was."}, {"type": "type", "q": "\"I'll send it tomorrow.\" → Maria said she ___ it the next day. (send)", "answers": ["would send", "'d send"], "why": "will → would."}, {"type": "type", "q": "Sam ___ me the meeting was at ten. (tell)", "answers": ["told"], "why": "Told + a person; tell → told."}, {"type": "type", "q": "\"I want pizza.\" → At lunch, Sam said he ___ pizza. (want)", "answers": ["wanted"], "why": "Move the tense back: want → wanted."}]}, "reading": {"title": "A lesson about talking", "kind": "Elif's diary", "text": "Wednesday night\n\nToday I learned an important lesson about talking to people.\n\nYesterday, Ms. Carter sent us some photos for her posters. One photo was very dark, so I told Maria, \"The photo is too dark.\" But Maria was in a hurry, and she said something quick to Sam in the hallway. Sam thought I didn't like his colors!\n\nThis morning, Sam was very quiet. He didn't tell any jokes. In the afternoon, I asked him about it. He said Maria told him I didn't like his posters. I was shocked! I told him I loved his colors. And it's true. They're beautiful.\n\nThen he said he was sorry, and I said I was sorry too. It was just a small misunderstanding. We laughed about it in the kitchen, and we shared the last cookie.\n\nLater, Maria came to my desk. Sam told her the whole story. She said, \"I'm so sorry, Elif. I'll listen more carefully next time.\"\n\nMom called tonight, and I told her everything. She said small problems were normal in a new job. Then she asked about my dinner, of course!", "questions": [{"q": "Why did Elif talk to Maria about the photo?", "options": ["because it was too dark", "because it was too small", "because it was from the wrong shop"], "answer": 0}, {"q": "What did Sam think?", "options": ["Elif didn't like his colors.", "Maria was angry with him.", "Ms. Carter didn't like the posters."], "answer": 0}, {"q": "What did Maria say to Elif later?", "options": ["She said she was busy.", "She said she was sorry.", "She said Sam was wrong."], "answer": 1}, {"q": "What did Elif's mom say?", "options": ["Small problems were normal in a new job.", "Elif should find a new job.", "Sam wasn't a good friend."], "answer": 0}], "tf": [{"s": "Sam told a lot of jokes this morning.", "answer": false}, {"s": "Elif and Sam shared the last cookie.", "answer": true}, {"s": "Elif told her mom about the problem.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında / -e (laugh about)", "afternoon": "öğleden sonra", "an": "bir", "and": "ve", "any": "hiç", "asked": "sordu (ask: sormak)", "beautiful": "güzel", "but": "ama", "called": "aradı (call: aramak)", "came": "geldi (come: gelmek)", "carefully": "dikkatle, dikkatli", "carter": "Carter (soyadı)", "colors": "renkler", "cookie": "kurabiye", "course": "(of course: tabii ki)", "dark": "karanlık, koyu", "desk": "masa", "didn't": "-medi (did not)", "dinner": "akşam yemeği", "elif": "Elif (isim)", "everything": "her şeyi", "for": "için", "hallway": "koridor", "he": "o (erkek)", "her": "ona / onun (kadın)", "him": "ona / onu (erkek)", "his": "onun (erkek)", "hurry": "acele (in a hurry: aceleyle)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-im (I am)", "important": "önemli", "in": "-de / içinde (in a hurry: aceleyle)", "is": "-dir / olmak (to be)", "it": "o / bunu", "it's": "o ...-dir (it is)", "job": "iş", "jokes": "şakalar", "just": "sadece", "kitchen": "mutfak", "last": "son", "later": "sonra, daha sonra", "laughed": "güldük (laugh: gülmek)", "learned": "öğrendim (learn: öğrenmek)", "lesson": "ders", "like": "beğenmek, sevmek", "listen": "dinlemek", "loved": "çok sevdiğimi (love: sevmek)", "maria": "Maria (isim)", "misunderstanding": "yanlış anlama", "mom": "annem", "more": "daha", "morning": "sabah", "ms": "Bayan (Ms.)", "my": "benim", "new": "yeni", "next": "bir sonraki", "night": "gece", "normal": "normal", "of": "-in / -nın", "one": "bir", "people": "insanlar", "photo": "fotoğraf", "photos": "fotoğraflar", "posters": "afişler", "problems": "sorunlar", "quick": "hızlı, kısa", "quiet": "sessiz", "said": "dedi, söyledi (say: söylemek)", "sam": "Sam (isim)", "sent": "gönderdi (send: göndermek)", "shared": "paylaştık (share: paylaşmak)", "she": "o (kadın)", "shocked": "şaşkın, şoke olmuş", "small": "küçük", "so": "bu yüzden / çok (so sorry)", "some": "birkaç", "something": "bir şey", "sorry": "üzgün (I'm sorry: özür dilerim)", "story": "hikâye, olay", "talking": "konuşma (talk: konuşmak)", "tell": "anlatmak (tell jokes: şaka yapmak)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "then": "sonra", "they're": "onlar ...-dir (they are)", "this": "bu", "thought": "sandı (think: düşünmek)", "time": "sefer, kez", "to": "-e / -a, ile (talk to: ile konuşmak)", "today": "bugün", "told": "söyledi, anlattı (tell: söylemek)", "tonight": "bu akşam", "too": "fazla, çok (too dark) / de, da (ayrıca)", "true": "doğru", "us": "bize / bizi", "very": "çok", "was": "idi / -di (to be, geçmiş)", "we": "biz", "wednesday": "çarşamba", "were": "-dı / -di (to be, geçmiş)", "whole": "bütün, tüm", "yesterday": "dün"}}, "speaking": {"prompt": "Talk about a small misunderstanding in your life. What happened, and what did people say?", "steps": ["say who was there and what happened", "report what people said (said / told)", "say how you fixed it"], "starters": ["Once, my friend told me that ...", "I thought she said ...", "But she said ...", "In the end, we ..."], "model": "Last year, my friend told me that her party was on Saturday. So on Saturday, I put on my best dress and went to her house. But nobody was there! I called her, and she said the party was on Sunday. She told me it was in her message. I checked, and she was right. I read it wrong! We laughed a lot. The next day, I went to the party, and I brought a big cake to say sorry."}, "writing": {"prompt": "Write a short message to a friend. Tell them what your boss or a coworker said to you today.", "length": "50-80 words", "checklist": ["Use said at least once.", "Use told + a person at least once.", "Move the tense back (is → was, can → could)."], "model": "Hi Lisa! Guess what? My boss called me into her office today. I was so nervous! But she said she was very happy with my work. She told me I could lead the next project. Then my coworker Tom said he wanted to help me. I told him he was the best. Let's celebrate on Friday! Are you free after work?"}, "audio": {"listen": "audio/w4d3-listen.mp3", "listenT": [[0.3, 4.14], [4.59, 6.19], [6.64, 9.56], [10.01, 14.96], [15.41, 18.44], [18.89, 21.11], [21.56, 25.17], [25.62, 26.51], [26.96, 31.4], [31.85, 35.22], [35.67, 37.67], [38.12, 41.54], [41.99, 45.66], [46.11, 49.46], [49.91, 54.49], [54.94, 57.89], [58.34, 60.75], [61.2, 64.78], [65.23, 67.22], [67.67, 71.93], [72.38, 75.45], [75.9, 77.87], [78.32, 80.77], [81.22, 84.34], [84.79, 87.2], [87.65, 90.57], [91.02, 92.3]], "read": "audio/w4d3-read.mp3", "speak": "audio/w4d3-speak.mp3", "vocab": "audio/w4d3-vocab.mp3", "vocabT": [[0.3, 1.49, 2.09, 4.31], [5.21, 6.3, 6.9, 8.48], [9.38, 10.49, 11.09, 13.65], [14.55, 15.49, 16.09, 17.58], [18.48, 19.63, 20.23, 22.9], [23.8, 24.74, 25.34, 27.39], [28.29, 29.29, 29.89, 31.77], [32.67, 33.95, 34.55, 36.72]]}}, {"day": 4, "dayName": "Thursday", "title": "Lunch for the team", "goals": ["I can order food for a group on the phone.", "I can say what I want and prefer with would like and would rather.", "I can use a few and a little."], "listening": {"title": "Ten sandwiches, please", "intro": "Elif plans a team lunch with Sam, then calls Nina at a sandwich shop.", "speakers": {"Elif": "female", "Sam": "male", "Nina": "female"}, "lines": [{"s": "Sam", "t": "So, Maria wants you to order lunch for the whole team?"}, {"s": "Elif", "t": "Yes, for eight people. It's my first time. Can you help me?"}, {"s": "Sam", "t": "Sure. The sandwich place on the corner is good. Or would you rather get pizza?"}, {"s": "Elif", "t": "I'd rather get sandwiches. We had pizza last time, right?"}, {"s": "Sam", "t": "Right. OK, I'd like a chicken sandwich, please."}, {"s": "Elif", "t": "Chicken, of course. And Maria said she'd like a vegetable sandwich."}, {"s": "Sam", "t": "Good. Get a few extra sandwiches, too. People are always hungry."}, {"s": "Elif", "t": "How many? Two?"}, {"s": "Sam", "t": "Two is perfect. And maybe a little fruit for dessert."}, {"s": "Elif", "t": "OK. I'll call them now."}, {"s": "Nina", "t": "Hi, this is Nina. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like to order lunch for a meeting, please. Ten sandwiches."}, {"s": "Nina", "t": "Sure. What would you like?"}, {"s": "Elif", "t": "Six chicken sandwiches and four vegetable sandwiches, please."}, {"s": "Nina", "t": "Would you like chips with that?"}, {"s": "Elif", "t": "Yes, please. And a few bottles of water."}, {"s": "Nina", "t": "How many bottles?"}, {"s": "Elif", "t": "Ten, please. Oh, and could you put the mayo on the side? Some people don't like it."}, {"s": "Nina", "t": "No problem. Would you rather pick it up, or should we deliver it?"}, {"s": "Elif", "t": "Delivery, please. We're very busy, so I'd rather stay at the office."}, {"s": "Nina", "t": "Sure. It'll be there at twelve thirty. What's the address?"}, {"s": "Elif", "t": "It's the design office across from the bus stop, on the second floor."}, {"s": "Nina", "t": "Got it. And what's the name for the order?"}, {"s": "Elif", "t": "Elif. E-L-I-F."}, {"s": "Nina", "t": "Thanks, Elif. See you at twelve thirty!"}, {"s": "Sam", "t": "See? That was easy. You're a pro now."}, {"s": "Elif", "t": "Not yet. I'd like a little more practice first!"}], "mcq": [{"q": "How many sandwiches does Elif order?", "options": ["eight", "ten", "twelve"], "answer": 1}, {"q": "Why does Elif choose sandwiches?", "options": ["They had pizza last time.", "Sandwiches are cheaper.", "Maria doesn't like pizza."], "answer": 0}, {"q": "What does Elif ask about the mayo?", "options": ["She doesn't want any mayo.", "She wants it on the side.", "She wants extra mayo."], "answer": 1}, {"q": "When will the food arrive?", "options": ["at twelve", "at twelve thirty", "at one"], "answer": 1}], "gaps": [{"line": 2, "answer": "would you rather"}, {"line": 4, "answer": "I'd like"}, {"line": 6, "answer": "a few extra"}, {"line": 8, "answer": "a little fruit"}, {"line": 15, "answer": "a few bottles"}, {"line": 19, "answer": "I'd rather stay"}]}, "vocab": [{"w": "order lunch", "m": "ask a restaurant to make lunch for you", "ex": "Let's order lunch for the meeting."}, {"w": "extra", "m": "more than you need, just in case", "ex": "Bring an extra jacket. It gets cold at night."}, {"w": "for dessert", "m": "as the sweet food after a meal", "ex": "We had ice cream for dessert."}, {"w": "on the side", "m": "next to the food, not on it", "ex": "Can I have the sauce on the side, please?"}, {"w": "pick it up", "m": "go to a place and get it", "ex": "My order is ready, so I'm going to pick it up."}, {"w": "deliver", "m": "bring something to a home or office", "ex": "Do they deliver to this street?"}, {"w": "Got it", "m": "I understand", "ex": "Turn left at the bank? Got it."}, {"w": "a pro", "m": "a person who is very good at something", "ex": "After a month, she was a pro at the new app."}], "grammar": {"title": "Would like, would rather, a few, a little", "points": ["Would like = want, but more polite: I'd like a sandwich. Would you like chips?", "Would rather = prefer. Use the base verb after it: I'd rather stay here.", "A few + plural nouns: a few bottles, a few days.", "A little + uncountable nouns: a little fruit, a little time."], "examples": [{"en": "I'd like a chicken sandwich, please.", "note": "a polite order"}, {"en": "Would you rather walk or take the bus?", "note": "asking about a choice"}, {"en": "I'd rather not go out tonight.", "note": "negative: I'd rather not"}, {"en": "Can I have a little sugar and a few cookies?", "note": "uncountable / xt few days.", "I can use the present continuous for future plans.", "I can talk about deadlines at work."], "listening": {"title": "A late Friday", "intro": "Elif and Sam are working late at the office on Friday evening. Then Maria arrives.", "speakers": {"Elif": "female", "Sam": "male", "Maria": "female"}, "lines": [{"s": "Sam", "t": "It's seven o'clock on a Friday. Usually we leave at five!"}, {"s": "Elif", "t": "I know. But the posters have to be ready on Monday morning."}, {"s": "Sam", "t": "Right. Ms. Carter is coming to the office at nine."}, {"s": "Elif", "t": "So we're finishing everything tonight. How many are left?"}, {"s": "Sam", "t": "Two. The big window poster and the small one for the truck."}, {"s": "Sam", "t": "I'm working on the window poster now. Can you check the text on the truck one?"}, {"s": "Elif", "t": "Sure. Oh no, there's a mistake in the phone number."}, {"s": "Sam", "t": "Good catch! Can you fix it?"}, {"s": "Elif", "t": "Done. Hey, someone is at the door."}, {"s": "Maria", "t": "Hi, you two! I brought pizza. Sam, you said you'd rather have pizza, right?"}, {"s": "Sam", "t": "Maria, you're the best!"}, {"s": "Maria", "t": "So, how's it going?"}, {"s": "Elif", "t": "Good. We're almost done. Sam is finishing the last big poster."}, {"s": "Maria", "t": "Great work. I'm meeting Ms. Carter at nine on Monday. Can you both be there?"}, {"s": "Elif", "t": "Of course. I'm coming in early to print everything."}, {"s": "Maria", "t": "Perfect. OK, I'm going home now. Don't stay too late!"}, {"s": "Sam", "t": "We won't. Thanks for the pizza!"}, {"s": "Sam", "t": "So, Elif, what are you doing tomorrow?"}, {"s": "Elif", "t": "Nothing special. I'm cleaning my apartment, and my mom is calling me in the morning."}, {"s": "Sam", "t": "Some of us are having brunch at the café on the corner at eleven. Do you want to come?"}, {"s": "Elif", "t": "Brunch? Sure, I'd love to! Who's coming?"}, {"s": "Sam", "t": "Oh, just a few people from work. Nothing big."}, {"s": "Elif", "t": "Sounds fun. I'm not doing anything in the afternoon, either."}, {"s": "Sam", "t": "Great. Now let's finish. I'm not sleeping here tonight!"}, {"s": "Elif", "t": "Me neither. Ten more minutes!"}], "mcq": [{"q": "Why are Elif and Sam working late?", "options": ["The posters have to be ready on Monday.", "Maria is angry with them.", "Their computers were broken."], "answer": 0}, {"q": "What mistake does Elif find?", "options": ["a wrong color", "a mistake in the phone number", "a wrong date"], "answer": 1}, {"q": "Why is Elif coming in early on Monday?", "options": ["to meet Ms. Carter at her shop", "to print everything", "to call her mom"], "answer": 1}, {"q": "What does Sam invite Elif to?", "options": ["a basketball game", "brunch at a café", "a party at Dan's"], "answer": 1}], "gaps": [{"line": 2, "answer": "is coming"}, {"line": 5, "answer": "I'm working on"}, {"line": 13, "answer": "I'm meeting"}, {"line": 17, "answer": "are you doing"}, {"line": 18, "answer": "is calling"}, {"line": 19, "answer": "are having"}]}, "vocab": [{"w": "deadline", "m": "the last day or time to finish something", "ex": "The deadline for the report is Friday."}, {"w": "work late", "m": "stay at work after the usual time", "ex": "I have to work late tonight."}, {"w": "Good catch", "m": "well done, you found a mistake", "ex": "You saw the wrong date? Good catch!"}, {"w": "How's it going?", "m": "How are things?", "ex": "Hi, Tom! How's it going?"}, {"w": "come in early", "m": "arrive at work before the usual time", "ex": "Can you come in early tomorrow?"}, {"w": "Nothing special", "m": "nothing different or exciting", "ex": "What did you do yesterday? Nothing special."}, {"w": "brunch", "m": "a late breakfast or an early lunch", "ex": "We often have brunch on Sundays."}, {"w": "Me neither", "m": "I don't either", "ex": "\"I don't like cold weather.\" \"Me neither.\""}], "grammar": {"title": "Present continuous for future plans", "points": ["Use am / is / are + -ing for fixe ou feel? It's your first birthday in Chicago!"}, {"s": "Elif", "t": "Honestly, I was worried about today. I thought it was going to be boring."}, {"s": "Sam", "t": "Boring? With us? Never!"}, {"s": "Elif", "t": "My mom called this morning, and I felt a little sad. But now I'm so excited."}, {"s": "Maria", "t": "This week was tiring, so we all needed a party."}, {"s": "Sam", "t": "Yes! Last night was exhausting. I was so tired."}, {"s": "Elif", "t": "But the posters are finished. And this cake is delicious."}, {"s": "Maria", "t": "Oh, and here's a card from the whole team."}, {"s": "Elif", "t": "Thank you! Wait, it says, \"To the most interesting assistant in Chicago.\""}, {"s": "Sam", "t": "That was my idea. You're never boring!"}, {"s": "Elif", "t": "You're all so kind. I'm really happy I came to Chicago."}, {"s": "Maria", "t": "We're happy too. Now, who wants the first piece?"}, {"s": "Sam", "t": "Me! I'm very interested in that big one."}], "mcq": [{"q": "What did Maria say to the team?", "options": ["\"It's Elif's birthday on Saturday.\"", "\"Let's all have brunch on Saturday. I'm bringing a cake.\"", "\"Elif is leaving the company.\""], "answer": 1}, {"q": "What kind of cake is it?", "options": ["chocolate", "baklava", "lemon"], "answer": 0}, {"q": "How did Elif feel this morning?", "options": ["excited", "a little sad", "angry"], "answer": 1}, {"q": "What does the card say?", "options": ["To the most interesting assistant in Chicago", "To the best cook in Chicago", "Happy first month in Chicago"], "answer": 0}], "gaps": [{"line": 3, "answer": "so surprised"}, {"line": 9, "answer": "disappointed"}, {"line": 12, "answer": "embarrassing"}, {"line": 15, "answer": "boring"}, {"line": 18, "answer": "tiring"}, {"line": 22, "answer": "interesting"}]}, "vocab": [{"w": "Surprise!", "m": "what people shout at a secret party", "ex": "When she opened the door, we all shouted, \"Surprise!\""}, {"w": "a promise is a promise", "m": "you must do what you promised", "ex": "I said I'd help you move, and a promise is a promise."}, {"w": "Make a wish", "m": "think of something you really want", "ex": "It's your birthday. Close your eyes and make a wish!"}, {"w": "blow out the candles", "m": "stop the small fires on a cake with your breath", "ex": "Now blow out the candles!"}, {"w": "embarrassing", "m": "making you feel shy or silly in front of people", "ex": "I fell on the bus. It was so embarrassing!"}, {"w": "exhausting", "m": "making you very, very tired", "ex": "Moving to a new apartment is exhausting."}, {"w": "Honestly", "m": "to tell the truth", "ex": "Honestly, I don't like coffee very much."}, {"w": "piece", "m": "one part of something, like cake", "ex": "Can I have a piece of cake?"}], "grammar": {"title": "Adjectives with -ed and -ing", "points": ["-ed adjectives describe how a person feels: I'm bored. She's surprised.", "-ing adjectives describe the thing that causes the feeling: The movie is boring.", "Common pairs: tired / tiring, excited / exciting, interested / interesting, embarrassed / embarrassing.", "Be careful: \"I'm boring\" means other people think you are boring!"], "examples": [{"en": "The meeting was boring, so I was bored.", "note": "thing -ing, person -ed"}, {"en": "I'm so excited about the trip.", "note": "a feeling"}, {"en": "Friday was a tiring day.", "note": "the day made me tired"}, {"en": "Are you interested in art?", "note": "interested in + noun"}], "tr": "Kişi için -ed (I'm bored = sıkıldım), şey için -ing (it's boring = sıkıcı).", "exercises": [{"type": "choice", "q": "The movie was so long and ___.", "options": ["bored", "boring"], "answer": 1, "why": "The movie causes the feeling: -ing."}, {"type": "choice", "q": "I'm ___ in learning Spanish.", "options": ["interested", "interesting"], "answer": 0, "why": "It's how I feel: -ed. Interested in + noun."}, {"type": "choice", "q": "We were all ___ when we heard the good news.", "options": ["excited", "exciting"], "answer": 0, "why": "It's how people feel: -ed."}, {"type": "choice", "q": "Moving to a new city can be ___.", "options": ["tired", "tiring"], "answer": 1, "why": "Moving causes the feeling: -ing."}, {"type": "type", "q": "After the long walk, I felt really ___. (tire)", "answers": ["tired"], "why": "How I feel: -ed."}, {"type": "type", "q": "That was an ___ story! Tell me more. (interest)", "answers": ["interesting"], "why": "The story causes the feeling: -ing."}, {"type": "type", "q": "I fell in front of everyone. It was so ___. (embarrass)", "answers": ["embarrassing"], "why": "The situation causes the feeling: -ing."}, {"type": "type", "q": "She was ___ when she saw the cake. (surprise)", "answers": ["surprised"], "why": "How she felt: -ed."}]}, "reading": {"title": "My first Chicago birthday", "kind": "Elif's diary", "text": "Saturday night\n\nToday was my first birthday in Chicago, and it was amazing.\n\nThis morning I felt a little sad. Mom called at seven, and the whole family sang for me on video. I was happy to see them, but I was also homesick. I thought my day was going to be quiet and boring.\n\nThen I went to brunch with Sam. When I arrived at the café, the whole team was there! Everyone shouted, \"Surprise!\" I was so surprised that I almost dropped my bag.\n\nMaria brought a big chocolate cake. She didn't tell anyone about my birthday. She just ordered a cake! Everyone sang \"Happy Birthday\" very loudly, and people in the café looked at us. It was a little embarrassing, but it was fun.\n\nThe team gave me a card. Sam wrote the funniest message in it. Then we talked for three hours, and nobody talked about work. Not even Maria!\n\nWhen I got home, there was a small box outside my door. It was from Dan: a cookbook and a note. How did he know? I have no idea!\n\nThis week was tiring, but today was perfect. I'm tired now, but I'm very happy.", "questions": [{"q": "How did Elif feel in the morning?", "options": ["excited", "a little sad and homesick", "angry"], "answer": 1}, {"q": "What did everyone shout at the café?", "options": ["\"Happy New Year!\"", "\"Surprise!\"", "\"Welcome!\""], "answer": 1}, {"q": "Why was it a little embarrassing?", "options": ["Everyone sang loudly in the café.", "Elif dropped the cake.", "Elif forgot someone's name."], "answer": 0}, {"q": "What did Dan give Elif?", "options": ["a cake", "flowers", "a cookbook and a note"], "answer": 2}], "tf": [{"s": "Maria told everyone about Elif's birthday.", "answer": false}, {"s": "Elif's family sang for her on video.", "answer": true}, {"s": "The team talked about work for three hours.", "answer": false}], "gloss": {"a": "bir", "about": "hakkında / -i (tell about)", "almost": "neredeyse", "also": "aynı zamanda, de", "amazing": "harika, muhteşem", "and": "ve", "anyone": "hiç kimseye", "arrived": "vardım (arrive: varmak)", "at": "-de / -e (at seven: yedide; look at: bakmak)", "bag": "çanta", "be": "olmak", "big": "büyük", "birthday": "doğum günü", "boring": "sıkıcı", "box": "kutu", "brought": "getirdi (bring: getirmek)", "brunch": "brunch (geç kahvaltı)", "but": "ama", "caf": "kafe (café)", "cake": "pasta", "called": "aradı (call: aramak)", "card": "kart", "chicago": "Chicago (şehir)", "chocolate": "çikolatalı", "cookbook": "yemek kitabı", "dan": "Dan (isim)", "day": "gün", "did": "soru yardımcı fiili (geçmiş)", "didn't": "-medi (did not)", "door": "kapı", "dropped": "düşürüyordum (drop: düşürmek)", "embarrassing": "utandırıcı", "even": "bile (not even: ... bile değil)", "everyone": "herkes", "family": "aile", "felt": "hissettim (feel: hissetmek)", "first": "ilk", "for": "için / boyunca (for three hours)", "from": "-den (gelen)", "fun": "eğlenceli", "funniest": "en komik", "gave": "verdi (give: vermek)", "going": "(was going to: -ecekti)", "got": "geldim (get home: eve varmak)", "happy": "mutlu", "have": "(have no idea: hiç bilmiyorum)", "he": "o (erkek)", "home": "eve", "homesick": "evimi özlemiş, memleket hasreti", "hours": "saat", "how": "nasıl", "i": "ben", "i'm": "ben ...-im (I am)", "i use ...", "The only embarrassing part was ..."], "model": "I remember my twenty-fifth birthday very well. My friends told me we were going to a quiet dinner, but it was a surprise party! When I opened the door, everyone shouted \"Surprise!\" I was so surprised that I started laughing. The party was amazing, and the music was really exciting. The only embarrassing part was the singing, because my uncle sang very loudly. At the end of the night, I was tired but very happy. It's still my favorite birthday."}, "writing": {"prompt": "Write a short thank-you message to friends or coworkers after a birthday or party.", "length": "50-80 words", "checklist": ["Say thank you and say what you liked.", "Use at least two -ed adjectives (surprised, excited ...).", "Use at least two -ing adjectives (amazing, interesting ...)."], "model": "Hi everyone,\n\nThank you so much for yesterday! I was really surprised when I saw you all at the restaurant. The food was amazing, and the cake was delicious. I was a little embarrassed when you sang so loudly, but it was a lot of fun. After a tiring week, it was the perfect evening. I'm so lucky to work with you!\n\nLove,\nKate"}, "partner": {"questions": ["What will you do to improve your English this month? Make three promises with I'll.", "Describe a person who is important in your life and a thing that you use every day.", "Think of something a coworker or family member said to you this week. Report it with said or told.", "You're ordering lunch for five people. What would you like to get? Would you rather pick it up or have it delivered?", "What are you doing this weekend? Talk about three plans with days or times.", "When did you last feel really excited? What was the most boring part of your week?"], "roleplay": "Imagine you are calling a restaurant to order lunch for your team. Play both parts and record yourself. As the worker, ask: \"What would you like?\" and \"Would you rather pick it up?\" As the customer, order a few sandwiches and a little fruit, and say when you're picking it up."}, "audio": {"listen": "audio/w4d6-listen.mp3", "listenT": [[0.3, 1.43], [1.88, 6.36], [6.81, 8.67], [9.12, 11.51], [11.96, 14.88], [15.33, 19.92], [20.37, 21.6], [22.05, 25.76], [26.21, 28.97], [29.42, 34.13], [34.58, 37.1], [37.55, 40.47], [40.92, 44.93], [45.38, 48.2], [48.65, 52.32], [52.77, 56.86], [57.31, 58.83], [59.28, 64.27], [64.72, 67.66], [68.11, 71.04], [71.49, 74.81], [75.26, 77.85], [78.3, 82.71], [83.16, 85.4], [85.85, 89.31], [89.76, 92.49], [92.94, 95.22]], "read": "audio/w4d6-read.mp3", "speak": "audio/w4d6-speak.mp3", "vocab": "audio/w4d6-vocab.mp3", "vocabT": [[0.3, 1.37, 1.97, 5.06], [5.96, 7.65, 8.25, 11.34], [12.24, 13.37, 13.97, 16.85], [17.75, 19.16, 19.76, 21.34], [22.24, 23.26, 23.86, 26.57], [27.47, 28.69, 29.29, 31.72], [32.62, 33.68, 34.28, 36.78], [37.68, 38.6, 39.2, 40.78]]}}], "sunday": {"quiz": [{"q": "Don't worry. I ___ tell anyone your secret.", "options": ["won't", "don't", "am not"], "answer": 0, "why": "A promise: won't + base verb."}, {"q": "The woman ___ owns the flower shop is very nice.", "options": ["which", "who", "what"], "answer": 1, "why": "The woman is a person, so use who."}, {"q": "Sam ___ me that the meeting was at ten.", "options": ["said", "told", "says"], "answer": 1, "why": "Told + a person (me)."}, {"q": "\"I love it.\" → She said she ___ it.", "options": ["loved", "loving", "love to"], "answer": 0, "why": "Move the tense back: love → loved."}, {"q": "Can I have ___ milk in my coffee, please?", "options": ["a few", "a little", "many"], "answer": 1, "why": "Milk is uncountable, so use a little."}, {"q": "I'd rather ___ the bus than walk in the rain.", "options": ["take", "to take", "taking"], "answer": 0, "why": "After would rather, use the base verb."}, {"q": "What ___ you doing on Saturday night?", "options": ["do", "are", "will"], "answer": 1, "why": "Present continuous for plans: are + you + -ing."}, {"q": "The meeting was two hours long. It was so ___." const GAME_LEVELS = ["Easy start", "Warm up", "Getting there", "Steady", "Strong", "Sharp", "Expert", "Master", "Champion", "Legend"];
const GAME_Q = 12;
function gameTime(lv) { return Math.max(2.6, 9 - 0.7 * (lv - 1)); }

function renderGame() {

  info.style.marginTop = "14px";
  app.append(info);
  const grid = h("div", { class: "glevels" });
  GAME_LEVELS.forEach((name, i) => {
    const lv = i + 1, open = lv <= G.unlocked, st = G.stars[lv] || 0;
    const b = h("button", { class: "glevel" + (open ? "" : " locked") + (st ? " won" : "") });
    b.style.setProperty("--k", "hsl(" + (200 - lv * 17) + " 62% 46%)");
    b.innerHTML = '<span class="gl-n">' + (open ? lv : LOCK) + '</span><b>' + name + '</b><span class="gl-s">' + [1, 2, 3].map((x) => '<i class="' + (x <= st ? "on" : "") + '">★</i>').join("") + '</span><small>' + (G.best[lv] ? "Best " + G.best[lv] : open ? gameTime(lv).toFixed(1) + "s per word" : "Locked") + "</small>";
    b.onclick = () => { if (!open) { toast("Pass level " + (lv - 1) + " first."); return; } playGame(lv); };
    grid.append(b);
  });
  app.append(grid);
}
function gameRound(lv) {
  const W = DATA.words, cur = W.filter((w) => w.level === lv), prev = W.filter((w) => w.level === lv - 1);
  const rnd = (a) => a.slice().sort(() => Math.random() - 0.5);
  const pick = rnd(cur).slice(0, lv > 1 ? 9 : GAME_Q).concat(lv > 1 ? rnd(prev).slice(0, GAME_Q - 9) : []);
  return rnd(pick).map((w) => {
    const pool = W.filter((x) => x.level === w.level && x.tr !== w.tr);
    let same = rnd(pool.filter((x) => x.cat === w.cat));
    if (same.length < 3) same = same.concat(rnd(pool.filter((x) => x.cat !== w.cat)));
    const opts = rnd([w.tr].concat(same.slice(0, 3).map((x) => x.tr)));
    return { en: w.en, tr: w.tr, opts };
  });
}
function playGame(lv) {
  stopAll();
  const G = gameState();
  const qs = gameRound(lv), T = gameTime(lv) * 1000;
  let qi = 0, hearts = 3, score = 0, combo = 0, right = 0, timer = null, t0 = 0, locked = false, raf = null;
  app.innerHTML = ""; app.append(topbar());
  const wrap = h("div", { class: "gplay" });
  const hud = h("div", { class: "ghud" });
  const bar = h("div", { class: "gbar" }, "<i></i>");
  const card = h("div", { class: "gcard" });
  const opts = h("div", { class: "gopts" });
  const quit = h("button", { class: "linkbtn small" }, "← Leave game");
  quit.onclick = () => { clearTimeout(timer); cancelAnimationFrame(raf); go({ tool: "game" }); };
  wrap.append(quit, hud, bar, card, opts);
  app.append(wrap);
  function drawHud() {
    hud.innerHTML = '<span class="gh-l">Level ' + lv + " · " + GAME_LEVELS[lv - 1] + '</span><span class="gh-h">' + [0, 1, 2].map((i) => '<i class="' + (i < hearts ? "on" : "") + '">♥</i>').join("") + '</span><span class="gh-s"><b>' + score + "</b> pts" + (combo >= 2 ? ' <em>×' + Math.min(combo, 5) + "</em>" : "") + '</span><span class="gh-q">' + Math.min(qi + 1, qs.length) + "/" + qs.length + "</span>";
  }
  function tickBar() { const left = Math.max(0, 1 - (Date.now() - t0) / T); bar.firstChild.style.transform = "scaleX(" + left + ")"; bar.classList.toggle("hurry", left < 0.3); if (left > 0 && !locked) raf = requestAnimationFrame(tickBar); }
  function ask() {
    if (qi >= qs.length || hearts <= 0) return finish();
    const q = qs[qi]; locked = false;
    drawHud();

}

function pickSayLines(d) {
  const L = d.listening.lines;
  const cand = L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.l.s === "Elif" && x.n >= 6 && x.n <= 16);
  const pool = cand.length >= 4 ? cand : L.map((l, i) => ({ l, i, n: l.t.split(/\s+/).length })).filter((x) => x.n >= 5 && x.n <= 18);
  const step = Math.max(1, Math.floor(pool.length / 4));
  const out = []; for (let j = 0; j < pool.length && out.length < 4; j += step) out.push(pool[j]);
  return out;
}

async function checkText(text) {
  const body = new URLSearchParams({ text, language: "en-US", enabledOnly: "false" });
  const r = await fetch("https://api.languagetool.org/v2/check", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" }, body });
  if (!r.ok) throw new Error("http " + r.status);
  const j = await r.json();
  return j.matches || [];
}
function friendlyType(m) {
  const t = (m.rule && m.rule.issueType) || "";
  if (t === "misspelling") return "Spelling";
  if (t === "grammar") return "Grammar";
  if (t === "typographical") return "Punctuation";
  if (t === "style") return "Style";
  return "Check";
}
function renderCheck(container, text, matches) {
  container.innerHTML = "";
  let html = "", pos = 0;
  const sorted = matches.slice().sort((a, b) => a.offset - b.offset);
  sorted.forEach((m, i) => { if (m.offset < pos) return; html += esc(text.slice(pos, m.offset)) + '<mark title="' + esc(m.message) + '">' + esc(text.slice(m.offset, m.offset + m.length)) + "<sup>" + (i + 1) + "</sup></mark>"; pos = m.offset + m.length; });
  html += esc(text.slice(pos));
  container.append(h("div", { class: "submitted" }, html));
  if (!sorted.length) { container.append(h("div", { class: "fb ok" }, "<b>No problems found.</b> Well done! Now compare with the model answer.")); }
  else {
    container.append(h("p", null, "<b>" + sorted.length + "</b> " + (sorted.length === 1 ? "thing" : "things") + " to check:"));
    const list = h("div", { class: "issues" });
    sorted.forEach((m, i) => {
      const bad = text.slice(m.offset, m.offset + m.length);
      const sug = (m.replacements || []).slice(0, 3).map((r) => r.value);
      list.append(h("div", { class: "issue" }, '<div class="small muted"><b>' + (i + 1) + ".</b> " + friendlyType(m) + '</div><div><span class="bad">' + esc(bad) + "</span>" + (sug.length ? ' → <span class="sug">' + sug.map(esc).join(" / ") + "</span>" : "") + '</div><div class="small">' + esc(m.shortMessage || m.message) + "</div>"));
    });
    container.append(list);
  }
  container.append(h("p", { class: "credit" }, 'Checked by <a href="https://languagetool.org" target="_blank">LanguageTool</a>. It can miss things or be wrong, so read each note carefully.'));
}
function buildWrite(body, d, k, ds) {
  const W = d.writing;
  const p1 = part(W.prompt, "Write", "Write " + esc(W.length) + ". Don't use a translator. When you finish, press <b>Submit</b> and your text will be checked.");
  const ta = h("textarea", { id: "write-" + k, "aria-label": "Your text", placeholder: "Write here…", spellcheck: "false", autocorrect: "off" });

  const upd = () => { const n = (ta.value.match(/[A-Za-z']+/g) || []).length; wc.textContent = n + " words"; };
  ta.oninput = () => { ds.write = ta.value; save(); upd(); }; upd();
  const submit = h("button", { class: "btn" }, "Submit");

  after.append(h("h3", null, "Check your text"), checks, h("h3", null, "Model answer"), h("div", { class: "model" }, "<p>" + esc(W.model) + "</p>"));
  function lockView(sub) {
    ta.hidden = true; wc.hidden = true; submit.hidden = true; editBtn.hidden = false; after.hidden = false;
    renderCheck(out, sub.text, sub.matches || []);
    if (sub.error) out.prepend(h("div", { class: "fb info" }, "The online checker isn't available right now (no internet, or it's busy). Compare with the model answer, and try <b>Edit and submit again</b> later."));
  }
  submit.onclick = async () => {
    const text = ta.value.trim();
    if ((text.match(/[A-Za-z']+/g) || []).length < 10) { toast("Write a little more first (at least 10 words)."); return; }
    submit.disabled = true; submit.textContent = "Checking…";
    let matches = [], error = false;
    try { matches = await checkText(text); } catch (e) { error = true; }
    submit.disabled = false; submit.textContent = "Submit";
    ds.submissions = ds.submissions || [];
    const sub = { text, at: today(), matches: matches.map((m) => ({ offset: m.offset, length: m.length, message: m.message, shortMessage: m.shortMessage, replacements: (m.replacements || []).slice(0, 3), rule: { issueType: m.rule && m.rule.issueType } })), error };
    ds.submissions.push(sub); ds.submitted = sub;
    sub.matches.forEach((m) => { const bad = text.slice(m.offset, m.offset + m.length); const sug = (m.replacements[0] || {}).value; if (sug) logMistake(k, "Writing", "“" + bad + "” in your text", bad, sug, m.shortMessage || m.message, { kind: "info" }); });
    markActive(); save(); lockView(sub);
  };
  editBtn.onclick = () => { ta.hidden = false; wc.hidden = false; submit.hidden = false; editBtn.hidden = true; out.innerHTML = ""; ta.focus(); };
  body.append(p1, after);
  if (ds.submitted && ds.submitted.text === (ds.write || "").trim()) lockView(ds.submitted);
}

  if (kind === "gate") return renderGate();
  renderApp(v);
  drawMenu();
}
function renderApp(v) {
  if (v && v.w != null && v.d != null && !isUnlocked(v.w, v.d)) { S.opened = null; v = null; }
  if (!v) return renderHome();
  if (v.tool === "words") return renderWords();
  if (v.tool === "mistakes") return renderMistakes();
  if (v.tool === "progress") return renderProgress();
  if (v.tool === "notes") return renderNotes(v);
  if (v.tool === "settings") return renderSettings();
  if (v.tool === "account") return renderAccount(v);
  if (v.tool === "map") return renderMap();
  if (v.tool === "grammar") return renderGrammarBook();
  if (v.tool === "library") return renderLibrary();
  if (v.tool === "quick") return renderQuick();
  if (v.tool === "practice") return renderPractice();
  if (v.tool === "ach") return renderAch();
  if (v.tool === "game") return renderGame();
  if (v.d === 7 && DATA.weeks.find((x) => x.week === v.w)) return renderSunday(v.w);
  if (findDay(v.w, v.d)) return renderDay(v.w, v.d);
  S.opened = null; renderHome();
}
render();
Sync.init();
})();
</script>
