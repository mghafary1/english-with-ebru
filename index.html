hing works."}, {"s": "Dan", "t": "Great! So tomorrow your mom can see your face."}, {"s": "Elif", "t": "Exactly. Okay, after that, add the tomatoes and a little salt. Stir them slowly."}, {"s": "Dan", "t": "How long do they cook?"}, {"s": "Elif", "t": "About ten minutes. Wait until they're soft."}, {"s": "Dan", "t": "And the eggs?"}, {"s": "Elif", "t": "Finally, break the eggs into the pan. Don't mix them too much."}, {"s": "Dan", "t": "Done! Can we eat now?"}, {"s": "Elif", "t": "Yes. Take some fresh bread and try it."}, {"s": "Dan", "t": "Wow. This is so good. Can I make it for my friends on Sunday?"}, {"s": "Elif", "t": "Of course. Just don't forget the bread!"}], "mcq": [{"q": "What does Elif tell Dan to do first?", "options": ["chop the onion", "wash his hands", "buy some bread"], "answer": 1}, {"q": "What is menemen?", "options": ["eggs with tomatoes and peppers", "a soup with onions", "a kind of bread"], "answer": 0}, {"q": "What happened with Elif's internet?", "options": ["It still doesn't work.", "Dan fixed it.", "A technician fixed it."], "answer": 2}, {"q": "What do they eat the menemen with?", "options": ["rice", "fresh bread", "yogurt"], "answer": 1}], "gaps": [{"line": 1, "answer": "put on"}, {"line": 7, "answer": "Chop"}, {"line": 10, "answer": "Too late"}, {"line": 13, "answer": "medium heat"}, {"line": 19, "answer": "after that"}, {"line": 23, "answer": "Finally"}]}, "vocab": [{"w": "chop", "m": "cut into small pieces", "ex": "Can you chop the carrots for the soup?"}, {"w": "put on", "m": "start to wear clothes", "ex": "Put on your coat. It's cold outside."}, {"w": "stir", "m": "move food around with a spoon", "ex": "Stir the soup so it doesn't burn."}, {"w": "medium heat", "m": "not too hot and not too low", "ex": "Cook the rice on medium heat."}, {"w": "smells amazing", "m": "has a very good smell", "ex": "Your coffee smells amazing!"}, {"w": "Too late", "m": "it already happened; you can't stop it now", "ex": "I wanted a ticket, but I was too late."}, {"w": "break the eggs", "m": "open eggs by hitting them", "ex": "Break the eggs into a bowl first."}, {"w": "right away", "m": "now, without waiting", "ex": "Call me right away if you need help."}], "grammar": {"title": "Imperatives and sequence words", "points": ["Imperative = base verb with no subject: Chop the onion. Add the eggs.", "Negative imperative: Don't + base verb: Don't mix them too much.", "Put steps in order with first, then, next, after that and finally.", "Use a comma after First, After that and Finally at the start."], "examples": [{"en": "First, wash your hands.", "note": "step 1"}, {"en": "Then cut the peppers.", "note": "the next step"}, {"en": "Don't use high heat.", "note": "negative imperative"}, {"en": "Finally, break the eggs into the pan.", "note": "the last step"}], "exercises": [{"type": "choice", "q": "___ the eggs into the pan.", "options": ["Break", "Breaks", "Breaking"], "answer": 0, "why": "An imperative uses the base verb: Break."}, {"type": "choice", "q": "___ touch the pan. It's very hot!", "options": ["No", "Not", "Don't"], "answer": 2, "why": "Negative imperative: Don't + base verb."}, {"type": "choice", "q": "First, chop the onion. ___, add the peppers. Finally, add the eggs.", "options": ["Next", "Finally", "First"], "answer": 0, "why": "The middle step needs next."}, {"type": "choice", "q": "Cook the tomatoes. ___ that, add some salt.", "options": ["Then", "After", "Finally"], "answer": 1, "why": "The phrase is after that."}, {"type": "type", "q": "___ the heat when the eggs are almost ready. (turn off)", "answers": ["Turn off", "turn off"], "why": "An imperative uses the base verb, with no subject."}, {"type": "type", "q": "___ forget the bread! (do not)", "answers": ["Don't", "don't", "Do not", "do not"], "why": "Negative imperative: Don't + base verb."}, {"type": "type", "q": "Wash the vegetables. ___, cut them into small pieces. After that, cook them. (then / finally)", "answers": ["Then", "then"], "why": "It's not the last step, so use then."}, {"type": "type", "q": "We cooked the food, set the table, and ___ we ate. (finally / first)", "answers": ["finally"], "why": "Eating is the last step: finally."}]}, "reading": {"title": "Menemen for Dan", "kind": "a recipe card", "text": "Dan, here is the recipe from tonight. You did a great job! Now you can make it for your friends on Sunday.\n\nYou need: 4 eggs, 2 tomatoes, 2 green peppers, 1 small onion, some butter, salt, black pepper and fresh bread.\n\nFirst, wash and chop the vegetables. Cut the onion into small pieces. Don't cry this time!\n\nThen, melt some butter in a pan. Use medium heat, not high.\n\nAfter that, add the onion and the peppers. Cook them for about five minutes. Stir them sometimes.\n\nNext, add the tomatoes and a little salt. Cook them until they are soft. This takes about ten minutes.\n\nFinally, break the eggs into the pan. Mix them gently, but not too much. Turn off the heat when the eggs are almost ready, because they keep cooking in the hot pan.\n\nServe it right away with warm bread. At home in Turkey, we often eat menemen for breakfast with a glass of tea.\n\nOne more tip: don't cook it before your friends arrive. Menemen is best when it's hot!\n\nElif", "questions": [{"q": "Who is the recipe for?", "options": ["Elif's mom", "Maria", "Dan"], "answer": 2}, {"q": "How long do the onion and peppers cook?", "options": ["about five minutes", "about ten minutes", "about two minutes"], "answer": 0}, {"q": "Why should you turn off the heat early?", "options": ["The butter burns.", "The eggs keep cooking in the hot pan.", "The bread gets cold."], "answer": 1}, {"q": "When does Elif's family often eat menemen?", "options": ["for dinner", "at parties", "for breakfast"], "answer": 2}], "tf": [{"s": "You should cook menemen on high heat.", "answer": false}, {"s": "The tomatoes cook for about ten minutes.", "answer": true}, {"s": "Elif says to cook the menemen before the friends arrive.", "answer": false}], "gloss": {"a": "bir", "about": "yaklaşık", "add": "ekle (add: eklemek)", "after": "-den sonra", "almost": "neredeyse", "and": "ve", "are": "-dir / olmak (to be)", "arrive": "gelmek (arrive: varmak, gelmek)", "at": "-de (at home: evde)", "away": "(right away: hemen)", "because": "çünkü", "before": "-meden önce", "best": "en iyi / en güzel", "black": "kara (black pepper: karabiber)", "bread": "ekmek", "break": "kır (break: kırmak)", "breakfast": "kahvaltı", "but": "ama", "butter": "tereyağı", "can": "-ebilirsin (can: -ebilmek)", "chop": "doğra (chop: doğramak)", "cook": "pişir (cook: pişirmek)", "cooking": "pişmek (keep cooking: pişmeye devam)", "cry": "ağlamak", "cut": "kes (cut: kesmek)", "dan": "Dan (isim)", "did": "yaptın (do: yapmak)", "don't": "-me / yapma (do not)", "eat": "yeriz (eat: yemek)", "eggs": "yumurtalar", "elif": "Elif (isim)", "finally": "son olarak", "first": "önce / ilk olarak", "five": "beş", "for": "için; boyunca (for five minutes)", "fresh": "taze", "friends": "arkadaşlar", "from": "-ki / -den (from tonight: bu akşamki)", "gently": "nazikçe / yavaşça", "glass": "bardak", "great": "harika", "green": "yeşil", "heat": "ateş / ısı", "here": "işte (here is: işte)", "high": "yüksek / harlı", "home": "ev (at home: bizde, evde)", "hot": "sıcak", "in": "-de / içinde", "into": "-e / içine", "is": "-dir / olmak (to be)", "it": "onu / o", "it's": "o ...-dir (it is)", "job": "iş (great job: harika iş çıkardın)", "keep": "devam etmek (keep cooking: pişmeye devam)", "little": "biraz (a little)", "make": "yapmak", "medium": "orta", "melt": "erit (melt: eritmek)", "menemen": "menemen (yemek)", "minutes": "dakika", "mix": "karıştır (mix: karıştırmak)", "more": "daha (one more: bir ... daha)", "much": "fazla (too much: çok fazla)", "need": "gerekenler / lazım (need: ihtiyaç duymak)", "next": "sonra / ardından", "not": "değil", "now": "artık", "of": "(a glass of: bir bardak ...)", "off": "(turn off kalıbının parçası)", "often": "sık sık", "on": "-de (on Sunday: Pazar günü)", "one": "bir", "onion": "soğan", "pan": "tava", "pepper": "biber (black pepper: karabiber)", "peppers": "biberler", "pieces": "parçalar", "ready": "hazır", "recipe": "tarif", "right": "hemen (right away)", "salt": "tuz", "serve": "servis yap (serve: servis yapmak)", "small": "küçük", "soft": "yumuşak", "some": "biraz", "sometimes": "arada bir / ara sıra", "stir": "karıştır (stir: karıştırmak)", "sunday": "Pazar", "takes": "sürer (take: sürmek)", "tea": "çay", "ten": "on (10)", "that": "o / bu", "the": "belirli tanımlık (Türkçede karşılığı yok)", "them": "onları", "then": "sonra", "they": "onlar", "this": "bu", "time": "sefer / kez", "tip": "ipucu", "tomatoes": "domatesler", "tonight": "bu akşam", "too": "fazla (too much: çok fazla)", "turkey": "Türkiye (ülke)", "turn": "kapat (turn off: kapatmak)", "until": "-ene kadar", "use": "kullan (use: kullanmak)", "vegetables": "sebzeler", "warm": "sıcak", "wash": "yıka (wash: yıkamak)", "we": "biz", "when": "-ınca / -dığında", "with": "ile / birlikte", "you": "sen", "your": "senin"}}, "speaking": {"prompt": "Explain how to make a simple dish or breakfast that you like.", "steps": ["say the name of the dish and when you eat it", "give the steps with first, then, after that, finally", "give one tip with Don't ..."], "starters": ["One easy dish I love is ...", "First, ...", "After that, ...", "Finally, ..."], "model": "One easy dish I love is a cheese omelet. I usually make it for breakfast on weekends. First, break three eggs into a bowl and add a little salt. Then mix them with a fork. After that, put some butter in a pan and wait until it's hot. Next, pour in the eggs. When they're almost ready, add some cheese. Finally, fold the omelet in half. Don't cook it for too long, or it gets dry. Eat it right away with toast!"}, "writing": {"prompt": "A friend wants to make a good cup of tea. Write the steps in a short message.", "length": "50-80 words", "checklist": ["Use at least three sequence words (first, then, after that, finally).", "Use one negative imperative (Don't ...).", "End with a friendly line."], "model": "Here's how I make tea! First, boil some fresh water. Then put one tea bag in a big cup. After that, pour the hot water over the tea bag. Wait for three or four minutes. Don't wait too long, or the tea gets bitter. Next, take out the tea bag. Finally, add a little milk or honey if you like. Now sit down, drink it slowly and relax. Enjoy!"}, "audio": {"listen": "audio/w3d3-listen.mp3", "listenT": [[0.3, 3.5], [3.95, 6.96], [7.41, 9.88], [10.33, 13.96], [14.41, 20.34], [20.79, 26.4], [26.85, 30.43], [30.88, 33.08], [33.53, 34.68], [35.13, 37.18], [37.63, 39.06], [39.51, 42.8], [43.25, 44.7], [45.15, 48.82], [49.27, 50.78], [51.23, 54.67], [55.12, 59.4], [59.85, 63.86], [64.31, 67.32], [67.77, 73.04], [73.49, 75.13], [75.58, 78.29], [78.74, 79.96], [80.41, 84.08], [84.53, 86.09], [86.54, 88.76], [89.21, 93.58], [94.03, 96.18]], "read": "audio/w3d3-read.mp3", "speak": "audio/w3d3-speak.mp3", "vocab": "audio/w3d3-vocab.mp3", "vocabT": [[0.3, 1.13, 1.73, 3.61], [4.51, 5.47, 6.07, 8.39], [9.29, 10.19, 10.79, 12.58], [13.48, 14.63, 15.23, 17.2], [18.1, 19.27, 19.87, 21.51], [22.41, 23.42, 24.02, 26.23], [27.13, 28.44, 29.04, 31.08], [31.98, 32.92, 33.52, 35.42]]}}, {"day": 4, "dayName": "Thursday", "title": "Missing home", "goals": ["I can talk about feeling homesick.", "I can tell a short story with was/were + -ing.", "I can use when and while."], "listening": {"title": "A call to Izmir", "intro": "Early on Thursday morning, Elif has a video call with her parents in Izmir. (They speak Turkish, but here it's in English.)", "speakers": {"Elif": "female", "Mom": "female", "Dad": "male"}, "lines": [{"s": "Mom", "t": "Elif! I can see you! Can you see me?"}, {"s": "Elif", "t": "Yes, Mom! The internet works perfectly now. Good morning!"}, {"s": "Mom", "t": "Good afternoon from Izmir! You look tired, my dear. Are you okay?"}, {"s": "Elif", "t": "I'm fine. Well, a little homesick, to be honest."}, {"s": "Mom", "t": "Oh, sweetheart. What happened?"}, {"s": "Elif", "t": "Nothing big. On Tuesday I was walking home from the bus stop when I smelled fresh bread."}, {"s": "Elif", "t": "It smelled exactly like the bakery near our house. Suddenly I wanted to cry."}, {"s": "Mom", "t": "Oh, Elif. We miss you too. I was thinking about you this morning."}, {"s": "Mom", "t": "I was making breakfast, and I made tea for two!"}, {"s": "Elif", "t": "For two? Oh, Mom!"}, {"s": "Mom", "t": "I know! Your father laughed at me while I was pouring the second glass."}, {"s": "Elif", "t": "Where is Dad? Is he there?"}, {"s": "Mom", "t": "He's in the garden. He was watering the tomatoes when you called. Come here! It's Elif!"}, {"s": "Dad", "t": "Elif! How's my girl?"}, {"s": "Elif", "t": "Hi, Dad! I'm good. Yesterday I cooked menemen with my neighbor, Dan."}, {"s": "Dad", "t": "Menemen in Chicago? Did he like it?"}, {"s": "Elif", "t": "He loved it. He was eating the bread while I was still cooking!"}, {"s": "Dad", "t": "Ha! A smart man."}, {"s": "Mom", "t": "What else happened this week?"}, {"s": "Elif", "t": "I joined a gym. On Tuesday, I was doing yoga when my phone started ringing. Loudly!"}, {"s": "Mom", "t": "Oh no! Was the teacher angry?"}, {"s": "Elif", "t": "No, she just smiled. But everyone looked at me."}, {"s": "Dad", "t": "Elif, are you happy there? Really?"}, {"s": "Elif", "t": "Yes, Dad. Most days I'm really happy. Some days are just harder."}, {"s": "Mom", "t": "That's normal. It gets easier. Call us when you feel sad, okay?"}, {"s": "Elif", "t": "I will. I love you both."}, {"s": "Dad", "t": "We love you too. Now go and eat some breakfast!"}], "mcq": [{"q": "How does Elif feel this week?", "options": ["a little homesick", "very angry", "sick and tired"], "answer": 0}, {"q": "What happened on Tuesday on her way home?", "options": ["She got lost.", "She smelled fresh bread and wanted to cry.", "She met her coworker."], "answer": 1}, {"q": "What was Dad doing when Elif called?", "options": ["making breakfast", "drinking tea", "watering the tomatoes"], "answer": 2}, {"q": "What happened during Elif's yoga class?", "options": ["Her phone started ringing.", "She fell down.", "The teacher was late."], "answer": 0}], "gaps": [{"line": 3, "answer": "to be honest"}, {"line": 5, "answer": "was walking"}, {"line": 6, "answer": "Suddenly"}, {"line": 8, "answer": "was making"}, {"line": 10, "answer": "while"}, {"line": 12, "answer": "was watering"}]}, "vocab": [{"w": "homesick", "m": "sad because you miss your home and family", "ex": "I was homesick during my first month at college."}, {"w": "to be honest", "m": "I'm telling you the truth", "ex": "To be honest, I don't really like coffee."}, {"w": "miss", "m": "feel sad because someone or something is far away", "ex": "I miss my grandmother's cooking."}, {"w": "suddenly", "m": "quickly, when you don't expect it", "ex": "The bus suddenly stopped, and I almost fell."}, {"w": "reminded me of", "m": "made me think of something from before", "ex": "That song reminded me of my school days."}, {"w": "knock on", "m": "hit a door with your hand", "ex": "Please knock on the door before you come in."}, {"w": "feel better", "m": "feel happier or less sick", "ex": "Drink some tea. You'll feel better."}, {"w": "it gets easier", "m": "with time, it becomes less difficult", "ex": "Driving is scary at first, but it gets easier."}], "grammar": {"title": "Past continuous vs past simple (when, while)", "points": ["Past continuous (was/were + -ing): an action in progress at a past time.", "Past simple: a short, finished action: I smelled, she called, he knocked.", "Long action + when + short action: I was walking home when I smelled bread.", "While + long action: While I was cooking, he ate the bread."], "examples": [{"en": "I was walking home when I smelled fresh bread.", "note": "long action, then short action"}, {"en": "My phone rang while I was doing yoga.", "note": "while + long action"}, {"en": "Dad was working in the garden when I called.", "note": ""}, {"en": "What were you doing at eight last night?", "note": "question form"}], "tr": "Was/were + -ing, Türkçedeki '-iyordu' gibidir: Eve yürüyordum (I was walking), telefon çaldı (the phone rang).", "exercises": [{"type": "choice", "q": "I ___ dinner when the phone rang.", "options": ["was cooking", "were cooking", "am cooking"], "answer": 0, "why": "I + was + -ing for a long past action."}, {"type": "choice", "q": "While we were talking, the internet suddenly ___.", "options": ["stop", "stopping", "stopped"], "answer": 2, "why": "A short, sudden action uses the past simple."}, {"type": "choice", "q": "What ___ you doing at eight last night?", "options": ["were", "did", "was"], "answer": 0, "why": "Past continuous question: were + you + -ing."}, {"type": "choice", "q": "She was watering the plants ___ it started to rain.", "options": ["while", "when", "during"], "answer": 1, "why": "Use when before the short action."}, {"type": "type", "q": "Dan ___ in the park when he saw a friend. (run)", "answers": ["was running"], "why": "Long action in progress: was + running."}, {"type": "type", "q": "While Elif ___ the dishes, someone knocked on the door. (wash)", "answers": ["was washing"], "why": "While + long action: was washing."}, {"type": "type", "q": "I was reading when the lights suddenly ___ off. (go)", "answers": ["went"], "why": "Short action: past simple. Go is irregular: went."}, {"type": "type", "q": "They ___ TV when we arrived, so they didn't hear the doorbell. (watch)", "answers": ["were watching"], "why": "They + were + -ing for the long action."}]}, "reading": {"title": "Faces on a screen", "kind": "Elif's diary", "text": "Thursday night\n\nThis morning, before work, I finally had a video call with Mom and Dad. The internet works now, so I could see their faces. Mom was sitting in the kitchen, and Dad was working in the garden. Everything looked the same: the blue curtains, the old clock, the lemon tree outside the window.\n\nI felt homesick this week. On Tuesday, I was walking home when I smelled fresh bread. It reminded me of the bakery near our house in Izmir. I stopped on the street, and my eyes filled with tears. A woman asked, \"Are you okay?\" I said yes, but I wasn't.\n\nWhile we were talking this morning, I told Mom about that moment. She didn't laugh. She said, \"Everyone feels like that in a new place. It gets easier.\" Then Dad showed me his tomatoes. He was so proud of them!\n\nAfter the call, I felt better. Tonight I was washing the dishes when Dan knocked on my door. He brought me a piece of apple pie. \"Thank you for the menemen,\" he said. Chicago is far from Izmir, but it has kind people too.", "questions": [{"q": "Where was Mom sitting during the call?", "options": ["in the garden", "in the kitchen", "in the living room"], "answer": 1}, {"q": "What did the smell of bread remind Elif of?", "options": ["a bakery near her parents' house", "her office kitchen", "Dan's apple pie"], "answer": 0}, {"q": "What did Mom say?", "options": ["\"Come home soon.\"", "\"Don't call Dan.\"", "\"It gets easier.\""], "answer": 2}, {"q": "What did Dan bring Elif?", "options": ["a piece of apple pie", "fresh bread", "some tea"], "answer": 0}], "tf": [{"s": "Dad was working in the garden during the call.", "answer": true}, {"s": "Elif told the woman on the street that she wasn't okay.", "answer": false}, {"s": "Dan knocked while Elif was washing the dishes.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında", "after": "-den sonra", "and": "ve", "apple": "elma", "are": "...-sin (are: olmak)", "asked": "sordu (ask: sormak)", "bakery": "fırın", "before": "-den önce", "better": "daha iyi", "blue": "mavi", "bread": "ekmek", "brought": "getirdi (bring: getirmek)", "but": "ama", "call": "arama / görüşme", "chicago": "Chicago (şehir)", "clock": "saat (duvar saati)", "could": "-ebildim (can: -ebilmek)", "curtains": "perdeler", "dad": "babam", "dan": "Dan (isim)", " r. When the bus came, he waved goodbye. I felt warm, even in the rain."}, "audio": {"listen": "audio/w3d4-listen.mp3", "listenT": [[0.3, 2.35], [2.8, 6.4], [6.85, 10.57], [11.02, 13.83], [14.28, 16.03], [16.48, 21.75], [22.2, 26.96], [27.41, 31.1], [31.55, 34.34], [34.79, 36.2], [36.65, 40.32], [40.77, 42.48], [42.93, 47.79], [48.24, 49.48], [49.93, 54.32], [54.77, 56.86], [57.31, 60.64], [61.09, 62.18], [62.63, 64.08], [64.53, 70.01], [70.46, 72.36], [72.81, 75.73], [76.18, 77.95], [78.4, 82.42], [82.87, 86.68], [87.13, 88.82], [89.27, 91.83]], "read": "audio/w3d4-read.mp3", "speak": "audio/w3d4-speak.mp3", "vocab": "audio/w3d4-vocab.mp3", "vocabT": [[0.3, 1.3, 1.9, 4.63], [5.53, 6.73, 7.33, 9.82], [10.72, 11.62, 12.22, 14.08], [14.98, 16.02, 16.62, 19.18], [20.08, 21.3, 21.9, 24.31], [25.21, 26.3, 26.9, 29.24], [30.14, 31.34, 31.94, 34.03], [34.93, 36.19, 36.79, 39.62]]}}, {"day": 5, "dayName": "Friday", "title": "Five minutes, no more", "goals": ["I can understand rules and tips for a presentation.", "I can use must, mustn't and don't have to.", "I can say what is and isn't necessary."], "listening": {"title": "Before the presentation", "intro": "On Friday morning, Elif is getting ready for a short presentation. Maria and Sam help her in the office.", "speakers": {"Elif": "female", "Maria": "female", "Sam": "male"}, "lines": [{"s": "Maria", "t": "Good morning, Elif. Are you ready for two o'clock?"}, {"s": "Elif", "t": "Almost. I'm a little nervous. It's my first presentation in English."}, {"s": "Maria", "t": "Don't worry. It's just for the team. But it must be short. Five minutes, no more."}, {"s": "Elif", "t": "Five minutes. Okay. Do I have to use slides?"}, {"s": "Maria", "t": "No, you don't have to. But slides can help."}, {"s": "Sam", "t": "Use slides! Then people look at the screen, not at you."}, {"s": "Elif", "t": "Good point. Sam, would you mind checking them?"}, {"s": "Sam", "t": "Sure. Hmm, this slide has a lot of words."}, {"s": "Elif", "t": "Is that anic"}]}, "vocab": [{"w": "presentation", "m": "a short talk to show information to a group", "ex": "I have a presentation for the team on Monday."}, {"w": "slides", "m": "pages you show on a screen during a talk", "ex": "Her slides had nice pictures and very few words."}, {"w": "Good point", "m": "you're right; that's a good idea", "ex": "Good point! Let's take the bus, not a taxi."}, {"w": "nervous", "m": "a little afraid and worried", "ex": "I always feel nervous before a test."}, {"w": "battery", "m": "it gives power to a phone or laptop", "ex": "My phone battery is low again."}, {"w": "charger", "m": "you use it to give power to a phone", "ex": "Can I borrow your phone charger?"}, {"w": "Don't panic", "m": "stay calm; don't be very afraid", "ex": "Don't panic. We still have ten minutes."}, {"w": "it went well", "m": "it happened in a good way", "ex": "How was your interview? It went well, thanks."}], "grammar": {"title": "must, mustn't, don't have to", "points": ["must + base verb = it's necessary or very important: You must finish in five minutes.", "mustn't = don't do it; it's not allowed: You mustn't show the logo.", "don't have to = it's not necessary, but you can: You don't have to use slides.", "In American English, people often say have to for must, and can't for mustn't."], "examples": [{"en": "You must be on time.", "note": "necessary"}, {"en": "You mustn't park here.", "note": "not allowed"}, {"en": "You don't have to bring anything.", "note": "not necessary"}, {"en": "She doesn't have to work on Saturday.", "note": "he/she: doesn't have to"}], "tr": "Dikkat: mustn't = yapmamalısın (yasak); don't have to = yapmak zorunda değilsin (gerekli değil).", "exercises": [{"type": "choice", "q": "You ___ smoke in the office. It's not allowed.", "options": ["mustn't", "don't have to", "must"], "answer": 0, "why": "Not allowed = mustn't."}, {"type": "choice", "q": "Tomorrow is Saturday, so I ___ get up early.", "options": ["mustn't", "don't have to", "must"], "an 85], [5.75, 6.83, 7.43, 10.61], [11.51, 12.49, 13.09, 15.63], [16.53, 17.54, 18.14, 20.46], [21.36, 22.3, 22.9, 24.99], [25.89, 26.91, 27.51, 29.41], [30.31, 31.34, 31.94, 34.2], [35.1, 36.21, 36.81, 39.22]]}}, {"day": 6, "dayName": "Saturday", "title": "The farmers market", "goals": ["I can shop at a market and ask about prices.", "I can say something is too big or not big enough.", "I can talk about my week."], "listening": {"title": "Pumpkins and apples", "intro": "On Saturday morning, Elif and Dan go to a farmers market. Ruth sells apples and honey there.", "speakers": {"Elif": "female", "Dan": "male", "Ruth": "female"}, "lines": [{"s": "Dan", "t": "Look at all these pumpkins! Do you have farmers markets in Turkey?"}, {"s": "Elif", "t": "Yes, there's a big market near my parents' house every week. But I've never seen pumpkins like these!"}, {"s": "Dan", "t": "Halloween is next week. I need one for my door. Oh, this one is perfect."}, {"s": "Elif", "t": "Dan, that pumpkin is too big. You can't carry it home."}, {"s": "Dan", "t": "Sure I can. I run every day. I'm strong enough."}, {"s": "Elif", "t": "Okay, Mr. Strong. Show me."}, {"s": "Dan", "t": "Hmm. Okay, maybe it's a little too heavy."}, {"s": "Elif", "t": "Ha! I told you. Take a smaller one."}, {"s": "Ruth", "t": "Good morning! Would you like to try an apple? They're fresh from our farm."}, {"s": "Elif", "t": "Yes, please. Mmm, it's really sweet! How much are they?"}, {"s": "Ruth", "t": "Three dollars a pound."}, {"s": "Elif", "t": "Can I have two pounds, please? Are they good for apple pie?"}, {"s": "Ruth", "t": "For pie, the green ones are better. These red ones are too sweet for some people."}, {"s": "Dan", "t": "My grandma always uses green apples for her pie."}, {"s": "Elif", "t": "Then two pounds of green ones too, please. Oh, and is this honey from your farm?"}, {"s": "Ruth", "t": "Yes, it is. It's twelve dollars a jar."}, {"s": "Elif", "t": "Twelve dollars? That's a little too expensive for me."}, {"s": "Ruth", "t": "Try some first."}, {"s": "Elif", "t": "Oh, wow. Okay, it's worth it. One jar, please. Do you take cards? I don't have enough cash."}, {"s": "Ruth", "t": "Sure, we do. Here you go. Enjoy!"}, {"s": "Dan", "t": "So, do we have enough apples for a pie?"}, {"s": "Elif", "t": "For one pie? We have enough for three pies!"}, {"s": "Dan", "t": "Perfect. Let's bake one this afternoon at my place."}, {"s": "Elif", "t": "Your kitchen isn't big enough for two people. Remember Wednesday?"}, {"s": "Dan", "t": "True. I hit my elbow three times. Let's use yours."}, {"s": "Elif", "t": "Mine is only a little bigger. But okay!"}, {"s": "Dan", "t": "Great. And tomorrow I'm making menemen for my friends."}, {"s": "Elif", "t": "Good luck. Don't forget the bread!"}], "mcq": [{"q": "Why doesn't Dan take the big pumpkin?", "options": ["It's too expensive.", "It's too heavy.", "It isn't big enough."], "answer": 1}, {"q": "Which apples are better for pie, according to Ruth?", "options": ["the green ones", "the red ones", "the yellow ones"], "answer": 0}, {"q": "Why does Elif buy the honey?", "options": ["Dan wants it for his pie.", "It's cheap.", "She tries it, and it's very good."], "answer": 2}, {"q": "Where are they going to bake the pie?", "options": ["at Dan's place", "in Elif's kitchen", "at Ruth's farm"], "answer": 1}], "gaps": [{"line": 3, "answer": "too big"}, {"line": 4, "answer": "strong enough"}, {"line": 7, "answer": "I told you"}, {"line": 8, "answer": "fresh from"}, {"line": 18, "answer": "worth it"}, {"line": 20, "answer": "enough apples"}]}, "vocab": [{"w": "farmers market", "m": "a market where farmers sell their own food", "ex": "We buy fresh eggs at the farmers market."}, {"w": "fresh from", "m": "very fresh; it just came from that place", "ex": "This bread is fresh from the oven."}, {"w": "a pound", "m": "a US weight, a little under half a kilo", "ex": "I need a pound of ground beef for dinner."}, {"w": "worth it", "m": "good enough for the money or work", "ex": "The ticket was expensive, but the concert was worth it."}, {"w": "a jar of", "m": "a glass container with a lid", "ex": "There's a jar of jam in the fridge."}, {"w": "cash", "m": "money in paper and coins", "ex": "I never carry much cash these days."}, {"w": "in the end", "m": "finally, after everything", "ex": "We wanted pizza, but in the end we cooked at home."}, {"w": "I told you", "m": "I said this before, and I was right", "ex": "I told you the store was closed on Sundays!"}], "grammar": {"title": "too and enough", "points": ["too + adjective = more than you want or need: too big, too expensive.", "adjective + enough = as much as you need: big enough, warm enough.", "enough + noun: enough money, enough apples. Not enough = less than you need.", "Add for + person or to + verb: too heavy for him, old enough to drive."], "examples": [{"en": "This pumpkin is too heavy for me.", "note": "too + adjective"}, {"en": "My kitchen isn't big enough for two people.", "note": "adjective + enough"}, {"en": "Do we have enough apples?", "note": "enough + noun"}, {"en": "He's strong enough to carry it.", "note": "enough + to + verb"}], "exercises": [{"type": "choice", "q": "This coat is ___ small. I need a bigger size.", "options": ["too", "enough", "much"], "answer": 0, "why": "More than you want: too + adjective."}, {"type": "choice", "q": "I'm not tall ___ to reach the top shelf.", "options": ["too", "enough", "very"], "answer": 1, "why": "Enough comes after the adjective: tall enough."}, {"type": "choice", "q": "We don't have ___ chairs for everyone.", "options": ["too", "very", "enough"], "answer": 2, "why": "Enough comes before a noun: enough chairs."}, {"type": "choice", "q": "The soup is ___ hot to eat. Wait a minute.", "options": ["enough", "too"], "answer": 1, "why": "More than you want: too hot to eat."}, {"type": "type", "q": "She's eighteen, so she's old ___ to vote. (enough / too)", "answers": ["enough"], "why": "Adjective + enough + to + verb."}, {"type": "type", "q": "I can't buy this bag. It's ___ expensive. (too / enough)", "answers": ["too"], "why": "More than you want to pay: too expensive."}, {"type": "type", "q": "Is this room ___ for ten people? (big + enough)", "answers": ["big enough"], "why": "Adjective first, then enough: big enough."}, {"type": "type", "q": "The music is ___ for me. I can't hear you! (loud + too)", "answers": ["too loud"], "why": "Too comes before the adjective: too loud."}]}, "reading": {"title": "Apples, honey and a busy week", "kind": "an email to a friend", "text": "Hi Deniz,\n\nWhat a week! I'm writing this with a cup of tea and a piece of warm apple pie.\n\nThis morning, Dan and I went to a farmers market. It was cold, but the sun was out. There were pumpkins everywhere, because Halloween is next week. Dan tried to carry a huge pumpkin, but it was too heavy for him. In the end, he bought a small one.\n\nI bought apples and a jar of honey. The honey was a little too expensive, but it was so good. Then we made an apple pie in my tiny kitchen. It isn't big enough for two people, so Dan hit his head on a cabinet twice!\n\nThe rest of the week was busy too. I joined a gym, my internet finally works, and I gave my first presentation in English. I was nervous, but it was short, and it went well. On Thursday I talked to Mom and Dad on video. I was homesick, but talking to them helped.\n\nNow I think I'm strong enough for a Chicago winter. Well, maybe! Everyone says it gets very cold here.\n\nHow are you? Write soon!\n\nElif", "questions": [{"q": "Why were there pumpkins everywhere?", "options": ["It was a pumpkin festival.", "Halloween is next week.", "Dan wanted to buy them all."], "answer": 1}, {"q": "What happened to Dan in Elif's kitchen?", "options": ["He hit his head twice.", "He burned his hand.", "He dropped the pie."], "answer": 0}, {"q": "What does Elif say about the honey?", "options": ["It was cheap.", "It was too sweet.", "It was a little too expensive, but very good."], "ans  and the sellers are friendly. Sometimes it's too crowded, especially at noon, so I go early in the morning. I always take two big bags, because one bag isn't big enough. The only problem is parking. There aren't enough parking spaces, so I walk. I love this market because it feels like a small festival every week."}, "writing": {"prompt": "Write a short online review of a café, shop or market you visited.", "length": "50-80 words", "checklist": ["Use too + adjective.", "Use adjective + enough or enough + noun.", "Say if you recommend it."], "model": "I visited the new café near my office last weekend. The coffee was great, and the cakes were fresh. But the café is too small. There aren't enough tables, so we waited for twenty minutes. The music was also a little too loud for a conversation. The prices are fair, and the staff is friendly. I recommend it, but go early or on a weekday!"}, "partner": {"questions": ["How long have you lived in your home? What do you like about it?", "Imagine you're calling a company about a problem. Make three polite requests with could and would you mind.", "How do you make your favorite breakfast? Explain the steps with first, then and finally.", "What were you doing at this time yesterday? Did anything happen while you were doing it?", "What must you do every day? What don't you have to do on weekends?", "Is your home big enough for you? Is your city too busy or quiet enough?"], "roleplay": "Imagine you are at a farmers market. Play both parts out loud: a seller and a customer. The customer asks about prices, says one thing is too expensive, asks if there are enough apples for a pie, and asks politely for a bag (Could you...? Would you mind...?). Record yourself and listen."}, "audio": {"listen": "audio/w3d6-listen.mp3", "listenT": [[0.3, 4.67], [5.12, 10.99], [11.44, 16.86], [17.31, 20.59], [21.04, 24.48], [24.93, 27.04], [27.49, 30.29], [30.74, 33.08], [33.53, 37.07], [37.52, 41.0], [41.45, 42.79], [43.24, 46.62], [47.07, 51.74], [ __ the soup slowly so it doesn't burn.", "options": ["Chop", "Break", "Stir"], "answer": 2, "why": "Stir = move food around with a spoon."}], "reflection": ["Which day this week was the most useful for you, and why?", "Can you explain the difference between mustn't and don't have to?", "How long have you studied English? Say it with for and with since."]}}, {"week": 4, "title": "Life at work", "days": [{"day": 1, "dayName": "Monday", "title": "How's it going?", "goals": ["I can talk with my manager about my work.", "I can make promises and offers with I'll.", "I can understand feedback in a short meeting."], "listening": {"title": "The first check-in", "intro": "Elif has her first check-in meeting with her manager, Maria, in Maria's office.", "speakers": {"Elif": "female", "Maria": "female"}, "lines": [{"s": "Maria", "t": "Come in, Elif. Have a seat. Would you like some coffee?"}, {"s": "Elif", "t": "No, thanks. I've already had two cups this morning!"}, {"s": "Maria", "t": "Ha! OK. So, this is your first check-in. It's just a short chat, so don't worry."}, {"s": "Elif", "t": "OK. I'm a little nervous, to be honest."}, {"s": "Maria", "t": "Don't be. I have good news. Everyone is really happy with your work."}, {"s": "Elif", "t": "Really? That's great to hear."}, {"s": "Maria", "t": "Your presentation last week was very clear. The whole team liked it."}, {"s": "Elif", "t": "Thank you. I practiced a lot at home."}, {"s": "Maria", "t": "I can tell. Now, one small thing. In meetings, you're very quiet."}, {"s": "Elif", "t": "I know. Sometimes I'm not sure about my English."}, {"s": "Maria", "t": "Your English is fine. We want to hear your ideas."}, {"s": "Elif", "t": "OK. I'll share my ideas more often. I promise."}, {"s": "Maria", "t": "Great. And if something isn't clear, just ask."}, {"s": "Elif", "t": "I will. Actually, can I ask about the flower shop project?"}, {"s": "Maria", "t": "Sure. Sam is designing their new posters, and he needs some help."}, {"s": "Elif", "t": "I'll help him! I can write the emails to the client."}, {"s": "Maria", "t": "Perfect. I'll tell Sam this afternoon."}, {"s": "Maria", "t": "Oh, and one more thing. I need your date of birth for this form."}, {"s": "Elif", "t": "Sure. Here, I'll write it down for you."}, {"s": "Maria", "t": "Wait, your birthday is this Saturday!"}, {"s": "Elif", "t": "Yes, but please don't tell anyone. I don't want a big party."}, {"s": "Maria", "t": "OK, I won't tell anyone. I promise."}, {"s": "Elif", "t": "Thank you. So, when is our next check-in?"}, {"s": "Maria", "t": "In a month. I'll send you an invite."}, {"s": "Elif", "t": "Great. Thanks, Maria. This was really helpful."}, {"s": "Maria", "t": "You're welcome. Keep up the good work!"}], "mcq": [{"q": "What does Maria say about Elif's work?", "options": ["Everyone is happy with it.", "It is often late.", "It needs a lot of changes."], "answer": 0}, {"q": "What does Maria want Elif to do in meetings?", "options": ["take more notes", "share her ideas more", "speak more slowly"], "answer": 1}, {"q": "How will Elif help with the flower shop project?", "options": ["She will design the posters.", "She will write the emails to the client.", "She will visit the shop."], "answer": 1}, {"q": "What does Elif ask Maria to do?", "options": ["keep her birthday a secret", "plan a small party", "move the next check-in"], "answer": 0}], "gaps": [{"line": 4, "answer": "happy with"}, {"line": 8, "answer": "very quiet"}, {"line": 11, "answer": "I'll share"}, {"line": 15, "answer": "I'll help"}, {"line": 21, "answer": "won't tell"}, {"line": 25, "answer": "Keep up"}]}, "vocab": [{"w": "check-in", "m": "a short meeting about how your work is going", "ex": "I have a check-in with my boss every month."}, {"w": "to be honest", "m": "I'm telling you what I really think", "ex": "To be honest, I didn't like the movie."}, {"w": "great to hear", "m": "a happy answer to good news", "ex": "You passed the test? That's great to hear!"}, {"w": "I can tell", "m": "I can see that it is true", "ex": "You're tired. I can tell."}, {"w": "share my ideas", "m": "tell other people what I think", "ex": "In class, I try to share my ideas."}, {"w": "date of birth", "m": "the day you were born", "ex": "Please write your date of birth on the form."}, {"w": "write it down", "m": "write something on paper so you remember", "ex": "Here's my phone number. Write it down."}, {"w": "Keep up the good work", "m": "continue doing well", "ex": "Your grades are great. Keep up the good work!"}], "grammar": {"title": "Will for promises, offers and decisions", "points": ["Use will + base verb for promises: I'll call you tonight.", "Use will for offers: That bag looks heavy. I'll carry it.", "Use will for decisions you make now: I'm cold. I'll close the window.", "Negative: won't (will not). I won't tell anyone."], "examples": [{"en": "I'll share my ideas more often. I promise.", "note": "a promise"}, {"en": "You look busy. I'll help you.", "note": "an offer"}, {"en": "The blue one? OK, I'll take it.", "note": "a decision now"}, {"en": "Don't worry. I won't be late.", "note": "won't = will not"}], "exercises": [{"type": "choice", "q": "That box looks heavy. ___ carry it for you.", "options": ["I'll", "I'm", "I"], "answer": 0, "why": "An offer: I'll + base verb."}, {"type": "choice", "q": "I promise I ___ tell anyone your secret.", "options": ["don't", "won't", "am not"], "answer": 1, "why": "A promise about the future: won't + base verb."}, {"type": "choice", "q": "The phone is ringing. I'll ___ it.", "options": ["answer", "answering", "to answer"], "answer": 0, "why": "After will, use the base verb."}, {"type": "choice", "q": "A: We need milk. B: OK, ___ get some after work.", "options": ["I'll", "I'm", "I was"], "answer": 0, "why": "A decision you make now: I'll."}, {"type": "type", "q": "I promise I ___ you every day. (text)", "answers": ["'ll text", "will text"], "why": "A promise: will + base verb."}, {"type": "type", "q": "A: I can't open this jar. B: Give it to me. I ___ it. (open)", "answers": ["'ll open", "will open"], "why": "An offer: I'll + base verb."}, {"type": "type", "q": "She ___ late again. She promised. (not / be)", "answers": ["won't be", "will not be"], "why": "A promise in the negative: won't + base verb."}, {"type": "type", "q": "A: Tea or coffee? B: I ___ tea, please. (have)", "answers": ["'ll have", "will have"], "why": "A decision at the moment: I'll have."}]}, "reading": {"title": "Notes from our check-in", "kind": "an email from Maria", "text": "Subject: Notes from our check-in\n\nHi Elif,\n\nThank you for our meeting this morning. Here are my notes, as I promised.\n\nFirst, the good news. You have done great work in your first weeks here. Your presentation last week was clear and well organized, and the whole team enjoyed it.\n\nSecond, one small goal. In our meetings, please share your ideas. You have good ideas, and your English is fine. If something isn't clear, just ask. Nobody will think it's a strange question.\n\nThird, the flower shop project. You offered to help Sam, so I'll tell him today. Ms. Carter, the owner of the shop, is a very nice woman. You will write the emails to her, and Sam will make the designs. She needs the posters by next Monday morning.\n\nFinally, I'll send you an invite for our next check-in in a month. If you have any questions before then, my door is always open.\n\nOh, and don't worry. I won't forget my other promise!\n\nBest,\nMaria", "questions": [{"q": "Why did Maria write this email?", "options": ["to send notes from the meeting", "to invite Elif to a party", "to give Elif a new job"], "answer": 0}, {"q": "What is Elif's goal for meetings?", "options": ["to arrive earlier", "to share her ideas", "to take more notes"], "answer": 1}, {"q": "Who is Ms. Carter?", "options": ["a new designer", "the owner of a flower shop", "Maria's manager"], "answer": 1}, {"q": "When does Ms. Carter need the posters?", "options": ["by Friday", "by next Monday morning", "in a month"], "answer": 1}], "tf": [{"s": "Maria thinks Elif's English is a problem.", "answer": false}, {"s": "Sam will make the designs for the posters.", "answer": true}, {"s": "The next check-in is next week.", "answer": false}], "gloss": {"a": "bir", "always": "her zaman", "an": "bir", "and": "ve", "any": "herhangi bir", "are": "-dir (here are: işte)", "as": "-dığı gibi", "ask": "sormak", "before": "önce, -den önce", "best": "sevgiler (Best: kapanış)", "by": "-e kadar (en geç)", "carter": "Carter (soyadı)", "check": "kontrol (check-in: görüşme)", "clear": "açık, anlaşılır", "designs": "tasarımlar", "don't": "yapma / -me (do not)", "done": "yaptın (do: yapmak)", "door": "kapı", "elif": "Elif (isim)", "emails": "e-postalar", "english": "İngilizce", "enjoyed": "beğendi, keyif aldı (enjoy: beğenmek)", "finally": "son olarak", "fine": "iyi, yeterli", "first": "ilk olarak / ilk", "flower": "çiçek", "for": "için", "forget": "unutmak", "from": "-den / -dan", "goal": "hedef", "good": "iyi", "great": "harika", "have": "(have done: yaptın)", "help": "yardım etmek", "her": "ona (kadın)", "here": "işte (here are: işte ...)", "hi": "merhaba", "him": "ona / onu (erkek)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "ideas": "fikirler", "if": "eğer", "in": "-de / içinde (check-in: görüşme)", "invite": "davet (toplantı daveti)", "is": "-dir / olmak (to be)", "isn't": "değilse (is not)", "it": "onu (sunumu)", "it's": "o ...-dir (it is)", "just": "sadece, yalnızca", "last": "son", "make": "yapmak, hazırlamak", "maria": "Maria (isim)", "meeting": "toplantı", "meetings": "toplantılar", "monday": "pazartesi", "month": "ay", "morning": "sabah", "ms": "Bayan (Ms.)", "my": "benim", "needs": "ihtiyacı var (need: ihtiyaç duymak)", "news": "haber", "next": "gelecek, bir sonraki", "nice": "hoş, iyi", "nobody": "hiç kimse", "notes": "notlar", "of": "-in / -nın", "offered": "teklif ettin (offer: teklif etmek)", "oh": "ah, bu arada", "one": "bir", "open": "açık", "organized": "düzenlenmiş (organize: düzenlemek)", "other": "diğer, öbür", "our": "bizim", "owner": "sahibi", "please": "lütfen", "posters": "afişler", "presentation": "sunum", "project": "proje", "promise": "söz, vaat", "promised": "söz verdiğim (promise: söz vermek)", "question": "soru", "questions": "sorular", "sam": "Sam (isim)", "second": "ikinci olarak", "send": "göndermek", "share": "paylaşmak", "she": "o (kadın)", "shop": "dükkân", "small": "küçük", "so": "bu yüzden", "something": "bir şey", "strange": "garip, tuhaf", "subject": "konu", "team": "ekip", "tell": "söylemek, anlatmak", "thank": "teşekkür etmek (thank you: teşekkürler)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "then": "o zaman", "think": "düşünmek", "third": "üçüncü olarak", "this": "bu", "to": "-mek/-mak (fiil öncesi)", "today": "bugün", "very": "çok", "was": "idi / -di (to be, geçmiş)", "week": "hafta", "weeks": "haftalar", "well": "iyi (well organized: iyi düzenlenmiş)", "whole": "bütün, tüm", "will": "-ecek (gelecek zaman)", "woman": "kadın", "won't": "-meyeceğim (will not)", "work": "iş", "worry": "endişelenmek (don't worry: merak etme)", "write": "yazmak", "you": "sen / siz", "your": "senin"}}, "speaking": {"prompt": "Think about your job or your studies. What is going well, and what do you want to do better?", "steps": ["say one thing that is going well", "say one thing you want to do better", "make two promises with I'll"], "starters": ["Things are going well because ...", "One thing I want to improve is ...", "I'll ... more often.", "I promise I won't ..."], "model": "Right now, I'm studying English, and things are going well. I understand much more than before, and I can watch short videos without subtitles. But I want to improve my speaking. I'm often quiet because I'm afraid of mistakes. So here are my promises. I'll speak English for ten minutes every day. I'll record myself and listen again. And I won't stop when I make a mistake. Next month, I'll check my progress again."}, "writing": {"prompt": "Your manager helped you with a problem today. Write a short thank-you email and make two promises.", "length": "50-80 words", "checklist": ["Say thank you and why.", "Use I'll for at least two promises or offers.", "Use won't at least once."], "model": "Hi Karen,\n\nThank you for your help today. Your advice about my report was really useful. I'll make the changes tonight, and I'll send you the new version tomorrow morning. I won't forget the numbers in the second part this time! Also, I know you're very busy this week. I'll answer the client's phone calls for you on Thursday.\n\nThanks again,\nTom"}, "audio": {"listen": "audio/w4d1-listen.mp3", "listenT": [[0.3, 3.37], [3.82, 6.79], [7.24, 12.61], [13.06, 15.5], [15.95, 20.32], [20.77, 22.52], [22.97, 27.17], [27.62, 29.84], [30.29, 34.51], [34.96, 37.74], [38.19, 41.19], [41.64, 44.97], [45.42, 48.17], [48.62, 52.44], [52.89, 56.97], [57.42, 60.38], [60.83, 63.27], [63.72, 67.62], [68.07, 70.27], [70.72, 72.98], [73.43, 77.01], [77.46, 79.79], [80.24, 82.65], [83.1, 85.21], [85.66, 88.58], [89.03, 91.17]], "read": "audio/w4d1-read.mp3", "speak": "audio/w4d1-speak.mp3", "vocab": "audio/w4d1-vocab.mp3", "vocabT": [[0.3, 1.35, 1.95, 4.31], [5.21, 6.41, 7.01, 9.35], [10.25, 11.43, 12.03, 14.46], [15.36, 16.45, 17.05, 18.75], [19.65, 21.0, 21.6, 23.92], [24.82, 25.89, 26.49, 28.92], [29.82, 30.97, 31.57, 33.96], [34.86, 36.29, 36.89, 39.56]]}}, {"day": 2, "dayName": "Tuesday", "title": "Dear Ms. Carter", "goals": ["I can write a short, clear work email.", "I can describe people and things with who, which and that.", "I can start and end an email politely."], "listening": {"title": "Too many paragraphs", "intro": "At his desk, Sam helps Elif with her first email to a client.", "speakers": {"Elif": "female", "Sam": "male"}, "lines": [{"s": "Sam", "t": "Hey, Elif. Maria says you're helping me with the flower shop project."}, {"s": "Elif", "t": "Yes! I'm writing the first email to the client now. Can you look at it?"}, {"s": "Sam", "t": "Sure. Who's it for? Ms. Carter?"}, {"s": "Elif", "t": "Yes, the woman who owns the shop. Here it is."}, {"s": "Sam", "t": "OK... \"Dear Ms. Carter, I am Elif, the new assistant which works with Sam.\""}, {"s": "Elif", "t": "Is that wrong?"}, {"s": "Sam", "t": "Just one word. For people, we use \"who.\" The assistant who works with Sam."}, {"s": "Elif", "t": "Oh, right. \"Which\" is for things. Like the posters which we're designing."}, {"s": "Sam", "t": "Exactly. You can also use \"that\" for people and things."}, {"s": "Elif", "t": "OK. What about the rest? Is it too long?"}, {"s": "Sam", "t": "A little. Clients like emails that are short and clear."}, {"s": "Elif", "t": "Hmm. I wrote five paragraphs."}, {"s": "Sam", "t": "Five? Let's make it two. What does she need to know?"}, {"s": "Elif", "t": "She needs to send us the photos that she wants on the posters."}, {"s": "Sam", "t": "Good. Put that first. Then ask about the colors."}, {"s": "Elif", "t": "The colors which she likes? She said green in her first email."}, {"s": "Sam", "t": "Right. So just check: \"Is green still the color you want?\""}, {"s": "Elif", "t": "Got it. And how do I finish? \"Kisses, Elif\"?"}, {"s": "Sam", "t": "Ha! No kisses for clients, please. \"Best regards\" is fine."}, {"s": "Elif", "t": "In Turkey, we're more formal in work emails. Here, people seem more relaxed."}, {"s": "Sam", "t": "A bit. But don't use too many emojis, either."}, {"s": "Elif", "t": "OK, no emojis. One more question. Who's the man who called this morning?"}, {"s": "Sam", "t": "That's Mr. Ortiz. He works at the print shop that prints all our posters."}, {"s": "Elif", "t": "I'll add him to my contacts. Thanks, Sam. You're a big help."}, {"s": "Sam", "t": "Anytime. Now send it before you write paragraph number three!"}], "mcq": [{"q": "What is Elif writing?", "options": ["a report for Maria", "an email to a client", "a message to her mom"], "answer": 1}, {"q": "What mistake did Elif make?", "options": ["She used \"which\" for a person.", "She wrote the wrong name.", "She forgot the photos."], "answer": 0}, {"q": "What does Sam say about emails to clients?", "options": ["They should be short and clear.", "They should be very formal.", "They should have a lot of emojis."], "answer": 0}, {"q": "Who is Mr. Ortiz?", "options": ["a new client", "Sam's friend", "a man from the print shop"], "answer": 2}], "gaps": [{"line": 3, "answer": "who owns"}, {"line": 6, "answer": "who works"}, {"line": 10, "answer": "short and clear"}, {"line": 13, "answer": "that she wants"}, {"line": 18, "answer": "Best regards"}, {"line": 22, "answer": "that prints"}]}, "vocab": [{"w": "owns", "m": "has something that belongs to them", "ex": "My uncle owns a small restaurant."}, {"w": "short and clear", "m": "quick and easy to understand", "ex": "Please keep your answers short and clear."}, {"w": "paragraph", "m": "a group of sentences about one idea", "ex": "The first paragraph of your email is too long."}, {"w": "Best regards", "m": "a polite way to end a work email", "ex": "I always end my work emails with \"Best regards.\""}, {"w": "formal", "m": "serious and polite, for work or official situations", "ex": "A job interview is a formal situation."}, {"w": "relaxed", "m": "calm and not very formal", "ex": "Our office feels relaxed on Fridays."}, {"w": "contacts", "m": "the names and numbers saved in your phone", "ex": "I added my new coworker to my phone contacts."}, {"w": "attach", "m": "add a file to an email", "ex": "Can you attach the photos to your email?"}], "grammar": {"title": "Relative clauses: who, which, that", "points": ["Use who for people: the woman who owns the shop.", "Use which for things: the posters which we're designing.", "You can use that for people and things: the man that called, the email that I sent.", "Don't repeat the object: the photos that she sent (not \"sent them\")."], "examples": [{"en": "Ms. Carter is the woman who owns the flower shop.", "note": "who = a person"}, {"en": "Clients like emails which are short.", "note": "which = a thing"}, {"en": "This is the file that I need.", "note": "that = a thing"}, {"en": "He's the man that prints our posters.", "note": "that = a person"}], "tr": "İngilizcede açıklama isimden sonra gelir: the woman who owns the shop (dükkânı olan kadın).", "exercises": [{"type": "choice", "q": "The man ___ lives next door is very funny.", "options": ["who", "which", "what"], "answer": 0, "why": "Use who for people."}, {"type": "choice", "q": "I lost the keys ___ you gave me.", "options": ["who", "which", "where"], "answer": 1, "why": "Use which for things, like keys."}, {"type": "choice", "q": "These are the photos that she ___.", "options": ["sent", "sent them", "sent it"], "answer": 0, "why": "Don't repeat the object after that."}, {"type": "choice", "q": "Sam is the designer ___ helped me.", "options": ["which", "who", "whose"], "answer": 1, "why": "Sam is a person, so use who."}, {"type": "type", "q": "Maria is the manager ___ organized the trip. (who / which)", "answers": ["who", "that"], "why": "Maria is a person: who (or that)."}, {"type": "type", "q": "I like emails ___ are short. (who / which)", "answers": ["which", "that"], "why": "Emails are things: which (or that)."}, {"type": "type", "q": "The photos ___ she sent are beautiful. (who / which)", "answers": ["which", "that"], "why": "Photos are things: which (or that)."}, {"type": "type", "q": "Do you know the woman ___ works at the bakery? (who / which)", "answers": ["who", "that"], "why": "A woman is a person: who (or that)."}]}, "reading": {"title": "Your new posters", "kind": "two work emails", "text": "Subject: Your new posters\n\nDear Ms. Carter,\n\nMy name is Elif, and I'm the new assistant who works with Sam on your posters.\n\nCould you send us the photos that you want on the posters? Also, is green still the color that you like best? I've attached two early designs which Sam made yesterday.\n\nBest regards,\nElif Demir\n\nDear Elif,\n\nThank you for your email. It was short and clear. I like that!\n\nThe designs are lovely. My favorite is the one which has the big flowers at the top. I've attached six photos that my daughter took in the shop. Please use the photo that shows our front window. It's my favorite.\n\nYes, green is still my favorite color. But maybe you can add a little yellow too.\n\nOne more thing: the man who brings flowers to my shop every morning would like a small poster for his truck. Can you make one for him too? I'll pay for it, of course.\n\nThank you, and say hello to Sam!\n\nBest regards,\nAnn Carter", "questions": [{"q": "Why did Elif write to Ms. Carter?", "options": ["to ask for photos and check the color", "to ask for money", "to invite her to the office"], "answer": 0}, {"q": "Which design does Ms. Carter like best?", "options": ["the green one", "the one with big flowers at the top", "the one with yellow letters"], "answer": 1}, {"q": "Who took the photos?", "options": ["Sam", "Ms. Carter", "Ms. Carter's daughter"], "answer": 2}, {"q": "What extra job does Ms. Carter ask for?", "options": ["a poster for a truck", "a new logo", "a photo of the shop"], "answer": 0}], "tf": [{"s": "Elif attached two designs to her email.", "answer": true}, {"s": "Ms. Carter doesn't like green anymore.", "answer": false}, {"s": "Ms. Carter wants Sam to take more photos.", "answer": false}], "gloss": {"a": "bir", "add": "eklemek", "also": "ayrıca", "and": "ve", "ann": "Ann (isim)", "are": "-dir / -siniz (to be)", "assistant": "asistan", "at": "-de (at the top: üst kısımda)", "attached": "ekledim (attach: eklemek)", "best": "en çok / (best regards: saygılar)", "big": "büyük", "brings": "getiren (bring: getirmek)", "but": "ama", "can": "-ebilir misiniz (can: yapabilmek)", "carter": "Carter (soyadı)", "clear": "açık, anlaşılır", "color": "renk", "could": "-ebilir misiniz (rica)", "course": "(of course: tabii ki)", "daughter": "kızım", "dear": "sevgili, sayın", "demir": "Dem ork: çalışmak)", "would": "ister (would like: istemek)", "yellow": "sarı", "yes": "evet", "yesterday": "dün", "you": "sen / siz", "your": "senin / sizin"}}, "speaking": {"prompt": "Talk about some people and things that are important in your daily life.", "steps": ["describe a person who helps you", "describe a thing that you use every day", "say why they are important to you"], "starters": ["My ... is someone who ...", "I have a ... that I use every day.", "It's the thing which ...", "They're important to me because ..."], "model": "My neighbor is a woman who helps me a lot. She's the person that waters my plants when I'm away. She also makes a cake which is famous in our building! I also have an old bike that I ride to work every day. It's not beautiful, but it saves me a lot of time. And my phone, of course. It has a calendar app that reminds me about everything. Without these, my life is much harder."}, "writing": {"prompt": "Write a short work email to a coworker. Ask for a file and give one more piece of information.", "length": "50-80 words", "checklist": ["Start with Hi or Dear, and end with Best regards.", "Use who for a person and which or that for a thing.", "Keep it short and clear."], "model": "Hi Mark,\n\nCould you send me the report that we finished last week? I need it for the meeting which starts at two. It's the file that has all the sales numbers. Also, the woman who called this morning wants to talk to you about the new website. Her number is on your desk.\n\nBest regards,\nJulia"}, "audio": {"listen": "audio/w4d2-listen.mp3", "listenT": [[0.3, 4.5], [4.95, 9.13], [9.58, 11.46], [11.91, 14.73], [15.18, 19.91], [20.36, 21.34], [21.79, 26.34], [26.79, 30.82], [31.27, 34.58], [35.03, 37.65], [38.1, 41.17], [41.62, 43.61], [44.06, 46.72], [47.17, 50.52], [50.97, 53.62], [54.07, 57.7], [58.15, 61.22], [61.67, 64.65], [65.1, 69.03], [69.48, 74.49], [74.94, 77.55], [78.0, 82.73], [83.18, 87.81], [88.26, 91.97], [92.42, 96.03]], "read": "audio/w4d2-read.mp3", "speak": "audio/w4d2-speak.mp3", "vocab": "audio/w4d2-vocab.mp3", "vocabT": [[0.3, 1.26, 1.86, 3.95], [4.85, 6.07, 6.67, 8.86], [9.76, 10.79, 11.39, 14.05], [14.95, 16.17, 16.77, 19.91], [20.81, 21.75, 22.35, 25.08], [25.98, 26.94, 27.54, 29.8], [30.7, 31.7, 32.3, 35.18], [36.08, 37.08, 37.68, 39.82]]}}, {"day": 3, "dayName": "Wednesday", "title": "That's not what I said!", "goals": ["I can report what people said.", "I can use said and told correctly.", "I can fix a small misunderstanding politely."], "listening": {"title": "Too dark?", "intro": "Elif talks to Sam in the office kitchen on Wednesday afternoon.", "speakers": {"Elif": "female", "Sam": "male"}, "lines": [{"s": "Elif", "t": "Sam? Are you OK? You didn't say much in the meeting this morning."}, {"s": "Sam", "t": "I'm fine. I'm just busy."}, {"s": "Elif", "t": "Are you sure? You usually tell me jokes all day."}, {"s": "Sam", "t": "OK... Maria told me something yesterday. She said you didn't like my posters."}, {"s": "Elif", "t": "What? That's not true! What exactly did she say?"}, {"s": "Sam", "t": "She said you thought the colors were too dark."}, {"s": "Elif", "t": "Oh no. I didn't say that. I said the photo was too dark."}, {"s": "Sam", "t": "The photo?"}, {"s": "Elif", "t": "Yes, the photo of the front window. The one that Ms. Carter sent us."}, {"s": "Elif", "t": "I told Maria that your colors were perfect. I love them!"}, {"s": "Sam", "t": "Really? Then why did she tell me that?"}, {"s": "Elif", "t": "Maybe she was in a hurry. She had three meetings yesterday."}, {"s": "Sam", "t": "Hmm, that's true. She told me about it in the hallway, very fast."}, {"s": "Elif", "t": "And my English isn't perfect. Maybe I said it badly."}, {"s": "Sam", "t": "No, I think I heard it wrong. I'm sorry, Elif. I was a little upset all day."}, {"s": "Elif", "t": "I'm sorry too. Next time, I'll talk to you first."}, {"s": "Sam", "t": "That's OK. So, you really like the colors?"}, {"s": "Elif", "t": "I really do. Last night I told my neighbor they were beautiful!"}, {"s": "Sam", "t": "Ha! OK, now I feel much better."}, {"s": "Elif", "t": "So, what about the dark photo? Ms. Carter said it was her favorite."}, {"s": "Sam", "t": "I can make it brighter on my computer. It's easy."}, {"s": "Elif", "t": "Great! I'll tell her we're fixing it."}, {"s": "Sam", "t": "And I'll tell Maria we're a great team again."}, {"s": "Elif", "t": "We never stopped being a great team! Do you want a coffee?"}, {"s": "Sam", "t": "Yes, please. And look, there's one cookie left."}, {"s": "Elif", "t": "You told me the rule: never take the last cookie!"}, {"s": "Sam", "t": "True. So let's share it."}], "mcq": [{"q": "Why is Sam quiet?", "options": ["He is sick.", "He thinks Elif doesn't like his posters.", "He is angry with Maria."], "answer": 1}, {"q": "What did Elif really say to Maria?", "options": ["The colors were too dark.", "The photo was too dark.", "The posters were too big."], "answer": 1}, {"q": "Why did the misunderstanding happen?", "options": ["Maria spoke fast, and Sam heard it wrong.", "Elif sent the wrong email.", "Ms. Carter didn't like the posters."], "answer": 0}, {"q": "How will they fix the dark photo?", "options": ["Ms. Carter will take a new one.", "Sam will make it brighter.", "Elif will choose a different photo."], "answer": 1}], "gaps": [{"line": 3, "answer": "She said"}, {"line": 5, "answer": "were too dark"}, {"line": 6, "answer": "I said"}, {"line": 9, "answer": "told Maria"}, {"line": 14, "answer": "heard it wrong"}, {"line": 19, "answer": "it was her favorite"}]}, "vocab": [{"w": "That's not true", "m": "that is wrong", "ex": "That's not true! I never said that."}, {"w": "exactly", "m": "used to ask for all the details", "ex": "What exactly do you need?"}, {"w": "in a hurry", "m": "doing things fast because you have little time", "ex": "Sorry, I can't talk now. I'm in a hurry."}, {"w": "hallway", "m": "a long space between rooms", "ex": "Let's talk in the hallway."}, {"w": "heard it wrong", "m": "understood the words in the wrong way", "ex": "I thought he said Tuesday, but I heard it wrong."}, {"w": "upset", "m": "unhappy or worried because of a problem", "ex": "She was upset because she missed the bus."}, {"w": "brighter", "m": "with more light", "ex": "This room is brighter in the morning."}, {"w": "misunderstanding", "m": "when people understand something in the wrong way", "ex": "It was just a small misunderstanding."}], "grammar": {"title": "Reported speech: said and told", "points": ["Use said without a person: She said (that) the photo was dark.", "Use told + a person: She told me (that) the photo was dark.", "Move the verb one step back: is → was, like → liked, can → could, will → would.", "Change the pronouns: \"I love it.\" → She said she loved it."], "examples": [{"en": "\"The photo is too dark.\" → I said the photo was too dark.", "note": "is → was"}, {"en": "\"I love your colors.\" → She told him she loved his colors.", "note": "told + person"}, {"en": "\"I can help.\" → He said he could help.", "note": "can → could"}, {"en": "\"I'll call you.\" → She told me she would call me.", "note": "will → would"}], "tr": "Türkçedeki \"dedi\", İngilizcede hem said hem told olabilir; ama told'dan sonra mutlaka kişi gelir: told me, told Sam.", "exercises": [{"type": "choice", "q": "She ___ me that she was tired.", "options": ["said", "told", "say"], "answer": 1, "why": "Told + a person (me)."}, {"type": "choice", "q": "He ___ that the bus was late.", "options": ["told", "said", "told to"], "answer": 1, "why": "There's no person after the verb, so use said."}, {"type": "choice", "q": "\"I am hungry.\" → Yesterday, Dan said he ___ hungry.", "options": ["is", "was", "were"], "answer": 1, "why": "Move the tense back: am → was."}, {"type": "choice", "q": "\"I can drive.\" → Sam told us he ___ drive.", "options": ["could", "would", "should"], "answer": 0, "why": "In reported speech, can → could."}, {"type": "type", "q": "\"I'm tired.\" → Last night, Elif said she ___ tired. (be)", "answers": ["was"], "why": "Move the tense back: am → was."}, {"type": "type", "q": "\"I'll send it tomorrow.\" → Maria said she ___ it the next day. (send)", "answers": ["would send", "'d send"], "why": "will → would."}, {"type": "type", "q": "Sam ___ me the meeting was at ten. (tell)", "answers": ["told"], "why": "Told + a person; tell → told."}, {"type": "type", "q": "\"I want pizza.\" → At lunch, Sam said he ___ pizza. (want)", "answers": ["wanted"], "why": "Move the tense back: want → wanted."}]}, "reading": {"title": "A lesson about talking", "kind": "Elif's diary", "text": "Wednesday night\n\nToday I learned an important lesson about talking to people.\n\nYesterday, Ms. Carter sent us some photos for her posters. One photo was very dark, so I told Maria, \"The photo is too dark.\" But Maria was in a hurry, and she said something quick to Sam in the hallway. Sam thought I didn't like his colors!\n\nThis morning, Sam was very quiet. He didn't tell any jokes. In the afternoon, I asked him about it. He said Maria told him I didn't like his posters. I was shocked! I told him I loved his colors. And it's true. They're beautiful.\n\nThen he said he was sorry, and I said I was sorry too. It was just a small misunderstanding. We laughed about it in the kitchen, and we shared the last cookie.\n\nLater, Maria came to my desk. Sam told her the whole story. She said, \"I'm so sorry, Elif. I'll listen more carefully next time.\"\n\nMom called tonight, and I told her everything. She said small problems were normal in a new job. Then she asked about my dinner, of course!", "questions": [{"q": "Why did Elif talk to Maria about the photo?", "options": ["because it was too dark", "because it was too small", "because it was from the wrong shop"], "answer": 0}, {"q": "What did Sam think?", "options": ["Elif didn't like his colors.", "Maria was angry with him.", "Ms. Carter didn't like the posters."], "answer": 0}, {"q": "What did Maria say to Elif later?", "options": ["She said she was busy.", "She said she was sorry.", "She said Sam was wrong."], "answer": 1}, {"q": "What did Elif's mom say?", "options": ["Small problems were normal in a new job.", "Elif should find a new job.", "Sam wasn't a good friend."], "answer": 0}], "tf": [{"s": "Sam told a lot of jokes this morning.", "answer": false}, {"s": "Elif and Sam shared the last cookie.", "answer": true}, {"s": "Elif told her mom about the problem.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında / -e (laugh about)", "afternoon": "öğleden sonra", "an": "bir", "and": "ve", "any": "hiç", "asked": "sordu (ask: sormak)", "beautiful": "güzel", "but": "ama", "called": "aradı (call: aramak)", "came": "geldi (come: gelmek)", "carefully": "dikkatle, dikkatli", "carter": "Carter (soyadı)", "colors": "renkler", "cookie": "kurabiye", "course": "(of course: tabii ki)", "dark": "karanlık, koyu", "desk": "masa", "didn't": "-medi (did not)", "dinner": "akşam yemeği", "elif": "Elif (isim)", "everything": "her şeyi", "for": "için", "hallway": "koridor", "he": "o (erkek)", "her": "ona / onun (kadın)", "him": "ona / onu (erkek)", "his": "onun (erkek)", "hurry": "acele (in a hurry: aceleyle)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-im (I am)", "important": "önemli", "in": "-de / içinde (in a hurry: aceleyle)", "is": "-dir / olmak (to be)", "it": "o / bunu", "it's": "o ...-dir (it is)", "job": "iş", "jokes": "şakalar", "just": "sadece", "kitchen": "mutfak", "last": "son", "later": "sonra, daha sonra", "laughed": "güldük (laugh: gülmek)", "learned": "öğrendim (learn: öğrenmek)", "lesson": "ders", "like": "beğenmek, sevmek", "listen": "dinlemek", "loved": "çok sevdiğimi (love: sevmek)", "maria": "Maria (isim)", "misunderstanding": "yanlış anlama", "mom": "annem", "more": "daha", "morning": "sabah", "ms": "Bayan (Ms.)", "my": "benim", "new": "yeni", "next": "bir sonraki", "night": "gece", "normal": "normal", "of": "-in / -nın", "one": "bir", orker said to you today.", "length": "50-80 words", "checklist": ["Use said at least once.", "Use told + a person at least once.", "Move the tense back (is → was, can → could)."], "model": "Hi Lisa! Guess what? My boss called me into her office today. I was so nervous! But she said she was very happy with my work. She told me I could lead the next project. Then my coworker Tom said he wanted to help me. I told him he was the best. Let's celebrate on Friday! Are you free after work?"}, "audio": {"listen": "audio/w4d3-listen.mp3", "listenT": [[0.3, 4.14], [4.59, 6.19], [6.64, 9.56], [10.01, 14.96], [15.41, 18.44], [18.89, 21.11], [21.56, 25.17], [25.62, 26.51], [26.96, 31.4], [31.85, 35.22], [35.67, 37.67], [38.12, 41.54], [41.99, 45.66], [46.11, 49.46], [49.91, 54.49], [54.94, 57.89], [58.34, 60.75], [61.2, 64.78], [65.23, 67.22], [67.67, 71.93], [72.38, 75.45], [75.9, 77.87], [78.32, 80.77], [81.22, 84.34], [84.79, 87.2], [87.65, 90.57], [91.02, 92.3]], "read": "audio/w4d3-read.mp3", "speak": "audio/w4d3-speak.mp3", "vocab": "audio/w4d3-vocab.mp3", "vocabT": [[0.3, 1.49, 2.09, 4.31], [5.21, 6.3, 6.9, 8.48], [9.38, 10.49, 11.09, 13.65], [14.55, 15.49, 16.09, 17.58], [18.48, 19.63, 20.23, 22.9], [23.8, 24.74, 25.34, 27.39], [28.29, 29.29, 29.89, 31.77], [32.67, 33.95, 34.55, 36.72]]}}, {"day": 4, "dayName": "Thursday", "title": "Lunch for the team", "goals": ["I can order food for a group on the phone.", "I can say what I want and prefer with would like and would rather.", "I can use a few and a little."], "listening": {"title": "Ten sandwiches, please", "intro": "Elif plans a team lunch with Sam, then calls Nina at a sandwich shop.", "speakers": {"Elif": "female", "Sam": "male", "Nina": "female"}, "lines": [{"s": "Sam", "t": "So, Maria wants you to order lunch for the whole team?"}, {"s": "Elif", "t": "Yes, for eight people. It's my first time. Can you help me?"}, {"s": "Sam", "t": "Sure. The sandwich place on the corner is good. Or would you rather get pizza?"}, {"s": "Elif", "t": "I'd rather get sandwiches. We had pizza last time, right?"}, {"s": "Sam", "t": "Right. OK, I'd like a chicken sandwich, please."}, {"s": "Elif", "t": "Chicken, of course. And Maria said she'd like a vegetable sandwich."}, {"s": "Sam", "t": "Good. Get a few extra sandwiches, too. People are always hungry."}, {"s": "Elif", "t": "How many? Two?"}, {"s": "Sam", "t": "Two is perfect. And maybe a little fruit for dessert."}, {"s": "Elif", "t": "OK. I'll call them now."}, {"s": "Nina", "t": "Hi, this is Nina. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like to order lunch for a meeting, please. Ten sandwiches."}, {"s": "Nina", "t": "Sure. What would you like?"}, {"s": "Elif", "t": "Six chicken sandwiches and four vegetable sandwiches, please."}, {"s": "Nina", "t": "Would you like chips with that?"}, {"s": "Elif", "t": "Yes, please. And a few bottles of water."}, {"s": "Nina", "t": "How many bottles?"}, {"s": "Elif", "t": "Ten, please. Oh, and could you put the mayo on the side? Some people don't like it."}, {"s": "Nina", "t": "No problem. Would you rather pick it up, or should we deliver it?"}, {"s": "Elif", "t": "Delivery, please. We're very busy, so I'd rather stay at the office."}, {"s": "Nina", "t": "Sure. It'll be there at twelve thirty. What's the address?"}, {"s": "Elif", "t": "It's the design office across from the bus stop, on the second floor."}, {"s": "Nina", "t": "Got it. And what's the name for the order?"}, {"s": "Elif", "t": "Elif. E-L-I-F."}, {"s": "Nina", "t": "Thanks, Elif. See you at twelve thirty!"}, {"s": "Sam", "t": "See? That was easy. You're a pro now."}, {"s": "Elif", "t": "Not yet. I'd like a little more practice first!"}], "mcq": [{"q": "How many sandwiches does Elif order?", "options": ["eight", "ten", "twelve"], "answer": 1}, {"q": "Why does Elif choose sandwiches?", "options": ["They had pizza last time.", "Sandwiches are cheaper.", "Maria doesn't like pizza."], "answer": 0}, {"q": "What does Elif ask about the mayo?", xt few days.", "I can use the present continuous for future plans.", "I can talk about deadlines at work."], "listening": {"title": "A late Friday", "intro": "Elif and Sam are working late at the office on Friday evening. Then Maria arrives.", "speakers": {"Elif": "female", "Sam": "male", "Maria": "female"}, "lines": [{"s": "Sam", "t": "It's seven o'clock on a Friday. Usually we leave at five!"}, {"s": "Elif", "t": "I know. But the posters have to be ready on Monday morning."}, {"s": "Sam", "t": "Right. Ms. Carter is coming to the office at nine."}, {"s": "Elif", "t": "So we're finishing everything tonight. How many are left?"}, {"s": "Sam", "t": "Two. The big window poster and the small one for the truck."}, {"s": "Sam", "t": "I'm working on the window poster now. Can you check the text on the truck one?"}, {"s": "Elif", "t": "Sure. Oh no, there's a mistake in the phone number."}, {"s": "Sam", "t": "Good catch! Can you fix it?"}, {"s": "Elif", "t": "Done. Hey, someone is at the door."}, {"s": "Maria", "t": "Hi, you two! I brought pizza. Sam, you said you'd rather have pizza, right?"}, {"s": "Sam", "t": "Maria, you're the best!"}, {"s": "Maria", "t": "So, how's it going?"}, {"s": "Elif", "t": "Good. We're almost done. Sam is finishing the last big poster."}, {"s": "Maria", "t": "Great work. I'm meeting Ms. Carter at nine on Monday. Can you both be there?"}, {"s": "Elif", "t": "Of course. I'm coming in early to print everything."}, {"s": "Maria", "t": "Perfect. OK, I'm going home now. Don't stay too late!"}, {"s": "Sam", "t": "We won't. Thanks for the pizza!"}, {"s": "Sam", "t": "So, Elif, what are you doing tomorrow?"}, {"s": "Elif", "t": "Nothing special. I'm cleaning my apartment, and my mom is calling me in the morning."}, {"s": "Sam", "t": "Some of us are having brunch at the café on the corner at eleven. Do you want to come?"}, {"s": "Elif", "t": "Brunch? Sure, I'd love to! Who's coming?"}, {"s": "Sam", "t": "Oh, just a few people from work. Nothing big."}, {"s": "Elif", "t": "Sounds fun. I'm not doing anything in the afternoon, either."}, {"s": "Sam", "t": "Great. Now let's finish. I'm not sleeping here tonight!"}, {"s": "Elif", "t": "Me neither. Ten more minutes!"}], "mcq": [{"q": "Why are Elif and Sam working late?", "options": ["The posters have to be ready on Monday.", "Maria is angry with them.", "Their computers were broken."], "answer": 0}, {"q": "What mistake does Elif find?", "options": ["a wrong color", "a mistake in the phone number", "a wrong date"], "answer": 1}, {"q": "Why is Elif coming in early on Monday?", "options": ["to meet Ms. Carter at her shop", "to print everything", "to call her mom"], "answer": 1}, {"q": "What does Sam invite Elif to?", "options": ["a basketball game", "brunch at a café", "a party at Dan's"], "answer": 1}], "gaps": [{"line": 2, "answer": "is coming"}, {"line": 5, "answer": "I'm working on"}, {"line": 13, "answer": "I'm meeting"}, {"line": 17, "answer": "are you doing"}, {"line": 18, "answer": "is calling"}, {"line": 19, "answer": "are having"}]}, "vocab": [{"w": "deadline", "m": "the last day or time to finish something", "ex": "The deadline for the report is Friday."}, {"w": "work late", "m": "stay at work after the usual time", "ex": "I have to work late tonight."}, {"w": "Good catch", "m": "well done, you found a mistake", "ex": "You saw the wrong date? Good catch!"}, {"w": "How's it going?", "m": "How are things?", "ex": "Hi, Tom! How's it going?"}, {"w": "come in early", "m": "arrive at work before the usual time", "ex": "Can you come in early tomorrow?"}, {"w": "Nothing special", "m": "nothing different or exciting", "ex": "What did you do yesterday? Nothing special."}, {"w": "brunch", "m": "a late breakfast or an early lunch", "ex": "We often have brunch on Sundays."}, {"w": "Me neither", "m": "I don't either", "ex": "\"I don't like cold weather.\" \"Me neither.\""}], "grammar": {"title": "Present continuous for future plans", "points": ["Use am / is / are + -ing for fixed plans: I'm meeting Ms. Carter on Monday.", "The plan usually has a time or day: tomorrow, at nine, on Saturday.", "Questions: What are you doing tomorrow? Are you coming to the party?", "Negative: I'm not working this weekend."], "examples": [{"en": "Ms. Carter is coming at nine on Monday.", "note": "a fixed plan"}, {"en": "What are you doing tomorrow?", "note": "asking about plans"}, {"en": "We're having brunch at eleven.", "note": "the time shows it's future"}, {"en": "I'm not working on Sunday.", "note": "a negative plan"}], "exercises": [{"type": "choice", "q": "What ___ you doing this weekend?", "options": ["are", "do", "is"], "answer": 0, "why": "Present continuous question: are + you + -ing."}, {"type": "choice", "q": "My parents ___ me next week. They have their tickets.", "options": ["are visiting", "visits", "visited"], "answer": 0, "why": "A fixed plan with a future time: are + -ing."}, {"type": "choice", "q": "___ Sam coming to the party tomorrow?", "options": ["Is", "Does", "Are"], "answer": 0, "why": "Sam is one person: Is Sam coming?"}, {"type": "choice", "q": "We aren't ___ tonight. We're too tired.", "options": ["go out", "going out", "went out"], "answer": 1, "why": "After aren't, use the -ing form."}, {"type": "type", "q": "We're ___ brunch at eleven tomorrow. (have)", "answers": ["having"], "why": "Have → having: drop the e, add -ing."}, {"type": "type", "q": "Ms. Carter is ___ to the office on Monday. (come)", "answers": ["coming"], "why": "Come → coming: drop the e, add -ing."}, {"type": "type", "q": "Are you ___ anything this weekend? (do)", "answers": ["doing"], "why": "Are you + -ing: asking about plans."}, {"type": "type", "q": "I'm not ___ late tonight. I'm too tired. (stay)", "answers": ["staying"], "why": "Negative plan: I'm not + -ing."}]}, "reading": {"title": "Still at the office?", "kind": "a text message chat", "text": "Dan: Hey, neighbor! Are you OK? I knocked on your door, but you weren't home.\n\nElif: Hi Dan! I'm still at the office. We're working late because of a big deadline.\n\nDan: On a Friday night? That's terrible! Did you eat anything?\n\nElif: Yes, Maria brought pizza. We're finishing the last poster now.\n\nDan: Good. When are you coming home?\n\nElif: I'm leaving in twenty minutes, I hope. I'm taking the bus at nine.\n\nDan: Text me when you're home. I'm making soup tonight, and there's a lot. I can bring you some.\n\nElif: You're so kind! Yes, please. I'm really hungry again.\n\nDan: Ha! So, what are you doing this weekend?\n\nElif: Tomorrow I'm having brunch with some people from work. On Sunday, I'm not doing anything. I'm resting!\n\nDan: Brunch with coworkers? Sounds fun. Are you doing anything special tomorrow night?\n\nElif: No. Why?\n\nDan: Oh, no reason. Just asking!\n\nElif: OK... The bus is coming. See you soon!", "questions": [{"q": "Why did Dan text Elif?", "options": ["He knocked on her door, and she wasn't home.", "He needed help with his sink.", "He wanted to borrow some sugar."], "answer": 0}, {"q": "Where is Elif?", "options": ["on the bus", "still at the office", "at a restaurant"], "answer": 1}, {"q": "What is Dan making tonight?", "options": ["pizza", "soup", "a cake"], "answer": 1}, {"q": "What is Elif doing on Sunday?", "options": ["having brunch", "working", "resting"], "answer": 2}], "tf": [{"s": "Elif didn't eat anything at the office.", "answer": false}, {"s": "Elif is taking the bus home at nine.", "answer": true}, {"s": "Elif is having brunch with her family tomorrow.", "answer": false}], "gloss": {"a": "bir", "again": "yine, tekrar", "and": "ve", "anything": "bir şey (soruda) / hiçbir şey", "are": "-sin / -iz (to be)", "asking": "soruyorum (ask: sormak)", "at": "-de / -da (at nine: dokuzda)", "because": "çünkü (because of: yüzünden)", "big": "büyük", "bring": "getirmek", "brought": "getirdi (bring: getirmek)", "brunch": "brunch (geç kahvaltı)", "bus": "otobüs", "but": "ama", "can": "-ebilirim (can: yapabilmek)", "coming": "geliyorsun (come: gelmek
