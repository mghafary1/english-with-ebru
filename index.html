First, I would ask a lot of questions, because I like to understand everything. Then I would make a simple plan with all the steps. If I had a problem, I would ask a coworker for help. I wouldn't wait until the last day. Honestly, if I were more confident, I would ask for bigger tasks more often. Maybe next year!"}, "writing": {"prompt": "A friend has a big new task at work and feels nervous. Write a text message with advice.", "length": "50-80 words", "checklist": ["Use If I were you, I would ... once.", "Use if + past simple, would + verb one more time.", "Use one phrase from today's vocab (on my own, trust me, make a plan ...)."], "model": "Hi Ana! Congratulations on the new project! Don't be nervous. Your boss chose you because you're good at your job. If I were you, I would make a plan first and write down every step. If you had a problem, your team would help you, so don't do everything on your own. And if I had more free time, I would bring you coffee every morning! Trust me, you can do this."}, "audio": {"listen": "audio/w6d1-listen.mp3", "listenT": [[0.3, 3.93], [4.38, 6.32], [6.77, 10.59], [11.04, 13.28], [13.73, 17.93], [18.38, 21.73], [22.18, 26.4], [26.85, 30.71], [31.16, 35.07], [35.52, 37.18], [37.63, 41.83], [42.28, 45.04], [45.49, 48.2], [48.65, 51.48], [51.93, 53.41], [53.86, 57.65], [58.1, 59.43], [59.88, 63.12], [63.57, 67.58], [68.03, 73.7], [74.15, 77.2], [77.65, 80.79], [81.24, 84.44], [84.89, 87.39]], "read": "audio/w6d1-read.mp3", "speak": "audio/w6d1-speak.mp3", "vocab": "audio/w6d1-vocab.mp3", "vocabT": [[0.3, 1.54, 2.14, 5.15], [6.05, 7.24, 7.84, 9.82], [10.72, 11.77, 12.37, 16.17], [17.07, 17.9, 18.5, 20.4], [21.3, 22.34, 22.94, 25.31], [26.21, 27.28, 27.88, 30.57], [31.47, 32.32, 32.92, 34.84], [35.74, 36.95, 37.55, 39.84]]}}, {"day": 2, "dayName": "Tuesday", "title": "Too loud upstairs", "goals": ["I can make a polite complaint.", "I can ask for and give advice.", "I can use should, ought to and Could you please...?"], "listening": {"title": "The music upstairs", "intro": "In the morning, Elif talks to Dan in the hallway. In the evening, she knocks on the door of apartment 5B. The next morning, she sees Dan again.", "speakers": {"Elif": "female", "Dan": "male", "Tyler": "male"}, "lines": [{"s": "Dan", "t": "Morning, Elif! Wow, you look tired."}, {"s": "Elif", "t": "I am. I only slept for about three hours last night."}, {"s": "Dan", "t": "Why? Were you working late?"}, {"s": "Elif", "t": "No. The people upstairs were playing loud music until two in the morning."}, {"s": "Dan", "t": "Oh, that's apartment 5B. A young guy moved in last month."}, {"s": "Elif", "t": "It was the third night this week. What should I do?"}, {"s": "Dan", "t": "I think you should talk to him first. Be friendly, not angry."}, {"s": "Elif", "t": "Shouldn't I just call the landlord?"}, {"s": "Dan", "t": "Maybe later. But you ought to give him a chance first. Maybe he doesn't know."}, {"s": "Elif", "t": "You're right. I'll go up tonight."}, {"s": "Tyler", "t": "Hi! Can I help you?"}, {"s": "Elif", "t": "Hi, I'm Elif. I live right below you, in 4B."}, {"s": "Tyler", "t": "Oh, hi! I'm Tyler. Nice to meet you."}, {"s": "Elif", "t": "Nice to meet you too. Sorry to bother you, but I have a small problem."}, {"s": "Tyler", "t": "Sure, what's up?"}, {"s": "Elif", "t": "Your music is really loud in my apartment at night. Could you please turn it down after ten?"}, {"s": "Tyler", "t": "Oh no, I'm so sorry! I didn't know the walls were so thin."}, {"s": "Elif", "t": "That's okay. I just need to sleep, because I start work early."}, {"s": "Tyler", "t": "Of course. I'll use headphones at night. And you should knock if it happens again."}, {"s": "Elif", "t": "Thank you so much. That's really kind of you."}, {"s": "Tyler", "t": "No problem. Hey, would you like some cookies? My mom sent me way too many."}, {"s": "Elif", "t": "Ha! Thank you. Welcome to the building, Tyler."}, {"s": "Dan", "t": "So? How did it go last night?"}, {"s": "Elif", "t": "Great! He was really nice, and he gave me cookies."}, {"s": "Dan", "t": "See? You ought to listen to me more often!"}, {"s": "Elif", "t": "Maybe. But I'm not sharing the cookies with you!"}], "mcq": [{"q": "Why is Elif tired?", "options": ["She worked late.", "Loud music kept her awake.", "She went to a party."], "answer": 1}, {"q": "What does Dan think Elif should do first?", "options": ["call the landlord", "talk to the neighbor", "move to another apartment"], "answer": 1}, {"q": "What does Tyler promise to do?", "options": ["move out", "use headphones at night", "play music only on weekends"], "answer": 1}, {"q": "What did Tyler give Elif?", "options": ["some cookies", "his phone number", "a cake"], "answer": 0}], "gaps": [{"line": 5, "answer": "should I do"}, {"line": 8, "answer": "ought to"}, {"line": 13, "answer": "bother"}, {"line": 15, "answer": "turn it down"}, {"line": 16, "answer": "thin"}, {"line": 18, "answer": "should knock"}]}, "vocab": [{"w": "the people upstairs", "m": "the people who live above you", "ex": "The people upstairs have a new baby."}, {"w": "move in", "m": "start living in a new home", "ex": "Our new neighbors move in next week."}, {"w": "give him a chance", "m": "let him try or show he can do better", "ex": "He's new here, so let's give him a chance."}, {"w": "Sorry to bother you", "m": "a polite way to start a request", "ex": "Sorry to bother you, but is this seat free?"}, {"w": "turn it down", "m": "make it quieter", "ex": "The TV is too loud. Can you turn it down?"}, {"w": "thin", "m": "not thick; sound goes through it easily", "ex": "The walls in my office are very thin."}, {"w": "headphones", "m": "small speakers that you wear on your ears", "ex": "I listen to podcasts with headphones on the bus."}, {"w": "How did it go?", "m": "Was it good or bad?", "ex": "You had an interview today! How did it go?"}], "grammar": {"title": "Polite complaints and advice", "points": ["Use should / shouldn't + verb for advice: You should talk to him.", "Ought to means the same as should, but it is more formal.", "Use Could you please + verb for polite requests: Could you please turn it down?", "Start softly: Sorry to bother you, but... / I'm afraid there's a problem."], "examples": [{"en": "You should talk to your neighbor first.", "note": "advice"}, {"en": "You ought to give him a chance.", "note": "ought to = should"}, {"en": "Could you please turn the music down after ten?", "note": "polite request"}, {"en": "You shouldn't call the landlord yet.", "note": "negative advice"}], "exercises": [{"type": "choice", "q": "You look tired. You ___ go to bed early tonight.", "options": ["should", "ought", "could you please"], "answer": 0, "why": "Advice: should + verb. Ought needs to."}, {"type": "choice", "q": "You ought ___ talk to your neighbor.", "options": ["to", "for", "at"], "answer": 0, "why": "Ought always needs to: ought to + verb."}, {"type": "choice", "q": "Excuse me, ___ please close the window? It's cold.", "options": ["could you", "you should", "ought you"], "answer": 0, "why": "Polite request: Could you please + verb?"}, {"type": "choice", "q": "You ___ play loud music after midnight. People are sleeping.", "options": ["should", "shouldn't", "could"], "answer": 1, "why": "Negative advice: shouldn't + verb."}, {"type": "type", "q": "You ___ eat so much sugar. It's bad for you. (should / not)", "answers": ["shouldn't", "should not"], "why": "Negative advice: shouldn't + verb."}, {"type": "type", "q": "You ___ see a doctor about that cough. (ought)", "answers": ["ought to"], "why": "Ought is always followed by to."}, {"type": "type", "q": "___ you please turn down the TV? I'm on the phone. (could)", "answers": ["Could", "could"], "why": "Polite request: Could you please + verb?"}, {"type": "type", "q": "___ I call the landlord, or talk to him first? (should)", "answers": ["Should", "should"], "why": "Asking for advice: Should + I + verb?"}]}, "reading": {"title": "Quiet, please!", "kind": "a notice in the building", "text": "A NOTE FROM YOUR LANDLORD\n\nDear neighbors,\n\nWinter is coming, and we are all spending more time at home. That's nice, but it also means more noise. This month, I got four complaints about loud music, TVs and heavy footsteps at night. So here are a few friendly reminders.\n\nQuiet hours in our building are from ten at night to seven in the morning. During these hours, you shouldn't play loud music or move furniture. If you have guests late, you ought to keep your door closed.\n\nThe walls and floors in this old building are thin. You should put a rug on your floor, because it really helps with noise.\n\nDo you have a problem with a neighbor? First, you should talk to them politely. Most people don't know that they are noisy. If that doesn't work, could you please send me an email? Please don't leave angry notes on doors.\n\nFinally, a big thank you to two neighbors who fixed a noise problem this week with a friendly talk. Good job!\n\nThank you, and stay warm!\n\nFrank Lee", "questions": [{"q": "When are quiet hours?", "options": ["from seven to ten at night", "from ten at night to seven in the morning", "all day on Sunday"], "answer": 1}, {"q": "Why should people put a rug on the floor?", "options": ["It looks nice.", "It helps with noise.", "It keeps the floor clean."], "answer": 1}, {"q": "What should you do first if you have a problem with a neighbor?", "options": ["send an email to the landlord", "leave a note on their door", "talk to them politely"], "answer": 2}, {"q": "Why did the landlord write this notice?", "options": ["He got complaints about noise.", "The building is closing.", "He wants to raise the rent."], "answer": 0}], "tf": [{"s": "The landlord got four complaints this month.", "answer": true}, {"s": "You can leave a note on a door if you are angry.", "answer": false}, {"s": "The walls in the building are thick.", "answer": false}], "gloss": {"a": "bir (a few: birkaç)", "about": "hakkında, ile ilgili", "all": "hepimiz, oor.", "length": "50-80 words", "checklist": ["Start politely (Hi, I'm ... / Sorry to bother you).", "Use Could you please + verb once.", "Explain why with because or so."], "model": "Hi! I'm Carla from apartment 2A, right below you. Sorry to bother you, but your TV is very loud late at night. I start work at seven, so I need to sleep early. Could you please turn it down after ten? Maybe you don't know that the walls here are thin. Thank you so much! And please knock on my door if my music is ever too loud. Carla"}, "audio": {"listen": "audio/w6d2-listen.mp3", "listenT": [[0.3, 3.01], [3.46, 6.87], [7.32, 9.05], [9.5, 13.66], [14.11, 18.76], [19.21, 22.01], [22.46, 26.53], [26.98, 28.73], [29.18, 33.83], [34.28, 36.07], [36.52, 37.72], [38.17, 41.45], [41.9, 43.97], [44.42, 48.73], [49.18, 50.1], [50.55, 55.95], [56.4, 59.98], [60.43, 64.14], [64.59, 69.05], [69.5, 72.0], [72.45, 76.99], [77.44, 80.17], [80.62, 82.67], [83.12, 86.15], [86.6, 89.18], [89.63, 92.13]], "read": "audio/w6d2-read.mp3", "speak": "audio/w6d2-speak.mp3", "vocab": "audio/w6d2-vocab.mp3", "vocabT": [[0.3, 1.71, 2.31, 4.4], [5.3, 6.3, 6.9, 8.91], [9.81, 11.0, 11.6, 13.97], [14.87, 16.3, 16.9, 19.44], [20.34, 21.38, 21.98, 24.67], [25.57, 26.45, 27.05, 29.31], [30.21, 31.25, 31.85, 34.56], [35.46, 36.61, 37.21, 39.77]]}}, {"day": 3, "dayName": "Wednesday", "title": "Behind the wheel", "goals": ["I can ask for information about a course.", "I can book a lesson.", "I can use the present simple passive."], "listening": {"title": "At the driving school", "intro": "Elif visits a driving school before work and talks to Paul at the front desk.", "speakers": {"Paul": "male", "Elif": "female"}, "lines": [{"s": "Paul", "t": "Good morning! Welcome to the driving school. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like some information about driving lessons."}, {"s": "Paul", "t": "Sure. Have you ever driven before?"}, {"s": "Elif", "t": "Only once, with my dad, in a parking lot. In Izmir, I always took the bus or the ferry."}, {"s": "Paul", "t": "No problem. A lot of our students are beginners."}, {"s": "Elif", "t": "Great. So how does it work?"}, {"s": "Paul", "t": "Well, all our lessons are given in a small car, and each lesson is ninety minutes."}, {"s": "Elif", "t": "Can I take lessons on weekends too?"}, {"s": "Paul", "t": "Yes. Lessons are offered seven days a week, from eight in the morning to seven at night."}, {"s": "Elif", "t": "And where do the lessons start? I don't have a car."}, {"s": "Paul", "t": "That's not a problem. Students are picked up at home or at work."}, {"s": "Elif", "t": "Really? That's very helpful. So the car is provided by the school?"}, {"s": "Paul", "t": "Yes. Our cars are cleaned and checked every day."}, {"s": "Elif", "t": "How much is one lesson?"}, {"s": "Paul", "t": "One lesson is sixty dollars. But if you buy ten lessons, one is free."}, {"s": "Elif", "t": "Hmm. Is a book included?"}, {"s": "Paul", "t": "Yes, it is. The most important rules of the road are explained in it."}, {"s": "Elif", "t": "I'm a little nervous. The streets in Chicago are so busy."}, {"s": "Paul", "t": "Everyone is nervous at first. That's why the first lesson is always given in a quiet place."}, {"s": "Elif", "t": "That sounds good. Can I book my first lesson for Sunday?"}, {"s": "Paul", "t": "Let me check... Yes. Sunday at ten works."}, {"s": "Elif", "t": "Perfect. Who is my teacher?"}, {"s": "Paul", "t": "Her name is Rita. She's very patient."}, {"s": "Elif", "t": "Good! I need a very patient teacher."}, {"s": "Paul", "t": "Don't worry. In a few months, you'll drive all over the city!"}], "mcq": [{"q": "Why is Elif at the driving school?", "options": ["to take a driving test", "to get information about lessons", "to buy a car"], "answer": 1}, {"q": "Where are students picked up?", "options": ["at the driving school", "at home or at work", "at the bus stop"], "answer": 1}, {"q": "How much is one lesson?", "options": ["sixty dollars", "ninety dollars", "ten dollars"], "answer": 0}, {"q": "When is Elif's first lesson?", "options": ["on Saturday", "on Sunday at ten", "tomorrow at eight"], "answer": 1}], "gaps": [{"line": 6, "answer": "are given"}, {"line": 8, "answer": "are offered"}, {"line": 10, "answer": "picked up"}, {"line": 11, "answer": "provided"}, {"line": 12, "answer": "checked"}, {"line": 16, "answer": "are explained"}]}, "vocab": [{"w": "driving lessons", "m": "classes where you learn to drive", "ex": "My cousin is taking driving lessons this summer."}, {"w": "parking lot", "m": "an outside area where people leave their cars", "ex": "I left my car in the parking lot."}, {"w": "beginner", "m": "a person who is starting to learn something", "ex": "This yoga class is perfect for a beginner."}, {"w": "pick up", "m": "go and get someone, usually in a car", "ex": "Dad will pick up the kids after school."}, {"w": "provide", "m": "give something that people need", "ex": "The hotel will provide towels and soap."}, {"w": "included", "m": "part of the price", "ex": "Breakfast is included in the room price."}, {"w": "at first", "m": "at the beginning", "ex": "At first, I didn't like coffee."}, {"w": "book a lesson", "m": "choose a time for a lesson and reserve it", "ex": "I want to book a lesson for Monday morning."}], "grammar": {"title": "Present simple passive", "points": ["Form: am / is / are + past participle: Lessons are given every day.", "Use the passive when the action is more important than the person doing it.", "Add by + the doer only when it's important: The car is provided by the school.", "Questions: Is a book included? Are the cars checked?"], "examples": [{"en": "All lessons are given in a small car.", "note": "are + given"}, {"en": "Students are picked up at home.", "note": "pick up → picked up"}, {"en": "Is a book included?", "note": "question: Is + subject + participle"}, {"en": "Coffee is made fresh every morning.", "note": "make → made"}], "tr": "Türkçedeki edilgen '-ılır / -ilir' gibi: 'İngilizce konuşulur' = English is spoken. 'is / are' kelimesini unutmayın.", "exercises": [{"type": "choice", "q": "English ___ in this shop.", "options": ["speaks", "is spoken", "is speak"], "answer": 1, "why": "Passive: is + past participle (spoken)."}, {"type": "choice", "q": "The cars ___ every morning.", "options": ["are cleaned", "is cleaned", "clean"], "answer": 0, "why": "Cars is plural, so use are."}, {"type": "choice", "q": "___ breakfast included in the price?", "options": ["Does", "Is", "Are"], "answer": 1, "why": "Passive question with one thing: Is + subject + participle."}, {"type": "choice", "q": "These cookies ___ in a small bakery near my house.", "options": ["are making", "are made", "make"], "answer": 1, "why": "Cookies don't make anything. They are made."}, {"type": "type", "q": "Lessons ___ on weekends too. (offer)", "answers": ["are offered"], "why": "Plural subject: are + offered."}, {"type": "type", "q": "The rules ___ in this small book. (explain)", "answers": ["are explained"], "why": "Plural subject: are + explained."}, {"type": "type", "q": "Our office ___ every evening. (clean)", "answers": ["is cleaned"], "why": "One office: is + cleaned."}, {"type": "type", "q": "Coffee ___ fresh every morning. (make)", "answers": ["is made"], "why": "Make is irregular: make → made."}]}, "reading": {"title": "Welcome, new students!", "kind": "an information sheet from the driving school", "text": "WELCOME, NEW STUDENTS!\n\nThank you for choosing our driving school. Here is some important information about your lessons.\n\nBefore your first lesson\nEvery new student is given a free book. The most important rules of the road are explained in it, so please read it before your first lesson.\n\nYour lessons\nAll lessons are taught by friendly, patient teachers. Each lesson is ninety minutes long. You are picked up at home or at work, and you are driven back at the end. Our cars are small and easy to drive. They are cleaned and checked every day.\n\nBeginners\nMany of our students have never driven before, so don't worry! The first lesson is always given in a quiet parking lot. After that, you drive on quiet streets. Busy roads are not used until you are ready.\n\nPayments\nLessons are paid for at the office or by phone. If you buy ten lessons, one lesson is free.\n\nChanges\nDo you need to change a lesson? Please call us one day before. If you cancel later than that, you have to pay for the lesson.\n\nWe hope you enjoy learning with us. See you on the road!", "questions": [{"q": "What is every new student given?", "options": ["a free lesson", "a free book", "a small car"], "answer": 1}, {"q": "Where is the first lesson given?", "options": ["on a busy road", "in a quiet parking lot", "at the office"], "answer": 1}, {"q": "How long is each lesson?", "options": ["sixty minutes", "ninety minutes", "two hours"], "answer": 1}, {"q": "What happens if you cancel a lesson on the same day?", "options": ["You have to pay for it.", "You get a free lesson.", "Nothing happens."], "answer": 0}], "tf": [{"s": "Students are picked up at home or at work.", "answer": true}, {"s": "The cars are checked once a week.", "answer": false}, {"s": "Busy roads are used in the first lesson.", "answer": false}], "gloss": {"a": "bir", "about": "hakkında", "after": "sonra (after that: ondan sonra)", "all": "tüm, bütün", "always": "her zaman", "and": "ve", "are": "-dir (edilgen: are given = verilir)", "at": "-de (at home: evde)", "back": "geri (driven back: geri götürülmek)", "before": "önce, -den önce", "beginners": "yeni başlayanlar", "book": "kitap", "busy": "yoğun, kalabalık", "buy": "satın almak", "by": "tarafından; ile (by phone: telefonla)", "call": "aramak", "cancel": "iptal etmek", "cars": "arabalar", "change": "değiştirmek", "changes": "değişiklikler", "checked": "kontrol edilir (check: kontrol etmek)", "choosing": "seçtiğiniz (choose: seçmek)", "cleaned": "temizlenir (clean: temizlemek)", "day": "gün", "do": "soru yardımcı fiili", "don't": "y ": "verilir (teach: öğretmek)", "teachers": "öğretmenler", "ten": "on", "than": "-den (karşılaştırma)", "thank": "teşekkür etmek (thank you: teşekkürler)", "that": "o, bu (after that: ondan sonra)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "they": "onlar", "to": "-mek/-mak (fiil öncesi)", "until": "-e kadar", "up": "(pick up kalıbının parçası)", "us": "bizi / bizimle", "used": "kullanılır (use: kullanmak)", "we": "biz", "welcome": "hoş geldiniz", "with": "ile (with us: bizimle)", "work": "iş (at work: işte)", "worry": "endişelenmek", "you": "siz / sizi", "your": "sizin"}}, "speaking": {"prompt": "Talk about your hometown. What is made, grown or sold there?", "steps": ["say where you are from", "say what is made, grown or sold there", "say what you like most about it"], "starters": ["I'm from ...", "In my town, ... is made / grown ...", "... is sold at ...", "My favorite thing is ..."], "model": "I'm from a small town near the sea. A lot of olives are grown there, and very good olive oil is made in small family factories. Every Saturday, a big market is held in the town square. Fresh fruit, cheese and fish are sold there, and the prices are good. My favorite thing is the bread. It is baked early in the morning, so it's always warm when you buy it. If you visit, you should go to the market!"}, "writing": {"prompt": "Write a short message to a friend about a class you are taking. Say how it works.", "length": "50-80 words", "checklist": ["Use is / are + past participle at least twice.", "Say when and where the classes are.", "Use one word from today's vocab (beginner, at first, included ...)."], "model": "Hi Tom! Guess what? I'm taking a cooking class! The classes are given every Thursday evening in a small kitchen downtown. All the food is included in the price, and the recipes are sent to us by email. At first, I was nervous, because I'm a real beginner. But the teacher is very patient. Next week we're making fresh pasta! Do you want to come with me?"}, "audio": {"listen": "audio/w6d3-listen.mp3", "listenT": [[0.3, 3.73], [4.18, 7.32], [7.77, 9.52], [9.97, 15.67], [16.12, 18.95], [19.4, 21.05], [21.5, 26.42], [26.87, 29.01], [29.46, 34.51], [34.96, 37.69], [38.14, 41.81], [42.26, 46.19], [46.64, 49.28], [49.73, 51.29], [51.74, 56.22], [56.67, 58.29], [58.74, 62.92], [63.37, 66.83], [67.28, 73.21], [73.66, 77.12], [77.57, 79.85], [80.3, 82.07], [82.52, 84.82], [85.27, 87.49], [87.94, 91.14]], "read": "audio/w6d3-read.mp3", "speak": "audio/w6d3-speak.mp3", "vocab": "audio/w6d3-vocab.mp3", "vocabT": [[0.3, 1.62, 2.22, 4.97], [5.87, 6.96, 7.56, 9.57], [10.47, 11.43, 12.03, 14.63], [15.53, 16.47, 17.07, 19.14], [20.04, 21.02, 21.62, 23.9], [24.8, 25.87, 26.47, 29.01], [29.91, 30.97, 31.57, 33.39], [34.29, 35.48, 36.08, 38.39]]}}, {"day": 4, "dayName": "Thursday", "title": "You're invited!", "goals": ["I can accept an invitation.", "I can talk about holidays in my country.", "I can use used to for past habits."], "listening": {"title": "An invitation from Dan", "intro": "Elif and Dan meet in the hallway of their building on Thursday evening.", "speakers": {"Dan": "male", "Elif": "female"}, "lines": [{"s": "Dan", "t": "Hey, Elif! Are you busy on Saturday evening?"}, {"s": "Elif", "t": "Saturday? No, I don't think so. Why?"}, {"s": "Dan", "t": "My family is having Thanksgiving dinner at my parents' house. Would you like to come?"}, {"s": "Elif", "t": "Really? I'd love to! But isn't Thanksgiving always on a Thursday?"}, {"s": "Dan", "t": "Usually, yes. But my sister is a nurse, and she has to work this week. So this year our big dinner is on Saturday."}, {"s": "Elif", "t": "I see. What do people usually do at Thanksgiving?"}, {"s": "Dan", "t": "We eat a lot of food, talk a lot and watch football. Then we eat again!"}, {"s": "Elif", "t": "That sounds like a Turkish holiday. When I was a kid, we used to visit all our relatives during Bayram."}, {"s": "Dan", "t": "Bayram? What's that?"}, {"s": "Elif", "t": "It's a big holiday in Turkey. We used to kiss our grandparents' hands, and they used to give us candy and money."}, {"s": "Dan", "t": "Money? I love that! We didn't use to get money. We got a lot of pie."}, {"s": "Elif", "t": "Pie is good too. Did your family use to play games?"}, {"s": "Dan", "t": "Yes! After dinner, we used to play cards for hours. My grandma always won."}, {"s": "Elif", "t": "Is your grandma still good at cards?"}, {"s": "Dan", "t": "She's ninety, and she still beats everyone. You'll meet her on Saturday."}, {"s": "Elif", "t": "I can't wait. Should I bring something?"}, {"s": "Dan", "t": "You don't have to. But my mom would love a Turkish dish."}, {"s": "Elif", "t": "Okay! I used to help my grandmother make stuffed grape leaves. I can make those."}, {"s": "Dan", "t": "Perfect. Oh, one more thing. My uncle talks a lot about football. Just smile and nod."}, {"s": "Elif", "t": "Ha! I used to do that with my uncle in Izmir, too."}, {"s": "Dan", "t": "See? You're ready for an American Thanksgiving."}, {"s": "Elif", "t": "What time should I be ready?"}, {"s": "Dan", "t": "We'll leave at three. The drive is about an hour."}, {"s": "Elif", "t": "Great. Thank you for inviting me, Dan. I mean it."}, {"s": "Dan", "t": "Of course. You're like family now."}], "mcq": [{"q": "When is Dan's family having Thanksgiving dinner this year?", "options": ["on Thursday", "on Saturday", "on Sunday"], "answer": 1}, {"q": "Why is the dinner not on Thursday?", "options": ["Dan's sister has to work.", "Dan's parents are away.", "The house is too small."], "answer": 0}, {"q": "What did Elif's grandparents use to give her during Bayram?", "options": ["pie", "candy and money", "books"], "answer": 1}, {"q": "What is Elif going to bring?", "options": ["an apple pie", "Turkish tea", "stuffed grape leaves"], "answer": 2}], "gaps": [{"line": 7, "answer": "used to visit"}, {"line": 9, "answer": "used to give"}, {"line": 10, "answer": "didn't use to"}, {"line": 11, "answer": "use to play"}, {"line": 12, " (no -d)."}, {"type": "choice", "q": "My dad ___ to smoke, but he stopped ten years ago.", "options": ["use", "used", "uses"], "answer": 1, "why": "Positive sentence: used to + verb."}, {"type": "choice", "q": "These days I ___ go to the gym every morning.", "options": ["used to", "usually", "use to"], "answer": 1, "why": "Present habit: usually, not used to."}, {"type": "type", "q": "We ___ a dog, but now we have two cats. (used to / have)", "answers": ["used to have"], "why": "Past state that is not true now: used to + verb."}, {"type": "type", "q": "I ___ like coffee, but now I drink it every day. (not / use to)", "answers": ["didn't use to", "did not use to"], "why": "Negative: didn't use to + verb."}, {"type": "type", "q": "___ you use to walk to school? (do)", "answers": ["Did", "did"], "why": "Past question: Did + you + use to + verb?"}, {"type": "type", "q": "My grandma ___ us candy every holiday. (used to / give)", "answers": ["used to give"], "why": "Past habit that stopped: used to + verb."}]}, "reading": {"title": "Holidays then and now", "kind": "Elif's diary", "text": "Thursday night\n\nDan invited me to his family's Thanksgiving dinner on Saturday! I'm so excited, but I'm also a little nervous, because I've never been to an American family dinner.\n\nTonight I'm thinking about holidays in Izmir. When I was a child, Bayram was my favorite time of the year. We used to wake up early and put on our new clothes. Then we used to visit all our relatives. My grandmother used to make the best stuffed grape leaves in the family. I used to help her in the kitchen, although I usually ate more than I made!\n\nI didn't use to like those long family visits. The adults talked for hours, and I wanted to play outside. However, now I miss them a lot. Here in Chicago, my weekends are often very quiet.\n\nSo Dan's invitation means a lot to me. I asked Mom for my grandmother's recipe, and she sent it in three long voice messages. Tomorrow after work, I'm going to buy grape leaves and rice.\n\nI hope Dan's family likes Turkish food. Maybe they'll even ask for the recipe, like Leo at Dan's party!", "questions": [{"q": "Why is Elif a little nervous?", "options": ["She can't cook well.", "She has never been to an American family dinner.", "She doesn't know Dan's address."], "answer": 1}, {"q": "What did Elif use to do on Bayram mornings?", "options": ["sleep late", "put on new clothes", "go to school"], "answer": 1}, {"q": "Why didn't Elif use to like the family visits?", "options": ["The food was bad.", "The adults talked for hours.", "Her relatives lived far away."], "answer": 1}, {"q": "How did Elif's mom send the recipe?", "options": ["in an email", "in a letter", "in voice messages"], "answer": 2}], "tf": [{"s": "Elif's grandmother used to make stuffed grape leaves.", "answer": true}, {"s": "Elif misses the long family visits now.", "answer": true}, {"s": "Elif bought grape leaves today.", "answer": false}], "gloss": {"a": "bir (a lot: çok)", "about": "hakkında", "adults": "yetişkinler", "after": "sonra (after work: işten sonra)", "all": "bütün, tüm", "also": "de/da, ayrıca", "although": "gerçi, -e rağmen", "american": "Amerikan", "an": "bir", "and": "ve", "are": "-dir / olmak (çoğul)", "ask": "istemek (ask for: istemek)", "asked": "istedim (ask for: istemek)", "at": "-de (at Dan's party: Dan'in partisinde)", "ate": "yedim (eat: yemek)", "bayram": "Bayram", "because": "çünkü", "been": "bulunmuş (been to: -e gitmiş olmak)", "best": "en iyi", "but": "ama", "buy": "almak, satın almak", "chicago": "Chicago (şehir)", "child": "çocuk", "clothes": "kıyafetler", "dan": "Dan (isim)", "dan's": "Dan'in", "didn't": "-mezdi (didn't use to)", "dinner": "akşam yemeği", "early": "erken", "even": "hatta", "excited": "heyecanlı", "family": "aile", "family's": "ailesinin", "favorite": "en sevdiğim", "food": "yemek", "for": "boyunca (for hours: saatlerce); için", "going": "going to: -ecek (gelecek zaman)", "grandmother": "büyükanne", "grandmother's": "b  "(wake up kalıbının parçası)", "use": "(didn't use to: eskiden ...-mezdi)", "used": "eskiden ...-erdi (used to)", "usually": "genellikle", "very": "çok", "visit": "ziyaret etmek", "visits": "ziyaretler", "voice": "ses (voice message: sesli mesaj)", "wake": "uyanmak (wake up: uyanmak)", "wanted": "istedim (want: istemek)", "was": "-dım / idi (was: olmak)", "we": "biz", "weekends": "hafta sonları", "when": "-dığımda", "work": "iş (after work: işten sonra)", "year": "yıl"}}, "speaking": {"prompt": "How did you use to celebrate holidays when you were a child? How is it different now?", "steps": ["say which holiday you remember", "say two things you used to do", "say what is different now"], "starters": ["When I was a child, ...", "We used to ...", "I didn't use to ...", "Now I usually ..."], "model": "When I was a child, New Year's Eve was my favorite holiday. My whole family used to meet at my aunt's house. We used to eat a huge dinner and play board games until midnight. My cousins and I didn't use to sleep at all! We used to watch the fireworks from the balcony. Now it's different, because my family lives in three different cities. I usually celebrate with friends, although I still call my aunt at midnight."}, "writing": {"prompt": "Write a short message to accept an invitation to a holiday dinner. Say thank you, ask a question and share one memory.", "length": "50-80 words", "checklist": ["Use used to + verb at least twice.", "Ask one question (the time, what to bring ...).", "Say thank you."], "model": "Hi Jessica! Thank you so much for the invitation. I'd love to come! What time should I be there? Can I bring something? I can make a chocolate cake. When I was a child, my mom used to make it every holiday, and we used to eat it for breakfast the next day! I didn't use to like big dinners, but now I really miss them. See you on Sunday! Ana"}, "audio": {"listen": "audio/w6d4-listen.mp3", "listenT": [[0.3, 3.63], [4.08, 6.51], [6.96, 12.55], [13.0, 17.12], [17.57, 25.78], [26.23, 29.09], [29.54, 34.36], [34.81, 40.95], [41.4, 42.9], [43.35, 50.0], [50.45, 54.87], [55.32, 58.52], [58.97, 64.56], [65.01, 67.06], [67.51, 72.05], [72.5, 74.76], [75.21, 79.05], [79.5, 84.32], [84.77, 90.73], [91.18, 94.25], [94.7, 97.49], [97.94, 99.46], [99.91, 103.36], [103.81, 106.74], [107.19, 109.47]], "read": "audio/w6d4-read.mp3", "speak": "audio/w6d4-speak.mp3", "vocab": "audio/w6d4-vocab.mp3", "vocabT": [[0.3, 1.32, 1.92, 3.97], [4.87, 5.96, 6.56, 8.91], [9.81, 10.96, 11.56, 13.46], [14.36, 15.23, 15.83, 18.18], [19.08, 20.23, 20.83, 23.65], [24.55, 25.4, 26.0, 29.07], [29.97, 31.21, 31.81, 34.67], [35.57, 36.68, 37.28, 39.22]]}}, {"day": 5, "dayName": "Friday", "title": "Going home", "goals": ["I can ask for time off.", "I can talk about my travel plans.", "I can choose between will, going to and the present continuous."], "listening": {"title": "Time off in December", "intro": "On Friday morning, Elif talks to Maria in the office. Then Sam joins them.", "speakers": {"Elif": "female", "Maria": "female", "Sam": "male"}, "lines": [{"s": "Elif", "t": "Maria, can I ask you something?"}, {"s": "Maria", "t": "Sure, Elif. What's up?"}, {"s": "Elif", "t": "I'd like to go home to Izmir for the holidays. Is it okay if I take some time off in December?"}, {"s": "Maria", "t": "Let me check the calendar... Yes, that's fine. When are you leaving?"}, {"s": "Elif", "t": "I'm not sure yet. I'm going to look at flights tonight."}, {"s": "Maria", "t": "My advice? Book soon. I think prices will go up."}, {"s": "Elif", "t": "Thanks, I will. And don't worry, I'll finish the flower shop plan before I go."}, {"s": "Maria", "t": "I know you will. Your family must be so excited."}, {"s": "Sam", "t": "Did I just hear \"Izmir\"? Are you going home?"}, {"s": "Elif", "t": "Yes! I'm going to see my family for the first time in months."}, {"s": "Sam", "t": "That's great. What are you going to do there?"}, {"s": "Elif", "t": "First, I'm going to eat my mom's cooking for three days."}, {"s": "Sam", "t": "Ha! Good plan. Is it a long trip?"}, {"s": "Elif", "t": "Very long. I'll probably change planes in Istanbul."}, {"s": "Sam", "t": "Do you want me to help you look for flights? I'm good at finding cheap tickets."}, {"s": "Elif", "t": "Really? That would be great. I'll buy you lunch."}, {"s": "Sam", "t": "Deal! What are you doing after work today?"}, {"s": "Elif", "t": "Oh, I'm meeting Dan at six. We're going shopping for Saturday."}, {"s": "Sam", "t": "Saturday? What's happening on Saturday?"}, {"s": "Elif", "t": "I'm having Thanksgiving dinner with Dan's family!"}, {"s": "Sam", "t": "Wow, lucky you! Then let's look at flights during lunch."}, {"s": "Elif", "t": "Perfect. And I'm going to call my mom tonight and tell her the news."}, {"s": "Sam", "t": "She's going to be so happy."}, {"s": "Elif", "t": "I know. She'll probably cry. Then she'll start planning the menu!"}], "mcq": [{"q": "What does Elif ask Maria?", "options": ["if she can work from home", "if she can take time off in December", "if she can leave early today"], "answer": 1}, {"q": "What does Elif promise Maria?", "options": ["to finish the flower shop plan before she goes", "to call her from Izmir", "to book a flight tonight"], "answer": 0}, {"q": "What is Elif doing after work today?", "options": ["going to the gym", "meeting Dan", "looking at flights with Sam"], "answer": 1}, {"q": "How will Sam help Elif?", "options": ["He'll drive her to the airport.", "He'll help her find cheap tickets.", "He'll talk to Maria for her."], "answer": 1}], "gaps": [{"line": 4, "answer": "going to look"}, {"line": 6, "answer": "I'll finish"}, {"line": 15, "answer": "I'll buy"}, {"line": 17, "answer": "I'm meeting"}, {"line": 19, "answer": "I'm having"}, {"line": 22, "answer": "going to be"}]}, "vocab": [{"w": "time off", "m": "days when you don't work", "ex": "I need some time off after this project."}, {"w": "for the holidays", "m": "during the holiday time at the end of the year", "ex": "Are you going anywhere for the holidays?"}, {"w": "in months", "m": "for many months", "ex": "I haven't seen my cousin in months."}, {"w": "change planes", "m": "take a second plane on the same trip", "ex": "We have to change planes on the way to Spain."}, {"w": "probably", "m": "almost sure, but not 100%", "ex": "It will probably rain tomorrow."}, {"w": "Deal!", "m": "Yes, I agree!", "ex": "You cook, and I'll wash the dishes. Deal!"}, {"w": "go shopping", "m": "go to stores to buy things", "ex": "Let's go shopping on Saturday morning."}, {"w": "lucky you", "m": "you are lucky (I'm a little jealous)", "ex": "You're going to the beach? Lucky you!"}], "grammar": {"title": "Future forms: will, going to, present continuous", "points": ["going to + verb: plans you made before now: I'm going to look at flights.", "Present continuous: arrangements with a time or a person: I'm meeting Dan at six.", "will: quick decisions, offers and promises: I'll buy you lunch. I'll finish it.", "Predictions: will or going to: She'll probably cry. She's going to be so happy."], "examples": [{"en": "I'm going to call my mom tonight.", "note": "a plan"}, {"en": "I'm meeting Dan at six.", "note": "an arrangement"}, {"en": "Don't worry, I'll help you.", "note": "an offer or promise"}, {"en": "She'll probably cry.", "note": "a prediction"}], "exercises": [{"type": "choice", "q": "A: The phone is ringing! B: Okay, ___ it.", "options": ["I'll answer", "I'm answering", "I answer"], "answer": 0, "why": "A quick decision at the moment of speaking: will."}, {"type": "choice", "q": "I booked the table yesterday. We ___ dinner at eight tonight.", "options": ["will have", "are having", "have"], "answer": 1, "why": "A fixed arrangement with a time: present continuous."}, {"type": "choice", "q": "Don't worry about the report. I promise I ___ finish it today.", "options": ["will", "am", "do"], "answer": 0, "why": "Promises use will."}, {"type": "choice", "q": "What ___ you doing this weekend? Any plans?", "options": ["are", "will", "do"], "answer": 0, "why": "Asking about arrangements: What are you doing...?"}, {"type": "type", "q": "That box looks heavy. ___ you! (I / help)", "answers": ["I'll help", "I will help"], "why": "An offer at the moment of speaking: will + verb."}, {"type": "type", "q": "Tonight I'm ___ look at flights. (go)", "answers": ["going to"], "why": "A plan: be + going to + verb."}, {"type": "type", "q": "We ___ dinner with Dan's family on Saturday. It's all arranged. (have)", "answers": ["'re having", "are having", "'re going to have", "are going to have"], "why": "An arrangement: present continuous (going to is also OK)."}, {"type": "type", "q": "My mom ___ so happy when she hears the news. (be)", "answers": ["will be", "'ll be", "is going to be", "'s going to be"], "why": "A prediction: will or going to."}]}, "reading": {"title": "I'm coming home!", "kind": "an email to a friend", "text": "Subject: I'm coming home!\n\nHi Deniz,\n\nGuess what? I'm coming home for the holidays! Maria said yes today, so I'm going to book my flight this weekend. Sam is going to help me, because he's very good at finding cheap tickets.\n\nI'm going to stay with my parents, of course. Mom doesn't know yet. I'm calling her tonight at nine, and I'm sure she'll cry. Then she'll start planning a huge dinner for the whole family.\n\nI have so many plans! I'm going to walk by the sea every morning, and I'm going to eat simit for breakfast every day. I really miss a real Turkish breakfast. Will you have time to meet? We'll go to our favorite café, like old times.\n\nBefore I leave, I have a lot of work to do. I'm planning a new website for a client, and I'll finish it before my trip. Also, tomorrow I'm having Thanksgiving dinner with Dan's family. I'm making my grandmother's stuffed grape leaves. Wish me luck!\n\nI'll send you my flight details next week. I can't wait to see you!\n\nHugs,\nElif", "questions": [{"q": "Who is going to help Elif book her flight?", "options": ["Maria", "Sam", "Dan"], "answer": 1}, {"q": "When is Elif calling her mom?", "options": ["tonight at nine", "tomorrow morning", "next week"], "answer": 0}, {"q": "What is Elif going to do every morning in Izmir?", "options": ["go to the gym", "walk by the sea", "visit her relatives"], "answer": 1}, {"q": "What is Elif making for the Thanksgiving dinner?", "options": ["baklava", "stuffed grape leaves", "simit"], "answer": 1}], "tf": [{"s": "Elif's mom already knows about the trip.", "answer": false}, {"s": "Elif will send Deniz her flight details next week.", "answer": true}, {"s": "Elif wants to meet Deniz at a café.", "answer": true}], "gloss": {"a": "bir", "also": "ayrıca", "and": "ve", "at": "-de (at nine: saat dokuzda; good at: -de iyi)", "because": "çünkü", "before": "-meden önce", "book": "ayırtmak, almak (bilet)", "breakfast": "kahvaltı", "by": "kenarında (by the sea: deniz kenarında)", "caf": "kafe (café)", "calling": "arayacağım (call: aramak)", "can't": "-emem (cannot; can't wait: sabırsızlanıyorum)", "cheap": "ucuz", "client": "müşteri", "coming": "geliyorum (come: gelmek)", "course": "(of course: tabii ki)", "cry": "ağlamak", "dan's": "Dan'in", "day": "gün", "deniz": "Deniz (isim)", "details": "ayrıntılar", "dinner": "akşam yemeği", "do": "yapmak (work to do: yapılacak iş)", "doesn't": "-mez (does not)", "eat": "yemek", "elif": "Elif (isim)", "every": "her", "family": "aile", "favorite": "en sevdiğimiz", "finding": "bulmak (find: bulmak)", "finish": "bitirmek", "flight": "uçuş", "for": "için", "go": "gitmek", "going": "going to: -ecek (gelecek zaman)", "good": "iyi (good at: -de iyi)", "grandmother's": "büyükannemin", "grape": "üzüm (grape leaves: asma yaprağı)", "guess": "tahmin et (guess what: bil bakalım ne oldu)", "have": "var (I have: benim ... var)", "having": "yiyorum (have dinner: akşam yemeği yemek)", "he's": "o ...-dir (he is)", "help": "yardım etmek", "her": "onu", "hi": "merhaba", "holidays": "tatil, bayram tatili", "home": "ev (come home: udio/w6d5-speak.mp3", "vocab": "audio/w6d5-vocab.mp3", "vocabT": [[0.3, 1.26, 1.86, 4.23], [5.13, 6.39, 6.99, 9.14], [10.04, 11.13, 11.73, 13.73], [14.63, 15.83, 16.43, 19.18], [20.08, 21.13, 21.73, 23.56], [24.46, 25.38, 25.98, 28.62], [29.52, 30.63, 31.23, 33.41], [34.31, 35.27, 35.87, 38.0]]}}, {"day": 6, "dayName": "Saturday", "title": "Thanksgiving dinner", "goals": ["I can be a polite dinner guest.", "I can agree with people in a natural way.", "I can use So do I and Neither do I."], "listening": {"title": "At the table", "intro": "Elif arrives at Dan's parents' house for Thanksgiving dinner and meets Dan's mom, Carol.", "speakers": {"Carol": "female", "Elif": "female", "Dan": "male"}, "lines": [{"s": "Carol", "t": "You must be Elif! Welcome! I'm Carol, Dan's mom."}, {"s": "Elif", "t": "Hello, Carol. Thank you for having me. I brought some stuffed grape leaves."}, {"s": "Carol", "t": "Oh, they look wonderful! I love trying new food."}, {"s": "Elif", "t": "So do I. That's my favorite thing about Chicago."}, {"s": "Dan", "t": "Mom, Elif made them from her grandmother's recipe."}, {"s": "Carol", "t": "How sweet. You know, I use my mother's recipes too. I don't like cooking from books."}, {"s": "Elif", "t": "Neither do I. Family recipes are always better."}, {"s": "Dan", "t": "Elif, come and meet Grandma. She's already playing cards."}, {"s": "Carol", "t": "So, Elif, do you have Thanksgiving in Turkey?"}, {"s": "Elif", "t": "No, we don't. But we have big family holidays, too. Everyone eats too much!"}, {"s": "Dan", "t": "So do we! Every year, I can't move after this dinner."}, {"s": "Carol", "t": "These grape leaves are delicious. I'm not very good at cooking rice."}, {"s": "Elif", "t": "Neither am I, honestly! This was my third try."}, {"s": "Dan", "t": "Well, I haven't had any pie yet, and I'm already full."}, {"s": "Elif", "t": "So am I. But I always have room for dessert."}, {"s": "Carol", "t": "Ha! Dan says that every year."}, {"s": "Dan", "t": "Grandma made her apple pie. It's the best in the world."}, {"s": "Elif", "t": "I remember! You made one for my dinner in my first week here."}, {"s": "Dan", "t": "True, but mine was just a copy of hers."}, {"s": "Carol", "t": "Elif, Dan says you're going home for the holidays."}, {"s": "Elif", "t": "Yes, I am! I miss my family a lot."}, {"s": "Carol", "t": "I'm sure they miss you too. But you have a family here now, too."}, {"s": "Elif", "t": "Thank you. That means a lot. I really feel at home today."}, {"s": "Dan", "t": "Good! Now, who wants pie?"}, {"s": "Elif", "t": "I do!"}, {"s": "Carol", "t": "So do I!"}], "mcq": [{"q": "What did Elif bring to the dinner?", "options": ["an apple pie", "stuffed grape leaves", "Turkish tea"], "answer": 1}, {"q": "Who made the apple pie for this dinner?", "options": ["Dan", "Carol", "Dan's grandma"], "answer": 2}, {"q": "What don't Elif and Carol like doing?", "options": ["cooking from books", "trying new food", "playing cards"], "answer": 0}, {"q": "How does Elif feel at the end?", "options": ["tired and bored", "at home", "homesick"], "answer": 1}], "gaps": [{"line": 1, "answer": "for having me"}, {"line": 3, "answer": "So do I"}, {"line": 6, "answer": "Neither do I"}, {"line": 10, "answer": "So do we"}, {"line": 12, "answer": "Neither am I"}, {"line": 14, "answer": "So am I"}]}, "vocab": [{"w": "Thank you for having me", "m": "polite thanks when you visit someone's home", "ex": "What a lovely evening. Thank you for having me!"}, {"w": "How sweet", "m": "How kind and nice!", "ex": "You remembered my birthday? How sweet!"}, {"w": "family recipe", "m": "cooking instructions from your family", "ex": "This soup is an old family recipe."}, {"w": "good at", "m": "able to do something well", "ex": "She's really good at drawing."}, {"w": "I'm full", "m": "I can't eat any more", "ex": "No more pasta, thanks. I'm full."}, {"w": "room for dessert", "m": "space in your stomach for something sweet", "ex": "Don't eat too much bread. Save room for dessert!"}, {"w": "That means a lot", "m": "That is very important to me", "ex": "Thank you for calling me. That means a lot."}, {"w": "feel at home", "m": "feel comfortable, like in your own home", "ex": "My new coworkers help me feel at home."}], "grammar": {"title": "So do I / Neither do I", "points": ["Agree with a positive sentence: So + auxiliary + I. I love tea. – So do I.", "Agree with a negative sentence: Neither + auxiliary + I. I don't smoke. – Neither do I.", "Use the same auxiliary as the first sentence: am → am, can → can.", "For a main verb in the present (like, love), use do or does."], "examples": [{"en": "I'm full. – So am I.", "note": "am → am"}, {"en": "I don't like cooking from books. – Neither do I.", "note": "don't → do"}, {"en": "I can't swim. – Neither can I.", "note": "can't → can"}, {"en": "We went to the lake. – So did we.", "note": "past: did"}], "exercises": [{"type": "choice", "q": "I love trying new food. – So ___ I.", "options": ["am", "do", "love"], "answer": 1, "why": "Love is a main verb in the present: use do."}, {"type": "choice", "q": "I'm not hungry. – ___ am I.", "options": ["So", "Neither", "Too"], "answer": 1, "why": "Negative sentence: Neither + am + I."}, {"type": "choice", "q": "I can speak two languages. – So ___ I.", "options": ["can", "do", "am"], "answer": 0, "why": "Use the same auxiliary: can → can."}, {"type": "choice", "q": "I went to bed late last night. – So ___ I.", "options": ["do", "did", "went"], "answer": 1, "why": "Past simple sentence: use did."}, {"type": "type", "q": "I'm tired today. – ___ I. (so)", "answers": ["So am", "so am"], "why": "I'm = I am, so the answer is So am I."}, {"type": "type", "q": "I don't eat meat. – ___ I. (neither)", "answers": ["Neither do", "neither do"], "why": "Negative present simple: Neither do I."}, {"type": "type", "q": "I haven't seen that movie. – ___ I. (neither)", "answers": ["Neither have", "neither have"], "why": "Haven't → have: Neither have I."}, {"type": "type", "q": "Dan likes basketball. – So ___ Sam. (do)", "answers": ["does"], "why": "Sam is he, so use does."}]}, "reading": {"title": "A thankful day", "kind": "Elif's diary", "text": "Saturday night\n\nWhat a day! I just got back from Thanksgiving dinner with Dan's family, and I'm still full.\n\nDan's parents live in a big old house about an hour from the city. His mom, Carol, hugged me at the door like an old friend. His dad, Mike, showed me the garden, although it was dark and cold. Then I met Dan's grandma, Ruth. She is ninety, and she plays cards better than anyone I know. She won three games in a row!\n\nThere was so much food: turkey, potatoes, corn, bread and five different pies. My stuffed grape leaves were a big success. Ruth said, \"I don't usually like vegetables, but these are wonderful.\" Dan said, \"Neither do I!\" Everyone laughed, because he ate six of them.\n\nAt dinner, everyone said one thing they were thankful for. When it was my turn, I felt shy. However, I said, \"I'm thankful for my new friends in Chicago.\" Dan said, \"So am I.\" His grandma smiled and said, \"So are we, dear.\"\n\nOn the drive home, I called Mom and told her everything. She wants to meet Dan one day. So do I! I want my two families to meet.\n\nTonight I feel very lucky.", "questions": [{"q": "Where do Dan's parents live?", "options": ["in Dan's building", "about an hour from the city", "in a small apartment downtown"], "answer": 1}, {"q": "What is Ruth very good at?", "options": ["cooking turkey", "playing cards", "gardening"], "answer": 1}, {"q": "Why did everyone laugh?", "options": ["Dan ate six grape leaves.", "Elif dropped a pie.", "Ruth lost a game."], "answer": 0}, {"q": "What does Elif's mom want?", "options": ["to come to Chicago next week", "to meet Dan one day", "to get Carol's recipe"], "answer": 1}], "tf": [{"s": "Carol hugged Elif at the door.", "answer": true}, {"s": "Ruth lost three games of cards.", "answer": false}, {"s": "Elif felt shy when it was her turn.", "answer" , 50.33], "misanthrope": [50.83, 52.09], "interloper": [52.59, 53.89], "dilettante": [54.39, 55.76], "pariah": [56.26, 57.26], "curmudgeon": [57.76, 58.91], "surreptitiously": [59.41, 60.78], "inexorably": [61.28, 62.58], "assiduously": [63.08, 64.38], "obliquely": [64.88, 66.1], "sardonically": [66.6, 67.84]}}}, "gbook": {"1-1": {"summary": "Use the present simple for habits, routines and facts. Use the present continuous for actions happening now.", "tr_summary": "Present simple alışkanlıkları, rutinleri ve genel gerçekleri anlatır: I work every day. Present continuous (am/is/are + -ing) ise şu anda olan bir işi anlatır: I'm working now. Türkçede ikisi için de '-iyor' diyebiliriz ('Her gün çalışıyorum', 'Şu an çalışıyorum'), ama İngilizcede ayırmak gerekir. Cümledeki zaman kelimelerine bakın: every day ise present simple, right now ise present continuous.", "use": ["Habits and routines: I go for a walk every evening.", "Facts that are always true: Dan lives next door.", "Actions happening at this moment: She's talking on the phone right now.", "Things in progress around now: I'm unpacking my boxes today."], "form": [{"label": "Present simple +", "pattern": "I/you/we/they + verb; he/she/it + verb-s/-es", "example": "She calls me every day."}, {"label": "Present simple –", "pattern": "don't / doesn't + base verb", "example": "Dan doesn't cook."}, {"label": "Present continuous +", "pattern": "am / is / are + verb-ing", "example": "I'm cooking dinner right now."}, {"label": "Present continuous –", "pattern": "am not / isn't / aren't + verb-ing", "example": "He isn't sleeping. He's reading."}], "examples": [{"en": "Elif's mom calls her every day.", "tr": "Elif'in annesi onu her gün arar."}, {"en": "Her phone is ringing right now.", "tr": "Telefonu şu anda çalıyor."}, {"en": "Dan often runs in the park on weekends.", "tr": "Dan hafta sonları sık sık parkta koşar."}, {"en": "Look! Dan is carrying the last box.", "tr": "Bak! Dan son kutuyu taşıyor."}, {"en": "I usually drink tea in the morning.", "tr": "Sabahları genelde çay içerim."}, {"en": "I'm drinking coffee today because I'm tired.", "tr": "Bugün yorgun olduğum için kahve içiyorum."}, {"en": "My sister works in a hospital.", "tr": "Kız kardeşim bir hastanede çalışıyor."}, {"en": "Be quiet, please. The baby is sleeping.", "tr": "Sessiz olun lütfen. Bebek uyuyor."}], "mistakes": [{"wrong": "I am working every day.", "right": "I work every day.", "why_tr": "'Every day' bir alışkanlıktır; Türkçedeki '-iyor' gibi -ing kullanmayın, present simple kullanın."}, {"wrong": "She work in an office.", "right": "She works in an office.", "why_tr": "He/she/it ile present simple fiile -s ya da -es alır."}, {"wrong": "Look! It rains.", "right": "Look! It's raining.", "why_tr": "'Look!' şu anda olan bir şeyi gösterir, bu yüzden am/is/are + -ing gerekir."}, {"wrong": "He doesn't works on Sundays.", "right": "He doesn't work on Sundays.", "why_tr": "'Doesn't' zaten -s taşır; ardından gelen fiil yalın kalır."}], "tip_tr": "Her zaman mı, şu an mı? Her zaman ise 'I work', şu an ise 'I'm working'."}, "1-2": {"summary": "Use a or an for one thing when it is new or not specific. Use the when we both know which one.", "tr_summary": "'A/an' Türkçedeki 'bir' gibidir ve tekil, sayılabilen bir şeyden ilk kez bahsederken kullanılır. Seçimi harf değil ses belirler: 'an hour' (h okunmaz), ama 'a university' (ses 'yu' ile başlar). Türkçede 'the' gibi bir kelime yoktur; İngilizcede ikimizin de bildiği şey için 'the' gerekir. Ayrıca Türkçede 'Ben asistanım' deriz ama İngilizcede meslekten önce mutlaka 'a/an' gelir: I'm an assistant.", "use": ["One thing, the first time we talk about it: I have a new laptop.", "Jobs: She's a designer. He's an engineer.", "A thing we already talked about: The laptop is very fast.", "A thing both people know: The restroom is on the left.", "Only one in the world: the sun, the sky."], "form": [{"label": "a + consonant sound", "pattern": "a + noun", "example": "a desk, a pen, a university"}, {"label": "an + vowel sound", "pattern": "an + noun", "example": "an orange, an assistant, an hour"}, {"label": "the", "pattern": "the + noun (singular or plural)", "example": "The meeting is in the big room."}, {"label": "Job", "pattern": "subject + be + a/an + job", "example": "Elif is an assistant."}], "examples": [{"en": "Elif is an assistant at a small design company.", "tr": "Elif küçük bir tasarım şirketinde asistan."}, {"en": "I have a laptop. The laptop is new.", "tr": "Bir dizüstü bilgisayarım var. Bilgisayar yeni."}, {"en": "We have an hour for lunch.", "tr": "Öğle yemeği için bir saatimiz var."}, {"en": "The restroom is on the left.", "tr": "Tuvalet solda."}, {"en": "Sam is a designer.", "tr": "Sam tasarımcı."}, {"en": "There's an umbrella by the door. Is it yours?", "tr": "Kapının yanında bir şemsiye var. Senin mi?"}, {"en": "Can you close the window, please?", "tr": "Pencereyi kapatabilir misin lütfen?"}, {"en": "The sun is very bright today.", "tr": "Bugün güneş çok parlak."}], "mistakes": [{"wrong": "She is teacher.", "right": "She is a teacher.", "why_tr": "Türkçede 'O öğretmen' deriz, ama İngilizcede meslekten önce 'a/an' şarttır."}, {"wrong": "We have a hour for lunch.", "right": "We have an hour for lunch.", "why_tr": "'Hour' kelimesinde h okunmaz, ünlü sesle başlar; bu yüzden 'an' kullanılır."}, {"wrong": "She studies at an university.", "right": "She studies at a university.", "why_tr": "'University' 'yu' sesiyle başlar, bu bir ünsüz sestir; o yüzden 'a' gelir."}, {"wrong": "I bought a cake. A cake was delicious.", "right": "I bought a cake. The cake was delicious.", "why_tr": "Pastadan ikinci kez bahsediyoruz, artık hangisi olduğunu biliyoruz: 'the'."}], "tip_tr": "Harfe değil sese bakın: 'an hour', 'a university'. Mesleği söylerken 'a/an' unutmayın."}, "1-3": {"summary": "Some nouns can be counted (onions) and some cannot (rice). Some, any, much, many and a lot of tell us about quantity.", "tr_summary": "Sayılabilen isimlerin çoğulu vardır (an onion, two onions); sayılamayanların yoktur (rice, milk, money). Türkçede sayıdan sonra isim tekil kalır ('iki soğan'), ama İngilizcede çoğul olur: two onions. Türkçede 'çok' her isimle gelir; İngilizcede soru ve olumsuzda sayılabilenle 'many', sayılamayanla 'much' kullanılır. 'A lot of' ikisiyle de olur; olumlu cümlede 'some', soru ve olumsuzda genelde 'any' kullanılır.", "use": ["Some in positive sentences and polite requests: I need some rice. I'd like some water.", "Any in questions and negatives: Do you have any bags? We don't have any milk.", "How many / not many with countable nouns: How many onions?", "How much / not much with uncountable nouns: How much meat?", "A lot of with both: a lot of people, a lot of coffee."], "form": [{"label": "Positive", "pattern": "some + plural / uncountable noun", "example": "I need some onions and some rice."}, {"label": "Negative", "pattern": "not + any + noun", "example": "We don't have any milk."}, {"label": "Question", "pattern": "Do you have any + noun?", "example": "Do you have any bags?"}, {"label": "Quantity questions", "pattern": "How many + plural? / How much + uncountable?", "example": "How many eggs? How much cheese?"}, {"label": "Big amount", "pattern": "a lot of + any noun", "example": "There are a lot of people here."}], "examples": [{"en": "I need some rice and some onions.", "tr": "Biraz pirinç ve birkaç soğana ihtiyacım var."}, {"en": "Do you have any bags?", "tr": "Poşetiniz var mı?"}, {"en": "How much meat do you need?", "tr": "Ne kadar et lazım?"}, {"en": "How many tomatoes do you want?", "tr": "Kaç domates istiyorsun?"}, {"en": "We don't have any milk. Can you buy some?", "tr": "Hiç sütümüz yok. Biraz alabilir misin?"}, {"en": "There isn't much cheese in the fridge.", "tr": "Buzdolabında fazla peynir yok."}, {"en": "Elif buys a lot of vegetables because she cooks a lot.", "tr": "Elif çok yemek yaptığı için bol sebze alır."}, {"en": "There are a lot of people in the store today.", "tr": "Bugün markette çok insan var."}], "mistakes": [{"wrong": "How much apples do you want?", "right": "How many apples do you want?", "why_tr": "Elma sayılabilir, bu yüzden 'many' kullanılır. 'Much' sayılamayanlar içindir."}, {"wrong": "I need three onion.", "right": "I need three onions.", "why_tr": "Türkçede 'üç soğan' deriz, ama İngilizcede sayıdan sonra isim çoğul olur."}, {"wrong": "We don't have some milk.", "right": "We don't have any milk.", "why_tr": "Olumsuz cümlede genelde 'some' değil 'any' kullanılır."}, {"wrong": "Can I ask for some informations?", "right": "Can I ask for some information?", "why_tr": "'Information' sayılamaz, -s almaz. Türkçede 'bilgiler' desek de İngilizcede tekildir."}], "tip_tr": "Sayabiliyor musunuz? Evet ise 'many', hayır ise 'much'. Emin değilseniz 'a lot of' her ikisinde de doğrudur."}, "1-4": {"summary": "In, on and at tell us when something happens: at for clock times, on for days and dates, in for longer periods.", "tr_summary": "Türkçede zaman için çoğu zaman '-de/-da' eki yeter: saat dokuzda, haziranda, 2020'de. İngilizcede ise üç farklı edat var: saatler için 'at', günler ve tarihler için 'on', günün bölümleri, aylar ve yıllar için 'in'. 'Today, tomorrow, yesterday' ve 'this, next, last' ile başlayan zamanlardan önce edat kullanılmaz. 'In ten minutes' ise 'on dakika sonra' demektir.", "use": ["at + clock times: at nine, at four thirty.", "at night (but in the morning, in the afternoon, in the evening).", "on + days and dates: on Monday, on June 5th, on the weekend.", "in + months, years and seasons: in June, in 2020, in winter.", "No preposition with today, tomorrow, yesterday, this, next, last."], "form": [{"label": "at", "pattern": "at + time", "example": "The store closes at nine."}, {"label": "on", "pattern": "on + day / date", "example": "My appointment is on Thursday."}, {"label": "in", "pattern": "in + part of day / month / year", "example": "I feel OK in the morning."}, {"label": "in + amount of time", "pattern": "in + time = after that time", "example": "Call us again in a week."}, {"label": "No preposition", "pattern": "today / tomorrow / next / last + noun", "example": "See you tomorrow morning!"}], "examples": [{"en": "My appointment is on Thursday at four thirty.", "tr": "Randevum perşembe günü saat dört buçukta."}, {"en": "I feel OK in the morning, but not at night.", "tr": "Sabahları iyiyim ama geceleri değil."}, {"en": "Dan's birthday is in June.", "tr": "Dan'in doğum günü haziranda."}, {"en": "Elif arrived in Chicago on Saturday.", "tr": "Elif cumartesi günü Chicago'ya geldi."}, {"en": "Let's meet on Saturday afternoon.", "tr": "Cumartesi öğleden sonra buluşalım."}, {"en": "Call me back in ten minutes.", "tr": "On dakika sonra beni geri ara."}, {"en": "The party is on December 5th.", "tr": "Parti 5 Aralık'ta."}, {"en": "I have a meeting next week.", "tr": "Gelecek hafta bir toplantım var."}], "mistakes": [{"wrong": "I start work in Monday.", "right": "I start work on Monday.", "why_tr": "Günlerden önce 'in' değil 'on' gelir."}, {"wrong": "I drink coffee at the morning.", "right": "I drink coffee in the morning.", "why_tr": "Günün bölümleri 'in' alır: in the morning, in the evening. Sadece 'at night' farklıdır."}, {"wrong": "I can't sleep in night.", "right": "I can't sleep at night.", "why_tr": "'Night' istisnadır: 'at night' denir."}, {"wrong": "See you on next week.", "right": "See you next week.", "why_tr": "'Next, last, this, tomorrow' ile edat kullanılmaz."}], "tip_tr": "Küçükten büyüğe: saat 'at', gün 'on', ay ve yıl 'in'. 'Next, last, tomorrow' önünde edat yok."}, "1-5": {"summary": "Can talks about what is possible or allowed. Have to talks about rules and things that are necessary. Should gives advice.", "tr_summary": "'Can' Türkçedeki '-ebilir' gibidir: izin ya da olasılık. 'Have to' bir zorunluluktur ('-mek zorunda'); he/she/it ile 'has to' olur. Dikkat: 'don't have to' yasak değildir, 'zorunda değilsin' demektir. Türkçede '-meli/-malı' hem zorunluluk hem tavsiye için kullanılır; İngilizcede tavsiye için 'should' tercih edilir: You should rest (Dinlenmelisin).", "use": ["can / can't: it is allowed or not allowed. You can leave at three.", "have to / has to: a rule or something necessary. She has to be here by nine.", "don't / doesn't have to: not necessary, but OK if you do it.", "should / shouldn't: advice, a good or bad idea. You should go to bed early."], "form": [{"label": "can", "pattern": "subject + can / can't + base verb", "example": "You can use the printer."}, {"label": "have to", "pattern": "I/you/we/they have to; he/she/it has to + base verb", "example": "Elif has to start at nine."}, {"label": "don't have to", "pattern": "don't / doesn't have to + base verb", "example": "We don't have to wear a suit."}, {"label": "should", "pattern": "subject + should / shouldn't + base verb", "example": "You shouldn't eat at your desk."}, {"label": "Questions", "pattern": "Can / Should + subject + verb? Do / Does + subject + have to + verb?", "example": "Does Elif have to bring a notebook?"}], "examples": [{"en": "You can use the printer on the second floor.", "tr": "İkinci kattaki yazıcıyı kullanabilirsin."}, {"en": "Elif has to start work at nine.", "tr": "Elif'in dokuzda işe başlaması gerekiyor."}, {"en": "We don't have to wear formal clothes.", "tr": "Resmi kıyafet giymek zorunda değiliz."}, {"en": "You look tired. You should rest.", "tr": "Yorgun görünüyorsun. Dinlenmelisin."}, {"en": "You shouldn't eat at your desk.", "tr": "Masanda yemek yememelisin."}, {"en": "Sorry, you can't park here.", "tr": "Kusura bakmayın, buraya park edemezsiniz."}, {"en": "Does Sam have to work on Saturday?", "tr": "Sam cumartesi çalışmak zorunda mı?"}, {"en": "Can you give me the code, please?", "tr": "Bana şifreyi verebilir misin lütfen?"}], "mistakes": [{"wrong": "She have to ask Maria first.", "right": "She has to ask Maria first.", "why_tr": "He/she/it ile 'have to' değil 'has to' kullanılır."}, {"wrong": "You can to use the kitchen.", "right": "You can use the kitchen.", "why_tr": "'Can' ve 'should' sonrasında 'to' gelmez; fiil yalın kalır."}, {"wrong": "You should to rest.", "right": "You should rest.", "why_tr": "'Should' sonrasında 'to' kullanılmaz."}, {"wrong": "Does she has to come?", "right": "Does she have to come?", "why_tr": "'Does' sorusunda 'has' değil 'have' kullanılır."}], "tip_tr": "'Don't have to' = zorunda değilsin, yasak değil. Yasak için 'can't' kullanın."}, "1-6": {"summary": "English questions change the word order. With be, put am/is/are first. With other verbs, use do or does.", "tr_summary": "Türkçede soru yapmak için kelime sırasını değiştirmeyiz, sadece 'mı/mi' ekleriz: 'Hazır mısın?'. İngilizcede ise sıra değişir: 'be' fiili özneden önce gelir (Are you ready?). Başka fiillerde özneden önce 'do/does' gelir ve ana fiil yalın kalır: Does he play? Soru kelimesi (where, what, when) her zaman en başa gelir.", "use": ["Questions with be (am/is/are) and adjectives, places or names: Are you hungry?", "Questions with other verbs: Do you like sports?", "He/she/it questions: Does she work here?", "Wh- questions about information: Where do you live?"], "form": [{"label": "With be", "pattern": "Am / Is / Are + subject + ...?", "example": "Are you from here?"}, {"label": "Yes/No", "pattern": "Do / Does + subject + base verb?", "example": "Does it come with bread?"}, {"label": "Wh- with be", "pattern": "Question word + am / is / are + subject?", "example": "Where are you from?"}, {"label": "Wh- with do", "pattern": "Question word + do / does + subject + base verb?", "example": "What does she do?"}], "examples": [{"en": "Are you ready to order?", "tr": "Sipariş vermeye hazır mısınız?"}, {"en": "Does it come with bread?", "tr": "Yanında ekmek geliyor mu?"}, {"en": "Where are you from?", "tr": "Nerelisin?"}, {"en": "What do you do on Sundays?", "tr": "Pazar günleri ne yaparsın?"}, {"en": "Do you like sports?", "tr": "Spordan hoşlanır mısın?"}, {"en": "Is Elif from Turkey?", "tr": "Elif Türkiyeli mi?"}, {"en": "Where do Sam's parents live?", "tr": "Sam'in ailesi nerede yaşıyor?"}, {"en": "What time does Maria start work?", "tr": "Maria işe saat kaçta başlar?"}], "mistakes": [{"wrong": "Where you live?", "right": "Where do you live?", "why_tr": "Türkçede yardımcı kelime gerekmez, ama İngilizcede soru kelimesinden sonra 'do/does' gelir."}, {"wrong": "Does he plays tennis?", "right": "Does he play tennis?", "why_tr": "'Does' -s'yi zaten taşır; ana fiil yalın kalır."}, {"wrong": "Do you are hungry?", "right": "Are you hungry?", "why_tr": "'Hungry' bir sıfattır; 'be' fiili varsa 'do' kullanılmaz."}, {"wrong": "What she does on weekends?", "right": "What does she do on weekends?", "why_tr": "Soru cümlesinde 'does' özneden önce gelir, ana fiil yalın olur."}], "tip_tr": "'Mı/mi' yerine kelimeleri yer değiştirin: Be varsa öne alın, yoksa başa 'do/does' koyun."}, "2-1": {"summary": "Prepositions of place tell us where something is. Prepositions of movement tell us how or where we go.", "tr_summary": "Türkçede yer bildirirken ek ve 'yanında, karşısında, arasında' gibi kelimeler kullanırız: 'bankanın yanında'. İngilizcede edat ismin önüne gelir: next to the bank. 'Across from' karşısında, 'between A and B' A ile B'nin arasında demektir. Hareket için 'along' (boyunca), 'into' (içine) ve 'past' (önünden geçip devam etmek) kullanılır.", "use": ["next to: side by side. My door is next to Dan's door.", "across from: on the other side of the street or room.", "between A and B: in the middle of two things.", "along: following a street or a river.", "into: from outside to inside. past: pass something and keep going."], "form": [{"label": "Place", "pattern": "be + next to / across from + place", "example": "The bank is next to the coffee shop."}, {"label": "Between", "pattern": "between + A + and + B", "example": "The shop is between the bank and the bookstore."}, {"label": "Movement", "pattern": "walk / go + along / past + place", "example": "Walk along the river and go past the bridge."}, {"label": "Into", "pattern": "go / come / run + into + place", "example": "She went into the library."}], "examples": [{"en": "The bank is next to the coffee shop.", "tr": "Banka kafenin yanında."}, {"en": "The pharmacy is across from the park.", "tr": "Eczane parkın karşısında."}, {"en": "The print shop is between a bank and a bookstore.", "tr": "Fotokopici, bir banka ile bir kitapçının arasında."}, {"en": "Walk along this street for two minutes.", "tr": "Bu cadde boyunca iki dakika yürüyün."}, {"en": "Go past the coffee shop and turn left at the corner.", "tr": "Kafeyi geçin ve köşeden sola dönün."}, {"en": "Elif's apartment is next to Dan's apartment.", "tr": "Elif'in dairesi Dan'in dairesinin yanında."}, {"en": "The bus stop is across from the post office.", "tr": "Otobüs durağı postanenin karşısında."}, {"en": "The cat ran into the house when it started to rain.", "tr": "Yağmur başlayınca kedi koşarak eve girdi."}], "mistakes": [{"wrong": "The bank is next the coffee shop.", "right": "The bank is next to the coffee shop.", "why_tr": "'Next' tek başına yetmez; 'yanında' anlamı için 'next to' gerekir."}, {"wrong": "The shop is between the bank to the bookstore.", "right": "The shop is between the bank and the bookstore.", "why_tr": "'Between' ile iki şeyi 'and' bağlar: between A and B."}, {"wrong": "Go past from the bank.", "right": "Go past the bank.", "why_tr": "Türkçedeki 'önünden geçmek' yüzünden 'from' eklemeyin; 'past' tek başına yeterlidir."}, {"wrong": "The pharmacy is across to the park.", "right": "The pharmacy is across from the park.", "why_tr": "'Karşısında' anlamı için 'across to' değil 'across from' kullanılır."}], "tip_tr": "İngilizcede edat öne gelir: 'bankanın yanında' = next to the bank. 'Past' ile 'from' kullanmayın."}, "2-2": {"summary": "Use the past simple for finished actions at a finished time, like yesterday or last night.", "tr_summary": "Past simple, geçmişte bitmiş bir eylemi anlatır; Türkçedeki '-di' ekine benzer. Düzenli fiiller '-ed' alır (clean → cleaned), ama birçok sık kullanılan fiil düzensizdir (go → went, see → saw) ve ezberlenmesi gerekir. Türkçede kişiye göre ek değişir (gittim, gitti, gittik), ama İngilizcede biçim herkes için aynıdır: I went, she went, they went.", "use": ["Finished actions in the past: I cleaned the kitchen.", "With finished time words: yesterday, last night, last week, an hour ago, in 2020.", "A story or a list of past events: Dan came over and helped me.", "The same form for every person: I/you/she/we/they worked."], "form": [{"label": "Regular", "pattern": "verb + -ed", "example": "clean → cleaned, help → helped"}, {"label": "Ending in -e", "pattern": "verb + -d", "example": "live → lived, arrive → arrived"}, {"label": "Consonant + y", "pattern": "y → i + -ed", "example": "try → tried, carry → carried"}, {"label": "Irregular", "pattern": "special past form (learn it)", "example": "go → went, see → saw, come → came, put → put"}], "examples": [{"en": "I heard a strange noise last night.", "tr": "Dün gece garip bir ses duydum."}, {"en": "Dan came over and helped me.", "tr": "Dan geldi ve bana yardım etti."}, {"en": "We cleaned the floor together.", "tr": "Yeri birlikte temizledik."}, {"en": "I put my towels on the floor.", "tr": "Havlularımı yere koydum."}, {"en": "This morning I tried to fix the sink myself.", "tr": "Bu sabah lavaboyu kendim tamir etmeye çalıştım."}, {"en": "The plumber fixed our shower in twenty minutes.", "tr": "Tesisatçı duşumuzu yirmi dakikada tamir etti."}, {"en": "Yesterday Elif went to the store after work.", "tr": "Dün Elif işten sonra markete gitti."}, {"en": "We saw a great movie on Saturday.", "tr": "Cumartesi harika bir film izledik."}], "mistakes": [{"wrong": "Yesterday I goed to the store.", "right": "Yesterday I went to the store.", "why_tr": "'Go' düzensiz bir fiildir; geçmiş hali 'went' olur, '-ed' almaz."}, {"wrong": "Last night I clean the kitchen.", "right": "Last night I cleaned the kitchen.", "why_tr": "'Last night' bitmiş bir zamandır; fiil geçmiş halde olmalı."}, {"wrong": "She tryed to call me.", "right": "She tried to call me.", "why_tr": "Ünsüz + y ile biten fiillerde y, i olur: try → tried."}, {"wrong": "I putted my keys on the table.", "right": "I put my keys on the table.", "why_tr": "'Put' geçmişte değişmez: put → put."}], "tip_tr": "Türkçedeki '-di' gibi düşünün, ama düzensiz fiilleri bir listeye yazıp her gün beş tanesini tekrar edin."}, "2-3": {"summary": "Use did to make past simple questions and didn't to make negatives. The main verb stays in the base form.", "tr_summary": "Türkçede olumsuz için fiile '-me' ekleriz (gitmedim), soru için 'mi' ekleriz (gittin mi?). İngilizcede ise olumsuzda 'didn't', soruda 'did' kullanılır ve geçmiş zamanı artık 'did' taşır; bu yüzden ana fiil yalın kalır: I didn't go, Did you go? 'Be' fiili ile 'did' kullanılmaz; 'was/were' kullanılır: Was it spicy?", "use": ["Yes/No questions about the past: Did you take the bus?", "Short answers: Yes, I did. / No, I didn't.", "Negatives: I didn't see it.", "Wh- questions: Where did you go on Sunday?", "With be, use was/were, not did: Were you tired?"], "form": [{"label": "Negative", "pattern": "subject + didn't + base verb", "example": "I didn't go upstairs."}, {"label": "Question", "pattern": "Did + subject + base verb?", "example": "Did you like it?"}, {"label": "Short answer", "pattern": "Yes, + subject + did. / No, + subject + didn't.", "example": "Yes, I did. No, she didn't."}, {"label": "Wh- question", "pattern": "Question word + did + subject + base verb?", "example": "Where did you go on Sunday?"}, {"label": "With be", "pattern": "Was / Were + subject ...? / wasn't / weren't", "example": "Was the museum busy?"}], "examples": [{"en": "Did you take the bus? No, I didn't.", "tr": "Otobüse bindin mi? Hayır, binmedim."}, {"en": "I didn't go upstairs.", "tr": "Yukarı çıkmadım."}, {"en": "Where did you go on Sunday?", "tr": "Pazar günü nereye gittin?"}, {"en": "Did you see the blue painting?", "tr": "Mavi tabloyu gördün mü?"}, {"en": "Elif didn't take the bus to the museum. She walked.", "tr": "Elif müzeye otobüsle gitmedi. Yürüdü."}, {"en": "What did you eat for lunch yesterday?", "tr": "Dün öğle yemeğinde ne yedin?"}, {"en": "She didn't go to the party. She was sick.", "tr": "Partiye gitmedi. Hastaydı."}, {"en": "Was the museum busy? Yes, it was.", "tr": "Müze kalabalık mıydı? Evet, kalabalıktı."}], "mistakes": [{"wrong": "Did you went to the museum?", "right": "Did you go to the museum?", "why_tr": "'Did' zaten geçmiş zamanı gösterir; ardından fiil yalın kalır."}, {"wrong": "I didn't saw the painting.", "right": "I didn't see the painting.", "why_tr": "'Didn't' sonrasında fiilin geçmiş hali değil, yalın hali gelir."}, {"wrong": "Where you went last weekend?", "right": "Where did you go last weekend?", "why_tr": "Türkçede yardımcı kelime yok, ama İngilizce soruda 'did' gerekir."}, {"wrong": "Did the museum busy?", "right": "Was the museum busy?", "why_tr": "'Busy' bir sıfattır; 'be' ile 'did' değil 'was/were' kullanılır."}], "tip_tr": "'Did' geçmişi taşır, fiil dinlenir: Did you go? I didn't go."}, "2-4": {"summary": "Use comparatives to compare two things and superlatives to say which one is number one in a group.", "tr_summary": "Türkçede karşılaştırma için 'daha' ve '-den' kullanırız: 'Bu hesap ondan daha ucuz'. İngilizcede kısa sıfatlar '-er' alır ve '-den' yerine 'than' gelir: cheaper than. Uzun sıfatlarda 'more' kullanılır: more expensive. Türkçedeki 'en' için kısa sıfatlarda 'the -est', uzunlarda 'the most' kullanılır. 'Good → better → the best' gibi düzensiz sıfatları ezberleyin.", "use": ["Compare two things with than: The app is easier than the website.", "Say which one is number one in a group: the cheapest account.", "Short adjectives: -er / -est (cheap, big, nice).", "Long adjectives: more / the most (expensive, popular).", "Irregular: good → better → the best, bad → worse → the worst."], "form": [{"label": "Short", "pattern": "adjective + -er (than) / the + adjective + -est", "example": "cheap → cheaper → the cheapest"}, {"label": "Ending in -y", "pattern": "y → i + -er / -est", "example": "easy → easier → the easiest"}, {"label": "One vowel + consonant", "pattern": "double the consonant", "example": "big → bigger → the biggest"}, {"label": "Long", "pattern": "more / the most + adjective", "example": "expensive → more expensive → the most expensive"}, {"label": "Irregular", "pattern": "special forms", "example": "good → better → the best; bad → worse → the worst"}], "examples": [{"en": "The Basic account is cheaper than the Plus.", "tr": "Basic hesap Plus'tan daha ucuz."}, {"en": "The app is easier than the website.", "tr": "Uygulama web sitesinden daha kolay."}, {"en": "Thursday morning is our busiest time.", "tr": "Perşembe sabahı en yoğun zamanımız."}, {"en": "The Plus account is more expensive.", "tr": "Plus hesap daha pahalı."}, {"en": "My new apartment is bigger than my old one.", "tr": "Yeni dairem eskisinden daha büyük."}, {"en": "This is the best coffee shop in the whole city.", "tr": "Burası bütün şehrin en iyi kafesi."}, {"en": "Today is worse than yesterday. It's raining and cold.", "tr": "Bugün dünden daha kötü. Yağmur yağıyor ve hava soğuk."}, {"en": "Grace is the friendliest person at the bank.", "tr": "Grace bankadaki en güler yüzlü kişi."}], "mistakes": [{"wrong": "The Basic account is more cheap.", "right": "The Basic account is cheaper.", "why_tr": "'Cheap' kısa bir sıfattır; 'more' değil '-er' alır."}, {"wrong": "The app is more better.", "right": "The app is better.", "why_tr": "'Better' zaten karşılaştırma bildirir; önüne 'more' eklenmez."}, {"wrong": "This bank is cheaper from that bank.", "right": "This bank is cheaper than that bank.", "why_tr": "Türkçedeki '-den' eki İngilizcede 'from' değil 'than' olur."}, {"wrong": "It's the most big room.", "right": "It's the biggest room.", "why_tr": "Kısa sıfatlarda 'the most' değil '-est' kullanılır: the biggest."}], "tip_tr": "'Daha' = -er veya more, '-den' = than, 'en' = the -est veya the most."}, "2-5": {"summary": "Use going to for plans you made before and for predictions you can see. Use will for quick decisions, offers and opinions.", "tr_summary": "Türkçede gelecek için genelde '-ecek/-acak' kullanırız, ama İngilizcede iki yol var. Önceden yapılmış bir plan ya da şu an gördüğümüz bir işarete dayanan tahmin için 'be going to' kullanılır: It's going to rain. Konuşma anında verilen karar ve teklifler için 'will' kullanılır; Türkçede bunu çoğu zaman geniş zamanla söyleriz: 'Dur, ben açarım' = I'll open it. 'I think' ile verilen fikirlerde de 'will' kullanılır.", "use": ["going to: a plan you made before. We're going to leave at eight.", "going to: a prediction from something you see now. Look at the sky! It's going to rain.", "will: a quick decision at the moment of speaking. I'll take the bus.", "will: an offer. I'll help you.", "will: an opinion, often after I think. I think you'll love it."], "form": [{"label": "going to +", "pattern": "am / is / are + going to + base verb", "example": "I'm going to rent a van."}, {"label": "going to –", "pattern": "am not / isn't / aren't + going to + base verb", "example": "We aren't going to stay long."}, {"label": "will +", "pattern": "subject + will ('ll) + base verb", "example": "I'll make some food."}, {"label": "will –", "pattern": "subject + won't + base verb", "example": "I don't think it'll be cold."}, {"label": "Questions", "pattern": "Are you going to + verb? / Will you + verb?", "example": "Will you come with us?"}], "examples": [{"en": "I'm going to rent a van.", "tr": "Bir minibüs kiralayacağım."}, {"en": "Can I help? I'll make some food.", "tr": "Yardım edebilir miyim? Ben yemek yaparım."}, {"en": "Look at the sky! It's going to rain.", "tr": "Gökyüzüne bak! Yağmur yağacak."}, {"en": "I think you'll love the lake.", "tr": "Bence gölü çok seveceksin."}, {"en": "We bought our tickets last month. We're going to visit my aunt in May.",
