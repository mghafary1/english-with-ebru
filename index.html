Right now, there are some eggs and some cheese in my fridge, but there isn't any milk. I also don't have many vegetables left. So I need to go shopping again soon!"}, "writing": {"prompt": "Write a note for your roommate or family. Say what food you have and what you need to buy.", "length": "40-60 words", "checklist": ["Use some and any.", "Use much or many in a negative sentence.", "Use a lot of at least once."], "model": "Hi Tom,\n\nI'm going to the store after work. We have some eggs and a lot of pasta, but we don't have any milk. There isn't much coffee, and we don't have many apples. Do you need anything? Send me a message before six.\n\nThanks!\nKate"}, "audio": {"listen": "audio/w1d3-listen.mp3", "listenT": [[0.3, 2.99], [3.44, 8.96], [9.41, 12.12], [12.57, 17.82], [18.27, 19.81], [20.26, 23.01], [23.46, 25.21], [25.66, 27.45], [27.9, 30.99], [31.44, 34.88], [35.33, 40.13], [40.58, 44.99], [45.44, 49.24], [49.69, 51.61], [52.06, 55.05], [55.5, 59.44], [59.89, 62.24], [62.69, 66.34], [66.79, 68.2], [68.65, 71.51], [71.96, 73.98], [74.43, 79.15]], "read": "audio/w1d3-read.mp3", "speak": "audio/w1d3-speak.mp3", "vocab": "audio/w1d3-vocab.mp3", "vocabT": [[0.3, 1.22, 1.82, 3.93], [4.83, 5.96, 6.56, 8.84], [9.74, 10.75, 11.35, 13.93], [14.83, 15.77, 16.37, 18.84], [19.74, 20.57, 21.17, 23.03], [23.93, 24.89, 25.49, 28.35], [29.25, 30.53, 31.13, 33.52], [34.42, 35.57, 36.17, 38.43]]}}, {"day": 4, "dayName": "Thursday", "title": "Say \"Ahh\"", "goals": ["I can make an appointment by phone.", "I can explain a simple health problem.", "I can use in, on and at for time."], "listening": {"title": "A sore throat", "intro": "In the morning, Elif calls a doctor's office and talks to Linda. In the afternoon, she sees Dr. Brown.", "speakers": {"Elif": "female", "Linda": "female", "Dr. Brown": "male"}, "lines": [{"s": "Linda", "t": "Good morning, doctor's office. This is Linda. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like to make an appointment, please. I have a bad sore throat."}, {"s": "Linda", "t": "I'm sorry to hear that. Are you a new patient?"}, {"s": "Elif", "t": "Yes, I am. I just moved here."}, {"s": "Linda", "t": "OK. What's your name, please?"}, {"s": "Elif", "t": "Elif Demir."}, {"s": "Linda", "t": "Thank you. The doctor can see you on Monday at nine."}, {"s": "Elif", "t": "Monday? Is there anything sooner? It really hurts."}, {"s": "Linda", "t": "Let me check. Oh, someone just canceled. The doctor can see you today at four thirty."}, {"s": "Elif", "t": "Perfect! I'll ask my manager if I can leave at four."}, {"s": "Linda", "t": "Great. Please come in at four fifteen and fill out some forms."}, {"s": "Elif", "t": "OK. Thank you so much!"}, {"s": "Dr. Brown", "t": "Hello, Elif. I'm Doctor Brown. So, what's the problem?"}, {"s": "Elif", "t": "My throat hurts, and I feel tired. It started on Tuesday."}, {"s": "Dr. Brown", "t": "Do you have a fever?"}, {"s": "Elif", "t": "A little, at night. In the morning, I feel OK."}, {"s": "Dr. Brown", "t": "Let me look. Open your mouth and say \"Ahh.\""}, {"s": "Elif", "t": "Ahh."}, {"s": "Dr. Brown", "t": "Hmm, it's a little red. It's probably just a cold. Drink a lot of water and get some rest."}, {"s": "Elif", "t": "Can I go to work tomorrow?"}, {"s": "Dr. Brown", "t": "Yes, but get a lot of rest on the weekend. If you don't feel better in a week, call us again."}, {"s": "Elif", "t": "OK. I'm cooking for my neighbor tomorrow night. Is that OK?"}, {"s": "Dr. Brown", "t": "Sure. Just wash your hands often. And make some hot tea with honey."}, {"s": "Elif", "t": "Turkish tea with honey. That's my favorite medicine!"}], "mcq": [{"q": "Why does Elif call the doctor's office?", "options": ["She has a sore throat.", "She wants to change her appointment.", "She needs a form for work."], "answer": 0}, {"q": "When does Elif see the doctor?", "options": ["On Monday at nine", "Today at four thirty", "Tomorrow morning"], "answer": 1}, {"q": "What does the doctor think the problem is?", "options": ["A bad tooth", "An allergy", "A cold"], "answer": 2}, {"q": "What does the doctor tell Elif to do on the weekend?", "options": ["Go to work", "Get a lot of rest", "Come back to the office"], "answer": 1}], "gaps": [{"line": 1, "answer": "make an appointment"}, {"line": 6, "answer": "on Monday"}, {"line": 10, "answer": "fill out"}, {"line": 13, "answer": "on Tuesday"}, {"line": 15, "answer": "at night"}, {"line": 20, "answer": "in a week"}]}, "vocab": [{"w": "make an appointment", "m": "arrange a time to see a doctor", "ex": "I need to make an appointment with my dentist."}, {"w": "sore throat", "m": "pain in your throat, often with a cold", "ex": "I can't sing today. I have a sore throat."}, {"w": "I'm sorry to hear that", "m": "a kind reply to bad news", "ex": "You lost your phone? I'm sorry to hear that."}, {"w": "new patient", "m": "a person who visits this doctor for the first time", "ex": "As a new patient, you need to bring your ID."}, {"w": "fill out", "m": "write information on a form", "ex": "Please fill out this form with a pen."}, {"w": "fever", "m": "a body temperature that is higher than normal", "ex": "My son has a fever, so he's staying home."}, {"w": "get some rest", "m": "relax or sleep so your body feels better", "ex": "You look tired. Go home and get some rest."}, {"w": "feel better", "m": "be less sick than before", "ex": "I hope you feel better soon!"}], "grammar": {"title": "Prepositions of time: in, on, at", "points": ["at + clock times and night: at nine, at four thirty, at night.", "on + days and dates: on Monday, on Friday, on the weekend.", "in + parts of the day, months, years: in the morning, in June, in 2020.", "No preposition before today, tomorrow, yesterday, this, next or last."], "examples": [{"en": "My appointment is on Thursday at four thirty.", "note": "day: on, time: at"}, {"en": "I feel OK in the morning, but not at night.", "note": ""}, {"en": "Call us again in a week.", "note": "in = after this amount of time"}, {"en": "See you tomorrow morning!", "note": "no preposition"}], "tr": "Türkçede çoğu zaman '-de' deriz; İngilizcede saat 'at', gün 'on', ay ve yıl 'in' alır.", "exercises": [{"type": "choice", "q": "My appointment is ___ Friday.", "options": ["in", "on", "at"], "answer": 1, "why": "Use on with days of the week."}, {"type": "choice", "q": "I usually drink coffee ___ the morning.", "options": ["in", "on", "at"], "answer": 0, "why": "Use in with parts of the day."}, {"type": "choice", "q": "The store closes ___ nine o'clock", "options": ["in", "on", "at"], "answer": 2, "why": "Use at with clock times."}, {"type": "type", "q": "I can't sleep well ___ night. (in / on / at)", "answers": ["at"], "why": "We say at night, but in the morning."}, {"type": "type", "q": "Dan's birthday is ___ June. (in / on / at)", "answers": ["in"], "why": "Use in with months."}, {"type": "type", "q": "Let's meet ___ Saturday afternoon. (in / on / at)", "answers": ["on"], "why": "A specific day, even with afternoon, takes on."}, {"type": "type", "q": "Call me back ___ ten minutes. (in / on / at)", "answers": ["in"], "why": "In + time means after that amount of time."}, {"type": "choice", "q": "Is the party ___ December 5th?", "options": ["in", "on", "at"], "answer": 1, "why": "Use on with dates."}]}, "reading": {"title": "Can I leave early?", "kind": "two short emails", "text": "Hi Maria,\n\nI'm sorry, but I'm not feeling well. I have a sore throat and a low fever, and I didn't sleep much last night. I made an appointment with a doctor today at four thirty. Can I leave work at four? I'm really sorry, because it's only my first week. I can finish the client report tomorrow morning.\n\nThank you,\nElif\n\nHi Elif,\n\nOf course you can leave early! Your health is more important than any report. Please don't worry about it. You can send the report to me on Monday.\n\nIf you feel sick tomorrow, stay home. I got sick too, in my first winter here. Drink a lot of tea and rest!\n\nBy the way, Sam says your Turkish delight was amazing. The box was empty at eleven yesterday! Everyone wants to know where to buy it. Can you tell us at the team meeting on Monday?\n\nFeel better soon,\nMaria", "questions": [{"q": "Why does Elif write to Maria?", "options": ["She wants to leave work early.", "She wants a day off on Friday.", "She lost the client report."], "answer": 0}, {"q": "What time is Elif's appointment?", "options": ["At four", "At four thirty", "At eleven"], "answer": 1}, {"q": "When does Maria say Elif can send the report?", "options": ["Tonight", "At eleven", "On Monday"], "answer": 2}, {"q": "What happened to the Turkish delight?", "options": ["Nobody liked it.", "People ate it all quickly.", "Sam took it home."], "answer": 1}], "tf": [{"s": "Elif slept well last night.", "answer": false}, {"s": "Maria got sick in her first winter in the city.", "answer": true}, {"s": "Maria is angry about the report.", "answer": false}], "gloss": {"a": "bir", "about": "hakkında, konusunda", "amazing": "harika, muhteşem", "an": "bir (sesli harften önce)", "and": "ve", "any": "herhangi bir", "appointment": "randevu", "at": "-de (saat / yer)", "because": "çünkü", "better": "daha iyi (feel better: iyileşmek)", "box": "kutu", "but": "ama", "buy": "almak, satın almak", "by": "(by the way: bu arada)", "can": "-ebilir (can: yapabilmek)", "client": "müşteri", "course": "(of course: tabii ki)", "delight": "lokum (Turkish delight: lokum)", "didn't": "-medim (did not)", "doctor": "doktor", "don't": "-me / değil (do not)", "drink": "iç (drink: içmek)", "early": "erken", "eleven": "on bir", "elif": "Elif (isim)", "empty": "boş", "everyone": "herkes", "feel": "hissetmek (feel sick: kendini hasta hissetmek)", "feeling": "hissediyorum (not feeling well: iyi değilim)", "fever": "ateş", "finish": "bitirmek", "first": "ilk", "four": "dört", "got": "oldum (get sick: hasta olmak)", "have": "var (have: sahip olmak)", "health": "sağlık", "here": "burada", "hi": "merhaba", "home": "ev (stay home: evde kalmak)", "i": "ben", "i'm": "ben ...-im (I am)", "if": "eğer, -se", "important": "önemli", "in": "içinde / -de", "is": "-dir / olmak (to be)", "it": "onu", "it's": "o ...-dir (it is)", "know": "bilmek", "last": "geçen (last night: dün gece)", "leave": "çıkmak, ayrılmak (leave work: işten çıkmak)", "lot": "çok (a lot: çok)", "low": "düşük, hafif", "made": "aldım (make an appointment: randevu almak)", "maria": "Maria (isim)", "me": "beni / bana", "meeting": "toplantı", "monday": "pazartesi", "more": "daha (more important: daha önemli)", "morning": "sabah", "much": "çok (not much: pek değil)", "my": "benim", "night": "gece", "not": "değil", "of": "(of course: tabii ki)", "on": "-de (on Monday: pazartesi günü)", "only": "sadece", "please": "lütfen", "really": "gerçekten", "report": "rapor", "rest": "dinlen (rest: dinlenmek)", "sam": "Sam (isim)", "says": "diyor (say: demek)", "send": "göndermek", "sick": "hasta", "sleep": "uyumak", "soon": "yakında (feel better soon: geçmiş olsun)", "sore": "ağrıyan (sore throat: boğaz ağrısı)", "sorry": "üzgünüm, özür dilerim", "stay": "kal (stay: kalmak)", "tea": "çay", "team": "ekip", "tell": "söylemek, anlatmak", "than": "-den (daha)", "thank": "teşekkür (thank you: teşekkürler)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "thirty": "otuz (four thirty: dört buçuk)", "throat": "boğaz", "to": "-e / -a; fiil önünde -mek/-mak", "today": "bugün", "tomorrow": "yarın", "too": "de / da", "turkish": "Türk (Turkish delight: lokum)", "us": "bize", "wants": "istiyor (want: istemek)", "was": "idi / -di (be: olmak)", "way": "yol (by the way: bu arada)", "week": "hafta", "well": "iyi", "where": "nereden (where to buy: nereden alınır)", "winter": "kış", "with": "ile", "work": "iş", "worry": "endişelenmek (don't worry: merak etme)", "yesterday": "dün", "you": "sen", "your": "senin"}}, "speaking": {"prompt": "How do you take care of your health? When do you exercise, sleep and see a doctor?", "steps": ["say what you do in the morning and at night", "say what you do on certain days", "say what you do when you're sick"], "starters": ["In the morning, I ...", "On weekends, I ...", "I usually go to bed at ...", "When I'm sick, I ..."], "model": "I try to take care of my health. In the morning, I drink a big glass of water and eat a good breakfast. On Tuesdays and Thursdays, I go swimming after work. I usually go to bed at eleven, but on the weekend I sleep a little later. When I'm sick, I drink a lot of tea and rest at home. I see my doctor once a year, usually in the spring, for a checkup."}, "writing": {"prompt": "Write a text message to a friend. You are sick, so cancel your plans and suggest a new day and time.", "length": "40-60 words", "checklist": ["Use at with a clock time.", "Use on with a day.", "Use in with a part of the day."], "model": "Hi Jess, I'm so sorry, but I can't meet you tonight. I have a bad cold, and I'm staying home. I have a doctor's appointment tomorrow at ten. Are you free on Saturday? We can have coffee in the afternoon, maybe at three. Let me know! Nora"}, "audio": {"listen": "audio/w1d4-listen.mp3", "listenT": [[0.3, 4.1], [4.55, 8.69], [9.14, 11.8], [12.25, 14.3], [14.75, 16.44], [16.89, 17.91], [18.36, 21.2], [21.65, 24.61], [25.06, 30.33], [30.78, 33.96], [34.41, 37.82], [38.27, 39.92], [40.37, 43.5], [43.95, 47.62], [48.07, 49.18], [49.63, 52.51], [52.96, 55.22], [55.67, 56.4], [56.85, 62.48], [62.93, 64.51], [64.96, 70.46], [70.91, 74.88], [75.33, 79.15], [79.6, 82.65]], "read": "audio/w1d4-read.mp3", "speak": "audio/w1d4-speak.mp3", "vocab": "audio/w1d4-vocab.mp3", "vocabT": [[0.3, 1.62, 2.22, 4.87], [5.77, 6.86, 7.46, 10.1], [11.0, 12.47, 13.07, 15.7], [16.6, 17.64, 18.24, 20.93], [21.83, 22.92, 23.52, 25.52], [26.42, 27.32, 27.92, 30.5], [31.4, 32.6, 33.2, 35.88], [36.78, 37.98, 38.58, 40.33]]}}, {"day": 5, "dayName": "Friday", "title": "Office rules", "goals": ["I can ask about rules at work.", "I can give advice with should.", "I can use can, have to and don't have to."], "listening": {"title": "Never take the last cookie", "intro": "On Friday morning, Sam answers Elif's questions about the office. Then Maria joins them.", "speakers": {"Elif": "female", "Sam": "male", "Maria": "female"}, "lines": [{"s": "Sam", "t": "Good morning, Elif! How's your throat?"}, {"s": "Elif", "t": "Much better, thanks. The doctor said it's just a cold."}, {"s": "Sam", "t": "Good. You should drink a lot of tea today."}, {"s": "Elif", "t": "Don't worry, I have five tea bags in my bag! Can I ask you some questions about the office?"}, {"s": "Sam", "t": "Sure. What do you want to know?"}, {"s": "Elif", "t": "Do I have to start at nine every day?"}, {"s": "Sam", "t": "Yes, you have to be here by nine. But on Fridays, you can leave at three."}, {"s": "Elif", "t": "Really? That's great! What about lunch? Can I eat at my desk?"}, {"s": "Sam", "t": "You can, but you shouldn't. Maria wants everyone to take a real break."}, {"s": "Elif", "t": "OK. And can I use the big printer?"}, {"s": "Sam", "t": "Yes, but you have to ask Maria for the code first."}, {"s": "Elif", "t": "Got it. Anything else?"}, {"s": "Sam", "t": "Hmm. Oh, yes. You don't have to wear formal clothes. Jeans are fine."}, {"s": "Elif", "t": "Good. I don't have many formal clothes anyway."}, {"s": "Sam", "t": "And one very important thing: you should never take the last cookie."}, {"s": "Elif", "t": "Ha! Is that a real rule?"}, {"s": "Sam", "t": "No, but everyone follows it. Trust me."}, {"s": "Maria", "t": "Good morning, you two! Elif, how are you feeling?"}, {"s": "Elif", "t": "Much better, thank you. And thanks for yesterday."}, {"s": "Maria", "t": "No problem. Listen, you have to finish the training videos today. They're short."}, {"s": "Elif", "t": "Sure. Should I watch them before lunch?"}, {"s": "Maria", "t": "Yes, if you can. And Elif, you're doing a great job."}, {"s": "Elif", "t": "Thank you! That's really nice to hear."}], "mcq": [{"q": "How is Elif feeling today?", "options": ["Much better", "Still very sick", "Very nervous"], "answer": 0}, {"q": "What time can people leave on Fridays?", "options": ["At nine", "At three", "At five"], "answer": 1}, {"q": "Why shouldn't Elif eat lunch at her desk?", "options": ["Food is not allowed in the office.", "Maria wants everyone to take a real break.", "Her desk is too small."], "answer": 1}, {"q": "What does Maria ask Elif to do today?", "options": ["Clean the kitchen", "Buy some cookies", "Finish the training videos"], "answer": 2}], "gaps": [{"line": 2, "answer": "should drink"}, {"line": 5, "answer": "have to start"}, {"line": 6, "answer": "can leave"}, {"line": 8, "answer": "shouldn't"}, {"line": 12, "answer": "don't have to"}, {"line": 20, "answer": "Should I"}]}, "vocab": [{"w": "by nine", "m": "not later than nine o'clock", "ex": "Please send me the report by nine."}, {"w": "take a break", "m": "stop working for a short time", "ex": "Let's take a break and get some coffee."}, {"w": "Got it", "m": "I understand", "ex": "Turn left at the bank? Got it, thanks."}, {"w": "formal clothes", "m": "nice clothes for work or special events", "ex": "I wear formal clothes to weddings."}, {"w": "rule", "m": "something you must or must not do", "ex": "The rule in our house is no phones at dinner."}, {"w": "training", "m": "lessons that teach you how to do a job", "ex": "New workers get two days of training."}, {"w": "a great job", "m": "very good work", "ex": "You did a great job on this report!"}, {"w": "nice to hear", "m": "a happy reply to good news", "ex": "You passed the test? That's so nice to hear!"}], "grammar": {"title": "can, have to, should", "points": ["can / can't: something is possible or allowed. You can leave at three.", "have to: something is necessary, a rule. He has to be here by nine.", "don't have to: something is not necessary. You don't have to wear formal clothes.", "should / shouldn't: advice, a good or bad idea. You should rest."], "examples": [{"en": "You can use the printer.", "note": idge. Every Friday at two, Sam empties the fridge. If there's no name, the food goes in the trash.\n\n3. You don't have to wash your cup right away, but you have to wash it before you go home.\n\n4. You shouldn't take the last cookie without asking. Yes, this is a real rule now!\n\n5. You can bring food from home to share. We love that! This week, Elif brought Turkish delight, and it was gone by eleven.\n\nDo you have any questions? Talk to me or to Sam. And remember: you don't have to be perfect, but you should be kind!\n\nThank you!\nMaria", "questions": [{"q": "Who wrote the notice?", "options": ["Sam", "Maria", "Elif"], "answer": 1}, {"q": "What happens to food with no name on it?", "options": ["It goes in the trash.", "Sam takes it home.", "It goes on the kitchen table."], "answer": 0}, {"q": "When do you have to wash your cup?", "options": ["Right away", "Before you go home", "Every Friday"], "answer": 1}, {"q": "Why does the notice mention Elif?", "options": ["She broke the coffee machine.", "She took the last cookie.", "She brought food to share."], "answer": 2}], "tf": [{"s": "You can use the coffee machine only in the morning.", "answer": false}, {"s": "The cookie rule is now a real rule.", "answer": true}, {"s": "You have to wash your cup right after you use it.", "answer": false}], "gloss": {"a": "bir", "all": "hepimiz (we all)", "and": "ve", "any": "herhangi; hiç (any time: istediğiniz zaman)", "are": "(here are: işte)", "asking": "sormak (without asking: sormadan)", "at": "-de (saat / yer)", "away": "(right away: hemen)", "be": "olmak", "before": "önce, -meden önce", "bring": "getirmek", "brought": "getirdi (bring: getirmek)", "but": "ama", "by": "-e kadar (by eleven: on bire kadar)", "can": "-ebilirsiniz (can: yapabilmek)", "clean": "temizlemek", "coffee": "kahve", "cookie": "kurabiye", "cup": "fincan, bardak", "delight": "lokum (Turkish delight: lokum)", "do": "soru yardımcı fiili", "don't": "-mez (don't have to: zorunda değil)", "eleven": "on bir", ht, I cooked stuffed peppers for Dan. He brought his grandma's apple pie, and three other neighbors came too. One of them, Mrs. Green, lives on the first floor. She's eighty, and she still goes swimming every Tuesday! She asked me a lot of questions. \"Where is Turkey exactly? Is it hot there? Do you have snow?\" I laughed and answered all of them.\n\nToday I had lunch with Sam. He's from Chicago, and he knows everything about the city. He invited me to a basketball game next Saturday. Do I know the rules of basketball? No! But I can learn.\n\nThis week wasn't always easy. I had a cold, and I still don't understand the bus map. But now I have a kind neighbor, a helpful coworker and a great manager. What more do I need? Maybe a little more sleep!\n\nWhat am I doing tomorrow? Nothing! I'm staying home and resting.", "questions": [{"q": "What did Dan bring to the dinner?", "options": ["Stuffed peppers", "An apple pie", "Turkish tea"], "answer": 1}, {"q": "What is surprising about Mrs. Green?", "options": ["She is eighty and still goes swimming.", "She is from Turkey.", "She plays basketball."], "answer": 0}, {"q": "What does Elif still find difficult?", "options": ["Her job", "Cooking", "The bus map"], "answer": 2}, {"q": "What is Elif's plan for Sunday?", "options": ["To go to a basketball game", "To stay home and rest", "To visit Sam's parents"], "answer": 1}], "tf": [{"s": "Mrs. Green lives on the first floor.", "answer": true}, {"s": "Elif knows the rules of basketball.", "answer": false}, {"s": "Sam is from Chicago.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında", "all": "hepsi (all of them: hepsi)", "always": "her zaman (not always: hep değil)", "am": "-im (what am I doing: ne yapıyorum)", "and": "ve", "answered": "cevapladım (answer: cevaplamak)", "apple": "elma", "ask": "sormak", "asked": "sordu (ask: sormak)", "basketball": "basketbol", "brought": "getirdi (bring: getirmek)", "bus": "otobüs", "but": "ama", "came": "geldi (come: gelmek)", "can": " abit; he/she/it adds -s: calls."}, {"q": "I'm tired. Let's ___ a break.", "options": ["make", "take", "do"], "answer": 1, "why": "We say take a break."}, {"q": "Sam is ___ excellent designer.", "options": ["a", "an", "the"], "answer": 1, "why": "Excellent starts with a vowel sound, so use an."}, {"q": "How ___ rice do we need?", "options": ["many", "much", "a lot"], "answer": 1, "why": "Rice is uncountable, so use much."}, {"q": "The team meeting starts ___ ten thirty.", "options": ["in", "on", "at"], "answer": 2, "why": "Use at with clock times."}, {"q": "You ___ wear a suit. Jeans are fine.", "options": ["have to", "don't have to", "can't"], "answer": 1, "why": "A suit is not necessary, so use don't have to."}, {"q": "___ Dan live next door?", "options": ["Is", "Does", "Do"], "answer": 1, "why": "Live is a main verb, and Dan is he: does."}, {"q": "I can't talk much today. I have a sore ___.", "options": ["fever", "rest", "throat"], "answer": 2, "why": "We say a sore throat."}, {"q": "Please ___ out this form before you see the doctor.", "options": ["make", "take", "fill"], "answer": 2, "why": "We fill out a form."}, {"q": "After a few weeks, I started to feel ___ home.", "options": ["in", "at", "on"], "answer": 1, "why": "The phrase is feel at home."}], "reflection": ["What was the most useful thing you learned this week?", "Which grammar point is still difficult for you?", "Which new phrase can you use in your own life next week?"]}}, {"week": 2, "title": "Finding my way", "days": [{"day": 1, "dayName": "Monday", "title": "Which bus do I take?", "goals": ["I can ask how to get somewhere.", "I can understand simple directions.", "I can say where places are."], "listening": {"title": "At the bus stop", "intro": "Elif is at a bus stop. She talks to a woman, Carmen, and then to the bus driver, Ray.", "speakers": {"Elif": "female", "Carmen": "female", "Ray": "male"}, "lines": [{"s": "Elif", "t": "Excuse me, is this the right bus stop for downtown?"}, {"s": "Carmen", "t": "It depends. Where exactly do you want to go?"}, {"s": "Elif", "t": "To a print shop. My manager wrote the address on this paper."}, {"s": "Carmen", "t": "Let me see... Oh, I know this place. Take the number 12."}, {"s": "Elif", "t": "The number 12. Does it stop here?"}, {"s": "Carmen", "t": "Yes, it does. It comes every fifteen minutes or so."}, {"s": "Elif", "t": "Great. And where do I get off?"}, {"s": "Carmen", "t": "Get off at the big library. The print shop is across from it."}, {"s": "Elif", "t": "Across from the library. Thank you so much!"}, {"s": "Carmen", "t": "No problem. Oh, look, here it comes."}, {"s": "Ray", "t": "Good morning!"}, {"s": "Elif", "t": "Hi. Can I pay with this card?"}, {"s": "Ray", "t": "Sure. Just tap your card here."}, {"s": "Elif", "t": "Thanks. Does this bus go past the big library?"}, {"s": "Ray", "t": "It does. It's about twenty minutes from here."}, {"s": "Elif", "t": "Can you tell me when we get there? I'm new in the city."}, {"s": "Ray", "t": "Of course. Welcome to Chicago! Sit near the front."}, {"s": "Ray", "t": "Okay, this is your stop. That's the library, on the left."}, {"s": "Elif", "t": "Thank you! Um, where is the print shop exactly?"}, {"s": "Ray", "t": "Cross the street and walk along it. Go past the coffee shop."}, {"s": "Ray", "t": "The print shop is between a bank and a small bookstore."}, {"s": "Elif", "t": "Between a bank and a bookstore. Got it."}, {"s": "Ray", "t": "If you get lost, just go into the library and ask."}, {"s": "Elif", "t": "I will. Thanks again. Have a nice day!"}, {"s": "Ray", "t": "You too. Good luck!"}], "mcq": [{"q": "Where does Elif want to go?", "options": ["to a bookstore", "to a print shop", "to the library"], "answer": 1}, {"q": "Which bus does she need?", "options": ["the number 12", "the number 20", "the number 15"], "answer": 0}, {"q": "What does Elif ask the driver to do?", "options": ["give her a map", "drive faster", "tell her when to get off"], "answer": 2}, {"q": "Where is the print shop?", "options": ["between a bank and a bookstore", "inside the coffee shop", "next to the bus stop"], "answer": 0}], "gaps": [{"line": 6, "answer": "get off"}, {"line": 7, "answer": "across from"}, {"line": 12, "answer": "tap"}, {"line": 19, "answer": "along"}, {"line": 20, "answer": "between"}, {"line": 22, "answer": "into"}]}, "vocab": [{"w": "bus stop", "m": "a place where the bus stops for people", "ex": "There's a bus stop next to my building."}, {"w": "get off", "m": "leave a bus, train or plane", "ex": "We get off at the next stop."}, {"w": "across from", "m": "on the other side of the street", "ex": "The bakery is across from the bank."}, {"w": "go past", "m": "move by something and keep going", "ex": "You go past a school on the way to the park."}, {"w": "It depends", "m": "the answer changes in different situations", "ex": "Is the trip long? It depends on the traffic."}, {"w": "tap your card", "m": "touch your card on a machine to pay", "ex": "At this café, you can tap your card to pay."}, {"w": "this is your stop", "m": "you need to get off here", "ex": "Wake up, Tom! This is your stop."}, {"w": "get lost", "m": "not know where you are", "ex": "I always get lost in big shopping malls."}], "grammar": {"title": "Prepositions of place and movement", "points": ["Place (where something is): next to, across from, between A and B.", "Movement (how you go): along, into, past.", "Across from = on the other side of the street or room.", "Go past = pass something and keep going. Go into = enter."], "examples": [{"en": "The bank is next to the coffee shop.", "note": ""}, {"en": "The pharmacy is across from the park.", "note": "on the other side"}, {"en": "The shop is between the bank and the bookstore.", "note": "between A and B"}, {"en": "Walk along the river and go past the bridge.", "note": "movement"}], "exercises": [{"type": "choice", "q": "The print shop is ___ a bank and a bookstore.", "options": ["between", "along", "into"], "answer": 0, "why": "Between connects two things: between A and B."}, {"type": "choice", "q": "Walk ___ this street for two minutes.", "options": ["between", "along", "into"], "answer": 1, "why": "Along means following a street or a river."}, {"type": "choice", "q": "She went ___ the library to ask for help.", "options": ["along", "between", "into"], "answer": 2, "why": "Into shows movement from outside to inside."}, {"type": "choice", "q": "The post office is ___ the bus stop, on the other side of the street.", "options": ["next to", "across from", "into"], "answer": 1, "why": "On the other side of the street = across from."}, {"type": "type", "q": "Go ___ the coffee shop and turn left at the corner. (past / between)", "answers": ["past"], "why": "Go past = pass it and keep walking."}, {"type": "type", "q": "My apartment is ___ Dan's apartment. Our doors are side by side. (next to / along)", "answers": ["next to"], "why": "Side by side = next to."}, {"type": "type", "q": "We walked ___ the river for an hour. (along / into)", "answers": ["along"], "why": "Along means following the side of the river."}, {"type": "type", "q": "The cat ran ___ the house when it started to rain. (into / between)", "answers": ["into"], "why": "The cat moved from outside to inside: into."}]}, "reading": {"title": "The wrong direction", "kind": "Elif's diary", "text": "Monday evening\n\nToday Maria asked me to take some designs to a print shop downtown. I don't know the city yet, so I was a little nervous. A kind woman at the bus stop helped me, and the driver told me when to get off.\n\nThe print shop is across from a big library. It's small, and it's between a bank and a bookstore. The people there were friendly, and they liked our designs. I felt very proud.\n\nThen I made a mistake. On the way back, I took the number 12 again, but in the wrong direction! After ten minutes, I saw a lake out the window. There is no lake near my office. I got off quickly.\n\nA man with a dog helped me. He said, \"Cross the street and wait next to the pharmacy. That bus goes past your office.\" It was easy. Next time, I'll check the direction before I get on.\n\nTonight I'm tired but happy. I know two more streets in Chicago now!", "questions": [{"q": "Why did Elif go downtown?", "options": ["to meet Dan", "to take designs to a print shop", "to visit the library"], "answer": 1}, {"q": "How did she feel at the print shop?", "options": ["proud", "bored", "angry"], "answer": 0}, {"q": "What was her mistake?", "options": ["She lost the designs.", "She forgot to pay.", "She took the bus in the wrong direction."], "answer": 2}, {"q": "Where did the man tell her to wait?", "options": ["across from the library", "next to the pharmacy", "inside the bookstore"], "answer": 1}], "tf": [{"s": "The print shop is next to the library.", "answer": false}, {"s": "A man with a dog helped Elif.", "answer": true}, {"s": "Elif saw a lake from the bus.", "answer": true}], "gloss": {"a": "bir", "across": "karşısında (across from: karşısında)", "after": "sonra", "again": "yine, tekrar", "and": "ve", "asked": "istedi (ask: istemek, rica etmek)", "at": "-de (saat / yer)", "back": "geri (on the way back: dönüş yolunda)", "bank": "banka", "before": "önce", "between": "arasında", "big": "büyük", "bookstore": "kitapçı", "bus": "otobüs", "but": "ama", "check": "kontrol etmek", "chicago": "Chicago (şehir)", "city": "şehir", "cross": "karşıya geç (cross: geçmek)", "designs": "tasarımlar", "direction": "yön", "dog": "köpek", "don't": "-mıyorum (do not)", "downtown": "şehir merkezi(nde)", "driver": "şoför", "easy": "kolay", "evening": "akşam", "felt": "hissettim (feel: hissetmek)", "friendly": "cana yakın", "from": "(across from: karşısında)", "get": "(get off: inmek; get on: binmek)", "goes": "gidiyor (go past: önünden geçmek)", "got": "indim (get off: inmek)", "happy": "mutlu", "he": "o (erkek)", "helped": "yardım etti (help: yardım etmek)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-im (I am)", "in": " peaking": {"prompt": "How do you get from your home to a place you often go, like a shop or a friend's house?", "steps": ["say where you go and how you get there", "give directions with three prepositions", "say how long it takes"], "starters": ["I often go to ...", "First, I walk along ...", "Then I go past ...", "It's next to / across from ..."], "model": "I often go to my favorite café on Saturdays. It's not far from my home, so I usually walk. First, I walk along my street for about five minutes. Then I go past a small park and a school. At the corner, I turn right. The café is between a flower shop and a bakery, and it's across from a big supermarket. It takes about fifteen minutes. When it rains, I take the bus. I love this walk because it's quiet and green."}, "writing": {"prompt": "A friend is visiting your home for the first time. Write a text message with directions from the bus stop.", "length": "40-70 words", "checklist": ["Use at least three prepositions (next to, across from, past ...).", "Say what your friend will see on the way.", "End with a friendly line."], "model": "Hi Jen! Get off the bus at the big supermarket. Walk along Green Street and go past a small park. My building is the white one between a bank and a pharmacy. It's across from a coffee shop. Go into the building and take the elevator to the fourth floor. I'm in 4B. Call me if you get lost. See you soon!"}, "audio": {"listen": "audio/w2d1-listen.mp3", "listenT": [[0.3, 3.39], [3.84, 6.6], [7.05, 10.69], [11.14, 14.26], [14.71, 16.86], [17.31, 20.58], [21.03, 22.73], [23.18, 26.75], [27.2, 29.78], [30.23, 32.51], [32.96, 33.83], [34.28, 36.27], [36.72, 38.32], [38.77, 41.56], [42.01, 44.25], [44.7, 47.52], [47.97, 51.0], [51.45, 54.71], [55.16, 58.23], [58.68, 62.12], [62.57, 65.47], [65.92, 68.29], [68.74, 71.55], [72.0, 74.46], [74.91, 76.06]], "read": "audio/w2d1-read.mp3", "speak": "audio/w2d1-speak.mp3", "vocab": "audio/w2d1-vocab.mp3", "vocabT": [[0.3, 1.39, 1.99, 4.19], [5.09, 5.96, 6.56, 8.14], [9.04, 10.17, 10.77, 12.92], [13.82, 14.91, 15.51, 17.94], [18.84, 19.93, 20.53, 23.22], [24.12, 25.31, 25.91, 28.5], [29.4, 30.63, 31.23, 33.41], [34.31, 35.38, 35.98, 38.54]]}}, {"day": 2, "dayName": "Tuesday", "title": "The sink is leaking!", "goals": ["I can describe a problem at home.", "I can say what happened last night.", "I can use the past simple (positive)."], "listening": {"title": "A call to the landlord", "intro": "Elif calls her landlord, Frank, early in the morning about a problem in her kitchen.", "speakers": {"Elif": "female", "Frank": "male"}, "lines": [{"s": "Frank", "t": "Hello, this is Frank."}, {"s": "Elif", "t": "Hi, Frank. This is Elif, from apartment 4B. Sorry to call so early."}, {"s": "Frank", "t": "No problem, Elif. What's wrong?"}, {"s": "Elif", "t": "There's a problem with my kitchen sink. It's leaking."}, {"s": "Frank", "t": "Oh no. Tell me what happened."}, {"s": "Elif", "t": "Last night I washed the dishes after dinner. Everything looked fine."}, {"s": "Elif", "t": "Then, at about midnight, I heard a strange noise in the kitchen."}, {"s": "Frank", "t": "What kind of noise?"}, {"s": "Elif", "t": "Like water. I went into the kitchen and saw water all over the floor."}, {"s": "Frank", "t": "A lot of water?"}, {"s": "Elif", "t": "Yes, a lot! It came from under the sink. I put all my towels on the floor."}, {"s": "Frank", "t": "Good thinking. Is the water still coming out?"}, {"s": "Elif", "t": "No. My neighbor Dan heard me, and he came over."}, {"s": "Elif", "t": "He turned off the water under the sink."}, {"s": "Frank", "t": "Dan's a good guy. That was the right thing to do."}, {"s": "Elif", "t": "Yes, he helped me a lot. We cleaned the floor together. I went to bed at two."}, {"s": "Frank", "t": "I'm sorry, Elif. That sounds like a long night."}, {"s": "Elif", "t": "It was! And now I can't use the sink. I can't cook or wash anything."}, {"s": "Frank", "t": "I understand. I'll send a plumber today. Are you home this afternoon?"}, {"s": "Elif", "t": "I'm at work until five. Can he come after five thirty?"}, {"s": "Frank", "t": "Let me check... Yes, he can come at six. His name is Joe."}, {"s": "Elif", "t": "Perfect. Thank you so much, Frank."}, {"s": "Frank", "t": "Thank you for calling quickly. And please say thanks to Dan for me."}, {"s": "Elif", "t": "I will. Have a good day!"}], "mcq": [{"q": "Why does Elif call Frank?", "options": ["Her door is broken.", "Her sink is leaking.", "She wants a new apartment."], "answer": 1}, {"q": "What did Elif hear at midnight?", "options": ["loud music", "her phone", "a noise like water"], "answer": 2}, {"q": "Who turned off the water?", "options": ["Dan", "Frank", "Joe"], "answer": 0}, {"q": "When is the plumber going to come?", "options": ["at nine", "at five thirty", "at six"], "answer": 2}], "gaps": [{"line": 5, "answer": "washed"}, {"line": 6, "answer": "heard"}, {"line": 8, "answer": "saw"}, {"line": 12, "answer": "came over"}, {"line": 13, "answer": "turned off"}, {"line": 15, "answer": "cleaned"}]}, "vocab": [{"w": "What's wrong?", "m": "What is the problem?", "ex": "You look sad. What's wrong?"}, {"w": "leaking", "m": "water is coming out of a hole", "ex": "The roof is leaking, so we put a bucket under it."}, {"w": "strange noise", "m": "a sound that is not normal", "ex": "My car makes a strange noise in the morning."}, {"w": "come over", "m": "come to someone's home", "ex": "Can you come over for coffee tomorrow?"}, {"w": "turn off", "m": "stop a machine, a light or water", "ex": "Please turn off the lights when you leave."}, {"w": "wash the dishes", "m": "clean plates, cups and pans", "ex": "It's your turn to wash the dishes tonight."}, {"w": "the right thing to do", "m": "the good or correct action", "ex": "Telling the truth was the right thing to do."}, {"w": "plumber", "m": "a person who fixes pipes, sinks and toilets", "ex": "We called a plumber because the shower was broken."}], "grammar": {"title": "Past simple: positive", "points": ["Use the past simple for finished actions at a finished time: last night, yesterday.", "Regular verbs add -ed: wash → washed, clean → cleaned, try → tried.", "Many common verbs are irregular: go → went, see → saw, come → came.", "The form is the same for everyone: I went, she went, they went."], "examples": [{"en": "I heard a strange noise last night.", "note": "hear → heard"}, {"en": "Dan came over and helped me.", "note": "come → came, help → helped"}, {"en": "We cleaned the floor together.", "note": "regular: + -ed"}, {"en": "I put my towels on the floor.", "note": "put → put (no change)"}], "tr": "Türkçede her fiile '-di' eklenir, ama İngilizcede birçok fiil düzensizdir: go → went, buy → bought. Bunları ezberleyin.", "exercises": [{"type": "type", "q": "Last night I ___ a strange noise. (hear)", "answers": ["heard"], "why": "Hear is irregular: hear → heard."}, {"type": "type", "q": "Dan ___ over and helped me. (come)", "answers": ["came"], "why": "Come is irregular: come → came."}, {"type": "type", "q": "Yesterday we ___ the kitchen floor together. (clean)", "answers": ["cleaned"], "why": "Clean is regular, so add -ed."}, {"type": "type", "q": "This morning I ___ to fix the sink myself. (try)", "answers": ["tried"], "why": "Consonant + y: change y to i, then add -ed."}, {"type": "choice", "q": "Yesterday she ___ to the store after work.", "options": ["goes", "went", "goed"], "answer": 1, "why": "Yesterday is a finished time. Go → went."}, {"type": "choice", "q": "Last week the plumber ___ our shower in twenty minutes.", "options": ["fixed", "fix", "fixs"], "answer": 0, "why": "Fix is regular: fix → fixed."}, {"type": "choice", "q": "I ___ my keys on the table an hour ago.", "options": ["putted", "put", "puts"], "answer": 1, "why": "Put doesn't change in the past: put → put."}, {"type": "choice", "q": "We ___ a great movie on Saturday.", "options": ["see", "seen", "saw"], "answer": 2, "why": "See is irregular: see → saw."}]}, "reading": {"title": "What a night!", "kind": "an email to a friend", "text": "Hi Deniz,\n\nHow are you? I have a funny story for you. Well, it's funny now!\n\nLast night my kitchen sink started to leak. At midnight I heard a noise and found water all over the floor. I ran to get towels, but there was too much water. My neighbor Dan heard me, and he came over in his pajamas. He turned off the water under the sink. We cleaned the kitchen together, and I finally went to bed at two.\n\nThis morning I called my landlord, Frank. He was very kind, and he sent a plumber in the evening. The plumber, Joe, arrived at six. He looked under the sink and found an old pipe with a hole in it. He changed the pipe in forty minutes. I made Turkish tea for him, and he loved it!\n\nAfter that, I bought a small cake and took it to Dan. He laughed and said, \"Call me anytime!\"\n\nSo my sink works again, and I have a great neighbor.\n\nWrite soon!\n\nElif", "questions": [{"q": "Why did Dan come over?", "options": ["Frank called him.", "He heard Elif.", "He wanted some tea."], "answer": 1}, {"q": "What was the problem with the sink?", "options": ["An old pipe had a hole in it.", "The sink was too small.", "The water was too hot."], "answer": 0}, {"q": "What did Elif give Joe?", "options": ["a cake", "some flowers", "Turkish tea"], "answer": 2}, {"q": "How does Elif feel at the end?", "options": ["angry with Frank", "happy about her neighbor", "worried about the sink"], "answer": 1}], "tf": [{"s": "Dan came over in his pajamas.", "answer": true}, {"s": "Joe arrived in the morning.", "answer": false}, {"s": "Elif took a cake to Dan.", "answer": true}], "gloss": {"a": "bir", "after": "sonra (after that: ondan sonra)", "again": "yine, tekrar", "all": "her yer (all over: her yerde)", "an": "bir (sesli harften önce)", "and": "ve", "anytime": "her zaman, istediğin zaman", "are": "-sin (how are you: nasılsın)", "arrived": "geldi (arrive: varmak, gelmek)", "at": "-de (saat / yer)", "bed": "yatak (go to bed: yatmak)", "bought": r was so nice. So I went to the art museum downtown."}, {"s": "Dan", "t": "Did you go with Sam?"}, {"s": "Elif", "t": "No, I didn't. I went alone. I wanted a quiet day."}, {"s": "Dan", "t": "Did you see the big blue painting on the second floor? It's my favorite."}, {"s": "Elif", "t": "No, I didn't see it. I didn't go upstairs. My feet hurt!"}, {"s": "Dan", "t": "You have to go back. Did you take the bus there?"}, {"s": "Elif", "t": "No, I walked. It took an hour, but it was a nice walk."}, {"s": "Dan", "t": "An hour? Wow. Did you get lost?"}, {"s": "Elif", "t": "Only once! But I asked a police officer, and she helped me."}, {"s": "Dan", "t": "You're really learning the city."}, {"s": "Elif", "t": "Slowly! But I still don't know where to buy good bread."}, {"s": "Dan", "t": "Oh, I can help with that. There's a great bakery next to the bus stop."}, {"s": "Elif", "t": "Really? I didn't notice it. Can you show me on Saturday morning?"}, {"s": "Dan", "t": "Sure. And Saturday night, come to my place. I'm having a small party."}, {"s": "Elif", "t": "A party? I'd love to come!"}], "mcq": [{"q": "What did Elif do on Saturday?", "options": ["She went to a museum.", "She had lunch with Sam.", "She visited Dan's sister."], "answer": 1}, {"q": "What did Elif eat for lunch?", "options": ["tomato soup", "a chicken sandwich", "spicy Mexican food"], "answer": 0}, {"q": "Who did Elif go to the museum with?", "options": ["Sam", "Dan", "She went alone."], "answer": 2}, {"q": "Why didn't Elif see Dan's favorite painting?", "options": ["The museum was closed.", "She didn't like it.", "She didn't go upstairs."], "answer": 2}], "gaps": [{"line": 6, "answer": "did you go"}, {"line": 7, "answer": "ordered"}, {"line": 8, "answer": "Did you like"}, {"line": 9, "answer": "didn't talk"}, {"line": 15, "answer": "didn't go"}, {"line": 17, "answer": "walked"}]}, "vocab": [{"w": "How was your weekend?", "m": "a friendly question about someone's weekend", "ex": "Hi, Tom! How was your weekend?"}, {"w": "Anytime", "m": "you don't need to thank me", "ex": "Thanks for the ride! Anytime."}, {"w": "do anything fun", "m": "do something you enjoy", "ex": "Are you going to do anything fun this summer?"}, {"w": "have lunch with", "m": "eat lunch together with someone", "ex": "I often have lunch with my sister on Fridays."}, {"w": "go upstairs", "m": "go to a higher floor", "ex": "The bedrooms are on the second floor, so let's go upstairs."}, {"w": "alone", "m": "without other people", "ex": "My grandmother lives alone, but she's very happy."}, {"w": "my feet hurt", "m": "my feet are in pain", "ex": "Can we sit down? My feet hurt."}, {"w": "notice", "m": "see something and pay attention to it", "ex": "Did you notice her new haircut?"}], "grammar": {"title": "Past simple: questions and negatives", "points": ["Questions: Did + subject + base verb. Did you like it?", "Negatives: didn't + base verb. I didn't see it.", "After did or didn't, use the base verb: not 'didn't went'.", "Wh- questions: Where / What / When + did + subject + verb?"], "examples": [{"en": "Did you take the bus? No, I didn't.", "note": "short answer"}, {"en": "I didn't go upstairs.", "note": "didn't + base verb"}, {"en": "Where did you go on Sunday?", "note": "Wh- + did + you + verb"}, {"en": "Was it spicy? Yes, it was.", "note": "with be: was/were, no did"}], "tr": "'Did' kullanınca fiil yalın kalır: 'Did you go?' doğru, 'Did you went?' yanlış.", "exercises": [{"type": "choice", "q": "___ you see the blue painting?", "options": ["Were", "Did", "Was"], "answer": 1, "why": "Use did with a main verb like see."}, {"type": "choice", "q": "I didn't ___ the answer, so I asked my teacher.", "options": ["know", "knew", "knows"], "answer": 0, "why": "After didn't, use the base verb."}, {"type": "choice", "q": "Where ___ you go last weekend?", "options": ["were", "do", "did"], "answer": 2, "why": "Last weekend is past: Where did you go?"}, {"type": "choice", "q": "___ the museum busy on Sunday?", "options": ["Did", "Was", "Were"], "answer": 1, "why": "With be, use was or were. Museum is singular."}, {"type": "type", "q": "She ___ to the party last night. She was sick. (not / go)", "answers": ["didn't go", "did not go"], "why": "Negative: didn't + base verb."}, {"type": "type", "q": "___ you like the movie yesterday? (do)", "answers": ["Did", "did"], "why": "Past question: Did + subject + base verb."}, {"type": "type", "q": "We ___ the bus to the museum. We walked. (not / take)", "answers": ["didn't take", "did not take"], "why": "Negative: didn't + base verb (take, not took)."}, {"type": "type", "q": "What ___ you eat for lunch yesterday? (do)", "answers": ["did"], "why": "Wh- question in the past: What did you...?"}]}, "reading": {"title": "The email I didn't send", "kind": "a text message chat", "text": "Sam: Hey Elif, are you okay? You looked worried after the meeting today.\n\nElif: Hi Sam. I'm fine now. But this morning was terrible. Maria asked me, \"Did you send the new designs to the client?\" And I said yes.\n\nSam: And?\n\nElif: Then I checked. I didn't send them! I wrote the email, but I didn't click \"Send.\" It was still in my drafts.\n\nSam: Oh no! What did Maria say?\n\nElif: She didn't get angry. She just said, \"Please send it now.\" The client answered in ten minutes, and they liked the designs.\n\nSam: See? No problem. Everyone does that. Last month I sent an email to the wrong person!\n\nElif: Really? Who did you send it to?\n\nSam: To Maria! It was a message about her surprise birthday party. So it wasn't a surprise anymore.\n\nElif: Haha! Did she like the party?\n\nSam: She loved it. She acted very surprised, too. So don't worry. See you tomorrow!", "questions": [{"q": "Why did Elif look worried?", "options": ["She was late for work.", "She didn't send an email.", "She lost her phone."], "answer": 1}, {"q": "Where was Elif's email?", "options": ["on Maria's desk", "in the trash", "in her drafts"], "answer": 2}, {"q": "How did Maria react?", "options": [ ee."}, {"s": "Elif", "t": "And the Plus account?"}, {"s": "Grace", "t": "The Plus is more expensive, but you get more services. For example, you can send money abroad for free."}, {"s": "Elif", "t": "Hmm. I send money to my mom sometimes, but not very often."}, {"s": "Grace", "t": "Then the Basic is probably better for you. It's our most popular account, too."}, {"s": "Elif", "t": "Great. Is there an app?"}, {"s": "Grace", "t": "Yes, and it's very easy to use. Honestly, the app is faster than coming here."}, {"s": "Elif", "t": "Good! The line this morning was longer than I expected."}, {"s": "Grace", "t": "Sorry about that. Thursday morning is our busiest time. Can I see your passport, please?"}, {"s": "Elif", "t": "Here you are. Do you need anything else?"}, {"s": "Grace", "t": "Yes, a letter with your address. A bill or your lease is fine."}, {"s": "Elif", "t": "I have my lease right here."}, {"s": "Grace", "t": "Perfect. Just a minute... Okay, your account is open!"}, {"s": "Elif", "t": "Already? That was easier than I thought."}, {"s": "Grace", "t": "Your card will arrive by mail in about a week."}, {"s": "Elif", "t": "In Turkey, my last bank visit took two hours!"}, {"s": "Grace", "t": "Well, you're my fastest customer today."}, {"s": "Elif", "t": "Thank you, Grace. This was the best part of my morning!"}], "mcq": [{"q": "Why is Elif at the bank?", "options": ["to change money", "to open an account", "to get a new card"], "answer": 1}, {"q": "Why is the Basic account better for Elif?", "options": ["It has more services.", "It's the newest account.", "She doesn't send money very often."], "answer": 2}, {"q": "What does Grace need to see?", "options": ["her passport and a letter with her address", "her work contract", "her phone and her old bank card"], "answer": 0}, {"q": "How does Elif feel at the end?", "options": ["worried about her card", "happy and surprised", "angry about the long line"], "answer": 1}], "gaps": [{"line": 6, "answer": "cheaper"}, {"line": 8 ect: Our Sunday trip to the lake\n\nHi Sam and Elif,\n\nThank you again for all your hard work this month. Here is the plan for Sunday.\n\nWe're going to meet at the office at eight in the morning Please don't be late! Sam is going to drive the van. The drive is about two hours, so we're going to stop for coffee on the way.\n\nMy friend's house is small, but it's right next to the lake. In the morning, we're going to walk along the lake. The weather app says it's going to rain early, so bring a jacket. After that, we're going to have a picnic.\n\nElif, thank you for offering to make Turkish food. I'll bring drinks and fruit. Sam, please bring your board games, and please keep the music quiet!\n\nWe're going to leave the lake at about five in the afternoon. I think we'll be home by seven thirty.\n\nI'm sure it will be a great day. See you on Sunday!\n\nMaria", "questions": [{"q": "Where are they going to meet on Sunday?", "options": ["at Elif's apartment", "at the office", "at the lake"], "answer": 1}, {"q": "Why are they going to stop on the way?", "options": ["to wait for Sam", "to buy food", "for coffee"], "answer": 2}, {"q": "Why should they bring a jacket?", "options": ["It's going to rain early.", "The house is cold.", "They're going to swim."], "answer": 0}, {"q": "When does Maria think they'll be home?", "options": ["at about five", "by eight in the morning", "by seven thirty"], "answer": 2}], "tf": [{"s": "The house is right next to the lake.", "answer": true}, {"s": "Maria is going to bring the board games.", "answer": false}, {"s": "They're going to leave the lake in the morning.", "answer": false}], "gloss": {"a": "bir", "about": "yaklaşık", "after": "sonra (after that: ondan sonra)", "afternoon": "öğleden sonra", "again": "tekrar", "all": "tüm, bütün", "along": "boyunca", "and": "ve", "app": "uygulama", "at": "-de (saat / yer)", "be": "olmak", "board": "tahta (board games: masa oyunları)", "bring": "getir (bring: getirmek)", "but": "ama", "by": "-e kadar re ten years ago."}, {"s": "Elif", "t": "Really? Did you try Turkish tea?"}, {"s": "Dan", "t": "Of course. I drank about ten glasses a day!"}, {"s": "Nora", "t": "Mmm, this dessert is amazing. What is it?"}, {"s": "Elif", "t": "It's called baklava. Have you ever eaten it?"}, {"s": "Nora", "t": "No, I've never tried it before. It's so sweet and delicious!"}, {"s": "Dan", "t": "So, Elif, what are you doing tomorrow?"}, {"s": "Elif", "t": "I'm going to a lake with my coworkers. I've never swum in a lake."}, {"s": "Nora", "t": "You have to try it! Bring a towel and be brave."}, {"s": "Elif", "t": "Maybe. I'll decide tomorrow!"}, {"s": "Dan", "t": "Okay, everyone, let's eat before Nora finishes the whole dessert!"}], "mcq": [{"q": "What did Elif bring to the party?", "options": ["flowers", "a Turkish dessert", "Turkish tea"], "answer": 1}, {"q": "Who is Nora?", "options": ["Dan's friend from college", "Dan's sister", "Elif's coworker"], "answer": 0}, {"q": "Which country has Dan visited?", "options": ["Germany", "Greece", "Turkey"], "answer": 2}, {"q": "What is Elif doing tomorrow?", "options": ["fixing her sink", "going to the bank", "going to a lake with coworkers"], "answer": 2}], "gaps": [{"line": 9, "answer": "never fixed"}, {"line": 12, "answer": "visited"}, {"line": 13, "answer": "been to"}, {"line": 15, "answer": "went"}, {"line": 20, "answer": "never tried"}, {"line": 22, "answer": "swum"}]}, "vocab": [{"w": "Come in", "m": "please enter", "ex": "The door is open. Come in!"}, {"w": "recipe", "m": "instructions for cooking a dish", "ex": "Can you give me the recipe for this soup?"}, {"w": "How do you like", "m": "What do you think of...?", "ex": "How do you like your new job?"}, {"w": "a little crazy", "m": "busy and full of surprises", "ex": "Work was a little crazy today."}, {"w": "first time", "m": "you have never done it before", "ex": "This is my first time on a plane."}, {"w": "I've always wanted to", "m": "I wanted to do this for a long time", "ex": "I've tly.", "I can ask for information at a gym."], "listening": {"title": "At the front desk", "intro": "On Monday after work, Elif visits a gym near her building. Marcus works at the front desk.", "speakers": {"Elif": "female", "Marcus": "male"}, "lines": [{"s": "Marcus", "t": "Hi there! Welcome. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like some information about a membership, please."}, {"s": "Marcus", "t": "Sure. Have you visited our gym before?"}, {"s": "Elif", "t": "No, this is my first time. But my neighbor has been a member here for three years."}, {"s": "Marcus", "t": "Oh, nice. What's his name?"}, {"s": "Elif", "t": "Dan. He lives next door to me."}, {"s": "Marcus", "t": "Dan? The guy who always tells jokes? He runs on the treadmill every morning."}, {"s": "Elif", "t": "That's him!"}, {"s": "Marcus", "t": "Ha! Great guy. So, how long have you lived in the neighborhood?"}, {"s": "Elif", "t": "Not long. I've lived here for two weeks. I moved from Turkey."}, {"s": "Marcus", "t": "Welcome to Chicago! Do you exercise much?"}, {"s": "Elif", "t": "Not really. I haven't exercised since I left Izmir. I've been too busy."}, {"s": "Marcus", "t": "That's normal. Moving is hard work. What kind of exercise do you like?"}, {"s": "Elif", "t": "Yoga. I did yoga for years at home. I really miss it."}, {"s": "Marcus", "t": "We have yoga classes on Tuesday and Thursday evenings at seven."}, {"s": "Elif", "t": "Perfect. I finish work at five thirty. How much does it cost?"}, {"s": "Marcus", "t": "Good news. This month, the first week is free for new members."}, {"s": "Elif", "t": "Free? I love that word!"}, {"s": "Marcus", "t": "Everyone does! Could I see an ID, please?"}, {"s": "Elif", "t": "Here you go. Is that the locker room over there?"}, {"s": "Marcus", "t": "Yes. The lockers are free, but you have to bring your own lock."}, {"s": "Elif", "t": "Okay. And how long have you worked here?"}, {"s": "Marcus", "t": "Since I finished college. So, about six years now."}, {"s": "Elif", "t": "Wow. You must know everyone!"}, {"s": "Marcus", "t": "I do. Okay, you're all set. Would you like a quick tour?"}, {"s": "Elif", "t": "Yes, please. Maybe I'll see Dan on the treadmill tomorrow!"}, {"s": "Marcus", "t": "Only if you come at six in the morning."}, {"s": "Elif", "t": "Six? Then I'll come in the evening!"}], "mcq": [{"q": "Who is already a member of this gym?", "options": ["Elif's manager, Maria", "Elif's neighbor, Dan", "Elif's coworker, Sam"], "answer": 1}, {"q": "How long has Elif lived in the neighborhood?", "options": ["for two weeks", "for three years", "for six years"], "answer": 0}, {"q": "What kind of exercise does Elif want to do?", "options": ["running", "swimming", "yoga"], "answer": 2}, {"q": "What does Elif need to bring for the locker?", "options": ["a towel", "her own lock", "a photo"], "answer": 1}], "gaps": [{"line": 3, "answer": "for three years"}, {"line": 8, "answer": "have you lived"}, {"line": 9, "answer": "for two weeks"}, {"line": 11, "answer": "since"}, {"line": 19, "answer": "locker room"}, {"line": 24, "answer": "you're all set"}]}, "vocab": [{"w": "join a gym", "m": "become a member of a gym", "ex": "I want to join a gym near my office."}, {"w": "membership", "m": "being a member of a club or group", "ex": "My gym membership ends in December."}, {"w": "front desk", "m": "the place where you ask questions when you arrive", "ex": "Please leave your key at the front desk."}, {"w": "locker room", "m": "a room where you change clothes and leave bags", "ex": "I left my shoes in the locker room."}, {"w": "sign up for", "m": "put your name on a list to join something", "ex": "Did you sign up for the cooking class?"}, {"w": "exercise", "m": "move your body to stay healthy", "ex": "My dad tries to exercise every morning."}, {"w": "you're all set", "m": "everything is ready for you now", "ex": "Here's your ticket. You're all set!"}, {"w": "a quick tour", "m": "a short walk to see a place", "ex": "The manager gave us a q {"s": "Elif", "t": "Not at all. It's D-E-M-I-R."}, {"s": "Tyler", "t": "Got it, Ms. Demir. So, what's the problem exactly?"}, {"s": "Elif", "t": "The internet stops every evening. It works for ten minutes, and then it stops again."}, {"s": "Tyler", "t": "I'm sorry about that. Can you see your router? It's a small box with lights."}, {"s": "Elif", "t": "Yes, it's next to my TV. One of the lights is red."}, {"s": "Tyler", "t": "Okay. Would you mind turning off the router for thirty seconds? Then turn it on again."}, {"s": "Elif", "t": "Sure. Just a moment... Okay, it's on again."}, {"s": "Tyler", "t": "Is the light green now?"}, {"s": "Elif", "t": "No, it's still red. Sorry!"}, {"s": "Tyler", "t": "Don't be sorry. It's not your fault. I think we need to send a technician."}, {"s": "Elif", "t": "Could the technician come this week, please? I have a video call with my mom on Thursday."}, {"s": "Tyler", "t": "Let me check. Could you be home on Wednesday morning?"}, {"s": "Elif", "t": "I'm afraid not. I'm at work until five thirty. Would you mind checking for an evening time?"}, {"s": "Tyler", "t": "No problem. How about Wednesday at six?"}, {"s": "Elif", "t": "That works. Can I ask one more question? Do I have to pay for the visit?"}, {"s": "Tyler", "t": "No, you don't. The visit is free."}, {"s": "Elif", "t": "Great. Could you send me a text with the time, please?"}, {"s": "Tyler", "t": "Of course. You'll get a text in a few minutes. Is there anything else?"}, {"s": "Elif", "t": "No, that's all. Thank you for your help, Tyler."}, {"s": "Tyler", "t": "You're welcome, Ms. Demir. Have a good evening!"}], "mcq": [{"q": "What is Elif's problem?", "options": ["Her TV doesn't work.", "Her internet stops every evening.", "Her phone is broken."], "answer": 1}, {"q": "What does Tyler ask her to do with the router?", "options": ["turn it off and on again", "move it to another room", "send it back"], "answer": 0}, {"q": "When will the technician come?", "options": ["Wednesday morning", "Thursday at five thirty", "Wednesday at six"], "answer": 2}, {"q": "Why does Elif want the internet to work this week?", "options": ["She has a video call with her mom.", "She works from home.", "Dan needs to use it."], "answer": 0}], "gaps": [{"line": 4, "answer": "spelling"}, {"line": 10, "answer": "turning off"}, {"line": 11, "answer": "Just a moment"}, {"line": 14, "answer": "technician"}, {"line": 17, "answer": "checking"}, {"line": 19, "answer": "That works"}]}, "vocab": [{"w": "technician", "m": "a worker who fixes machines or equipment", "ex": "The technician fixed our printer in ten minutes."}, {"w": "turn off", "m": "stop a machine or light with a button", "ex": "Please turn off the lights when you leave."}, {"w": "Just a moment", "m": "please wait a short time", "ex": "Just a moment, I'm looking for my keys."}, {"w": "It's not your fault", "m": "you didn't do anything wrong", "ex": "Don't worry, it's not your fault. The bus was late."}, {"w": "That works", "m": "that time or plan is good for me", "ex": "Friday at noon? That works for me."}, {"w": "a favor", "m": "something kind you do to help someone", "ex": "Could you do me a favor and close the door?"}, {"w": "bother", "m": "take someone's time or make them a little annoyed", "ex": "Sorry to bother you, but is this seat free?"}, {"w": "come over", "m": "visit someone's home", "ex": "Do you want to come over for dinner on Friday?"}], "grammar": {"title": "Polite requests: can, could, would you mind + -ing", "points": ["Can you...? is friendly and informal. Could you...? is more polite.", "Would you mind + verb-ing? is very polite: Would you mind waiting?", "To say yes to Would you mind...?, answer: No, not at all.", "Ask for permission with Can I...? or Could I...?: Could I use your phone?"], "examples": [{"en": "Can you help me with this box?", "note": "friendly"}, {"en": "Could you send me a text, please?", "note": "more polite"}, {"en": "Would you mind spelling your name?", "note": "mind + -ing"
