we're": "biz ...-iz (we are)", "weekend": "hafta sonu", "weren't": "değildin (were not)", "what": "ne", "when": "-dığında / ne zaman", "why": "neden", "with": "ile, birlikte", "work": "iş", "working": "çalışıyoruz (work: çalışmak)", "yes": "evet", "you": "sen / sana", "you're": "sen ...-sin (you are)", "your": "senin / sizin"}}, "speaking": {"prompt": "What are your plans for this weekend? Talk about what you are doing and when.", "steps": ["say what you're doing on Saturday", "say what you're doing on Sunday", "say one thing you're not doing, and why"], "starters": ["On Saturday morning, I'm ...", "In the afternoon, I'm meeting ...", "On Sunday, I'm ...", "I'm not ... this weekend because ..."], "model": "This weekend is busy for me. On Saturday morning, I'm going to the gym with my sister. In the afternoon, I'm meeting an old friend for coffee. We're trying a new café downtown. In the evening, I'm cooking dinner for my parents. On Sunday, I'm not doing much. I'm staying home and reading a book. I'm not working this weekend, because I worked late every day this week. I really need some rest!"}, "writing": {"prompt": "A friend wants to meet this week. Write a message about your plans and suggest a free day.", "length": "50-80 words", "checklist": ["Use the present continuous for at least three plans.", "Give a day or time for each plan.", "Suggest one free day."], "model": "Hi Mia! I'd love to meet, but this week is crazy. On Monday, I'm working late because we have a deadline. On Tuesday evening, I'm taking my mom to the doctor. On Wednesday, I'm having dinner with my coworkers. But I'm not doing anything on Thursday! Are you free after six? We can try the new pizza place near the park. Let me know!\nJen"}, "audio": {"listen": "audio/w4d5-listen.mp3", "listenT": [[0.3, 3.88], [4.33, 7.88], [8.33, 11.29], [11.74, 14.79], [15.24, 18.48], [18.93, 23.31], [23.76, 26.68], [27.13, 28.64], [29.09, 31.21], [31.66, 36.56], [37.01, 38.27], [38.72, 40.02], [40.47, 44.23], [44.68, 49.99], [50.44, 53.38], [53.83, 57.57], [58.02, 59.68], [60.13, 62.29], [62.74, 67.75], [68.2, 73.43], [73.88, 76.07], [76.52, 79.38], [79.83, 83.29], [83.74, 86.79], [87.24, 88.99]], "read": "audio/w4d5-read.mp3", "speak": "audio/w4d5-speak.mp3", "vocab": "audio/w4d5-vocab.mp3", "vocabT": [[0.3, 1.35, 1.95, 4.1], [5.0, 5.98, 6.58, 8.33], [9.23, 10.25, 10.85, 12.99], [13.89, 15.02, 15.62, 17.47], [18.37, 19.42, 20.02, 21.83], [22.73, 23.99, 24.59, 27.13], [28.03, 28.99, 29.59, 31.51], [32.41, 33.41, 34.01, 36.55]]}}, {"day": 6, "dayName": "Saturday", "title": "Surprise!", "goals": ["I can talk about feelings at a party.", "I can use -ed and -ing adjectives correctly.", "I can say thank you for a surprise."], "listening": {"title": "A birthday brunch", "intro": "On Saturday morning, Elif arrives at the café on the corner to meet Sam for brunch.", "speakers": {"Elif": "female", "Sam": "male", "Maria": "female"}, "lines": [{"s": "Sam", "t": "Elif! Over here!"}, {"s": "Elif", "t": "Hi, Sam! Oh, Maria, you're here too! And... wait, why is the whole team here?"}, {"s": "Sam", "t": "Surprise! Happy birthday, Elif!"}, {"s": "Elif", "t": "What? How did you know? I'm so surprised!"}, {"s": "Maria", "t": "Don't look at me! I didn't tell anyone. I promised."}, {"s": "Sam", "t": "It's true. She just said, \"Let's all have brunch on Saturday. I'm bringing a cake.\""}, {"s": "Elif", "t": "A cake? Maria!"}, {"s": "Maria", "t": "Well, a promise is a promise. But I didn't promise \"no cake\"!"}, {"s": "Elif", "t": "Ha! This is amazing. I don't know what to say."}, {"s": "Sam", "t": "Here it is. It's chocolate. I hope you're not disappointed. It's not baklava!"}, {"s": "Elif", "t": "Disappointed? I love chocolate cake!"}, {"s": "Maria", "t": "Make a wish, Elif, and blow out the candles."}, {"s": "Elif", "t": "OK... Oh no, everyone is singing! This is a little embarrassing."}, {"s": "Sam", "t": "Don't be embarrassed. We sing badly for everyone!"}, {"s": "Maria", "t": "So, how do you feel? It's your first birthday in Chicago!"}, {"s": "Elif", "t": "Honestly, I was worried about today. I thought it was going to be boring."}, {"s": "Sam", "t": "Boring? With us? Never!"}, {"s": "Elif", "t": "My mom called this morning, and I felt a little sad. But now I'm so excited."}, {"s": "Maria", "t": "This week was tiring, so we all needed a party."}, {"s": "Sam", "t": "Yes! Last night was exhausting. I was so tired."}, {"s": "Elif", "t": "But the posters are finished. And this cake is delicious."}, {"s": "Maria", "t": "Oh, and here's a card from the whole team."}, {"s": "Elif", "t": "Thank you! Wait, it says, \"To the most interesting assistant in Chicago.\""}, {"s": "Sam", "t": "That was my idea. You're never boring!"}, {"s": "Elif", "t": "You're all so kind. I'm really happy I came to Chicago."}, {"s": "Maria", "t": "We're happy too. Now, who wants the first piece?"}, {"s": "Sam", "t": "Me! I'm very interested in that big one."}], "mcq": [{"q": "What did Maria say to the team?", "options": ["\"It's Elif's birthday on Saturday.\"", "\"Let's all have brunch on Saturday. I'm bringing a cake.\"", "\"Elif is leaving the company.\""], "answer": 1}, {"q": "What kind of cake is it?", "options": ["chocolate", "baklava", "lemon"], "answer": 0}, {"q": "How did Elif feel this morning?", "options": ["excited", "a little sad", "angry"], "answer": 1}, {"q": "What does the card say?", "options": ["To the most interesting assistant in Chicago", "To the best cook in Chicago", "Happy first month in Chicago"], "answer": 0}], "gaps": [{"line": 3, "answer": "so surprised"}, {"line": 9, "answer": "disappointed"}, {"line": 12, "answer": "embarrassing"}, {"line": 15, "answer": "boring"}, {"line": 18, "answer": "tiring"}, {"line": 22, "answer": "interesting"}]}, "vocab": [{"w": "Surprise!", "m": "what people shout at a secret party", "ex": "When she opened the door, we all shouted, \"Surprise!\""}, {"w": "a promise is a promise", "m": "you must do what you promised", "ex": "I said I'd help you move, and a promise is a promise."}, {"w": "Make a wish", "m": "think of something you really want", "ex": "It's your birthday. Close your eyes and make a wish!"}, {"w": "blow out the candles", "m": "stop the small fires on a cake with your breath", "ex": "Now blow out the candles!"}, {"w": "embarrassing", "m": "making you feel shy or silly in front of people", "ex": "I fell on the bus. It was so embarrassing!"}, {"w": "exhausting", "m": "making you very, very tired", "ex": "Moving to a new apartment is exhausting."}, {"w": "Honestly", "m": "to tell the truth", "ex": "Honestly, I don't like coffee very much."}, {"w": "piece", "m": "one part of something, like cake", "ex": "Can I have a piece of cake?"}], "grammar": {"title": "Adjectives with -ed and -ing", "points": ["-ed adjectives describe how a person feels: I'm bored. She's surprised.", "-ing adjectives describe the thing that causes the feeling: The movie is boring.", "Common pairs: tired / tiring, excited / exciting, interested / interesting, embarrassed / embarrassing.", "Be careful: \"I'm boring\" means other people think you are boring!"], "examples": [{"en": "The meeting was boring, so I was bored.", "note": "thing -ing, person -ed"}, {"en": "I'm so excited about the trip.", "note": "a feeling"}, {"en": "Friday was a tiring day.", "note": "the day made me tired"}, {"en": "Are you interested in art?", "note": "interested in + noun"}], "tr": "Kişi için -ed (I'm bored = sıkıldım), şey için -ing (it's boring = sıkıcı).", "exercises": [{"type": "choice", "q": "The movie was so long and ___.", "options": ["bored", "boring"], "answer": 1, "why": "The movie causes the feeling: -ing."}, {"type": "choice", "q": "I'm ___ in learning Spanish.", "options": ["interested", "interesting"], "answer": 0, "why": "It's how I feel: -ed. Interested in + noun."}, {"type": "choice", "q": "We were all ___ when we heard the good news.", "options": ["excited", "exciting"], "answer": 0, "why": "It's how people feel: -ed."}, {"type": "choice", "q": "Moving to a new city can be ___.", "options": ["tired", "tiring"], "answer": 1, "why": "Moving causes the feeling: -ing."}, {"type": "type", "q": "After the long walk, I felt really ___. (tire)", "answers": ["tired"], "why": "How I feel: -ed."}, {"type": "type", "q": "That was an ___ story! Tell me more. (interest)", "answers": ["interesting"], "why": "The story causes the feeling: -ing."}, {"type": "type", "q": "I fell in front of everyone. It was so ___. (embarrass)", "answers": ["embarrassing"], "why": "The situation causes the feeling: -ing."}, {"type": "type", "q": "She was ___ when she saw the cake. (surprise)", "answers": ["surprised"], "why": "How she felt: -ed."}]}, "reading": {"title": "My first Chicago birthday", "kind": "Elif's diary", "text": "Saturday night\n\nToday was my first birthday in Chicago, and it was amazing.\n\nThis morning I felt a little sad. Mom called at seven, and the whole family sang for me on video. I was happy to see them, but I was also homesick. I thought my day was going to be quiet and boring.\n\nThen I went to brunch with Sam. When I arrived at the café, the whole team was there! Everyone shouted, \"Surprise!\" I was so surprised that I almost dropped my bag.\n\nMaria brought a big chocolate cake. She didn't tell anyone about my birthday. She just ordered a cake! Everyone sang \"Happy Birthday\" very loudly, and people in the café looked at us. It was a little embarrassing, but it was fun.\n\nThe team gave me a card. Sam wrote the funniest message in it. Then we talked for three hours, and nobody talked about work. Not even Maria!\n\nWhen I got home, there was a small box outside my door. It was from Dan: a cookbook and a note. How did he know? I have no idea!\n\nThis week was tiring, but today was perfect. I'm tired now, but I'm very happy.", "questions": [{"q": "How did Elif feel in the morning?", "options": ["excited", "a little sad and homesick", "angry"], "answer": 1}, {"q": "What did everyone shout at the café?", "options": ["\"Happy New Year!\"", "\"Surprise!\"", "\"Welcome!\""], "answer": 1}, {"q": "Why was it a little embarrassing?", "options": ["Everyone sang loudly in the café.", "Elif dropped the cake.", "Elif forgot someone's name."], "answer": 0}, {"q": "What did Dan give Elif?", "options": ["a cake", "flowers", "a cookbook and a note"], "answer": 2}], "tf": [{"s": "Maria told everyone about Elif's birthday.", "answer": false}, {"s": "Elif's family sang for her on video.", "answer": true}, {"s": "The team talked about work for three hours.", "answer": false}], "gloss": {"a": "bir", "about": "hakkında / -i (tell about)", "almost": "neredeyse", "also": "aynı zamanda, de", "amazing": "harika, muhteşem", "and": "ve", "anyone": "hiç kimseye", "arrived": "vardım (arrive: varmak)", "at": "-de / -e (at seven: yedide; look at: bakmak)", "bag": "çanta", "be": "olmak", "big": "büyük", "birthday": "doğum günü", "boring": "sıkıcı", "box": "kutu", "brought": "getirdi (bring: getirmek)", "brunch": "brunch (geç kahvaltı)", "but": "ama", "caf": "kafe (café)", "cake": "pasta", "called": "aradı (call: aramak)", "card": "kart", "chicago": "Chicago (şehir)", "chocolate": "çikolatalı", "cookbook": "yemek kitabı", "dan": "Dan (isim)", "day": "gün", "did": "soru yardımcı fiili (geçmiş)", "didn't": "-medi (did not)", "door": "kapı", "dropped": "düşürüyordum (drop: düşürmek)", "embarrassing": "utandırıcı", "even": "bile (not even: ... bile değil)", "everyone": "herkes", "family": "aile", "felt": "hissettim (feel: hissetmek)", "first": "ilk", "for": "için / boyunca (for three hours)", "from": "-den (gelen)", "fun": "eğlenceli", "funniest": "en komik", "gave": "verdi (give: vermek)", "going": "(was going to: -ecekti)", "got": "geldim (get home: eve varmak)", "happy": "mutlu", "have": "(have no idea: hiç bilmiyorum)", "he": "o (erkek)", "home": "eve", "homesick": "evimi özlemiş, memleket hasreti", "hours": "saat", "how": "nasıl", "i": "ben", "i'm": "ben ...-im (I am)", "i use ...", "The only embarrassing part was ..."], "model": "I remember my twenty-fifth birthday very well. My friends told me we were going to a quiet dinner, but it was a surprise party! When I opened the door, everyone shouted \"Surprise!\" I was so surprised that I started laughing. The party was amazing, and the music was really exciting. The only embarrassing part was the singing, because my uncle sang very loudly. At the end of the night, I was tired but very happy. It's still my favorite birthday."}, "writing": {"prompt": "Write a short thank-you message to friends or coworkers after a birthday or party.", "length": "50-80 words", "checklist": ["Say thank you and say what you liked.", "Use at least two -ed adjectives (surprised, excited ...).", "Use at least two -ing adjectives (amazing, interesting ...)."], "model": "Hi everyone,\n\nThank you so much for yesterday! I was really surprised when I saw you all at the restaurant. The food was amazing, and the cake was delicious. I was a little embarrassed when you sang so loudly, but it was a lot of fun. After a tiring week, it was the perfect evening. I'm so lucky to work with you!\n\nLove,\nKate"}, "partner": {"questions": ["What will you do to improve your English this month? Make three promises with I'll.", "Describe a person who is important in your life and a thing that you use every day.", "Think of something a coworker or family member said to you this week. Report it with said or told.", "You're ordering lunch for five people. What would you like to get? Would you rather pick it up or have it delivered?", "What are you doing this weekend? Talk about three plans with days or times.", "When did you last feel really excited? What was the most boring part of your week?"], "roleplay": "Imagine you are calling a restaurant to order lunch for your team. Play both parts and record yourself. As the worker, ask: \"What would you like?\" and \"Would you rather pick it up?\" As the customer, order a few sandwiches an , "options": ["bored", "boring", "bore"], "answer": 1, "why": "The meeting causes the feeling: -ing."}, {"q": "\"I found a mistake in the report.\" \"Good ___!\"", "options": ["catch", "hold", "drop"], "answer": 0, "why": "Good catch = well done, you found a mistake."}, {"q": "Sorry, I can't talk now. I'm in a ___.", "options": ["hurry", "fast", "quick"], "answer": 0, "why": "The phrase is \"in a hurry\" = busy, with no time."}], "reflection": ["Which work email or message from this week can you now write in English?", "What promise will you make for your English next week? Use I'll.", "What surprised you most this week, and how did you feel?"]}}, {"week": 5, "title": "Out and about", "days": [{"day": 1, "dayName": "Monday", "title": "Just a cold", "goals": ["I can describe a cold at the pharmacy.", "I can ask for and understand simple advice.", "I can use if + present, will for results."], "listening": {"title": "At the pharmacy", "intro": "After work, Elif goes to the pharmacy near her apartment and talks to Rachel, the pharmacist.", "speakers": {"Elif": "female", "Rachel": "female"}, "lines": [{"s": "Rachel", "t": "Hi there. How can I help you?"}, {"s": "Elif", "t": "Hi. I have a bad cold. My nose is runny, and I can't stop sneezing."}, {"s": "Rachel", "t": "Oh, you poor thing. Do you have a fever?"}, {"s": "Elif", "t": "No, I don't think so. But my throat hurts a little."}, {"s": "Rachel", "t": "Okay. Are you taking any other medicine right now?"}, {"s": "Elif", "t": "No, nothing. Can you recommend something?"}, {"s": "Rachel", "t": "Sure. This one is for the night. If you take it before bed, you'll sleep better."}, {"s": "Elif", "t": "Great. Can I take it in the morning too?"}, {"s": "Rachel", "t": "No, it will make you sleepy at work. So take the day medicine in the morning. It's in the blue box."}, {"s": "Elif", "t": "The blue box for the day, and the other one for the night. Got it."}, {"s": "Rachel", "t": "And for your throat, try these cough drops. They taste like honey."}, {"s": "Elif", "t": "Honey? Perfect. In Turkey, we drink tea with honey when we're sick."}, {"s": "Rachel", "t": "That's a good idea too. If you drink a lot of warm drinks, your throat will feel better."}, {"s": "Elif", "t": "I have a lot of work this week. Should I stay home tomorrow?"}, {"s": "Rachel", "t": "If you feel very tired, you should rest. Can you work from home?"}, {"s": "Elif", "t": "Maybe. I'll ask my manager. She won't be happy if the whole office gets sick!"}, {"s": "Rachel", "t": "Ha! True. Wash your hands often, and you won't give it to anyone."}, {"s": "Elif", "t": "How long will it last?"}, {"s": "Rachel", "t": "A cold usually lasts about a week. But if you get a fever, call your doctor."}, {"s": "Elif", "t": "Okay. I'll call Doctor Brown if it gets worse."}, {"s": "Rachel", "t": "Good. So that's the night medicine, the day medicine and the cough drops. That's sixteen dollars and fifty cents."}, {"s": "Elif", "t": "Here's twenty dollars."}, {"s": "Rachel", "t": "And here's your change. Feel better soon!"}, {"s": "Elif", "t": "Thank you! If I feel better by Friday, I'll come back and say thanks."}], "mcq": [{"q": "What is Elif's problem?", "options": ["She has a bad cold.", "She hurt her foot.", "She can't sleep at all."], "answer": 0}, {"q": "When should Elif take the medicine in the blue box?", "options": ["at night", "in the morning", "after dinner"], "answer": 1}, {"q": "What does Rachel say about warm drinks?", "options": ["They will help her throat.", "They will make her sleepy.", "She shouldn't drink them."], "answer": 0}, {"q": "What does Elif buy?", "options": ["only cough drops", "tea and honey", "day and night medicine and cough drops"], "answer": 2}], "gaps": [{"line": 1, "answer": "a bad cold"}, {"line": 5, "answer": "recommend"}, {"line": 10, "answer": "cough drops"}, {"line": 12, "answer": "will feel"}, {"line": 15, "answer": "gets"}, {"line": 19, "answer": "gets worse"}]}, "vocab": [{"w": "a bad cold", "m": "a strong cold that makes you feel ill", "ex": "I can't come today because I have a bad cold."}, {"w": "recommend", "m": "say that something is good to try", "ex": "Can you recommend a good restaurant near here?"}, {"w": "make you sleepy", "m": "make you want to sleep", "ex": "A big lunch can make you sleepy in the afternoon."}, {"w": "cough drops", "m": "small sweets that help your throat", "ex": "I always keep cough drops in my bag in winter."}, {"w": "work from home", "m": "do your job at home, not at the office", "ex": "Can you work from home on Fridays?"}, {"w": "get worse", "m": "become more serious", "ex": "Call the doctor if your cough starts to get worse."}, {"w": "change", "m": "money you get back after you pay", "ex": "The coffee was three dollars, so I got two dollars in change."}, {"w": "Feel better soon!", "m": "I hope you are well again soon", "ex": "Sorry you're sick. Feel better soon!"}], "grammar": {"title": "First conditional: if + present, will", "points": ["Use if + present simple for a possible situation in the future: If you take this medicine...", "Use will / won't + verb for the result: ...you'll sleep better.", "Don't use will after if: If it rains, not If it will rain.", "You can put the if part second. Then don't use a comma."], "examples": [{"en": "If you drink warm tea, your throat will feel better.", "note": "if + present, will + verb"}, {"en": "If I don't feel better, I'll call the doctor.", "note": "negative in the if part"}, {"en": "Maria won't be happy if everyone gets sick.", "note": "if part second, no comma"}], "tr": "Türkçede 'yağacaksa' değil 'yağarsa' deriz. İngilizcede de if'ten sonra will gelmez: 'If it rains' doğru.", "exercises": [{"type": "choice", "q": "If you ___ this medicine at night, you'll sleep better.", "options": ["take", "will take", "took"], "answer": 0, "why": "After if, use the present simple."}, {"type": "choice", "q": "If it snows tomorrow, I ___ the bus to work.", "options": ["take", "will take", "took"], "answ st in case."}, {"s": "Elif", "t": "Yes, I checked it on my laptop this morning. Everything is fine."}, {"s": "Marcus", "t": "Good news! Is this yours? A black phone with a green case."}, {"s": "Elif", "t": "Yes! That's my phone! Thank you so much!"}, {"s": "Marcus", "t": "A driver found it under a seat at ten o'clock. Can you unlock it for me, please?"}, {"s": "Elif", "t": "Sure. There. Oh no, I have fourteen missed calls."}, {"s": "Sam", "t": "Ten of them are from me!"}, {"s": "Elif", "t": "And four are from my mom. She's probably really worried."}, {"s": "Marcus", "t": "Then you should call her back right away."}, {"s": "Elif", "t": "I will. Do I need to sign anything?"}, {"s": "Marcus", "t": "Yes, just sign here, please. Have a good day!"}, {"s": "Sam", "t": "See? It's your lucky day. Now you have to buy me lunch."}, {"s": "Elif", "t": "Deal! I've learned my lesson. From now on, my phone stays in my pocket."}], "mcq": [{"q": "Where did Elif lose her phone?", "options": ["at the office", "on the bus", "at a restaurant"], "answer": 1}, {"q": "What does Elif's phone look like?", "options": ["black with a green case", "red with a black case", "green with a photo of a tree"], "answer": 0}, {"q": "Who found the phone?", "options": ["Sam", "a bus driver", "Marcus"], "answer": 1}, {"q": "Who called Elif four times?", "options": ["Sam", "Maria", "her mom"], "answer": 2}], "gaps": [{"line": 1, "answer": "lost"}, {"line": 3, "answer": "got on"}, {"line": 6, "answer": "answered"}, {"line": 10, "answer": "received"}, {"line": 17, "answer": "found"}, {"line": 25, "answer": "learned my lesson"}]}, "vocab": [{"w": "lost-and-found", "m": "a place where people keep lost things", "ex": "I left my umbrella on the train, so I went to the lost-and-found."}, {"w": "get on", "m": "enter a bus, train or plane", "ex": "Please get on the train quickly. It's leaving!"}, {"w": "notice", "m": "see or feel something for the first time", "ex": "Did you notice the new picture in the hall?"}, {"w": "What does it look like?", "m": "Describe it, please. How does it look?", "ex": "You have a new car? What does it look like?"}, {"w": "just in case", "m": "because maybe something will happen", "ex": "Take a jacket, just in case it gets cold."}, {"w": "missed calls", "m": "phone calls you didn't answer", "ex": "I had three missed calls from my boss after the movie."}, {"w": "call back", "m": "phone someone who called you before", "ex": "She wasn't home, so I left a message and asked her to call back."}, {"w": "learn my lesson", "m": "understand a mistake and not do it again", "ex": "I missed the bus again. I hope I learn my lesson this time!"}], "grammar": {"title": "Past simple vs present perfect", "points": ["Use the past simple with a finished time: yesterday, at ten o'clock, last week, two days ago.", "Use the present perfect for life experiences with no exact time: I've never lost a phone.", "Use the present perfect with since, for and unfinished times like today or this week.", "When you give details like when or where, change to the past simple."], "examples": [{"en": "I've lost my phone twice this year.", "note": "this year is not finished"}, {"en": "I lost it on the bus yesterday.", "note": "yesterday = finished time"}, {"en": "Have you ever been to Izmir? Yes, I went there last year.", "note": "experience, then details"}, {"en": "My mom has called me four times since this morning.", "note": "since = present perfect"}], "tr": "'Kaybettim' hem 'I lost' hem 'I've lost' olabilir. Zaman söylüyorsanız (yesterday) past simple kullanın.", "exercises": [{"type": "choice", "q": "I ___ my phone on the bus yesterday.", "options": ["left", "have left"], "answer": 0, "why": "Yesterday is a finished time: past simple."}, {"type": "choice", "q": "___ you ever lost your keys?", "options": ["Did", "Have", "Are"], "answer": 1, "why": "Ever + past participle (lost): present perfect."}, {"type": "choice", "q": "We ___ in this apartment since 2021.", "options": ["lived", "have lived", "live"], "answer": 1, "why": "Since + a time until now: present perfect."}, {"type": "choice", "q": "A driver ___ the phone under a seat at ten o'clock.", "options": ["found", "has found"], "answer": 0, "why": "At ten o'clock is a finished time: past simple."}, {"type": "type", "q": "My mom ___ me five times since this morning. (call)", "answers": ["has called", "'s called"], "why": "Since this morning, until now: has + past participle."}, {"type": "type", "q": "Elif ___ her phone at lunchtime. (find)", "answers": ["found"], "why": "An exact past time: past simple. Find → found."}, {"type": "type", "q": "I ___ to Canada, but I'd like to go. (never / be)", "answers": ["have never been", "'ve never been"], "why": "Life experience with never: have never been."}, {"type": "type", "q": "Last summer we ___ to the beach every weekend. (go)", "answers": ["went"], "why": "Last summer is finished: past simple. Go → went."}]}, "reading": {"title": "A lucky day", "kind": "Elif's diary", "text": "Tuesday night\n\nWhat a day! This morning I left my phone on the number 12 bus. I've never lost a phone in my life, so I didn't know what to do. I felt terrible all morning.\n\nSam was great. He let me use his phone, and he called my number again and again. Nobody answered. At lunch, he came with me to the lost-and-found office. A man named Marcus checked a big box of phones, and suddenly, there it was! A driver found it under a seat at ten o'clock.\n\nWhen I unlocked it, I saw fourteen missed calls. Ten were from Sam, and four were from my mom. I called her back right away. \"I've called you four times!\" she said. I told her the whole story, and at the end, she laughed.\n\nSo I've learned two things today. First, there are a lot of honest people in Chicago. Second, my phone stays in my pocket from now on.\n\nTomorrow I'm buying Sam lunch. He has helped me so much since my first day at work, and I haven't really thanked him yet.", "questions": [{"q": "How did Elif feel in the morning?", "options": ["terrible", "excited", "angry with Sam"], "answer": 0}, {"q": "How did Sam help Elif?", "options": ["He drove her to the bus station.", "He called her number and went to the office with her.", "He bought her a new phone."], "answer": 1}, {"q": "What did Elif's mom do at the end of the call?", "options": ["She cried.", "She got angry.", "She laughed."], "answer": 2}, {"q": "What is Elif going to do tomorrow?", "options": ["buy a new phone", "buy Sam lunch", "visit her mom"], "answer": 1}], "tf": [{"s": "Elif has lost a phone many times before.", "answer": false}, {"s": "Marcus found the phone under a seat.", "answer": false}, {"s": "Elif thinks there are many honest people in Chicago.", "answer": true}], "gloss": {"a": "bir", "again": "tekrar (again and again: defalarca)", "all": "bütün (all morning: bütün sabah)", "and": "ve", "answered": "cevap verdi, açtı (answer: cevap vermek)", "are": "there are: ... var", "at": "-de (at lunch: öğle yemeğinde)", "away": "right away: hemen", "back": "geri (call back: geri aramak)", "big": "büyük", "box": "kutu", "bus": "otobüs", "buying": "ısmarlayacağım (buy: satın almak)", "called": "aradı / aradım (call: aramak)", "calls": "aramalar (missed calls: cevapsız aramalar)", "came": "geldi (come: gelmek)", "checked": "kontrol etti, baktı (check: kontrol etmek)", "chicago": "Chicago (şehir)", "day": "gün", "didn't": "-medim (did not); didn't know: bilmiyordum", "do": "yapmak (what to do: ne yapacağımı)", "driver": "şoför", "end": "son (at the end: sonunda)", "felt": "hissettim (feel: hissetmek)", "first": "birincisi; ilk (first day: ilk gün)", "found": "buldu (find: bulmak); lost-and-found: kayıp eşya", "four": "dört", "fourteen": "on dört", "from": "-den (from Sam: Sam'den; from now on: bundan sonra)", "great": "harika", "has": "has helped: yardım etti (have: yardımcı fiil)", "haven't": "-medim (have not); haven't thanked: teşekkür etmedim", "he": "o (erkek)", "helped": "yardım etti (help: yardım etmek)", "her": "onu, ona (kadın)", "him": "ona, onu (erkek)", "his": "onun (erkek)", "honest": "dürüst", "i": "ben", "i'm": "ben ...-im (I am); I'm buying: ısmarlayacağım", "i've": "ben ...-dim (I have); I've never lost: hiç kaybetmedim", "in": "-de (in my life: hayatımda; in Chicago: Chicago'da)", "it": "onu, o", "know": "bilmek", "laughed": "güldü (laugh: gülmek)", "learned": "öğrendim (learn: öğrenmek)", "left": "unuttum, bıraktım (leave: bırakmak)", "let": "izin verdi (let: izin vermek)", "life": "hayat", "lost": "kaybettim (lose: kaybetmek); lost-and-found: kayıp eşya", "lot": "a lot of: çok, bir sürü", "lunch": "öğle yemeği", "man": "adam", "marcus": "Marcus (isim)", "me": "bana, beni", "missed": "cevapsız (missed calls: cevapsız aramalar)", "mom": "annem", "morning": "sabah", "much": "çok (so much: o kadar çok)", "my": "benim", "named": "adında", "never": "hiç, asla", "night": "gece", "nobody": "kimse", "now": "şimdi (from now on: bundan sonra)", "number": "numara (number 12 bus: 12 numaralı otobüs)", "o'clock": "saat (ten o'clock: saat on)", "of": "a box of phones: bir kutu telefon; a lot of: çok", "office": "büro, ofis", "on": "-de (on the bus: otobüste); from now on: bundan sonra", "people": "insanlar", "phone": "telefon", "phones": "telefonlar", "pocket": "cep", "really": "gerçekten, tam olarak", "right": "right away: hemen", "said": "dedi (say: demek)", "sam": "Sam (isim)", "saw": "gördüm (see: görmek)", "seat": "koltuk", "second": "ikincisi", "she": "o (kadın)", "since": "-den beri", "so": "bu yüzden; o kadar (so much: o kadar çok)", "stays": "kalacak (stay: kalmak)", "story": "hikâye", "suddenly": "aniden, birden", "ten": "on", "terrible": "berbat, çok kötü", "thanked": "teşekkür ettim (thank: teşekkür etmek)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "there": "there it was: işte oradaydı; there are: var", "things": "şeyler", "this": "bu (this morning: bu sabah)", "times": "kez, kere", "to": "-e (to the office: büroya); -mek (what to do)", "today": "bugün", "told": "anlattım (tell: anlatmak)", "tomorrow": "yarın", "tuesday": "salı", "two": "iki", "under": "altında", "unlocked": "kilidini açtım (unlock: kilidini açmak)", "use": "kullanmak", "was": "-di / idi (was great: harikaydı)", "were": "-di (were from Sam: Sam'dendi)", "what": "ne (What a day!: Ne gün ama!)", "when": "-ince, -diğinde", "whole": "bütün", "with": "ile (with me: benimle)", "work": "iş (at work: işte)", "yet": "henüz", "you": "seni"}}, "speaking": {"prompt": "Have you ever lost something important? What happened?", "steps": ["say what you have lost (present perfect)", "say when and where it happened (past simple)", "say how the story ended"], "starters": ["I've lost ... a few times.", "Once, I lost my ... at/on ...", "I looked for it ...", "In the end, ..."], "model": "I've lost a lot of small things in my life, like keys and umbrellas. But I've only lost something important once. Two years ago, I left my wallet in a taxi. I noticed it when I got home, and I felt sick. I called the taxi company right away, but nobody answered. The next morning, the driver called me. He found my wallet and brought it to my house. Nothing was missing! I've never forgotten that kind man."}, "writing": {"prompt": "You left your bag on a train. Write a short email to the lost-and-found office. Describe the bag and say when you lost it.", "length": "50-80 words", "checklist": ["Start with I've lost ... .", "Say when and where in the past simple.", "Describe the bag and give your phone number."], "model": "Hello,\n\nI've lost my bag, and I think I left it on the train. I took the 6:30 train from downtown yesterday evening, and I got off at Park Street. It's a small brown bag with a long strap. There's a blue notebook and a black umbrella in it. Has anyone found it? Please call me at the number below.\n\nThank you,\nPaula Smith"}, "audio": {"listen": "audio/w5d2-listen.mp3", "listenT": [[0.3, 2.11], [2.56, 6.79], [7.24, 9.03], [9.48, 12.49], [12.94, 14.11], [14.56, 18.23], [18.68, 22.8], [23.25, 26.15], [26.6, 31.01], [31.46, 35.26], [35.71, 39.47], [39.92, 42.92], [43.37, 46.51], [46.96, 49.69], [50.14, 54.05], [54.5, 57.76], [58.21, 60.51], [60.96, 65.91], [66.36, 69.18], [69.63, 70.93], [71.38, 74.71], [75.16, 76.97], [77.42, 79.58], [80.03, 82.33], [82.78, 85.64], [86.09, 90.46]], "read": "audio/w5d2-read.mp3", "speak": "audio/w5d2-speak.mp3", "vocab": "audio/w5d2-vocab.mp3", "vocabT": [[0.3, 1.62, 2.22, 6.17], [7.07, 7.97, 8.57, 11.21], [12.11, 13.13, 13.73, 15.85], [16.75, 18.07, 18.67, 21.02], [21.92, 23.2, 23.8, 26.46], [27.36, 28.39, 28.99, 31.97], [32.87, 33.9, 34.5, 38.23], [39.13, 40.41, 41.01, 44.57]]}}, {"day": 3, "dayName": "Wednesday", "title": "Story time", "goals": ["I can talk about things I like and don't like doing.", "I can talk to children in a friendly way.", "I can use verbs + -ing (enjoy, love, hate, don't mind)."], "listening": {"title": "Story time at the library", "intro": "On Wednesday evening, Elif volunteers at the neighborhood library. She talks to Helen, the librarian, and Ava, a little girl.", "speakers": {"Elif": "female", "Helen": "female", "Ava": "female"}, "lines": [{"s": "Helen", "t": "Elif, welcome! Thank you for volunteering with us."}, {"s": "Elif", "t": "Thanks for having me. I saw your sign on the door last week, and I wanted to help."}, {"s": "Helen", "t": "Wonderful. Do you enjoy reading to children?"}, {"s": "Elif", "t": "Yes, I love it. In Izmir, I often read to my friends' kids."}, {"s": "Helen", "t": "Perfect. Story time starts at six thirty, and it lasts about forty minutes."}, {"s": "Elif", "t": "How many kids usually come?"}, {"s": "Helen", "t": "About ten. Some of them don't like sitting still, so it can get noisy."}, {"s": "Elif", "t": "I don't mind noise. I grew up in a big, noisy family!"}, {"s": "Helen", "t": "Great. Here's today's book. It's about a bear who hates sleeping in winter."}, {"s": "Elif", "t": "Ha! I understand him. I hate getting up when it's cold and dark."}, {"s": "Helen", "t": "Okay, kids, this is Miss Elif. She's going to read to you today."}, {"s": "Ava", "t": "Hi! Why do you talk funny?"}, {"s": "Helen", "t": "Ava! That's not very polite."}, {"s": "Elif", "t": "It's okay. I'm from Turkey, so I have an accent. Do you know where Turkey is?"}, {"s": "Ava", "t": "No. Is it far?"}, {"s": "Elif", "t": "Very far. You have to take a long flight to get there."}, {"s": "Ava", "t": "I love flying! My grandma lives in Texas, and we fly there every summer."}, {"s": "Elif", "t": "Lucky you! And do you enjoy reading books, Ava?"}, {"s": "Ava", "t": "Yes, but I like listening to stories more."}, {"s": "Elif", "t": "Me too. Okay, everyone, are you ready? Once upon a time, there was a bear named Bruno."}, {"s": "Helen", "t": "That was great, Elif. The kids really enjoyed listening to you."}, {"s": "Ava", "t": "Can Miss Elif come back next Wednesday?"}, {"s": "Elif", "t": "I'd love to. I don't mind coming every week."}, {"s": "Helen", "t": "Then it's a deal. See you next Wednesday, Miss Elif!"}], "mcq": [{"q": "Why did Elif come to the library?", "options": ["She saw a sign and wanted to help.", "Maria asked her to go.", "She needed a book for work."], "answer": 0}, {"q": "What is today's book about?", "options": ["a girl who loves flying", "a bear who hates sleeping in winter", "a family in Turkey"], "answer": 1}, {"q": "Why does Ava think Elif talks funny?", "options": ["Elif reads too fast.", "Elif has an accent.", "Elif speaks very quietly."], "answer": 1}, {"q": "What will Elif do next week?", "options": ["fly to Texas", "come back for story time", "bring her friends' kids"], "answer": 1}], "gaps": [{"line": 0, "answer": "volunteering"}, {"line": 2, "answer": "reading to"}, {"line": 6, "answer": "sitting still"}, {"line": 8, "answer": "sleeping"}, {"line": 16, "answer": "flying"}, {"line": 20, "answer": "listening"}]}, "vocab": [{"w": "volunteer", "m": "work for free to help people", "ex": "My sister likes to volunteer at the animal shelter on weekends."}, {"w": "Thanks for having me.", "m": "thank you for inviting me here", "ex": "What a lovely dinner. Thanks for having me."}, {"w": "sit still", "m": "sit without moving", "ex": "My little brother can't sit still in the car."}, {"w": "get noisy", "m": "become loud", "ex": "The café can get noisy at lunchtime."}, {"w": "grow up", "m": "be a child and become an adult", "ex": "Where did you grow up?"}, {"w": "polite", "m": "kind and with good manners", "ex": "It's polite to say thank you."}, {"w": "accent", "m": "the way people from one place speak", "ex": "He speaks English with a beautiful Irish accent."}, {"w": "Lucky you!", "m": "You are lucky! (I'm a little jealous)", "ex": "You're going to Spain next week? Lucky you!"}], "grammar": {"title": "Verbs + -ing: like, love, enjoy, hate, don't mind", "points": ["After like, love, enjoy, hate and don't mind, use verb + -ing: I enjoy reading.", "Enjoy and don't mind always take -ing. Never say enjoy to read.", "Spelling: take → taking, sit → sitting, fly → flying.", "Don't mind = it's okay for me: I don't mind waiting."], "examples": [{"en": "The kids enjoy listening to stories.", "note": "enjoy + -ing"}, {"en": "I hate getting up when it's cold.", "note": "get → getting"}, {"en": "Ava loves flying.", "note": ""}, {"en": "I don't mind coming every week.", "note": "come → coming (drop e)"}], "exercises": [{"type": "choice", "q": "I really enjoy ___ to children.", "options": ["read", "reading", "to read"], "answer": 1, "why": "Enjoy is always followed by -ing."}, {"type": "choice", "q": "Ava doesn't like ___ still.", "options": ["sit", "sitting", "sits"], "answer": 1, "why": "Like + -ing; sit → sitting (double t)."}, {"type": "choice", "q": "I don't mind ___ late on Wednesdays.", "options": ["stay", "staying", "to stay"], "answer": 1, "why": "Don't mind is always followed by -ing."}, {"type": "choice", "q": "Elif hates ___ up early in winter.", "options": ["get", "getting", "gets"], "answer": 1, "why": "Hate + -ing; get → getting (double t)."}, {"type": "type", "q": "Dan really enjoys ___ for his friends. (cook)", "answers": ["cooking"], "why": "Enjoy + -ing."}, {"type": "type", "q": "Do you enjoy ___ new people? (meet)", "answers": ["meeting"], "why": "Enjoy + -ing."}, {"type": "type", "q": "Sam doesn't mind ___ for the bus. (wait)", "answers": ["waiting"], "why": "Don't mind + -ing."}, {"type": "type", "q": "I don't mind ___ the dishes after dinner. (do)", "answers": ["doing"], "why": "Don't mind + -ing: do → doing."}]}, "reading": {"title": "My new Wednesday job", "kind": "an email to a friend", "text": "Hi Deniz,\n\nGuess what? I'm a volunteer now! Last week I saw a sign on the door of our neighborhood library. They needed people for story time, so I wrote to them.\n\nTonight was my first time. The librarian, Helen, is really kind. She loves working with kids, and you can see it. Every Wednesday evening, about ten children come to listen to a story. Some of them don't like sitting still, so it can get noisy. But I don't mind. You know my family!\n\nA little girl named Ava asked me, \"Why do you talk funny?\" Everyone laughed, and I told her about Turkey. After that, she asked me a lot of questions. I think she enjoys asking questions as much as listening to stories!\n\nI really enjoyed reading to them. I usually hate speaking in front of people, but kids are different. They don't care about my accent. They only care about the story.\n\nHelen asked me to come every week, and I said yes. Now I'm practicing reading out loud at home, so Dan can probably hear me through the wall.\n\nHow's your new job? Write soon!\n\nLove,\nElif", "questions": [{"q": "How did Elif find out about story time?", "options": ["Dan told her.", "She saw a sign on the library door.", "She read about it online."], "answer": 1}, {"q": "How many children come to story time?", "options": ["about five", "about ten", "about twenty"], "answer": 1}, {"q": "Why does Elif like speaking to kids?", "options": ["They don't care about her accent.", "They are always quiet.", "They speak Turkish."], "answer": 0}, {"q": "What is Elif doing at home now?", "options": ["writing stories", "practicing reading out loud", "watching TV with Dan"], "answer": 1}], "tf": [{"s": "Helen enjoys working with children.", "answer": true}, {"s": "Elif usually loves speaking in front of people.", "answer": false}, {"s": "Elif is going to go to the library every week.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında; yaklaşık (about ten: yaklaşık on)", "accent": "aksan", "after": "-den sonra (after that: ondan sonra)", "and": "ve", "are": "-dir (kids are different: çocuklar farklıdır)", "as": "as much as: -diği kadar", "asked": "sordu; istedi (ask: sormak, rica etmek)", "asking": "sormak (asking questions: soru sormak)", "at": "-de (at home: evde)", "ava": "Ava (isim)", "but": "ama", "can": "-ebilmek (you can see it: belli oluyor)", "care": "önemsemek (care about: umursamak)", "children": "çocuklar", "come": "gelmek", "dan": "Dan (isim)", "deniz": "Deniz (isim)", "different": "farklı", "do": "soru yardımcı fiili (Why do you...?: Neden ...?)", "don't": "-mez / -mem (do not); I don't mind: dert etmem", "door": "kapı", "elif": "Elif (isim)", "enjoyed": "keyif aldım (enjoy: keyif almak)", "enjoys": "seviyor, hoşlanıyor (enjoy: keyif almak)", "evening": "akşam", "every": "her", "everyone": "herkes", "family": "aile", "first": "ilk (first time: ilk kez)", "for": "için", "front": "in front of: önünde", "funny": "tuhaf, garip (talk funny: tuhaf konuşmak)", "get": "olmak (get noisy: gürültülü olmak)", "girl": "kız", "guess": "tahmin etmek (Guess what?: Bil bakalım ne oldu?)", "hate": "nefret etmek", "hear": "duymak", "helen": "Helen (isim)", "her": "ona (kadın)", "hi": "merhaba", "home": "ev (at home: evde)", "how's": "nasıl gidiyor? (how is)", "i": "ben", "i'm": "ben ...-im (I am)", "in": "in front of: önünde (kalıp parçası)", "is": "-dir (to be)", "it": "onu, bu", "job": "iş", "kids": "çocuklar", "kind": "nazik", "know": "bilmek (You know my family!: Ailemi bilirsin!)", "last": "geçen (last week: geçen hafta)", "laughed": "güldü (laugh: gülmek)", "librarian": "kütüphaneci", "library": "kütüphane", "like": "sevmek, hoşlanmak", "listen": "dinlemek", "listening": "dinlemek (listening to stories: hikâye dinlemek)", "little": "küçük", "lot": "a lot of: çok, bir sürü", "loud": "out loud: yüksek sesle, sesli", "love": "sevgiler (mektup sonu)", "loves": "çok seviyor (love: sevmek)", "me": "bana", "mind": "aldırmak (I don't mind: dert etmem)", "much": "as much as: -diği kadar", "my": "benim", "named": "adında", "needed": "ihtiyaç duyuyordu (need: ihtiyacı olmak)", "neighborhood": "mahalle", "new": "yeni", "noisy": "gürültülü", "now": "artık, şimdi", "of": "-in (door of the library: kütüphanenin kapısı)", "on": "üzerinde (on the door: kapıda)", "only": "sadece", "our": "bizim", "out": "out loud: yüksek sesle (kalıp parçası)", "people": "insanlar", "practicing": "pratik yapıyorum (practice: pratik yapmak)", "probably": "muhtemelen", "questions": "sorular", "reading": "okumak (reading out loud: sesli okumak)", "really": "gerçekten, çok", "said": "dedim (say: demek)", "saw": "gördüm (see: görmek)", "see": "görmek", "she": "o (kadın)", "sign": "ilan, duyuru", "sitting": "oturmak (sitting still: kıpırdamadan oturmak)", "so": "bu yüzden", "some": "bazı (some of them: bazıları)", "soon": "yakında (Write soon!: Hemen yaz!)", "speaking": "konuşmak (speaking in front of: önünde konuşmak)", "still": "kıpırdamadan (sitting still: uslu oturmak)", "stories": "hikâyeler", "story": "hikâye (story time: hikâye saati)", "talk": "konuşmak", "ten": "on", "that": "o (after that: ondan sonra)", "the": "belirli tanımlık (Türkçede karşılığı yok)", "them": "onlara, onları", "they": "onlar", "think": "sanmak, düşünmek", "through": "-den (through the wall: duvardan)", "time": "saat; kez (story time: hikâye saati)", "to": "-e (to them: onlara); -mek / -mak (fiil öncesi)", "told": "anlattım (tell: anlatmak)", "tonight": "bu akşam", "turkey": "Türkiye (ülke)", "usually": "genellikle", "volunteer": "gönüllü", "wall": "duvar", "was": "-di (was my first time: ilk seferimdi)", "wednesday": "çarşamba", "week": "hafta", "what": "ne (Guess what?: Bil bakalım ne oldu?)", "why": "neden", "with": "ile (with kids: çocuklarla)", "working": "çalışmak", "write": "yazmak (Write soon!: Hemen yaz!)", "wrote": "yazdım (write: yazmak)", "yes": "evet", "you": "sen", "your": "senin"}}, "speaking": {"prompt": "What do you enjoy doing in your free time? What do you hate doing?", "steps": ["say two things you love or enjoy doing", "say one thing you hate doing", "say one thing you don't mind doing"], "starters": ["In my free time, I enjoy ...", "I also love ...", "I hate ...", "I don't mind ..., but ..."], "model": "In my free time, I really enjoy cooking for my friends. I love trying new recipes, especially soups. I also enjoy walking in the park on Sunday mornings because it's quiet. I hate cleaning the kitchen after dinner, though! And I hate getting up early on weekends. I don't mind doing the shopping, because I like looking at all the fruit and vegetables. What about you? What do you enjoy doing?"}, "writing": {"prompt": "A neighborhood library needs volunteers. Write a short email to the librarian. Say what you enjoy doing and why you want to help.", "length": "50-80 words", "checklist": ["Use enjoy or love + -ing at least twice.", "Use don't mind + -ing once.", "Say when you are free."], "model": "Hi Ms. Carter,\n\nI saw your sign about volunteers, and I'd like to help. I love reading, and I enjoy working with children. I can also help with the books, because I don't mind carrying heavy boxes! I'm free on Saturday mornings and on Thursday evenings after six. Please let me know if you need me.\n\nBest wishes,\nAnna"}, "audio": {"listen": "audio/w5d3-listen.mp3", "listenT": [[0.3, 3.31], [3.76, 8.52], [8.97, 11.46], [11.91, 15.88], [16.33, 20.89], [21.34, 23.07], [23.52, 27.6], [28.05, 31.76], [32.21, 36.35], [36.8, 40.7], [41.15, 45.01], [45.46, 46.98], [47.43, 49.31], [49.76, 54.32], [54.77, 55.86], [56.31, 59.4], [59.85, 64.27], [64.72, 67.38], [67.83, 70.12], [70.57, 75.99], [76.44, 80.34], [80.79, 82.9], [83.35, 86.1], [86.55, 89.33]], "read": "audio/w5d3-read.mp3", "speak": "audio/w5d3-speak.mp3", "vocab": "audio/w5d3-vocab.mp3", "vocabT": [[0.3, 1.37, 1.97, 5.93], [6.83, 8.33, 8.93, 11.51], [12.41, 13.52, 14.12, 16.47], [17.37, 18.47, 19.07, 21.27], [22.17, 23.17, 23.77, 25.05], [25.95, 26.91, 27.51, 29.24], [30.14, 31.23, 31.83, 34.67], [35.57, 36.61, 37.21, 39.77]]}}, {"day": 4, "dayName": "Thursday", "title": "The lights went out", "goals": ["I can talk about the weather and a storm.", "I can make predictions with will and going to.", "I can offer help to a neighbor."], "listening": {"title": "Storm night", "intro": "On Thursday evening, a big storm is coming. Elif and Dan talk in the hallway. Later, they visit Mrs. Green on the first floor.", "speakers": {"Elif": "female", "Dan": "male", "Mrs. Green": "female"}, "lines": [{"s": "Dan", "t": "Elif, have you seen the sky? It's almost black."}, {"s": "Elif", "t": "I know. Look at those clouds! It's going to rain really hard."}, {"s": "Dan", "t": "The news says it's going to be the biggest storm of the year."}, {"s": "Elif", "t": "Really? Then I'll close all my windows right now."}, {"s": "Dan", "t": "Good idea. Do you have candles and a flashlight?"}, {"s": "Elif", "t": "I have a few candles. Why? Do you think the power will go out?"}, {"s": "Dan", "t": "Probably. In this building, it always goes out in big storms."}, {"s": "Elif", "t": "Oh no. My phone battery is almost dead. I'll charge it now."}, {"s": "Dan", "t": "Hurry! I can hear thunder already."}, {"s": "Elif", "t": "Wow! That thunder was so loud."}, {"s": "Dan", "t": "And there go the lights. The power's out."}, {"s": "Elif", "t": "I can't see anything! Wait, I'll use the light on my phone."}, {"s": "Dan", "t": "Let's go and check on Mrs. Green. She lives alone on the first floor."}, {"s": "Elif", "t": "Good idea. The elevator won't work, so we'll take the stairs."}, {"s": "Mrs. Green", "t": "Who's there?"}, {"s": "Dan", "t": "It's Dan and Elif, Mrs. Green. Are you okay?"}, {"s": "Mrs. Green", "t": "I'm fine, dears. I've seen much worse storms than this one!"}, {"s": "Elif", "t": "Is your apartment cold? It's going to get colder tonight."}, {"s": "Mrs. Green", "t": "A little. But I have three blankets and a lot of cookies."}, {"s": "Dan", "t": "I'll bring you some hot soup. I have a gas stove, so it still works."}, {"s": "Mrs. Green", "t": "Oh, that would be lovely. Thank you, Dan."}, {"s": "Elif", "t": "When do you think the power will come back?"}, {"s": "Mrs. Green", "t": "Don't worry. It'll be back by morning. It always is."}, {"s": "Dan", "t": "I hope you're right. I don't want cold cereal for breakfast!"}, {"s": "Mrs. Green", "t": "Then come down here tomorrow. We'll have breakfast by candlelight."}, {"s": "Elif", "t": "That sounds fun. I'll bring the Turkish tea!"}], "mcq": [{"q": "Why does Elif think it's going to rain?", "options": ["She heard it on the radio.", "She can see black clouds.", "Mrs. Green told her."], "answer": 1}, {"q": "Why does Elif want to charge her phone?", "options": ["The battery is almost dead.", "She wants to call her mom.", "Dan asked her to."], "answer": 0}, {"q": "Why do Elif and Dan visit Mrs. Green?", "options": ["to borrow candles", "to check that she's okay", "to eat cookies"], "answer": 1}, {"q": "What does Mrs. Green think about the power?", "options": ["It will come back by morning.", "It will be out for days.", "It's going to come back in an hour."], "answer": 0}], "gaps": [{"line": 1, "answer": "going to rain"}, {"line": 4, "answer": "flashlight"}, {"line": 6, "answer": "always"}, {"line": 10, "answer": "power's out"}, {"line": 18, "answer": "blankets"}, {"line": 22, "answer": "be back"}]}, "vocab": [{"w": "flashlight", "m": "a small light you carry in your hand", "ex": "I keep a flashlight next to my bed."}, {"w": "the power goes out", "m": "the electricity stops working", "ex": "When the power goes out, the fridge stops too."}, {"w": "battery is almost dead", "m": "it has very little power left", "ex": "Can I use your charger? My battery is almost dead."}, {"w": "check on", "m": "visit or call someone to see if they're okay", "ex": "I'm going to check on my grandma after work."}, {"w": "live alone", "m": "live with no other people", "ex": "My uncle likes to live alone in a small house by the sea."}, {"w": "take the stairs", "m": "walk up or down, not use the elevator", "ex": "The elevator is slow, so I always take the stairs."}, {"w": "That would be lovely.", "m": "a warm way to say yes, please", "ex": "More tea? Oh, that would be lovely."}, {"w": "by candlelight", "m": "with only candles for light", "ex": "We had a romantic dinner by candlelight."}], "grammar": {"title": "Predictions: will vs going to", "points": ["Use going to when you can see the reason now: Look at those clouds! It's going to rain.", "Use will for what you think or believe: I think, probably, I'm sure.", "Use will for quick decisions while you speak: I'll charge my phone now.", "Negatives: won't (will not) and isn't / aren't going to."], "examples": [{"en": "Look at the sky. It's going to snow.", "note": "you can see it now"}, {"en": "I think the power will come back soon.", "note": "opinion: I think + will"}, {"en": "Don't worry. It'll be back by morning.", "note": "I'm sure: will"}, {"en": "My battery is almost dead. I'll charge it.", "note": "quick decision: will"}], "exercises": [{"type": "choice", "q": "Look at those black clouds! It's ___ rain.", "options": ["going to", "will", "go to"], "answer": 0, "why": "It's (it is) + going to + verb."}, {"type": "choice", "q": "Don't worry. I'm sure the power ___ back soon.", "options": ["will come", "is coming to", "comes to"], "answer": 0, "why": "I'm sure + will + verb for a belief."}, {"type": "choice", "q": "Be careful! That glass ___ fall off the table!", "options": ["is going to", "will to", "going"], "answer": 0, "why": "You can see it now: is going to + verb."}, {"type": "choice", "q": "I think it ___ very cold tomorrow.", "options": ["will be", "is going be", "be"], "answer": 0, "why": "I think + will + verb."}, {"type": "type", "q": "My battery is at one percent. My phone ___ die. (be going to)", "answers": ["is going to", "'s going to"], "why": "You can see the reason now: going to."}, {"type": "type", "q": "Don't worry. You ___ a great time at the party. (will / have)", "answers": ["will have", "'ll have"], "why": "A belief about the future: will + verb."}, {"type": "type", "q": "The sky is very dark. It ___ snow tonight. (be going to)", "answers": ["is going to", "'s going to"], "why": "Evidence now (dark sky): is going to."}, {"type": "type", "q": "I'm sure Mrs. Green ___ fine. She's very strong. (will / be)", "answers": ["will be", "'ll be"], "why": "I'm sure + will + verb."}]}, "reading": {"title": "A night by candlelight", "kind": "Elif's diary", "text": "Thursday, 9 p.m.\n\nI'm writing this by candlelight, because the power is still out. The storm started at about six. First, the wind got stronger and stronger. Then there was a loud crash of thunder, and all the lights went out.\n\nDan and I went downstairs to check on Mrs. Green. She was sitting in her chair under three blankets, and she looked very calm. \"It's just a storm,\" she said. \"The power will be back by morning.\" Dan brought her some hot soup, and we stayed with her for an hour. She told us stories about her first winter in Chicago, sixty years ago.\n\nNow I'm back in my apartment, and it's getting cold. I'm wearing two sweaters and my thin coat from Izmir. I think I'll sleep in all of them! However, my coat isn't warm enough for this city. Tomorrow I'm going to buy a real winter coat.\n\nMy phone battery is at ten percent, so it's going 's longer and thicker."}, {"s": "Sam", "t": "Trust me, in January, warm is more important than cheap."}, {"s": "Elif", "t": "Can I try them both on?"}, {"s": "Olivia", "t": "Of course. The mirror is over there."}, {"s": "Elif", "t": "The gray one is as soft as a blanket. But the black one is much warmer."}, {"s": "Sam", "t": "And the black one looks better on you, too."}, {"s": "Elif", "t": "Really? It's a bit big, though. Do you have it in a smaller size?"}, {"s": "Olivia", "t": "Let me check. Yes, here's a medium."}, {"s": "Elif", "t": "Oh, this is much better. It isn't as heavy as the large one."}, {"s": "Olivia", "t": "And good news: this coat is on sale today. It's thirty dollars off."}, {"s": "Elif", "t": "So it's only forty dollars more than the gray one. I'll take it!"}, {"s": "Sam", "t": "Great choice. Now you're ready for winter."}, {"s": "Elif", "t": "Am I? What else do I need?"}, {"s": "Sam", "t": "A hat, gloves and a big scarf."}, {"s": "Elif", "t": "Okay, but not today. My wallet is as empty as my fridge!"}], "mcq": [{"q": "Why does Elif need a new coat?", "options": ["She lost her old coat.", "Her coat from Izmir isn't warm enough.", "Her coat is too small."], "answer": 1}, {"q": "Why is the black coat warmer than the gray one?", "options": ["It's longer and thicker.", "It's softer.", "It's more expensive."], "answer": 0}, {"q": "What size does Elif buy?", "options": ["small", "medium", "large"], "answer": 1}, {"q": "What does Sam say Elif still needs?", "options": ["boots and socks", "a hat, gloves and a scarf", "a new wallet"], "answer": 1}], "gaps": [{"line": 1, "answer": "as warm as"}, {"line": 3, "answer": "warmest"}, {"line": 6, "answer": "cheaper"}, {"line": 9, "answer": "thicker"}, {"line": 14, "answer": "better"}, {"line": 17, "answer": "heavy"}]}, "vocab": [{"w": "looking for anything special", "m": "wanting one special thing (a shop worker asks)", "ex": "Are you looking for anything special, or just looking?"}, {"w": "try on", "m": "put on ok at that little girl. She skated past us so fast!"}, {"s": "Elif", "t": "She's about five years old! That's not fair."}, {"s": "Dan", "t": "Let's go around once more. Breathe calmly and don't look at your feet."}, {"s": "Elif", "t": "Okay. Look! I'm doing it! I'm really skating!"}, {"s": "Sam", "t": "You're skating better than me now!"}, {"s": "Dan", "t": "Great job, Elif. So, who wants hot chocolate?"}, {"s": "Elif", "t": "Me! I worked hard today. And you promised, Dan!"}], "mcq": [{"q": "Why is it Elif's first time on ice?", "options": ["There isn't really ice in Izmir.", "She was always too busy.", "She doesn't like sports."], "answer": 0}, {"q": "Who taught Dan to skate?", "options": ["his dad", "Sam", "a teacher at the park"], "answer": 0}, {"q": "How does Sam skate?", "options": ["very well", "badly", "faster than Dan"], "answer": 1}, {"q": "What happens at the end?", "options": ["Elif goes home early.", "Elif skates better than Sam.", "Dan falls."], "answer": 1}], "gaps": [{"line": 2, "answer": "slowly"}, {"line": 5, "answer": "well"}, {"line": 8, "answer": "badly"}, {"line": 9, "answer": "gently"}, {"line": 16, "answer": "hard"}, {"line": 20, "answer": "calmly"}]}, "vocab": [{"w": "first time", "m": "you have never done it before", "ex": "Is this your first time in New York?"}, {"w": "slippery", "m": "so smooth or wet that you can fall", "ex": "Be careful. The floor is slippery after the rain."}, {"w": "bend your knees", "m": "make your legs not straight", "ex": "Bend your knees when you pick up a heavy box."}, {"w": "Am I doing it right?", "m": "Is this the correct way?", "ex": "I'm making the sauce now. Am I doing it right?"}, {"w": "fall hard", "m": "fall to the ground in a painful way", "ex": "Careful on those stairs. You can fall hard."}, {"w": "can't stop laughing", "m": "laugh again and again", "ex": "This movie is so funny. I can't stop laughing!"}, {"w": "That's not fair.", "m": "That isn't right or equal", "ex": "He got two cookies and I got one. That's not fair."}, {"w": "Great job!", "m": "You did it very well!", "ex": "You finished the report early? Great job!"}], "grammar": {"title": "Adverbs of manner: slowly, carefully, well", "points": ["Adverbs say how we do something. They usually come after the verb: She skates well.", "Most adverbs are adjective + -ly: slow → slowly, careful → carefully, calm → calmly.", "Adjectives ending in -y: change y to i + -ly: easy → easily, happy → happily.", "Irregular: good → well, fast → fast, hard → hard. Never say fastly."], "examples": [{"en": "Move slowly and carefully.", "note": "verb + adverb"}, {"en": "Dan skates well, but Sam skates badly.", "note": "good → well"}, {"en": "The little girl skated very fast.", "note": "fast → fast"}, {"en": "Elif is learning quickly.", "note": "quick → quickly"}], "exercises": [{"type": "choice", "q": "Dan skates very ___.", "options": ["good", "well", "goodly"], "answer": 1, "why": "Good is an adjective; the adverb is well."}, {"type": "choice", "q": "Walk ___ on the ice, or you'll fall.", "options": ["careful", "carefully", "carefuly"], "answer": 1, "why": "After a verb, use the adverb: careful → carefully."}, {"type": "choice", "q": "The little girl skated really ___.", "options": ["fastly", "fast", "fasted"], "answer": 1, "why": "Fast is the same as an adjective and an adverb."}, {"type": "choice", "q": "Sam plays basketball ___, but he skates badly.", "options": ["good", "well", "nice"], "answer": 1, "why": "How does he play? Well (adverb of good)."}, {"type": "type", "q": "Breathe ___ and don't look at your feet. (calm)", "answers": ["calmly"], "why": "Adjective + -ly: calm → calmly."}, {"type": "type", "q": "Elif is learning very ___. (quick)", "answers": ["quickly"], "why": "Adjective + -ly: quick → quickly."}, {"type": "type", "q": "She fell ___, but she laughed. (hard)", "answers": ["hard"], "why": "Hard doesn't change. Hardly means almost not."}, {"type": "type", "q": "Elif opened the heavy door ___. (easy)", "answers": ["easily"], "why": "Easy → easily: change y to i, add -ly."}]}, "reading": {"title": "A week of surprises", "kind": "Elif's diary", "text": "Saturday night\n\nWhat a week! On Monday, I had a bad cold. On Tuesday, I lost my phone on the bus, but luckily a driver found it. On Wednesday, I read to children at the library for the first time. On Thursday, a big storm hit the city, and we had no power all night. And yesterday, I bought my first real winter coat.\n\nToday was the best day, though. Dan, Sam and I went ice skating in the park. I was very nervous, because it was my first time on ice. At first, I moved slowly and held the wall tightly. Dan skates beautifully, so he helped me. Sam was funny. He plays basketball well, but on ice he moves badly, like a baby giraffe!\n\nI fell hard once, but I laughed loudly, and everyone laughed with me. By the end, I was skating more confidently. After that, Dan bought hot chocolate for everyone.\n\nAlthough my legs hurt now, I feel happy. My new coat kept me warm all afternoon. Maybe winter in Chicago isn't as scary as I thought!", "questions": [{"q": "What happened on Thursday?", "options": ["Elif lost her phone.", "A big storm hit the city.", "Elif bought a coat."], "answer": 1}, {"q": "Why was Elif nervous today?", "options": ["It was her first time on ice.", "She was sick.", "She was late."], "answer": 0}, {"q": "How does Sam move on the ice?", "options": ["beautifully", "badly", "very fast"], "answer": 1}, {"q": "Who bought hot chocolate?", "options": ["Elif", "Sam", "Dan"], "answer": 2}], "tf": [{"s": "Elif read to children at the library on Wednesday.", "answer": true}, {"s": "Elif never fell on the ice.", "answer": false}, {"s": "Elif was cold all afternoon.", "answer": false}], "gloss": {"a": "bir", "after": "after that: ondan sonra", "afternoon": "öğleden sonra (all afternoon: bütün öğleden sonra)", "all": "bütün (all night: bütün gece)", "although": "-e rağmen, gerçi", "and": "ve", "as": "as ... as: kadar (as scary  new activity you tried (a sport, a dance class, a game ...). How did it go?", "length": "60-90 words", "checklist": ["Use at least three adverbs (slowly, carefully, well, badly ...).", "Say how you felt at the start and at the end.", "Use one connector: because, so, although or however."], "model": "Today I tried yoga for the first time. At the start, I felt nervous, because everyone moved so easily. I did everything slowly and carefully, and I listened to the teacher closely. Some positions were really hard, so I did them badly! However, by the end, I was breathing calmly and I felt great. Although my back hurts a little now, I'm going to go again next week."}, "partner": {"questions": ["What do you do when you have a cold? What will you do if you get sick this winter?", "Have you ever lost something important? When did it happen, and did you find it?", "What do you enjoy doing on weekends? What do you hate doing?", "Look outside. What do you think the weather will be like tomorrow?", "Compare your favorite coat or jacket with an old one. Which is warmer, nicer or cheaper?", "What can you do well? What do you do badly?"], "roleplay": "Imagine you are at a pharmacy. Play both parts out loud. A has a bad cold and asks for help. B is the pharmacist: B asks two questions and gives advice with 'If you ..., you'll ...'. Record yourself, then listen."}, "audio": {"listen": "audio/w5d6-listen.mp3", "listenT": [[0.3, 3.27], [3.72, 6.25], [6.7, 10.14], [10.59, 14.66], [15.11, 17.4], [17.85, 20.36], [20.81, 25.91], [26.36, 28.64], [29.09, 33.62], [34.07, 38.78], [39.23, 41.15], [41.6, 43.56], [44.01, 46.17], [46.62, 48.54], [48.99, 50.08], [50.53, 51.49], [51.94, 55.01], [55.46, 59.21], [59.66, 62.76], [63.21, 65.77], [66.22, 70.68], [71.13, 73.77], [74.22, 75.91], [76.36, 79.94], [80.39, 83.4]], "read": "audio/w5d6-read.mp3", "speak": "audio/w5d6-speak.mp3", "vocab": "audio/w5d6-vocab.mp3", "vocabT": [[0.3, 1.41, 2.01, 3.95], [4.85, 5.85, 6.45, 9.4], [10.3, 11.34, 11.94, 14.46], [15.36, 16.85, 17.45, 20.21], [21.11, 22.26, 22.86, 25.48], [26.38, 27.77, 28.37, 31.35], [32.25, 33.51, 34.11, 37.23], [38.13, 39.24, 39.84, 42.46]]}}], "sunday": {"quiz": [{"q": "If you ___ hot tea, your throat will feel better.", "options": ["drink", "will drink", "drank"], "answer": 0, "why": "After if, use the present simple."}, {"q": "I ___ my phone on the bus yesterday.", "options": ["have left", "left", "leave"], "answer": 1, "why": "Yesterday is a finished time: past simple."}, {"q": "___ you ever lost your keys?", "options": ["Did", "Have", "Are"], "answer": 1, "why": "Ever + past participle: present perfect (have)."}, {"q": "Ava enjoys ___ to stories.", "options": ["listen", "listening", "listens"], "answer": 1, "why": "Enjoy is always followed by -ing."}, {"q": "Look at those clouds! It's ___ snow.", "options": ["going to", "will", "go to"], "answer": 0, "why": "You can see the clouds now: it's going to."}, {"q": "The black coat is warmer ___ the gray one.", "options": ["as", "than", "that"], "answer": 1, "why": "Comparative + than."}, {"q": "This coat isn't as heavy ___ that one.", "options": ["than", "as", "like"], "answer": 1, "why": "The pattern is not as + adjective + as."}, {"q": "Dan skates really ___.", "options": ["good", "well", "nice"], "answer": 1, "why": "The adverb of good is well."}, {"q": "I have a cold. Can you ___ some medicine?", "options": ["recommend", "remember", "return"], "answer": 0, "why": "Recommend = say that something is good to try."}, {"q": "During the storm, the power ___, so we used candles.", "options": ["went out", "got on", "called back"], "answer": 0, "why": "The power goes out = the electricity stops."}], "reflection": ["Which story this week was the most fun for you, and why?", "Can you say what you will do if you get sick, in English?", "What do you do well? Can you describe it with three adverbs?"]}}, {"week": 6, "title": "Growing confidence", "days": [{"day": 1, "dayName": "Monday", "title": "A bigger task", "goals": ["I can talk about a new task at work.", "I can talk about imagined situations.", "I can give advice with If I were you, I would..."], "listening": {"title": "Maria has news", "intro": "At the office, Maria gives Elif a new task. Later, Sam talks to Elif about it.", "speakers": {"Maria": "female", "Elif": "female", "Sam": "male"}, "lines": [{"s": "Maria", "t": "Elif, do you have a minute? I'd like to talk to you about something."}, {"s": "Elif", "t": "Of course. Is everything okay?"}, {"s": "Maria", "t": "Everything's great. You know our new client, the small flower shop?"}, {"s": "Elif", "t": "Yes, the one with the beautiful photos."}, {"s": "Maria", "t": "Right. They need a new website, and I want you to plan the whole project."}, {"s": "Elif", "t": "Me? Wow. But I've never planned a project on my own."}, {"s": "Maria", "t": "I know. However, you're very organized, and the client really likes you."}, {"s": "Elif", "t": "Thank you. If I had more experience, I would feel more confident."}, {"s": "Maria", "t": "If you didn't have the skills, I wouldn't give you this job. Trust me."}, {"s": "Elif", "t": "Okay. When do they need it?"}, {"s": "Maria", "t": "The first plan is due in two weeks. Sam can help you with the design."}, {"s": "Sam", "t": "So, I heard the big news! Congratulations!"}, {"s": "Elif", "t": "Thanks, Sam. But honestly, I'm a little scared."}, {"s": "Sam", "t": "That's normal. What would you do if you had a problem?"}, {"s": "Elif", "t": "I would ask you, of course!"}, {"s": "Sam", "t": "Good answer. And if I were you, I would make a simple plan first."}, {"s": "Elif", "t": "A plan for the plan?"}, {"s": "Sam", "t": "Exactly. Write down every step, so nothing gets lost."}, {"s": "Elif", "t": "That's a good idea. What would you do if the client didn't like my ideas?"}, {"s": "Sam", "t": "I would listen, ask questions and try again. Clients change their minds all the time."}, {"s": "Elif", "t": "If I were a client, I would want a designer like you."}, {"s": "Sam", "t": "Ha! If you said that to Maria, she would give me a raise."}, {"s": "Elif", "t": "Let's get some coffee first. Then I'll start my plan."}, {"s": "Sam", "t": "See? You already sound like a project leader!"}], "mcq": [{"q": "What does Maria want Elif to do?", "options": ["design a logo for a bakery", "plan a website project for a new client", "take photos for a flower shop"], "answer": 1}, {"q": "Why did Maria choose Elif?", "options": ["Elif asked for the job.", "Elif is organized and the client likes her.", "Sam was too busy."], "answer": 1}, {"q": "When is the first plan due?", "options": ["tomorrow", "in two weeks", "next month"], "answer": 1}, {"q": "What does Sam tell Elif to do first?", "options": ["talk to the client", "make a simple plan", "ask Maria for more time"], "answer": 1}], "gaps": [{"line": 7, "answer": "had"}, {"line": 8, "answer": "wouldn't give"}, {"line": 13, "answer": "would you do"}, {"line": 15, "answer": "were"}, {"line": 18, "answer": "didn't like"}, {"line": 21, "answer": "would give"}]}, "vocab": [{"w": "do you have a minute", "m": "a polite way to ask to talk", "ex": "Excuse me, do you have a minute? I have a question."}, {"w": "on my own", "m": "alone, without help", "ex": "I cooked the whole dinner on my own."}, {"w": "organized", "m": "good at planning and keeping things in order", "ex": "My sister is very organized, so she never forgets a birthday."}, {"w": "due", "m": "must be finished by this time", "ex": "The report is due on Friday."}, {"w": "trust me", "m": "believe me", "ex": "Trust me, this restaurant is really good."}, {"w": "honestly", "m": "to tell the truth", "ex": "Honestly, I didn't like the movie very much."}, {"w": "make a plan", "m": "decide what to do and when", "ex": "Let's make a plan for the weekend."}, {"w": "change your mind", "m": "decide something different", "ex": "If you change your mind, just call me."}], "grammar": {"title": "Second conditional: if + past, would", "points": ["Use if + past simple, then would + verb for imagined situations now.", "If I had more time, I would help you. (But I don't have time.)", "With be, we usually use were for everyone: If I were you...", "Use If I were you, I would... to give advice."], "examples": [{"en": "If I had more experience, I would feel more confident.", "note": "she doesn't have much experience"}, {"en": "If I were you, I would make a simple plan.", "note": "advice"}, {"en": "What would you do if the client said no?", "note": "question: would + you"}, {"en": "I wouldn't worry if I were you.", "note": "the if part can come second"}], "tr": "Zamanım olsa gelirdim = If I had time, I would come. 'If' kısmında geçmiş zaman kullanılır.", "exercises": [{"type": "choice", "q": "If I ___ more money, I would buy a car.", "options": ["have", "had", "would have"], "answer": 1, "why": "The if part uses the past simple."}, {"type": "choice", "q": "If I were you, I ___ talk to the manager.", "options": ["will", "would", "am"], "answer": 1, "why": "The result part uses would + verb."}, {"type": "choice", "q": "What ___ you do if you lost your keys?", "options": ["will", "would", "did"], "answer": 1, "why": "Imagined situation: What would you do if...?"}, {"type": "choice", "q": "If it ___ so cold, we would walk to work.", "options": ["isn't", "wasn't", "won't be"], "answer": 1, "why": "Imagined situation now: if + past simple."}, {"type": "type", "q": "If I ___ a car, I would drive to work. (have)", "answers": ["had"], "why": "The if part uses the past simple: have → had."}, {"type": "type", "q": "Don't worry. If I were you, I ___ worry about it. (would / not)", "answers": ["wouldn't", "would not"], "why": "Negative result: wouldn't + verb."}, {"type": "type", "q": "She ___ the job if she spoke better French. (get)", "answers": ["would get", "'d get"], "why": "Result part: would + base verb."}, {"type": "type", "q": "If the client ___ my ideas, I would try again. (not / like)", "answers": ["didn't like", "did not like"], "why": "Negative past simple in the if part: didn't + verb."}]}, "reading": {"title": "My first big task", "kind": "Elif's diary", "text": "Monday night\n\nToday Maria gave me my first big task. Our new client, a small flower shop, needs a website, and I'm going to plan the whole project. I was shocked when she asked me. I'm only an assistant!\n\nAt first, I felt nervous. If I had more experience, I would feel calmer. However, Maria believes in me, and Sam is going to help with the design. That makes me feel better.\n\nTonight I'm thinking about the first steps. If I were the client, what would I want? I would want a simple website with big, beautiful photos of the flowers. I would also want people to find the address and opening hours quickly.\n\nI called Mom after dinner. When I told her the news, she was so happy. \"If I lived closer, I would bring you a cake,\" she said. I almost cried.\n\nOf course, I'm still a little scared. If the client didn't like my plan, I would feel terrible. But Sam says clients change their minds all the time, so I shouldn't worry too much.\n\nTomorrow I'm going to write down every step of the project. One step at a time!", "questions": [{"q": "What is Elif's big task?", "options": ["taking photos of flowers", "planning a website for a flower shop", "finding a new client"], "answer": 1}, {"q": "If Elif were the client, what would she want?", "options": ["a lot of text", "a simple website with big photos", "a video about the shop"], "answer": 1}, {"q": "What did Elif's mom say?", "options": ["She would bring a cake if she lived closer.", "She wants Elif to come home.", "She was worried about the new task."], "answer": 0}, {"q": "What is Elif going to do tomorrow?", "options": ["call the client", "write down every step of the project", "ask Maria for more time"], "answer": 1}], "tf": [{"s": "Elif felt nervous at first.", "answer": true}, {"s": "Maria is going to help Elif with the design.", "answer": false}, {"s": "Elif's mom w
