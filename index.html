y car."}], "grammar": {"title": "Asking questions", "points": ["With be, put am/is/are before the subject: Are you from here?", "With other verbs, use do/does + subject + base verb: Do you like sports?", "Wh- questions: put the question word first. Where do you live? What does she do?", "After does, the main verb has no -s: Does he play? Not: Does he plays?"], "examples": [{"en": "Are you ready to order?", "note": "be + subject"}, {"en": "Does it come with bread?", "note": "does + subject + base verb"}, {"en": "Where are you from?", "note": "question word + be + subject"}, {"en": "What do you do on Sundays?", "note": "the first do is the helper"}], "exercises": [{"type": "choice", "q": "___ you like sports?", "options": ["Do", "Are", "Does"], "answer": 0, "why": "Like is a main verb, and the subject is you."}, {"type": "choice", "q": "Where ___ Sam's parents live?", "options": ["does", "do", "are"], "answer": 1, "why": "Parents is plural, so use do."}, {"type": "choice", "q": "___ Elif from Turkey?", "options": ["Does", "Is", "Do"], "answer": 1, "why": "There is no main verb here, so use be."}, {"type": "type", "q": "What time ___ Maria start work? (do)", "answers": ["does"], "why": "Maria is she, so use does."}, {"type": "type", "q": "___ you hungry? (be)", "answers": ["Are", "are"], "why": "Hungry is an adjective, so use be: Are you."}, {"type": "type", "q": "Does Dan ___ in the park on weekends? (run)", "answers": ["run"], "why": "After does, use the base verb with no -s."}, {"type": "type", "q": "Where ___? (do / you / work)", "answers": ["do you work"], "why": "Question word, then do, then subject, then verb."}, {"type": "choice", "q": "What ___ he do on Sundays?", "options": ["do", "does", "is"], "answer": 1, "why": "He takes does in present simple questions."}]}, "reading": {"title": "One week in Chicago", "kind": "Elif's diary", "text": "Dear diary,\n\nOne week in Chicago! People often ask me, \"Do you like it here?\" Today I can finally say yes.\n\nLast night, I cooked stuffed peppers for Dan. He brought his grandma's apple pie, and three other neighbors came too. One of them, Mrs. Green, lives on the first floor. She's eighty, and she still goes swimming every Tuesday! She asked me a lot of questions. \"Where is Turkey exactly? Is it hot there? Do you have snow?\" I laughed and answered all of them.\n\nToday I had lunch with Sam. He's from Chicago, and he knows everything about the city. He invited me to a basketball game next Saturday. Do I know the rules of basketball? No! But I can learn.\n\nThis week wasn't always easy. I had a cold, and I still don't understand the bus map. But now I have a kind neighbor, a helpful coworker and a great manager. What more do I need? Maybe a little more sleep!\n\nWhat am I doing tomorrow? Nothing! I'm staying home and resting.", "questions": [{"q": "What did Dan bring to the dinner?", "options": ["Stuffed peppers", "An apple pie", "Turkish tea"], "answer": 1}, {"q": "What is surprising about Mrs. Green?", "options": ["She is eighty and still goes swimming.", "She is from Turkey.", "She plays basketball."], "answer": 0}, {"q": "What does Elif still find difficult?", "options": ["Her job", "Cooking", "The bus map"], "answer": 2}, {"q": "What is Elif's plan for Sunday?", "options": ["To go to a basketball game", "To stay home and rest", "To visit Sam's parents"], "answer": 1}], "tf": [{"s": "Mrs. Green lives on the first floor.", "answer": true}, {"s": "Elif knows the rules of basketball.", "answer": false}, {"s": "Sam is from Chicago.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında", "all": "hepsi (all of them: hepsi)", "always": "her zaman (not always: hep değil)", "am": "-im (what am I doing: ne yapıyorum)", "and": "ve", "answered": "cevapladım (answer: cevaplamak)", "apple": "elma", "ask": "sormak", "asked": "sordu (ask: sormak)", "basketball": "basketbol", "brought": "getirdi (bring: getirmek)", "bus": "otobüs", "but": "ama", "came": "geldi (come: gelmek)", "can": " abit; he/she/it adds -s: calls."}, {"q": "I'm tired. Let's ___ a break.", "options": ["make", "take", "do"], "answer": 1, "why": "We say take a break."}, {"q": "Sam is ___ excellent designer.", "options": ["a", "an", "the"], "answer": 1, "why": "Excellent starts with a vowel sound, so use an."}, {"q": "How ___ rice do we need?", "options": ["many", "much", "a lot"], "answer": 1, "why": "Rice is uncountable, so use much."}, {"q": "The team meeting starts ___ ten thirty.", "options": ["in", "on", "at"], "answer": 2, "why": "Use at with clock times."}, {"q": "You ___ wear a suit. Jeans are fine.", "options": ["have to", "don't have to", "can't"], "answer": 1, "why": "A suit is not necessary, so use don't have to."}, {"q": "___ Dan live next door?", "options": ["Is", "Does", "Do"], "answer": 1, "why": "Live is a main verb, and Dan is he: does."}, {"q": "I can't talk much today. I have a sore ___.", "options": ["fever", "rest", "throat"], "answer": 2, "why": "We say a sore throat."}, {"q": "Please ___ out this form before you see the doctor.", "options": ["make", "take", "fill"], "answer": 2, "why": "We fill out a form."}, {"q": "After a few weeks, I started to feel ___ home.", "options": ["in", "at", "on"], "answer": 1, "why": "The phrase is feel at home."}], "reflection": ["What was the most useful thing you learned this week?", "Which grammar point is still difficult for you?", "Which new phrase can you use in your own life next week?"]}}, {"week": 2, "title": "Finding my way", "days": [{"day": 1, "dayName": "Monday", "title": "Which bus do I take?", "goals": ["I can ask how to get somewhere.", "I can understand simple directions.", "I can say where places are."], "listening": {"title": "At the bus stop", "intro": "Elif is at a bus stop. She talks to a woman, Carmen, and then to the bus driver, Ray.", "speakers": {"Elif": "female", "Carmen": "female", "Ray": "male"}, "lines": [{"s": "Elif", "t": "Excuse me, is this the right bus stop for downtown?"}, {"s": "Carmen", "t": "It depends. Where exactly do you want to go?"}, {"s": "Elif", "t": "To a print shop. My manager wrote the address on this paper."}, {"s": "Carmen", "t": "Let me see... Oh, I know this place. Take the number 12."}, {"s": "Elif", "t": "The number 12. Does it stop here?"}, {"s": "Carmen", "t": "Yes, it does. It comes every fifteen minutes or so."}, {"s": "Elif", "t": "Great. And where do I get off?"}, {"s": "Carmen", "t": "Get off at the big library. The print shop is across from it."}, {"s": "Elif", "t": "Across from the library. Thank you so much!"}, {"s": "Carmen", "t": "No problem. Oh, look, here it comes."}, {"s": "Ray", "t": "Good morning!"}, {"s": "Elif", "t": "Hi. Can I pay with this card?"}, {"s": "Ray", "t": "Sure. Just tap your card here."}, {"s": "Elif", "t": "Thanks. Does this bus go past the big library?"}, {"s": "Ray", "t": "It does. It's about twenty minutes from here."}, {"s": "Elif", "t": "Can you tell me when we get there? I'm new in the city."}, {"s": "Ray", "t": "Of course. Welcome to Chicago! Sit near the front."}, {"s": "Ray", "t": "Okay, this is your stop. That's the library, on the left."}, {"s": "Elif", "t": "Thank you! Um, where is the print shop exactly?"}, {"s": "Ray", "t": "Cross the street and walk along it. Go past the coffee shop."}, {"s": "Ray", "t": "The print shop is between a bank and a small bookstore."}, {"s": "Elif", "t": "Between a bank and a bookstore. Got it."}, {"s": "Ray", "t": "If you get lost, just go into the library and ask."}, {"s": "Elif", "t": "I will. Thanks again. Have a nice day!"}, {"s": "Ray", "t": "You too. Good luck!"}], "mcq": [{"q": "Where does Elif want to go?", "options": ["to a bookstore", "to a print shop", "to the library"], "answer": 1}, {"q": "Which bus does she need?", "options": ["the number 12", "the number 20", "the number 15"], "answer": 0}, {"q": "What does Elif ask the driver to do?", "options": ["give her a map", "drive faster", "tell her when to get off"], "answer": 2}, {"q": "Where is the print shop?", "options": ["between a bank and a bookstore", "inside the coffee shop", "next to the bus stop"], "answer": 0}], "gaps": [{"line": 6, "answer": "get off"}, {"line": 7, "answer": "across from"}, {"line": 12, "answer": "tap"}, {"line": 19, "answer": "along"}, {"line": 20, "answer": "between"}, {"line": 22, "answer": "into"}]}, "vocab": [{"w": "bus stop", "m": "a place where the bus stops for people", "ex": "There's a bus stop next to my building."}, {"w": "get off", "m": "leave a bus, train or plane", "ex": "We get off at the next stop."}, {"w": "across from", "m": "on the other side of the street", "ex": "The bakery is across from the bank."}, {"w": "go past", "m": "move by something and keep going", "ex": "You go past a school on the way to the park."}, {"w": "It depends", "m": "the answer changes in different situations", "ex": "Is the trip long? It depends on the traffic."}, {"w": "tap your card", "m": "touch your card on a machine to pay", "ex": "At this café, you can tap your card to pay."}, {"w": "this is your stop", "m": "you need to get off here", "ex": "Wake up, Tom! This is your stop."}, {"w": "get lost", "m": "not know where you are", "ex": "I always get lost in big shopping malls."}], "grammar": {"title": "Prepositions of place and movement", "points": ["Place (where something is): next to, across from, between A and B.", "Movement (how you go): along, into, past.", "Across from = on the other side of the street or room.", "Go past = pass something and keep going. Go into = enter."], "examples": [{"en": "The bank is next to the coffee shop.", "note": ""}, {"en": "The pharmacy is across from the park.", "note": "on the other side"}, {"en": "The shop is between the bank and the bookstore.", "note": "between A and B"}, {"en": "Walk along the river and go past the bridge.", "note": "movement"}], "exercises": [{"type": "choice", "q": "The print shop is ___ a bank and a bookstore.", "options": ["between", "along", "into"], "answer": 0, "why": "Between connects two things: between A and B."}, {"type": "choice", "q": "Walk ___ this street for two minutes.", "options": ["between", "along", "into"], "answer": 1, "why": "Along means following a street or a river."}, {"type": "choice", "q": "She went ___ the library to ask for help.", "options": ["along", "between", "into"], "answer": 2, "why": "Into shows movement from outside to inside."}, {"type": "choice", "q": "The post office is ___ the bus stop, on the other side of the street.", "options": ["next to", "across from", "into"], "answer": 1, "why": "On the other side of the street = across from."}, {"type": "type", "q": "Go ___ the coffee shop and turn left at the corner. (past / between)", "answers": ["past"], "why": "Go past = pass it and keep walking."}, {"type": "type", "q": "My apartment is ___ Dan's apartment. Our doors are side by side. (next to / along)", "answers": ["next to"], "why": "Side by side = next to."}, {"type": "type", "q": "We walked ___ the river for an hour. (along / into)", "answers": ["along"], "why": "Along means following the side of the river."}, {"type": "type", "q": "The cat ran ___ the house when it started to rain. (into / between)", "answers": ["into"], "why": "The cat moved from outside to inside: into."}]}, "reading": {"title": "The wrong direction", "kind": "Elif's diary", "text": "Monday evening\n\nToday Maria asked me to take some designs to a print shop downtown. I don't know the city yet, so I was a little nervous. A kind woman at the bus stop helped me, and the driver told me when to get off.\n\nThe print shop is across from a big library. It's small, and it's between a bank and a bookstore. The people there were friendly, and they liked our designs. I felt very proud.\n\nThen I made a mistake. On the way back, I took the number 12 again, but in the wrong direction! After ten minutes, I saw a lake out the window. There is no lake near my office. I got off quickly.\n\nA man with a dog helped me. He said, \"Cross the street and wait next to the pharmacy. That bus goes past your office.\" It was easy. Next time, I'll check the direction before I get on.\n\nTonight I'm tired but happy. I know two more streets in Chicago now!", "questions": [{"q": "Why did Elif go downtown?", "options": ["to meet Dan", "to take designs to a print shop", "to visit the library"], "answer": 1}, {"q": "How did she feel at the print shop?", "options": ["proud", "bored", "angry"], "answer": 0}, {"q": "What was her mistake?", "options": ["She lost the designs.", "She forgot to pay.", "She took the bus in the wrong direction."], "answer": 2}, {"q": "Where did the man tell her to wait?", "options": ["across from the library", "next to the pharmacy", "inside the bookstore"], "answer": 1}], "tf": [{"s": "The print shop is next to the library.", "answer": false}, {"s": "A man with a dog helped Elif.", "answer": true}, {"s": "Elif saw a lake from the bus.", "answer": true}], "gloss": {"a": "bir", "across": "karşısında (across from: karşısında)", "after": "sonra", "again": "yine, tekrar", "and": "ve", "asked": "istedi (ask: istemek, rica etmek)", "at": "-de (saat / yer)", "back": "geri (on the way back: dönüş yolunda)", "bank": "banka", "before": "önce", "between": "arasında", "big": "büyük", "bookstore": "kitapçı", "bus": "otobüs", "but": "ama", "check": "kontrol etmek", "chicago": "Chicago (şehir)", "city": "şehir", "cross": "karşıya geç (cross: geçmek)", "designs": "tasarımlar", "direction": "yön", "dog": "köpek", "don't": "-mıyorum (do not)", "downtown": "şehir merkezi(nde)", "driver": "şoför", "easy": "kolay", "evening": "akşam", "felt": "hissettim (feel: hissetmek)", "friendly": "cana yakın", "from": "(across from: karşısında)", "get": "(get off: inmek; get on: binmek)", "goes": "gidiyor (go past: önünden geçmek)", "got": "indim (get off: inmek)", "happy": "mutlu", "he": "o (erkek)", "helped": "yardım etti (help: yardım etmek)", "i": "ben", "i'll": "ben ...-eceğim (I will)", "i'm": "ben ...-im (I am)", "in": " 6, 6.56, 8.14], [9.04, 10.17, 10.77, 12.92], [13.82, 14.91, 15.51, 17.94], [18.84, 19.93, 20.53, 23.22], [24.12, 25.31, 25.91, 28.5], [29.4, 30.63, 31.23, 33.41], [34.31, 35.38, 35.98, 38.54]]}}, {"day": 2, "dayName": "Tuesday", "title": "The sink is leaking!", "goals": ["I can describe a problem at home.", "I can say what happened last night.", "I can use the past simple (positive)."], "listening": {"title": "A call to the landlord", "intro": "Elif calls her landlord, Frank, early in the morning about a problem in her kitchen.", "speakers": {"Elif": "female", "Frank": "male"}, "lines": [{"s": "Frank", "t": "Hello, this is Frank."}, {"s": "Elif", "t": "Hi, Frank. This is Elif, from apartment 4B. Sorry to call so early."}, {"s": "Frank", "t": "No problem, Elif. What's wrong?"}, {"s": "Elif", "t": "There's a problem with my kitchen sink. It's leaking."}, {"s": "Frank", "t": "Oh no. Tell me what happened."}, {"s": "Elif", "t": "Last night I washed the dishes after dinner. Everything looked fine."}, {"s": "Elif", "t": "Then, at about midnight, I heard a strange noise in the kitchen."}, {"s": "Frank", "t": "What kind of noise?"}, {"s": "Elif", "t": "Like water. I went into the kitchen and saw water all over the floor."}, {"s": "Frank", "t": "A lot of water?"}, {"s": "Elif", "t": "Yes, a lot! It came from under the sink. I put all my towels on the floor."}, {"s": "Frank", "t": "Good thinking. Is the water still coming out?"}, {"s": "Elif", "t": "No. My neighbor Dan heard me, and he came over."}, {"s": "Elif", "t": "He turned off the water under the sink."}, {"s": "Frank", "t": "Dan's a good guy. That was the right thing to do."}, {"s": "Elif", "t": "Yes, he helped me a lot. We cleaned the floor together. I went to bed at two."}, {"s": "Frank", "t": "I'm sorry, Elif. That sounds like a long night."}, {"s": "Elif", "t": "It was! And now I can't use the sink. I can't cook or wash anything."}, {"s": "Frank", "t": "I understand. I'll send a plumber today. Are you home this afternoon?"}, {"s": "Elif", "t": "I'm at work until five. Can he come after five thirty?"}, {"s": "Frank", "t": "Let me check... Yes, he can come at six. His name is Joe."}, {"s": "Elif", "t": "Perfect. Thank you so much, Frank."}, {"s": "Frank", "t": "Thank you for calling quickly. And please say thanks to Dan for me."}, {"s": "Elif", "t": "I will. Have a good day!"}], "mcq": [{"q": "Why does Elif call Frank?", "options": ["Her door is broken.", "Her sink is leaking.", "She wants a new apartment."], "answer": 1}, {"q": "What did Elif hear at midnight?", "options": ["loud music", "her phone", "a noise like water"], "answer": 2}, {"q": "Who turned off the water?", "options": ["Dan", "Frank", "Joe"], "answer": 0}, {"q": "When is the plumber going to come?", "options": ["at nine", "at five thirty", "at six"], "answer": 2}], "gaps": [{"line": 5, "answer": "washed"}, {"line": 6, "answer": "heard"}, {"line": 8, "answer": "saw"}, {"line": 12, "answer": "came over"}, {"line": 13, "answer": "turned off"}, {"line": 15, "answer": "cleaned"}]}, "vocab": [{"w": "What's wrong?", "m": "What is the problem?", "ex": "You look sad. What's wrong?"}, {"w": "leaking", "m": "water is coming out of a hole", "ex": "The roof is leaking, so we put a bucket under it."}, {"w": "strange noise", "m": "a sound that is not normal", "ex": "My car makes a strange noise in the morning."}, {"w": "come over", "m": "come to someone's home", "ex": "Can you come over for coffee tomorrow?"}, {"w": "turn off", "m": "stop a machine, a light or water", "ex": "Please turn off the lights when you leave."}, {"w": "wash the dishes", "m": "clean plates, cups and pans", "ex": "It's your turn to wash the dishes tonight."}, {"w": "the right thing to do", "m": "the good or correct action", "ex": "Telling the truth was the right thing to do."}, {"w": "plumber", "m": "a person who fixes pipes, sinks and toilets", "ex": "We called a plumber because the shower was broken."}], "grammar": {"title": "Past simple: positive", "points": ["Use the past simple for finished actions at a finished time: last night, yesterday.", "Regular verbs add -ed: wash → washed, clean → cleaned, try → tried.", "Many common verbs are irregular: go → went, see → saw, come → came.", "The form is the same for everyone: I went, she went, they went."], "examples": [{"en": "I heard a strange noise last night.", "note": "hear → heard"}, {"en": "Dan came over and helped me.", "note": "come → came, help → helped"}, {"en": "We cleaned the floor together.", "note": "regular: + -ed"}, {"en": "I put my towels on the floor.", "note": "put → put (no change)"}], "tr": "Türkçede her fiile '-di' eklenir, ama İngilizcede birçok fiil düzensizdir: go → went, buy → bought. Bunları ezberleyin.", "exercises": [{"type": "type", "q": "Last night I ___ a strange noise. (hear)", "answers": ["heard"], "why": "Hear is irregular: hear → heard."}, {"type": "type", "q": "Dan ___ over and helped me. (come)", "answers": ["came"], "why": "Come is irregular: come → came."}, {"type": "type", "q": "Yesterday we ___ the kitchen floor together. (clean)", "answers": ["cleaned"], "why": "Clean is regular, so add -ed."}, {"type": "type", "q": "This morning I ___ to fix the sink myself. (try)", "answers": ["tried"], "why": "Consonant + y: change y to i, then add -ed."}, {"type": "choice", "q": "Yesterday she ___ to the store after work.", "options": ["goes", "went", "goed"], "answer": 1, "why": "Yesterday is a finished time. Go → went."}, {"type": "choice", "q": "Last week the plumber ___ our shower in twenty minutes.", "options": ["fixed", "fix", "fixs"], "answer": 0, "why": "Fix is regular: fix → fixed."}, {"type": "choice", "q": "I ___ my keys on the table an hour ago.", "options": ["putted", "put", "puts"], "answer": 1, "why": "Put doesn't change in the past: put → put."}, {"type": "choice", "q": "We ___ a great movie on Saturday.", "options": ["see", "seen", "saw"], "answer": 2, "why": "See is irregular: see → saw."}]}, "reading": {"title": "What a night!", "kind": "an email to a friend", "text": "Hi Deniz,\n\nHow are you? I have a funny story for you. Well, it's funny now!\n\nLast night my kitchen sink started to leak. At midnight I heard a noise and found water all over the floor. I ran to get towels, but there was too much water. My neighbor Dan heard me, and he came over in his pajamas. He turned off the water under the sink. We cleaned the kitchen together, and I finally went to bed at two.\n\nThis morning I called my landlord, Frank. He was very kind, and he sent a plumber in the evening. The plumber, Joe, arrived at six. He looked under the sink and found an old pipe with a hole in it. He changed the pipe in forty minutes. I made Turkish tea for him, and he loved it!\n\nAfter that, I bought a small cake and took it to Dan. He laughed and said, \"Call me anytime!\"\n\nSo my sink works again, and I have a great neighbor.\n\nWrite soon!\n\nElif", "questions": [{"q": "Why did Dan come over?", "options": ["Frank called him.", "He heard Elif.", "He wanted some tea."], "answer": 1}, {"q": "What was the problem with the sink?", "options": ["An old pipe had a hole in it.", "The sink was too small.", "The water was too hot."], "answer": 0}, {"q": "What did Elif give Joe?", "options": ["a cake", "some flowers", "Turkish tea"], "answer": 2}, {"q": "How does Elif feel at the end?", "options": ["angry with Frank", "happy about her neighbor", "worried about the sink"], "answer": 1}], "tf": [{"s": "Dan came over in his pajamas.", "answer": true}, {"s": "Joe arrived in the morning.", "answer": false}, {"s": "Elif took a cake to Dan.", "answer": true}], "gloss": {"a": "bir", "after": "sonra (after that: ondan sonra)", "again": "yine, tekrar", "all": "her yer (all over: her yerde)", "an": "bir (sesli harften önce)", "and": "ve", "anytime": "her zaman, istediğin zaman", "are": "-sin (how are you: nasılsın)", "arrived": "geldi (arrive: varmak, gelmek)", "at": "-de (saat / yer)", "bed": "yatak (go to bed: yatmak)", "bought":  bu sabah)", "to": "-e / -a; fiil önünde -mek/-mak", "together": "birlikte", "too": "fazla (too much: çok fazla)", "took": "götürdüm (take: götürmek)", "towels": "havlular", "turkish": "Türk (Türkiye'ye ait)", "turned": "kapattı (turn off: kapatmak)", "two": "iki", "under": "altında", "very": "çok", "was": "idi / -di (be: olmak)", "water": "su", "we": "biz", "well": "şey, yani (cümle başında)", "went": "gittim (go to bed: yatmak)", "with": "ile; (a pipe with a hole: delikli boru)", "works": "çalışıyor (work: çalışmak)", "write": "yaz (write: yazmak)", "you": "sen"}}, "speaking": {"prompt": "Talk about a time something broke or went wrong in your home. What happened?", "steps": ["say what broke and when", "say what you did", "say how it ended"], "starters": ["Last year, my ... broke.", "First, I ...", "Then I called ...", "In the end, ..."], "model": "Last winter, our heater stopped working. It was a very cold night in January. First, I put on two sweaters and made some hot tea. Then I called my landlord, but he didn't answer, so I sent him a message. The next morning, a repairman came and looked at the heater. He found a small problem and fixed it in an hour. I felt so happy when the apartment was warm again. After that, I bought a small electric heater, just in case."}, "writing": {"prompt": "Write a short message to your landlord about a problem in your home. Say what happened and ask for help.", "length": "50-80 words", "checklist": ["Say what happened in the past simple (I heard, it started ...).", "Explain the problem now.", "Ask politely for help and say when you are home."], "model": "Hi Mr. Lee,\n\nThis is Ana from apartment 2A. Yesterday evening, the light in my bathroom started to make a strange noise. Then it stopped working. I changed the bulb, but it still doesn't work. Now the bathroom is dark, and it's difficult in the morning. Could you please send someone to check it? I'm home after five every day.\n\nThank you,\nAna"}, "audio": {"listen": "audio/w2 r was so nice. So I went to the art museum downtown."}, {"s": "Dan", "t": "Did you go with Sam?"}, {"s": "Elif", "t": "No, I didn't. I went alone. I wanted a quiet day."}, {"s": "Dan", "t": "Did you see the big blue painting on the second floor? It's my favorite."}, {"s": "Elif", "t": "No, I didn't see it. I didn't go upstairs. My feet hurt!"}, {"s": "Dan", "t": "You have to go back. Did you take the bus there?"}, {"s": "Elif", "t": "No, I walked. It took an hour, but it was a nice walk."}, {"s": "Dan", "t": "An hour? Wow. Did you get lost?"}, {"s": "Elif", "t": "Only once! But I asked a police officer, and she helped me."}, {"s": "Dan", "t": "You're really learning the city."}, {"s": "Elif", "t": "Slowly! But I still don't know where to buy good bread."}, {"s": "Dan", "t": "Oh, I can help with that. There's a great bakery next to the bus stop."}, {"s": "Elif", "t": "Really? I didn't notice it. Can you show me on Saturday morning?"}, {"s": "Dan", "t": "Sure. And Saturday night, come to my place. I'm having a small party."}, {"s": "Elif", "t": "A party? I'd love to come!"}], "mcq": [{"q": "What did Elif do on Saturday?", "options": ["She went to a museum.", "She had lunch with Sam.", "She visited Dan's sister."], "answer": 1}, {"q": "What did Elif eat for lunch?", "options": ["tomato soup", "a chicken sandwich", "spicy Mexican food"], "answer": 0}, {"q": "Who did Elif go to the museum with?", "options": ["Sam", "Dan", "She went alone."], "answer": 2}, {"q": "Why didn't Elif see Dan's favorite painting?", "options": ["The museum was closed.", "She didn't like it.", "She didn't go upstairs."], "answer": 2}], "gaps": [{"line": 6, "answer": "did you go"}, {"line": 7, "answer": "ordered"}, {"line": 8, "answer": "Did you like"}, {"line": 9, "answer": "didn't talk"}, {"line": 15, "answer": "didn't go"}, {"line": 17, "answer": "walked"}]}, "vocab": [{"w": "How was your weekend?", "m": "a friendly question about someone's weekend", "ex": "Hi, Tom! How was your weekend?"}, {"w": "Anytime", "m": "you don't need to thank me", "ex": "Thanks for the ride! Anytime."}, {"w": "do anything fun", "m": "do something you enjoy", "ex": "Are you going to do anything fun this summer?"}, {"w": "have lunch with", "m": "eat lunch together with someone", "ex": "I often have lunch with my sister on Fridays."}, {"w": "go upstairs", "m": "go to a higher floor", "ex": "The bedrooms are on the second floor, so let's go upstairs."}, {"w": "alone", "m": "without other people", "ex": "My grandmother lives alone, but she's very happy."}, {"w": "my feet hurt", "m": "my feet are in pain", "ex": "Can we sit down? My feet hurt."}, {"w": "notice", "m": "see something and pay attention to it", "ex": "Did you notice her new haircut?"}], "grammar": {"title": "Past simple: questions and negatives", "points": ["Questions: Did + subject + base verb. Did you like it?", "Negatives: didn't + base verb. I didn't see it.", "After did or didn't, use the base verb: not 'didn't went'.", "Wh- questions: Where / What / When + did + subject + verb?"], "examples": [{"en": "Did you take the bus? No, I didn't.", "note": "short answer"}, {"en": "I didn't go upstairs.", "note": "didn't + base verb"}, {"en": "Where did you go on Sunday?", "note": "Wh- + did + you + verb"}, {"en": "Was it spicy? Yes, it was.", "note": "with be: was/were, no did"}], "tr": "'Did' kullanınca fiil yalın kalır: 'Did you go?' doğru, 'Did you went?' yanlış.", "exercises": [{"type": "choice", "q": "___ you see the blue painting?", "options": ["Were", "Did", "Was"], "answer": 1, "why": "Use did with a main verb like see."}, {"type": "choice", "q": "I didn't ___ the answer, so I asked my teacher.", "options": ["know", "knew", "knows"], "answer": 0, "why": "After didn't, use the base verb."}, {"type": "choice", "q": "Where ___ you go last weekend?", "options": ["were", "do", "did"], "answer": 2, "why": "Last weekend is past: Where did you go?"}, {"type": "choice", "q": "___ the museum busy on Sunday?", "options": ["Did", "Was", "Were"], "answer": 1, "why": "With be, use was or were. Museum is singular."}, {"type": "type", "q": "She ___ to the party last night. She was sick. (not / go)", "answers": ["didn't go", "did not go"], "why": "Negative: didn't + base verb."}, {"type": "type", "q": "___ you like the movie yesterday? (do)", "answers": ["Did", "did"], "why": "Past question: Did + subject + base verb."}, {"type": "type", "q": "We ___ the bus to the museum. We walked. (not / take)", "answers": ["didn't take", "did not take"], "why": "Negative: didn't + base verb (take, not took)."}, {"type": "type", "q": "What ___ you eat for lunch yesterday? (do)", "answers": ["did"], "why": "Wh- question in the past: What did you...?"}]}, "reading": {"title": "The email I didn't send", "kind": "a text message chat", "text": "Sam: Hey Elif, are you okay? You looked worried after the meeting today.\n\nElif: Hi Sam. I'm fine now. But this morning was terrible. Maria asked me, \"Did you send the new designs to the client?\" And I said yes.\n\nSam: And?\n\nElif: Then I checked. I didn't send them! I wrote the email, but I didn't click \"Send.\" It was still in my drafts.\n\nSam: Oh no! What did Maria say?\n\nElif: She didn't get angry. She just said, \"Please send it now.\" The client answered in ten minutes, and they liked the designs.\n\nSam: See? No problem. Everyone does that. Last month I sent an email to the wrong person!\n\nElif: Really? Who did you send it to?\n\nSam: To Maria! It was a message about her surprise birthday party. So it wasn't a surprise anymore.\n\nElif: Haha! Did she like the party?\n\nSam: She loved it. She acted very surprised, too. So don't worry. See you tomorrow!", "questions": [{"q": "Why did Elif look worried?", "options": ["She was late for work.", "She didn't send an email.", "She lost her phone."], "answer": 1}, {"q": "Where was Elif's email?", "options": ["on Maria's desk", "in the trash", "in her drafts"], "answer": 2}, {"q": "How did Maria react?", "options": [ out my plans.", "I can offer to do something.", "I can choose between going to and will."], "listening": {"title": "Planning a team trip", "intro": "Maria, Sam and Elif are in the office kitchen on Friday afternoon.", "speakers": {"Elif": "female", "Maria": "female", "Sam": "male"}, "lines": [{"s": "Maria", "t": "Okay, you two, quick question. Are you free this Sunday?"}, {"s": "Sam", "t": "I think so. Why?"}, {"s": "Elif", "t": "I'm going to a party on Saturday night, but Sunday is free."}, {"s": "Maria", "t": "Great. I'm going to organize a little team trip. We all worked really hard this month."}, {"s": "Elif", "t": "That sounds wonderful! Where are we going to go?"}, {"s": "Maria", "t": "My friend has a small house by a lake. It's about two hours north."}, {"s": "Sam", "t": "A lake house? I'm in!"}, {"s": "Elif", "t": "Me too! How are we going to get there?"}, {"s": "Maria", "t": "I'm going to rent a van."}, {"s": "Sam", "t": "Great. Then I'll drive, and you can relax."}, {"s": "Maria", "t": "Thanks, Sam! We're going to leave at eight in the morning."}, {"s": "Sam", "t": "Eight? On a Sunday? Okay, I'll set two alarms."}, {"s": "Elif", "t": "What are we going to do there?"}, {"s": "Maria", "t": "We're going to walk around the lake and have a picnic."}, {"s": "Elif", "t": "Can I bring something? I know! I'll make some Turkish food."}, {"s": "Sam", "t": "Yes, please! I'll bring my speaker for music."}, {"s": "Maria", "t": "Not too loud, Sam! Maybe we can swim, too."}, {"s": "Elif", "t": "Hmm, I don't think I'll swim. I'm not a good swimmer."}, {"s": "Sam", "t": "Don't worry. The water will probably be too cold anyway."}, {"s": "Maria", "t": "Oh, look at the weather app. It's going to rain on Sunday morning."}, {"s": "Sam", "t": "Oh no. Only in the morning?"}, {"s": "Maria", "t": "Yes, the afternoon looks sunny. I think it'll be fine."}, {"s": "Elif", "t": "Then I'll bring an umbrella, just in case."}, {"s": "Sam", "t": "And I'll bring some board games. If it rains, we'll play inside."}, {"s": "Maria", "t": "You two are the best. It's going to be a great day."}], "mcq": [{"q": "Why is Maria planning a trip?", "options": ["It's Sam's birthday.", "The team worked hard this month.", "A client asked her."], "answer": 1}, {"q": "How are they going to travel?", "options": ["in a van", "by bus", "by train"], "answer": 0}, {"q": "What is Elif going to bring?", "options": ["board games", "a speaker", "Turkish food and an umbrella"], "answer": 2}, {"q": "What is the weather going to be like?", "options": ["rainy all day", "cold and snowy", "rainy in the morning, sunny later"], "answer": 2}], "gaps": [{"line": 8, "answer": "going to rent"}, {"line": 9, "answer": "I'll drive"}, {"line": 10, "answer": "going to leave"}, {"line": 14, "answer": "I'll make"}, {"line": 19, "answer": "going to rain"}, {"line": 21, "answer": "it'll be fine"}]}, "vocab": [{"w": "Are you free", "m": "Do you have time? Do you have plans?", "ex": "Are you free on Friday evening?"}, {"w": "I'm in", "m": "Yes, I want to join!", "ex": "A movie tonight? I'm in!"}, {"w": "rent", "m": "pay to use something for a short time", "ex": "We rented a car for our vacation."}, {"w": "have a picnic", "m": "eat a meal outside, often in a park", "ex": "Let's have a picnic in the park on Sunday."}, {"w": "set an alarm", "m": "make a clock or phone ring at a time", "ex": "I always set an alarm for six thirty."}, {"w": "weather app", "m": "a phone app that shows the weather", "ex": "My weather app says it will snow tonight."}, {"w": "just in case", "m": "because something might happen", "ex": "Take a jacket, just in case."}, {"w": "board games", "m": "games you play on a table, like chess", "ex": "We played board games all evening."}], "grammar": {"title": "going to vs will", "points": ["going to: plans you made before. We're going to leave at eight.", "going to: predictions you can see now. Look at those clouds! It's going to rain.", "will: quick decisions and offers. I'll bring an umb ect: Our Sunday trip to the lake\n\nHi Sam and Elif,\n\nThank you again for all your hard work this month. Here is the plan for Sunday.\n\nWe're going to meet at the office at eight in the morning Please don't be late! Sam is going to drive the van. The drive is about two hours, so we're going to stop for coffee on the way.\n\nMy friend's house is small, but it's right next to the lake. In the morning, we're going to walk along the lake. The weather app says it's going to rain early, so bring a jacket. After that, we're going to have a picnic.\n\nElif, thank you for offering to make Turkish food. I'll bring drinks and fruit. Sam, please bring your board games, and please keep the music quiet!\n\nWe're going to leave the lake at about five in the afternoon. I think we'll be home by seven thirty.\n\nI'm sure it will be a great day. See you on Sunday!\n\nMaria", "questions": [{"q": "Where are they going to meet on Sunday?", "options": ["at Elif's apartment", "at the office", "at the lake"], "answer": 1}, {"q": "Why are they going to stop on the way?", "options": ["to wait for Sam", "to buy food", "for coffee"], "answer": 2}, {"q": "Why should they bring a jacket?", "options": ["It's going to rain early.", "The house is cold.", "They're going to swim."], "answer": 0}, {"q": "When does Maria think they'll be home?", "options": ["at about five", "by eight in the morning", "by seven thirty"], "answer": 2}], "tf": [{"s": "The house is right next to the lake.", "answer": true}, {"s": "Maria is going to bring the board games.", "answer": false}, {"s": "They're going to leave the lake in the morning.", "answer": false}], "gloss": {"a": "bir", "about": "yaklaşık", "after": "sonra (after that: ondan sonra)", "afternoon": "öğleden sonra", "again": "tekrar", "all": "tüm, bütün", "along": "boyunca", "and": "ve", "app": "uygulama", "at": "-de (saat / yer)", "be": "olmak", "board": "tahta (board games: masa oyunları)", "bring": "getir (bring: getirmek)", "but": "ama", "by": "-e kadar tly.", "I can ask for information at a gym."], "listening": {"title": "At the front desk", "intro": "On Monday after work, Elif visits a gym near her building. Marcus works at the front desk.", "speakers": {"Elif": "female", "Marcus": "male"}, "lines": [{"s": "Marcus", "t": "Hi there! Welcome. How can I help you?"}, {"s": "Elif", "t": "Hi. I'd like some information about a membership, please."}, {"s": "Marcus", "t": "Sure. Have you visited our gym before?"}, {"s": "Elif", "t": "No, this is my first time. But my neighbor has been a member here for three years."}, {"s": "Marcus", "t": "Oh, nice. What's his name?"}, {"s": "Elif", "t": "Dan. He lives next door to me."}, {"s": "Marcus", "t": "Dan? The guy who always tells jokes? He runs on the treadmill every morning."}, {"s": "Elif", "t": "That's him!"}, {"s": "Marcus", "t": "Ha! Great guy. So, how long have you lived in the neighborhood?"}, {"s": "Elif", "t": "Not long. I've lived here for two weeks. I moved from Turkey."}, {"s": "Marcus", "t": "Welcome to Chicago! Do you exercise much?"}, {"s": "Elif", "t": "Not really. I haven't exercised since I left Izmir. I've been too busy."}, {"s": "Marcus", "t": "That's normal. Moving is hard work. What kind of exercise do you like?"}, {"s": "Elif", "t": "Yoga. I did yoga for years at home. I really miss it."}, {"s": "Marcus", "t": "We have yoga classes on Tuesday and Thursday evenings at seven."}, {"s": "Elif", "t": "Perfect. I finish work at five thirty. How much does it cost?"}, {"s": "Marcus", "t": "Good news. This month, the first week is free for new members."}, {"s": "Elif", "t": "Free? I love that word!"}, {"s": "Marcus", "t": "Everyone does! Could I see an ID, please?"}, {"s": "Elif", "t": "Here you go. Is that the locker room over there?"}, {"s": "Marcus", "t": "Yes. The lockers are free, but you have to bring your own lock."}, {"s": "Elif", "t": "Okay. And how long have you worked here?"}, {"s": "Marcus", "t": "Since I finished college. So, about six years now."}, {"s": "Elif", "t": "Wow. You must know everyone!"}, {"s": "Marcus", "t": "I do. Okay, you're all set. Would you like a quick tour?"}, {"s": "Elif", "t": "Yes, please. Maybe I'll see Dan on the treadmill tomorrow!"}, {"s": "Marcus", "t": "Only if you come at six in the morning."}, {"s": "Elif", "t": "Six? Then I'll come in the evening!"}], "mcq": [{"q": "Who is already a member of this gym?", "options": ["Elif's manager, Maria", "Elif's neighbor, Dan", "Elif's coworker, Sam"], "answer": 1}, {"q": "How long has Elif lived in the neighborhood?", "options": ["for two weeks", "for three years", "for six years"], "answer": 0}, {"q": "What kind of exercise does Elif want to do?", "options": ["running", "swimming", "yoga"], "answer": 2}, {"q": "What does Elif need to bring for the locker?", "options": ["a towel", "her own lock", "a photo"], "answer": 1}], "gaps": [{"line": 3, "answer": "for three years"}, {"line": 8, "answer": "have you lived"}, {"line": 9, "answer": "for two weeks"}, {"line": 11, "answer": "since"}, {"line": 19, "answer": "locker room"}, {"line": 24, "answer": "you're all set"}]}, "vocab": [{"w": "join a gym", "m": "become a member of a gym", "ex": "I want to join a gym near my office."}, {"w": "membership", "m": "being a member of a club or group", "ex": "My gym membership ends in December."}, {"w": "front desk", "m": "the place where you ask questions when you arrive", "ex": "Please leave your key at the front desk."}, {"w": "locker room", "m": "a room where you change clothes and leave bags", "ex": "I left my shoes in the locker room."}, {"w": "sign up for", "m": "put your name on a list to join something", "ex": "Did you sign up for the cooking class?"}, {"w": "exercise", "m": "move your body to stay healthy", "ex": "My dad tries to exercise every morning."}, {"w": "you're all set", "m": "everything is ready for you now", "ex": "Here's your ticket. You're all set!"}, {"w": "a quick tour", "m": "a short walk to see a place", "ex": "The manager gave us a q {"s": "Elif", "t": "Not at all. It's D-E-M-I-R."}, {"s": "Tyler", "t": "Got it, Ms. Demir. So, what's the problem exactly?"}, {"s": "Elif", "t": "The internet stops every evening. It works for ten minutes, and then it stops again."}, {"s": "Tyler", "t": "I'm sorry about that. Can you see your router? It's a small box with lights."}, {"s": "Elif", "t": "Yes, it's next to my TV. One of the lights is red."}, {"s": "Tyler", "t": "Okay. Would you mind turning off the router for thirty seconds? Then turn it on again."}, {"s": "Elif", "t": "Sure. Just a moment... Okay, it's on again."}, {"s": "Tyler", "t": "Is the light green now?"}, {"s": "Elif", "t": "No, it's still red. Sorry!"}, {"s": "Tyler", "t": "Don't be sorry. It's not your fault. I think we need to send a technician."}, {"s": "Elif", "t": "Could the technician come this week, please? I have a video call with my mom on Thursday."}, {"s": "Tyler", "t": "Let me check. Could you be home on Wednesday morning?"}, {"s": "Elif", "t": "I'm afraid not. I'm at work until five thirty. Would you mind checking for an evening time?"}, {"s": "Tyler", "t": "No problem. How about Wednesday at six?"}, {"s": "Elif", "t": "That works. Can I ask one more question? Do I have to pay for the visit?"}, {"s": "Tyler", "t": "No, you don't. The visit is free."}, {"s": "Elif", "t": "Great. Could you send me a text with the time, please?"}, {"s": "Tyler", "t": "Of course. You'll get a text in a few minutes. Is there anything else?"}, {"s": "Elif", "t": "No, that's all. Thank you for your help, Tyler."}, {"s": "Tyler", "t": "You're welcome, Ms. Demir. Have a good evening!"}], "mcq": [{"q": "What is Elif's problem?", "options": ["Her TV doesn't work.", "Her internet stops every evening.", "Her phone is broken."], "answer": 1}, {"q": "What does Tyler ask her to do with the router?", "options": ["turn it off and on again", "move it to another room", "send it back"], "answer": 0}, {"q": "When will the technician come?", "options": ["Wednesday morning", "Thursday at five thirty", "Wednesday at six"], "answer": 2}, {"q": "Why does Elif want the internet to work this week?", "options": ["She has a video call with her mom.", "She works from home.", "Dan needs to use it."], "answer": 0}], "gaps": [{"line": 4, "answer": "spelling"}, {"line": 10, "answer": "turning off"}, {"line": 11, "answer": "Just a moment"}, {"line": 14, "answer": "technician"}, {"line": 17, "answer": "checking"}, {"line": 19, "answer": "That works"}]}, "vocab": [{"w": "technician", "m": "a worker who fixes machines or equipment", "ex": "The technician fixed our printer in ten minutes."}, {"w": "turn off", "m": "stop a machine or light with a button", "ex": "Please turn off the lights when you leave."}, {"w": "Just a moment", "m": "please wait a short time", "ex": "Just a moment, I'm looking for my keys."}, {"w": "It's not your fault", "m": "you didn't do anything wrong", "ex": "Don't worry, it's not your fault. The bus was late."}, {"w": "That works", "m": "that time or plan is good for me", "ex": "Friday at noon? That works for me."}, {"w": "a favor", "m": "something kind you do to help someone", "ex": "Could you do me a favor and close the door?"}, {"w": "bother", "m": "take someone's time or make them a little annoyed", "ex": "Sorry to bother you, but is this seat free?"}, {"w": "come over", "m": "visit someone's home", "ex": "Do you want to come over for dinner on Friday?"}], "grammar": {"title": "Polite requests: can, could, would you mind + -ing", "points": ["Can you...? is friendly and informal. Could you...? is more polite.", "Would you mind + verb-ing? is very polite: Would you mind waiting?", "To say yes to Would you mind...?, answer: No, not at all.", "Ask for permission with Can I...? or Could I...?: Could I use your phone?"], "examples": [{"en": "Can you help me with this box?", "note": "friendly"}, {"en": "Could you send me a text, please?", "note": "more polite"}, {"en": "Would you mind spelling your name?", "note": "mind + -ing" 1.8], [92.25, 94.64]], "read": "audio/w3d2-read.mp3", "speak": "audio/w3d2-speak.mp3", "vocab": "audio/w3d2-vocab.mp3", "vocabT": [[0.3, 1.41, 2.01, 4.61], [5.51, 6.45, 7.05, 9.1], [10.0, 11.17, 11.77, 14.33], [15.23, 16.51, 17.11, 20.06], [20.96, 21.98, 22.58, 24.86], [25.76, 26.83, 27.43, 29.93], [30.83, 31.76, 32.36, 34.9], [35.8, 36.78, 37.38, 39.77]]}}, {"day": 3, "dayName": "Wednesday", "title": "Cooking with Dan", "goals": ["I can give and follow cooking instructions.", "I can put steps in order with first, then and finally.", "I can use simple kitchen words."], "listening": {"title": "Menemen night", "intro": "On Wednesday evening, Elif teaches Dan to cook a Turkish dish in his kitchen.", "speakers": {"Elif": "female", "Dan": "male"}, "lines": [{"s": "Dan", "t": "Okay, chef, I'm ready. What do I do first?"}, {"s": "Elif", "t": "First, wash your hands. Then put on this apron."}, {"s": "Dan", "t": "An apron? Wow, this is serious."}, {"s": "Elif", "t": "Cooking is always serious! Did you buy everything on my list?"}, {"s": "Dan", "t": "Yes. Eggs, tomatoes, green peppers, an onion and some butter. What's the dish called again?"}, {"s": "Elif", "t": "Menemen. It's eggs with tomatoes and peppers. We often eat it for breakfast in Turkey."}, {"s": "Dan", "t": "Breakfast for dinner. I love it. So, what's the first step?"}, {"s": "Elif", "t": "Chop the onion into small pieces."}, {"s": "Dan", "t": "Like this?"}, {"s": "Elif", "t": "Smaller, please. And don't cry!"}, {"s": "Dan", "t": "Too late. My eyes!"}, {"s": "Elif", "t": "Ha! Now cut the peppers. Then put some butter in the pan."}, {"s": "Dan", "t": "How much butter?"}, {"s": "Elif", "t": "About two tablespoons. Keep it on medium heat, not high."}, {"s": "Dan", "t": "Okay. What next?"}, {"s": "Elif", "t": "Add the onion and the peppers. Cook them for five minutes."}, {"s": "Dan", "t": "It smells amazing already. Oh, did the internet guy come?"}, {"s": "Elif", "t": "Yes, at six. He changed my router, and now everything works."}, {"s": "Dan", "t": "Great! So tomorrow your mom can see your face."}, {"s": "Elif", "t": "Exactly. Okay, after that, add the tomatoes and a little salt. Stir them slowly."}, {"s": "Dan", "t": "How long do they cook?"}, {"s": "Elif", "t": "About ten minutes. Wait until they're soft."}, {"s": "Dan", "t": "And the eggs?"}, {"s": "Elif", "t": "Finally, break the eggs into the pan. Don't mix them too much."}, {"s": "Dan", "t": "Done! Can we eat now?"}, {"s": "Elif", "t": "Yes. Take some fresh bread and try it."}, {"s": "Dan", "t": "Wow. This is so good. Can I make it for my friends on Sunday?"}, {"s": "Elif", "t": "Of course. Just don't forget the bread!"}], "mcq": [{"q": "What does Elif tell Dan to do first?", "options": ["chop the onion", "wash his hands", "buy some bread"], "answer": 1}, {"q": "What is menemen?", "options": ["eggs with tomatoes and peppers", "a soup with onions", "a kind of bread"], "answer": 0}, {"q": "What happened with Elif's internet?", "options": ["It still doesn't work.", "Dan fixed it.", "A technician fixed it."], "answer": 2}, {"q": "What do they eat the menemen with?", "options": ["rice", "fresh bread", "yogurt"], "answer": 1}], "gaps": [{"line": 1, "answer": "put on"}, {"line": 7, "answer": "Chop"}, {"line": 10, "answer": "Too late"}, {"line": 13, "answer": "medium heat"}, {"line": 19, "answer": "after that"}, {"line": 23, "answer": "Finally"}]}, "vocab": [{"w": "chop", "m": "cut into small pieces", "ex": "Can you chop the carrots for the soup?"}, {"w": "put on", "m": "start to wear clothes", "ex": "Put on your coat. It's cold outside."}, {"w": "stir", "m": "move food around with a spoon", "ex": "Stir the soup so it doesn't burn."}, {"w": "medium heat", "m": "not too hot and not too low", "ex": "Cook the rice on medium heat."}, {"w": "smells amazing", "m": "has a very good smell", "ex": "Your coffee smells amazing!"}, {"w": "Too late", "m": "it already happened; you can't stop it now", "ex": "I wanted a ticket, but I was too late."}, {"w": "break the eggs", "m": "open eggs by hitting them", "ex": "Break the eggs into a bowl first."}, {"w": "right away", "m": "now, without waiting", "ex": "Call me right away if you need help."}], "grammar": {"title": "Imperatives and sequence words", "points": ["Imperative = base verb with no subject: Chop the onion. Add the eggs.", "Negative imperative: Don't + base verb: Don't mix them too much.", "Put steps in order with first, then, next, after that and finally.", "Use a comma after First, After that and Finally at the start."], "examples": [{"en": "First, wash your hands.", "note": "step 1"}, {"en": "Then cut the peppers.", "note": "the next step"}, {"en": "Don't use high heat.", "note": "negative imperative"}, {"en": "Finally, break the eggs into the pan.", "note": "the last step"}], "exercises": [{"type": "choice", "q": "___ the eggs into the pan.", "options": ["Break", "Breaks", "Breaking"], "answer": 0, "why": "An imperative uses the base verb: Break."}, {"type": "choice", "q": "___ touch the pan. It's very hot!", "options": ["No", "Not", "Don't"], "answer": 2, "why": "Negative imperative: Don't + base verb."}, {"type": "choice", "q": "First, chop the onion. ___, add the peppers. Finally, add the eggs.", "options": ["Next", "Finally", "First"], "answer": 0, "why": "The middle step needs next."}, {"type": "choice", "q": "Cook the tomatoes. ___ that, add some salt.", "options": ["Then", "After", "Finally"], "answer": 1, "why": "The phrase is after that."}, {"type": "type", "q": "___ the heat when the eggs are almost ready. (turn off)", "answers": ["Turn off", "turn off"], "why": "An imperative uses the base verb, with no subject."}, {"type": "type", "q": "___ forget the bread! (do not)", "answers": ["Don't", "don't", "Do not", "do not"], "why": "Negative imperative: Don't + base verb."}, {"type": "type", "q": "Wash the vegetables. ___, cut them into small pieces. After that, cook them. (then / finally)", "answers": ["Then", "then"], "why": "It's not the last step, so use then."}, {"type": "type", "q": "We cooked the food, set the table, and ___ we ate. (finally / first)", "answers": ["finally"], "why": "Eating is the last step: finally."}]}, "reading": {"title": "Menemen for Dan", "kind": "a recipe card", "text": "Dan, here is the recipe from tonight. You did a great job! Now you can make it for your friends on Sunday.\n\nYou need: 4 eggs, 2 tomatoes, 2 green peppers, 1 small onion, some butter, salt, black pepper and fresh bread.\n\nFirst, wash and chop the vegetables. Cut the onion into small pieces. Don't cry this time!\n\nThen, melt some butter in a pan. Use medium heat, not high.\n\nAfter that, add the onion and the peppers. Cook them for about five minutes. Stir them sometimes.\n\nNext, add the tomatoes and a little salt. Cook them until they are soft. This takes about ten minutes.\n\nFinally, break the eggs into the pan. Mix them gently, but not too much. Turn off the heat when the eggs are almost ready, because they keep cooking in the hot pan.\n\nServe it right away with warm bread. At home in Turkey, we often eat menemen for breakfast with a glass of tea.\n\nOne more tip: don't cook it before your friends arrive. Menemen is best when it's hot!\n\nElif", "questions": [{"q": "Who is the recipe for?", "options": ["Elif's mom", "Maria", "Dan"], "answer": 2}, {"q": "How long do the onion and peppers cook?", "options": ["about five minutes", "about ten minutes", "about two minutes"], "answer": 0}, {"q": "Why should you turn off the heat early?", "options": ["The butter burns.", "The eggs keep cooking in the hot pan.", "The bread gets cold."], "answer": 1}, {"q": "When does Elif's family often eat menemen?", "options": ["for dinner", "at parties", "for breakfast"], "answer": 2}], "tf": [{"s": "You should cook menemen on high heat.", "answer": false}, {"s": "The tomatoes cook for about ten minutes.", "answer": true}, {"s": "Elif says to cook the menemen before the friends arrive.", "answer": false}], "gloss" onest."}, {"s": "Mom", "t": "Oh, sweetheart. What happened?"}, {"s": "Elif", "t": "Nothing big. On Tuesday I was walking home from the bus stop when I smelled fresh bread."}, {"s": "Elif", "t": "It smelled exactly like the bakery near our house. Suddenly I wanted to cry."}, {"s": "Mom", "t": "Oh, Elif. We miss you too. I was thinking about you this morning."}, {"s": "Mom", "t": "I was making breakfast, and I made tea for two!"}, {"s": "Elif", "t": "For two? Oh, Mom!"}, {"s": "Mom", "t": "I know! Your father laughed at me while I was pouring the second glass."}, {"s": "Elif", "t": "Where is Dad? Is he there?"}, {"s": "Mom", "t": "He's in the garden. He was watering the tomatoes when you called. Come here! It's Elif!"}, {"s": "Dad", "t": "Elif! How's my girl?"}, {"s": "Elif", "t": "Hi, Dad! I'm good. Yesterday I cooked menemen with my neighbor, Dan."}, {"s": "Dad", "t": "Menemen in Chicago? Did he like it?"}, {"s": "Elif", "t": "He loved it. He was eating the bread while I was still cooking!"}, {"s": "Dad", "t": "Ha! A smart man."}, {"s": "Mom", "t": "What else happened this week?"}, {"s": "Elif", "t": "I joined a gym. On Tuesday, I was doing yoga when my phone started ringing. Loudly!"}, {"s": "Mom", "t": "Oh no! Was the teacher angry?"}, {"s": "Elif", "t": "No, she just smiled. But everyone looked at me."}, {"s": "Dad", "t": "Elif, are you happy there? Really?"}, {"s": "Elif", "t": "Yes, Dad. Most days I'm really happy. Some days are just harder."}, {"s": "Mom", "t": "That's normal. It gets easier. Call us when you feel sad, okay?"}, {"s": "Elif", "t": "I will. I love you both."}, {"s": "Dad", "t": "We love you too. Now go and eat some breakfast!"}], "mcq": [{"q": "How does Elif feel this week?", "options": ["a little homesick", "very angry", "sick and tired"], "answer": 0}, {"q": "What happened on Tuesday on her way home?", "options": ["She got lost.", "She smelled fresh bread and wanted to cry.", "She met her coworker."], "answer": 1}, {"q": "What was Dad doing when Elif called?", "options": ["making breakfast", "drinking tea", "watering the tomatoes"], "answer": 2}, {"q": "What happened during Elif's yoga class?", "options": ["Her phone started ringing.", "She fell down.", "The teacher was late."], "answer": 0}], "gaps": [{"line": 3, "answer": "to be honest"}, {"line": 5, "answer": "was walking"}, {"line": 6, "answer": "Suddenly"}, {"line": 8, "answer": "was making"}, {"line": 10, "answer": "while"}, {"line": 12, "answer": "was watering"}]}, "vocab": [{"w": "homesick", "m": "sad because you miss your home and family", "ex": "I was homesick during my first month at college."}, {"w": "to be honest", "m": "I'm telling you the truth", "ex": "To be honest, I don't really like coffee."}, {"w": "miss", "m": "feel sad because someone or something is far away", "ex": "I miss my grandmother's cooking."}, {"w": "suddenly", "m": "quickly, when you don't expect it", "ex": "The bus suddenly stopped, and I almost fell."}, {"w": "reminded me of", "m": "made me think of something from before", "ex": "That song reminded me of my school days."}, {"w": "knock on", "m": "hit a door with your hand", "ex": "Please knock on the door before you come in."}, {"w": "feel better", "m": "feel happier or less sick", "ex": "Drink some tea. You'll feel better."}, {"w": "it gets easier", "m": "with time, it becomes less difficult", "ex": "Driving is scary at first, but it gets easier."}], "grammar": {"title": "Past continuous vs past simple (when, while)", "points": ["Past continuous (was/were + -ing): an action in progress at a past time.", "Past simple: a short, finished action: I smelled, she called, he knocked.", "Long action + when + short action: I was walking home when I smelled bread.", "While + long action: While I was cooking, he ate the bread."], "examples": [{"en": "I was walking home when I smelled fresh bread.", "note": "long action, then short action"}, {"en": "My phone rang while I was doing yoga.", "note": "while + long action"}, {"en": "Dad was working in the garden when I called.", "note": ""}, {"en": "What were you doing at eight last night?", "note": "question form"}], "tr": "Was/were + -ing, Türkçedeki '-iyordu' gibidir: Eve yürüyordum (I was walking), telefon çaldı (the phone rang).", "exercises": [{"type": "choice", "q": "I ___ dinner when the phone rang.", "options": ["was cooking", "were cooking", "am cooking"], "answer": 0, "why": "I + was + -ing for a long past action."}, {"type": "choice", "q": "While we were talking, the internet suddenly ___.", "options": ["stop", "stopping", "stopped"], "answer": 2, "why": "A short, sudden action uses the past simple."}, {"type": "choice", "q": "What ___ you doing at eight last night?", "options": ["were", "did", "was"], "answer": 0, "why": "Past continuous question: were + you + -ing."}, {"type": "choice", "q": "She was watering the plants ___ it started to rain.", "options": ["while", "when", "during"], "answer": 1, "why": "Use when before the short action."}, {"type": "type", "q": "Dan ___ in the park when he saw a friend. (run)", "answers": ["was running"], "why": "Long action in progress: was + running."}, {"type": "type", "q": "While Elif ___ the dishes, someone knocked on the door. (wash)", "answers": ["was washing"], "why": "While + long action: was washing."}, {"type": "type", "q": "I was reading when the lights suddenly ___ off. (go)", "answers": ["went"], "why": "Short action: past simple. Go is irregular: went."}, {"type": "type", "q": "They ___ TV when we arrived, so they didn't hear the doorbell. (watch)", "answers": ["were watching"], "why": "They + were + -ing for the long action."}]}, "reading": {"title": "Faces on a screen", "kind": "Elif's diary", "text": "Thursday night\n\nThis morning, before work, I finally had a video call with Mom and Dad. The internet works now, so I could see their faces. Mom was sitting in the kitchen, and Dad was working in the garden. Everything looked the same: the blue curtains, the old clock, the lemon tree outside the window.\n\nI felt homesick this week. On Tuesday, I was walking home when I smelled fresh bread. It reminded me of the bakery near our house in Izmir. I stopped on the street, and my eyes filled with tears. A woman asked, \"Are you okay?\" I said yes, but I wasn't.\n\nWhile we were talking this morning, I told Mom about that moment. She didn't laugh. She said, \"Everyone feels like that in a new place. It gets easier.\" Then Dad showed me his tomatoes. He was so proud of them!\n\nAfter the call, I felt better. Tonight I was washing the dishes when Dan knocked on my door. He brought me a piece of apple pie. \"Thank you for the menemen,\" he said. Chicago is far from Izmir, but it has kind people too.", "questions": [{"q": "Where was Mom sitting during the call?", "options": ["in the garden", "in the kitchen", "in the living room"], "answer": 1}, {"q": "What did the smell of bread remind Elif of?", "options": ["a bakery near her parents' house", "her office kitchen", "Dan's apple pie"], "answer": 0}, {"q": "What did Mom say?", "options": ["\"Come home soon.\"", "\"Don't call Dan.\"", "\"It gets easier.\""], "answer": 2}, {"q": "What did Dan bring Elif?", "options": ["a piece of apple pie", "fresh bread", "some tea"], "answer": 0}], "tf": [{"s": "Dad was working in the garden during the call.", "answer": true}, {"s": "Elif told the woman on the street that she wasn't okay.", "answer": false}, {"s": "Dan knocked while Elif was washing the dishes.", "answer": true}], "gloss": {"a": "bir", "about": "hakkında", "after": "-den sonra", "and": "ve", "apple": "elma", "are": "...-sin (are: olmak)", "asked": "sordu (ask: sormak)", "bakery": "fırın", "before": "-den önce", "better": "daha iyi", "blue": "mavi", "bread": "ekmek", "brought": "getirdi (bring: getirmek)", "but": "ama", "call": "arama / görüşme", "chicago": "Chicago (şehir)", "clock": "saat (duvar saati)", "could": "-ebildim (can: -ebilmek)", "curtains": "perdeler", "dad": "babam", "dan": "Dan (isim)", "
